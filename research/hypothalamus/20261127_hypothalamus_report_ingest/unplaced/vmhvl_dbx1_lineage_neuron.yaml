# Findings for vmhvl_dbx1_lineage_neuron that no CellTypeNode property
# field can hold. Written by the node-characterisation step of
# asta-report-ingest, 2026-11-27.

- finding: >
    Functional role — a selective contribution to social behaviour and
    predator-threat responses. Sokolowski et al. 2016 (PMID:27209204)
    conclude that, unlike the Arc and LH Dbx1 populations, Dbx1-derived
    neurons in the VMH "have a more selective role in the regulation of
    social behaviors and responses to predator threats, behaviors known to
    be mediated by the VMH". The report carries this through as the reason
    Dbx1 is "a useful developmental lineage marker for a socially relevant
    subset of VMHvl neurons". CellTypeNode has no field for behavioural
    function, and the claim is in any case a suggestion drawn from the
    anatomy rather than a manipulation result, so it is not recorded on the
    node.
  quote_keys:
    - 9550590_0bdb13aa
  closest_field: null

- finding: >
    Activity evidence — c-Fos labelling shows Dbx1-derived cells in male and
    female LH, Arc and VMH are responsive during mating and aggression, and
    the same lineage is described as activated during stress and other innate
    behavioural responses (Sokolowski et al. 2016, PMID:27209204). This is
    immediate-early-gene activation data for the lineage across three nuclei,
    not resolved to the VMHvl fraction this node is scoped to. There is no
    activity or functional-response field on CellTypeNode; it is not
    electrophysiology (no recording, no intrinsic property), so it is left
    here.
  quote_keys:
    - 9550590_3ab764b2
    - 9550590_b15bfcd0
  closest_field: null

- finding: >
    Neuropeptide contributions of the Dbx1 lineage lie outside the VMH.
    Sokolowski et al. 2016 (PMID:27209204) report that Dbx1+ progenitors
    generate a large proportion of the Pmch-, Nesfatin-, Cart-, Hcrt- and
    Agrp-expressing populations and, to a lesser extent, the Pomc- and
    TH-expressing populations — all of which are LH and Arc populations, not
    VMH ones. No neuropeptide is attributed to the VMH (or VMHvl) fraction of
    the lineage, so none is written to this node's neuropeptides field; the
    finding is recorded here so that the empty field is not later read as an
    unsearched gap.
  quote_keys:
    - 9550590_0bfc4760
  closest_field: neuropeptides

- finding: >
    The 15.1 ± 0.7% overlap between Dbx1-lineage cells and SF1-positive cells
    reported by Sokolowski et al. 2016 (PMID:27209204) is in dorsomedial VMH
    (VMHdm), outside this node's VMHvl scope. It is the source's own contrast
    showing the lineage is VMHvl-biased, and the report restates it as
    "overlap with SF1 cells is more limited and biased to VMHdm". Not an
    anatomical_location entry for this node (those cells are not this node's
    cells) and not a negative marker (the quote shows partial overlap in
    another subdivision, not absence of Nr5a1 in the VMHvl fraction).
    Summarised as a scope caveat in the node's notes; recorded here in full.
  quote_keys:
    - 9550590_e5547345
  closest_field: anatomical_location
