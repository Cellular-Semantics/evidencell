# ============================================================
# Node 1: basal_amygdala_fear_neuron
# ============================================================
- id: basal_amygdala_fear_neuron
  name: Basal amygdala fear neuron
  definition_basis: CLASSICAL
  # NEW EVIDENCE: functional/connectivity properties from Cardenas et al. 2019.
  # Anatomical location and mPFC projection pattern are newly supported by PMID:31193505.
  anatomical_location:
  - id: UBERON:0002887
    name: basal amygdala
    sources:
    - ref: PMID:31193505
      method: asta_report
      scope: review of BLA fear/extinction neuron circuit
      quote_key: 4940771_cb8fa215
  # NOTE: electrophysiology here is functional (CS-triggered activation), not intrinsic.
  # No intrinsic ephys data are in any target-corpus quotes for this node.
  # Connectivity (projects to mPFC, does NOT receive reciprocal mPFC input) is
  # the distinguishing property — recorded under notes, not a formal ephys field.

