# ============================================================
# Node 7: paralaminar_immature_neuron
# ============================================================
- id: paralaminar_immature_neuron
  name: Paralaminar nucleus immature excitatory neuron
  definition_basis: CLASSICAL
  # NEW EVIDENCE: Page et al. 2022 (PMID:35841648) is new in this corpus.
  # Provides the most specific characterisation of the protracted developmental timeline.
  morphology:
    description: >
      Immature excitatory neuron with protracted postnatal developmental timeline.
      Present in large numbers at birth in the paralaminar nucleus (PL); some may
      continue to be born from local progenitors postnatally. Progenitors disappear
      rapidly in infancy while the immature neurons persist through childhood and
      adolescence, indicating a protracted maturation schedule.
    sources:
    - ref: PMID:35841648
      method: asta_report
      scope: characterisation of PL immature excitatory neurons across postnatal development
      quote_key: 250411527_03961399
  anatomical_location:
  - id: UBERON:0002887
    name: paralaminar nucleus
    sources:
    - ref: PMID:35841648
      method: asta_report
      scope: immature neurons of the PL persist across postnatal development
      quote_key: 250411527_03961399

