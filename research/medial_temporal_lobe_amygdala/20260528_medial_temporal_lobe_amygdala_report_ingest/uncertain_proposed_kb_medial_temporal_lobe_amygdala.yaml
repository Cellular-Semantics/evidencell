  - id: paralaminar_immature_neuron
    name: Paralaminar nucleus immature excitatory neuron
    category: CLASSICAL
    nt_type:
      name: glutamatergic
    morphology:
      description: >-
        Immature excitatory neuron of the paralaminar nucleus (PL); not a mature
        glutamatergic principal cell nor a GABAergic class. A large population of
        immature excitatory neurons is present at birth, some of which may
        continue to be born from local progenitors that disappear rapidly in
        infancy; the immature neurons persist through childhood and adolescence
        on a protracted maturation timeline.
      sources:
        - ref: "DOI:10.1016/j.dcn.2022.101133"
          method: "histology / developmental characterization"
          scope: "PL immature excitatory neuron population and maturation timeline"
          quote_key: "250411527_03961399"
    electrophysiology:
      description: >-
        Not characterized as a mature electrophysiological type. Defining feature
        is developmental state: neurons remain immature on a protracted timeline.
      sources:
        - ref: "DOI:10.1016/j.dcn.2022.101133"
          method: "developmental characterization"
          scope: "protracted maturation of PL immature neurons"
          quote_key: "250411527_03961399"

