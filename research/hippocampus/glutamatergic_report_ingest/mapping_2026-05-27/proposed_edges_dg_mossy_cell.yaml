  # ── PRIMARY MATCH: DG polymorph layer cluster ──────────────────────────────

  - id: edge_dg_mossy_cell_to_CS20230722_CLUS_0317
    lit_type: dg_mossy_cell
    taxonomy_type: CS20230722_CLUS_0317
    mapping_predicate: skos:closeMatch
    mapping_cardinality: 1:1
    mapping_justification: semapv:UnreviewedManualMapping
    property_comparisons:
      - property: nt_type
        node_a_value: "glutamatergic (cl_terms: CL:0000679)"
        node_b_value: "Glut"
        alignment: CONSISTENT
      - property: location
        node_a_value: "UBERON:0001885 dentate gyrus hilus / polymorph layer (SOMA)"
        node_b_value: "MBA:10704 Dentate gyrus, polymorph layer (SOMA; 1029 cells Yao 2024 + 124 cells Zhuang 2023). Also CA3 strata (pyramidal 195, oriens 116, radiatum 132, lucidum 78) and DG granule cell layer (125)."
        alignment: CONSISTENT
        notes: >
          DG polymorph layer is the dominant SOMA region for this cluster (~1153 cells
          combined across two MERFISH datasets). Additional CA3-stratum representation
          (~521 cells across pyramidal/oriens/radiatum/lucidum) suggests the cluster
          may also encompass non-mossy hilar/CA3-adjacent glutamatergic neurons or
          reflect anatomical registration spillover between adjacent CA3 and dentate
          hilus.
      - property: marker_Slc17a7
        node_a_value: "asserted present (PMID:27375434, marker_type PROTEIN, rat hippocampus review)"
        node_b_value: "precomputed mean 10.15 (cohort percentile 0.982); not listed in taxonomy DEFINING/MERFISH metadata"
        alignment: CONSISTENT
      - property: marker_Drd2
        node_a_value: "asserted present (PMID:33600026 Drd2-Cre viral labeling; PMID:37546856 transcriptomics ventral hippocampus)"
        node_b_value: "precomputed mean 4.95 (cohort percentile 0.965); listed in taxonomy MERFISH markers"
        alignment: CONSISTENT
      - property: marker_Calcrl
        node_a_value: "asserted present (PMID:33600026 Crlr-Cre viral labeling, mouse)"
        node_b_value: "precomputed mean 0.76 (cohort percentile 0.872); not listed in taxonomy metadata"
        alignment: APPROXIMATE
        notes: >
          Calcrl precomputed mean (0.76) is just below the MIN_DETECTABLE 1.0 threshold
          but is in the 87th percentile of the cohort — presence credit only,
          sibling-non-discriminating expression.
      - property: marker_Reln
        node_a_value: "asserted present (PMID:25206826 immunohistochemistry, mouse hippocampus)"
        node_b_value: "precomputed mean 0.21 (cohort percentile 0.202); not listed in taxonomy metadata"
        alignment: DISCORDANT
        notes: >
          Reln precomputed mean 0.21 is below MIN_DETECTABLE 1.0 and in the bottom
          quintile of the cohort. Classical mossy cell literature reports Reln+
          IHC in dentate hilar mossy cells; if CLUS_0317 corresponds to mossy cells,
          the Reln signal is unexpectedly weak. May reflect (i) post-development
          downregulation in transcript vs persistent protein, (ii) sub-population
          heterogeneity, or (iii) cluster includes non-mossy cells diluting Reln+
          fraction.
      - property: negative_marker_Gad1
        node_a_value: "asserted negative (PMID:23420672 review, dentate hilus)"
        node_b_value: "precomputed mean 1.49 (cohort percentile 0.923); not listed in taxonomy metadata"
        alignment: DISCORDANT
        notes: >
          Classical mossy cell asserted Gad1-negative, but CLUS_0317 precomputed
          mean 1.49 is above MIN_DETECTABLE 1.0 and in the top decile of the
          glutamatergic cohort. Suggests low-level Gad1 transcript may be detectable
          in transcriptomic data despite glutamatergic NT phenotype, or cluster
          contains some GABAergic contamination. Flag for review.
    evidence:
      - evidence_type: ATLAS_METADATA
        supports: SUPPORT
        reference: "https://doi.org/10.1038/s41586-023-06808-9"
        explanation: >
          WMB cluster 0317 (CA3 Glut_5) has its dominant SOMA distribution in the
          Dentate gyrus polymorph layer (1029 cells, Yao 2024 MERFISH; 124 cells,
          Zhuang 2023 MERFISH) — the canonical anatomical locus of hilar mossy
          cells. Glutamatergic NT-type assignment is consistent with classical
          mossy cell definition. High Drd2 expression (mean 4.95) and high Slc17a7
          (mean 10.15) match the Drd2/Calcrl/Slc17a7 multimodal definition of
          mossy cells from PMID:33600026 (Drd2-Cre / Crlr-Cre viral labeling).
      - evidence_type: ATLAS_METADATA
        supports: PARTIAL
        reference: "https://doi.org/10.1038/s41586-023-06812-z"
        explanation: >
          Zhuang 2023 MERFISH shows additional CA3-strata SOMA representation
          (pyramidal 195, oriens 116, radiatum 132, lucidum 78) and DG granule cell
          layer (125) for this cluster — anatomically adjacent to the hilus but
          extending the cluster beyond a pure hilar-mossy-cell pool. May indicate
          registration spillover or sub-population heterogeneity.
    caveats:
      - >
        Reln expression in CLUS_0317 (mean 0.21) is below MIN_DETECTABLE and far
        below the classical IHC-based assertion of Reln+ in dentate hilar mossy
        cells. The discrepancy is unexplained.
      - >
        Gad1 expression in CLUS_0317 (mean 1.49) is above MIN_DETECTABLE despite
        the classical assertion that mossy cells are Gad1-negative.
      - >
        Cluster label is "CA3 Glut_5" and SOMA distribution extends substantially
        into CA3 strata. The mapping rests on dentate-polymorph SOMA dominance
        + Drd2/Slc17a7 expression; the CA3-strata sub-population may represent
        a distinct (non-mossy) component of this cluster.
      - >
        No annotation transfer evidence available for this edge — confidence
        will be capped at MODERATE by report-time agent per Stage B rubric step (iv).
      - >
        Heterogeneity flag from classical node notes: dorsal vs ventral mossy
        cells (dorsal: IML+MML projection; ventral: IML only) — single atlas
        cluster may collapse this axis.
    unresolved_questions:
      - >
        Does CLUS_0317 contain both hilar mossy cells (DG polymorph) and a
        distinct CA3-stratum glutamatergic population, or is the CA3 signal
        registration spillover from adjacent dentate hilus in MERFISH sections?
      - >
        Why is Reln transcript so low (0.21) when classical IHC reports Reln+
        protein in dentate hilar mossy cells (PMID:25206826)?
      - >
        Does CLUS_0317 separate dorsal vs ventral mossy cell sub-populations,
        or is it dorsoventrally collapsed?
    proposed_experiments:
      - >
        Spatial sub-clustering of CLUS_0317 cells restricted to MBA:10704 (DG
        polymorph) vs CA3 strata to test whether the cluster collapses two
        anatomically distinct glutamatergic populations.
      - >
        Re-examine Reln in CLUS_0317 at single-cell resolution to test whether
        Reln+ is a minority sub-population (consistent with PMID:25206826) or
        broadly low expression across the cluster.
      - >
        Annotation transfer from a mossy-cell-enriched dataset (e.g. Drd2-Cre
        FACS or hilar microdissection RNA-seq) to confirm 1:1 correspondence
        to CLUS_0317.
