# Predicate rubric: 2026-05-26 (PartialOverlapMatch deprecated)
# Mapping_justification: semapv:UnreviewedManualMapping
#
# Note: ca1_radiatum_giant_cell is a rare CA1 stratum radiatum projection neuron
# (Kirson 2000, Christie 2000, Nasrallah 2019) with no defining transcriptomic
# markers in the classical literature. No transcriptomic counterpart has been
# reported. All candidates either (a) localise primarily outside CA1 stratum
# radiatum (ENT/PA/COAp, SUB/ProS), or (b) represent the canonical CA1 pyramidal
# supertype (SUPT_0069 / CLUS_0261), which RGCs are morphologically and
# electrophysiologically distinct from. All edges are UncertainRelationship
# pending transcriptomic characterisation of RGCs.
##

