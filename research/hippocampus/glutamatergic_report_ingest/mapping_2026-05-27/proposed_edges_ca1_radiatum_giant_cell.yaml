  - id: edge_ca1_radiatum_giant_cell_to_CS20230722_CLUS_0261
    lit_type: ca1_radiatum_giant_cell
    taxonomy_type: CS20230722_CLUS_0261
    relationship: evidencell:UncertainRelationship
    mapping_cardinality: "1:1"
