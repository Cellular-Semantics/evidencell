    property_comparisons:
      - property: nt_type
        lit_value: glutamatergic
        taxonomy_value: Glut
        agreement: AGREE
      - property: SOMA_location
        lit_value: CA1 stratum radiatum (UBERON:0005372)
        taxonomy_value: CA1 stratum oriens, CA1 pyramidal layer, CA1 stratum radiatum, CA2/CA3 pyramidal/oriens — the canonical CA1-ProS pyramidal cluster
        agreement: PARTIAL
        notes: >
          CLUS_0261 contains the canonical CA1 pyramidal neurons. RGCs reside in
          CA1 stratum radiatum and are morphologically and electrophysiologically
          distinct from CA1 PCs (NMDA-dependent bursting, EPSCs ≥3× larger,
          inverted HCN gradient). MERFISH cells in MBA:415 in this cluster are
          presumably CA1 PCs whose soma centre or processes register to sr.
    evidence:
      - evidence_type: ATLAS_METADATA
        supports: PARTIAL
        explanation: >
          CLUS_0261 (CA1-ProS Glut_1) is the canonical CA1 pyramidal cell cluster
          (dominant MERFISH counts in CA1 pyramidal layer, oriens, radiatum and
          CA2/CA3 fields). RGCs are a rare specialised projection neuron in CA1
          stratum radiatum that classical literature explicitly distinguishes
          from CA1 PCs (Kirson 2000, Christie 2000, Nasrallah 2019). Without
          defining transcriptomic markers for RGCs, we cannot rule out that
          RGCs are a transcriptomically distinct minority contained within this
          cluster, but no positive evidence supports correspondence.
        source_atlas: WMBv1
        source_cell_set_accession: CS20230722_CLUS_0261
