  - id: edge_hpc_cajal_retzius_cell_to_CS20230722_CLUS_0497
    lit_type: hpc_cajal_retzius_cell
    taxonomy_type: CS20230722_CLUS_0497
    mapping_predicate: skos:closeMatch
    mapping_cardinality: 1:1
    mapping_justification: semapv:UnreviewedManualMapping
    property_comparisons:
      - property: nt_type
        node_a_value: "glutamatergic (cl_terms: CL:0000679)"
        node_b_value: "Glut"
        alignment: CONSISTENT
      - property: location
        node_a_value: "UBERON:0014557 CA1 stratum lacunosum-moleculare (SOMA); UBERON:0001885 dentate gyrus OML (SOMA)"
        node_b_value: "MBA:10703 Dentate gyrus molecular layer (SOMA; 640 Zhuang 2023 + 1735 Yao 2024 = 2375 cells); MBA:391 Field CA1 stratum lacunosum-moleculare (SOMA; 139+179 = 318 cells); MBA:526 Entorhinal area medial part dorsal zone layer 1 (SOMA; 182 cells)"
        alignment: CONSISTENT
        notes: >
          Excellent anatomical match: dominant SOMA distribution in DG molecular
          layer + CA1 SLM exactly matches the classical hippocampal Cajal-Retzius
          cell SOMA locations (SLM and OML). Entorhinal L1 SOMA component is
          consistent with the known distribution of CR cells across cortical/
          hippocampal marginal zones. region_fraction 0.937 against the
          hippocampal closure (MBA:391 + MBA:726).
      - property: marker_Reln
        node_a_value: "asserted present (PMID:25253849 optogenetic; PMID:25206826 IHC)"
        node_b_value: "precomputed mean 12.42 (cohort percentile 0.999); not listed in taxonomy DEFINING/MERFISH metadata but extremely high"
        alignment: CONSISTENT
        notes: >
          Reln expression is in the top percentile of the glutamatergic cohort,
          consistent with the defining classical marker for hippocampal CR cells.
    evidence:
      - evidence_type: ATLAS_METADATA
        supports: SUPPORT
        reference: "https://doi.org/10.1038/s41586-023-06808-9"
        explanation: >
          WMB cluster 0497 (HPF CR Glut_1) has its dominant SOMA distribution in
          the dentate gyrus molecular layer (2375 cells combined across Yao 2024
          and Zhuang 2023 MERFISH) and CA1 stratum lacunosum-moleculare (318
          cells) — the canonical anatomical loci of hippocampal Cajal-Retzius
          cells. Glutamatergic NT-type assignment matches the classical
          reelin+/calretinin+/VGluT3+ subpopulation. Reln expression is at the
          top of the cohort (mean 12.42, percentile 0.999), and high Ndnf
          (mean 11.09) is consistent with marginal-zone Reln+ neurons. The
          cluster taxonomic name "HPF CR Glut_1" itself reflects the atlas
          curators' identification of this cluster as hippocampal CR cells.
      - evidence_type: ATLAS_METADATA
        supports: SUPPORT
        reference: "https://doi.org/10.1038/s41586-023-06812-z"
        explanation: >
          Zhuang 2023 MERFISH provides independent confirmation of the SOMA
          distribution (640 cells in DG molecular layer, 139 in CA1 SLM)
          consistent with the Yao 2024 dataset.
    caveats:
      - >
        Classical node aggregates only the glutamatergic CR subpopulation
        (Reln+/calretinin+/VGluT3+); the classical node notes a substantial
        GABAergic CR fraction that is not represented here. WMB cluster 0497
        is purely glutamatergic and so corresponds to the glutamatergic
        subpopulation only.
      - >
        Classical node morphology section identifies three axonal subtypes
        (layer-restricted local, cross-fissure local, long-range projecting);
        cluster 0497 collapses any such heterogeneity, and the atlas data
        does not separately resolve axonal subtypes.
      - >
        Vglut3 precomputed mean is low (0.29) despite the classical
        Reln+/calretinin+/VGluT3+ marker triad being part of the node
        definition. Calb2 (calretinin) is high (4.88, consistent). The
        Vglut3 discrepancy may reflect (i) low Slc17a8/Vglut3 transcript
        relative to protein, (ii) dilution by non-VGluT3 subpopulations, or
        (iii) detection limit issues — not investigated here.
      - >
        No annotation transfer evidence is available for this edge; confidence
        will be capped per Stage B rubric (iv) at report-time synthesis.
    unresolved_questions:
      - >
        Does the SOMA in entorhinal cortex medial dorsal layer 1 (MBA:526,
        182 cells) represent hippocampal CR cells extending into adjacent
        cortex, or a separate cortical CR population that this cluster
        encompasses?
      - >
        Why is Vglut3 transcript so low relative to the classical VGluT3+
        molecular signature reported in optogenetic studies?
      - >
        Can the three axonal subtypes (layer-restricted local, cross-fissure
        local, long-range projecting) be resolved as sub-clusters within
        cluster 0497?
    proposed_experiments:
      - >
        smFISH or single-cell Vglut3/Slc17a8 transcript profiling on Reln+
        cells in DG OML and CA1 SLM to test the apparent Vglut3 transcript-
        protein discrepancy.
      - >
        Sub-cluster analysis of CLUS_0497 with axonal-projection markers (if
        any are identifiable) to test whether the three classical axonal
        subtypes correspond to molecular subsets.
      - >
        Annotation transfer from a Reln-Cre or calretinin-targeted dataset
        with confirmed CR identity to formally measure F1 correspondence
        to CLUS_0497.
