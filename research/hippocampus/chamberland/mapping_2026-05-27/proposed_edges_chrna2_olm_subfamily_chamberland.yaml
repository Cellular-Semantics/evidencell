    taxonomy_type: CS20230722_SUPT_0216
    mapping_predicate: skos:broadMatch
    mapping_cardinality: "1:n"
    mapping_justification: semapv:UnreviewedManualMapping
    property_comparisons:
      - property: nt_type
        node_a_value: "GABAergic (Chrna2-Cre / Sst-Flp intersectional reporter)"
        node_b_value: "GABA (taxonomy parent subclass 053 Sst Gaba)"
        alignment: CONSISTENT
      - property: location
        node_a_value: "CA1 stratum oriens (SOMA; Chrna2-Cre transgenic; biocytin fill)"
        node_b_value: "Field CA1 stratum oriens 1375 cells; Prosubiculum 404; alveus 303; Posterior amygdalar nucleus 163; Subiculum 108"
        alignment: CONSISTENT
        notes: |
          Supertype soma distribution dominated by CA1 stratum oriens — the canonical
          Chrna2-OLM region. Adjacent subicular/prosubicular/alveus fractions are common
          boundary/registration neighbours. Posterior amygdalar component (~6%) is a
          minor non-OLM contaminant at the supertype level.
      - property: marker_Sst
        node_a_value: "Sst+ (Sst-Flp intersectional; gene-pair rule Sst+/Chrna2+>0)"
        node_b_value: "Sst: 11.44 (precomputed mean); coverage 1.0 across child clusters"
        alignment: CONSISTENT
      - property: marker_Chrna2
        node_a_value: "Chrna2+ (Chrna2-Cre defining; gene-pair rule)"
        node_b_value: "Chrna2: 0.61 (precomputed mean); coverage 0.667 across child clusters"
        alignment: APPROXIMATE
        notes: |
          Supertype-mean Chrna2 expression is sparse (0.61) and only 2 of 3 child
          clusters detectably express Chrna2 (coverage 0.667). This matches the
          expected sparsity of Chrna2 in classical Sst-OLM and the fact that the
          Chrna2-OLM subfamily is a *subset* of cells aggregated into this supertype.
    evidence:
      - evidence_type: ATLAS_METADATA
        supports: SUPPORT
        reference: "https://doi.org/10.1038/s41586-023-06812-z"
        explanation: |
          Supertype 0216 Sst Gaba_3 is dominated by CA1 stratum oriens soma (1375 cells)
          and expresses Sst (mean 11.44) and Chrna2 (mean 0.61, coverage 0.667 across
          children) — the molecular signature of the canonical OLM family. Because the
          Chrna2-OLM subfamily is one of several Sst-OLM subfamilies pooled within this
          supertype, the relation is broader-than (skos:broadMatch, 1:n) rather than
          exact. The supertype aggregates all four top-ranked rank-0 candidate clusters
          (0768, 0771, 0772, 0773, 0775) — the specific Chrna2+ sub-cluster identity
          (CLUS_0771) should be resolved at rank 0.
      - evidence_type: ANNOTATION_TRANSFER
        run_ref: at_run_20260512_chamberland_subfamily_mmc_wmbv1
        source_cluster_label: Chrna2
        target_atlas: WMBv1
        method: MapMyCells
        source_dataset_accession: GSE116217
        explanation: |
          MapMyCells transfer of Chamberland 2024 Chrna2-subfamily-labelled Harris 2018
          cells to WMBv1: 74 of the Chrna2 cohort mapped to supertype 0216 Sst Gaba_3
          (modal supertype, coverage 0.90, F1 0.21). The F1 is low because Chrna2 cells
          are a small fraction of the supertype — consistent with Chrna2-OLM being a
          *subfamily* within the broader Sst Gaba_3 supertype.
    caveats:
      - |
        Supertype contains the four top rank-0 candidate clusters (CLUS_0768/0771/0772/
        0773/0775) plus additional Sst Gaba_3 clusters — the specific Chrna2+ sub-cluster
        identity is best resolved at rank 0 (CLUS_0771).
      - |
        AT F1 at this supertype is low (0.21) despite high coverage (0.90), reflecting
        the fact that Chrna2-OLM is a subfamily within the broader supertype — typical
        for the broadMatch case rather than a sign of poor mapping.
      - |
        Posterior amygdalar component (163 cells, ~6%) is anatomically distant from CA1
        and may represent a minor non-OLM subpopulation pooled in this supertype.
      - |
        Chrna2 coverage across child clusters is 0.667 — at least one child cluster
        within supertype 0216 has undetectable Chrna2 and is therefore not part of the
        Chrna2-OLM subfamily.
    proposed_experiments:
      - |
        Per-cluster MERFISH validation (Sst, Chrna2) across CLUS_0768/0771/0772/0773/0775
        in CA1 stratum oriens to identify which rank-0 cluster(s) carry the bulk of the
        Chrna2-Cre-labelled population.
