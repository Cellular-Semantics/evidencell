# 2026-05-27 mapping re-run for chrna2_olm_subfamily_chamberland
# Stage B output: proposed MappingEdges against top 5 rank-0 clusters
# and top 5 rank-1 supertypes from discovery_2026-05-27.
# Predicates follow the 2026-05-26 rubric.
#
# Classical node: Chrna2-IN (Chrna2-OLM, Chamberland 2024).
# Defined as Sst+/Chrna2+ GABAergic CA1 stratum oriens interneurons via
# Chrna2-Cre / Sst-Flp intersectional genetics. A subset of the canonical
# OLM population — Chrna2 expression is the *defining* discriminator
# vs other Sst-OLM subfamilies (notably Ndnf::Nkx2-1).
#
# Cohort overlaps the OLM (olm_hippocampus) candidates because both are
# Sst+ CA1 stratum-oriens interneurons. The key adjudicator at rank-0 is
# Chrna2 expression: CLUS_0771 carries the highest Chrna2 mean (2.56) and
# is the modal target of the Chamberland Chrna2 source label in the
# at_run_20260512_chamberland_subfamily_mmc_wmbv1 AT run (41 of 60 cells,
# F1≈0.42 cluster-level). This contrasts with canonical OLM, whose AT
# (Winterer 2019) preferred CLUS_0768.
