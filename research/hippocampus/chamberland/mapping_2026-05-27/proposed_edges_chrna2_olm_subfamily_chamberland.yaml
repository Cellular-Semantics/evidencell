    evidence:
      - evidence_type: ATLAS_METADATA
        supports: SUPPORT
        reference: "https://doi.org/10.1038/s41586-023-06812-z"
        explanation: |
          CLUS_0771 has the highest Chrna2 mean (2.56) in the rank-0 cohort and high
