#
# Classical node: Sst::Nos1-IN (long-range projecting, Chamberland 2024).
# Defined as Sst+/Nos1+ GABAergic CA1 stratum oriens / alveus interneurons via
# Sst-Flp;Nos1-Cre intersectional genetics. Long-range-projecting cells whose
# axons reach medial septum and contralateral hippocampus — the canonical
# hippocampo-septal / back-projection identity.
#
# NB: per the classical node's notes, the principal AT target for the Nos1
# subfamily in at_run_20260512_chamberland_subfamily_mmc_wmbv1 was
# SUPT_0241 / CLUS_0859 (Sst Chodl Gaba_4) with F1=0.97 — the Sst Chodl
# branch which contains long-range-projecting Sst types. Neither SUPT_0241
# nor CLUS_0859 appears in the 2026-05-27 discovery cohort, because the
# cohort was anchored to MBA:399 (Field CA1 stratum oriens) and the Sst
# Chodl branch's modal anatomy lies elsewhere. The candidates surveyed
# here are therefore the *region-anchored* survivors and are uniformly
# weaker matches than the cross-supertype Sst Chodl target. This is
# called out in each edge's caveats and in the file-level commentary.
