  closest_field: anatomical_location
- finding: >
    Function: activating LHb-projecting vLGN/IGL neurons is sufficient to
    reduce depressive-like behaviours evoked by chronic aversive stimuli or
    social defeat stress, and the antidepressive effects of light therapy
    require the retina-vLGN/IGL-LHb pathway.
  quote_keys: [72332556_28081399, 248001630_8eed194e]
  closest_field: null
- finding: >
    Which transcriptomic vLGN GABAergic subtypes form the LHb-projecting
    population is unresolved (Sabbagh 2020); Brock 2022 reports only a
    sparse LHb projection from Sox14+ LGv/IGL neurons - overlap with
    lgv_igl_sox14_gabaergic_neuron unknown. (Also recorded as a caveat in
    the node's notes.)
