- finding: >
    Afferent retinal input: the population is innervated by M4-type
    melanopsin-expressing RGCs (sONalpha RGCs in Kerschensteiner 2022),
    forming a disynaptic retina-vLGN/IGL-LHb circuit. Afferent inputs are not
    AXON_TARGET locations.
