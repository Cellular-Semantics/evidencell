- finding: >
    vLGNe is the retinorecipient vLGN subdivision: retinal axons terminate
    exclusively there, and neurons in each of the four vLGNe sublaminae receive
    monosynaptic retinal input (trans-synaptic viral tracing + in vitro
    electrophysiology). Afferent input is a defining property of this node but
    has no node field.
  quote_keys: [255502436_f820743a, 219328889_a1d23e11, 219328889_ea819292]
  closest_field: null
- finding: >
    Retinal afferent stimulation evokes robust driver-like excitation in vLGNe;
    layer V corticothalamic terminals evoke similar driver-like activity, and
    many vLGNe neurons receive convergent retinal + corticothalamic input
    (dual-colour optogenetics); corticothalamic input shows stronger synaptic
    depression than retinogeniculate input. Synaptic, not intrinsic, properties.
  quote_keys: [255502436_8191927b]
  closest_field: electrophysiology
- finding: >
    Development: the cell-type-specific GABAergic laminae of vLGNe are
    specified at or before birth independently of retinal input; after the
    first postnatal week, retinal input is needed to maintain the laminar
    organisation and the vLGNe/vLGNi boundary (mutants lacking retinal input).
  quote_keys: [271906359_1bfec86c]
  closest_field: null
- finding: >
    vLGNe contains at least four transcriptomically distinct GABAergic
    subtypes in adjacent sublaminae; the report gives no names or markers for
    them (candidate child nodes once Sabbagh 2020 markers are extracted).
  quote_keys: [219328889_ea819292, 219328889_a1d23e11, 271906359_1bfec86c]
  closest_field: defining_markers
