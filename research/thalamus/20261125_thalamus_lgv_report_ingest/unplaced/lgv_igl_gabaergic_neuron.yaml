# Unplaced findings for lgv_igl_gabaergic_neuron (ENRICH), vLGN GABA report ingest 2026-11-25
- finding: >
    In vivo visual response properties of vLGN cells: larger receptive fields
    than dLGN, most cells prefer bright over dark stimuli, lower temporal
    precision of visually evoked spikes, and stimulus-dependent gamma
    oscillations in membrane currents and spikes of some cells. These are
    sensory response properties, not intrinsic firing properties, and the
    cells are not identified as GABAergic in the quote.
  quote_keys: [217593649_83051103]
  closest_field: electrophysiology
- finding: >
    vLGN GABA neuron activity scales with ambient illumination and is
    modulated by behavioural state; chemogenetic activation reduces freezing
    and inactivation prolongs freezing to visual threats; vLGN→Re and vLGN→SC
    circuits have opposite effects on defensive responses.
  quote_keys: [238410529_5d954f1d]
  closest_field: electrophysiology
- finding: >
    Afferent retinal input: M4-type ipRGCs / sONα RGCs innervate vLGN/IGL GABA
    neurons (retina→vLGN/IGL→LHb circuit for the antidepressant effects of
    light); a subset of RGCs innervates the LPBN-projecting vLGN/IGL GABAergic
    neurons; Sox14+ IGL/LGv neurons receive sparse-to-moderate RGC input,
    likely heavier in ventral than dorsal LGv/IGL; no M1 ipRGC terminals in
    LGv. Afferents are not AXON_TARGET locations.
  quote_keys: [72332556_28081399, 248001630_8eed194e, 270412585_53f9c770, 247159795_caaf839c, 247159795_d6f1641f]
  closest_field: anatomical_location
- finding: >
    Synaptic input physiology: retinal afferents give driver-like excitation in
    vLGNe; layer V corticothalamic input is driver-like in both vLGNe and
    vLGNi; many vLGNe neurons receive convergent retinal + corticothalamic
    input, vLGNi neurons only corticothalamic. Retinal terminals in vLGN are
    smaller and denser than in dLGN, and optic-tract EPSCs are smaller with
    distinct paired-pulse responses; inhibitory terminals are dense in vLGN.
  quote_keys: [255502436_8191927b, 255985654_f1719734, 1225644_ccfc7885, 1225644_4f198eeb]
  closest_field: electrophysiology
- finding: >
    Development: retinal-derived SHH is required for recruitment of GABAergic
    interneurons into visual thalamus (dLGN and vLGN); vLGNe GABAergic laminae
    are specified at or before birth independent of retinal input, but retinal
    input is needed after the first postnatal week to maintain laminar order
    and the vLGNe/vLGNi boundary.
  quote_keys: [247085323_6022a467, 247085323_880b2f54, 271906359_1bfec86c]
  closest_field: null
