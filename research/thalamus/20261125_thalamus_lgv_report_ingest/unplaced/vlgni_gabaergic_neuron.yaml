- finding: >
    vLGNi is the non-retinorecipient vLGN subdivision: retinal axons that
    target vLGN terminate exclusively in vLGNe, and vLGNi receives little, if
    any, retinal input. Afferent input is a defining property of this node but
    has no node field.
  quote_keys: [255502436_f820743a, 4601077_b2845e93, 219328889_a1d23e11]
  closest_field: null
- finding: >
    Optical activation of layer V corticothalamic terminals evokes driver-like
    excitatory activity in vLGNi as in vLGNe; vLGNi neurons respond only to
    corticothalamic stimulation, with no evidence of retinal +
    corticothalamic convergence (dual-colour optogenetics, slice). Synaptic,
    not intrinsic, properties.
  quote_keys: [255502436_8191927b]
  closest_field: electrophysiology
- finding: >
    Development: in mutants lacking retinal input, the GABAergic laminar
    organisation is normal at birth but the boundary between vLGNe and vLGNi
    later becomes disrupted.
  quote_keys: [271906359_1bfec86c]
  closest_field: null
