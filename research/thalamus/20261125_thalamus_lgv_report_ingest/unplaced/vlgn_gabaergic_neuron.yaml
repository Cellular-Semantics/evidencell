- finding: >
    Stebbins 2026 snRNA-seq atlas of mouse vLGN (>16,500 nuclei): 20
    candidate neuron types, at least two excitatory; most neurons in vLGN are
    GABAergic. Cluster names, markers and accession not given in the report.
    Candidate at_source_sets / PRIOR_TRANSCRIPTOMIC source for
    evidence-extraction.
  quote_keys: [286491924_d7a92ebc, 286491924_d474808b]
  closest_field: null
- finding: >
    Afferent synaptic input: retinal axons terminate exclusively in vLGNe and
    give driver-like excitation there; layer V corticothalamic input is
    driver-like in both vLGNe and vLGNi; many vLGNe neurons receive
    convergent retinal + corticothalamic input, vLGNi neurons respond only to
    corticothalamic input. Retinal terminals in vLGN are smaller, less complex
    and denser than in dLGN, optic-tract EPSCs are smaller with distinct
    paired-pulse responses, and inhibitory terminals are densely packed.
    Afferents are not AXON_TARGET locations; synaptic responses are not
    intrinsic electrophysiology.
  quote_keys: [255502436_f820743a, 255502436_8191927b, 255985654_f1719734, 1225644_ccfc7885, 1225644_4f198eeb]
  closest_field: electrophysiology
- finding: >
    Retinal input to defined vLGN/IGL GABAergic channels: M4-type ipRGCs /
    sONα RGCs innervate LHb-projecting vLGN/IGL GABA neurons (light's
    antidepressant effects); a subset of RGCs innervates LPBN-projecting
    vLGN/IGL GABAergic neurons (antipruritic effect of light). SC GABAergic
    neurons below the SGS project to vLGN (an input).
  quote_keys: [72332556_28081399, 248001630_8eed194e, 270412585_53f9c770, 199504544_8e10a4d6]
  closest_field: anatomical_location
- finding: >
    In vivo visual response properties of vLGN cells: larger receptive fields
    than dLGN, most cells prefer bright stimuli, lower temporal precision, and
    stimulus-dependent gamma oscillations in some cells. Sensory responses,
    not intrinsic firing; cells not identified as GABAergic in the quote.
  quote_keys: [217593649_83051103]
  closest_field: electrophysiology
- finding: >
    vLGN-GABA neuron activity scales with ambient illumination and is
    modulated by behavioural state; chemogenetic activation reduces freezing,
    inactivation prolongs freezing to visual threats; vLGN→Re and vLGN→SC
    circuits have opposite effects on defensive responses.
  quote_keys: [238410529_5d954f1d]
  closest_field: null
- finding: >
    Developmental origin: vLGN is an "inhibitory nucleus" whose neurons derive
    from the rostral thalamic progenitor domain (pTH-R, Ascl1/Tal1+), the most
    caudal prethalamus and the zona limitans interthalamica. Recruitment of
    GABAergic interneurons into visual thalamus (dLGN and vLGN) depends on
    retina-derived SHH acting via astrocytes (Fgf15). vLGNe GABAergic laminae
    are specified at or before birth, independent of retinal input, but
    retinal input is needed to maintain laminar order and the vLGNe/vLGNi
    boundary after the first postnatal week.
