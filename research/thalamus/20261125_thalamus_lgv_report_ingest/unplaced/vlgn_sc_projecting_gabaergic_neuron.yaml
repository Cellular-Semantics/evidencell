- finding: >
    In rat, the ventral LGN projects to the superior colliculus, terminating
    mainly in the medial third of the stratum opticum ([3H]proline
    autoradiography; Ribak & Peters 1975). Transmitter of the projecting cells
    not stated; different species from the node (mouse).
  quote_keys: [6613291_27e29f1c]
  closest_field: anatomical_location
- finding: >
    Behavioural function: the vLGN-to-SC circuit and the vLGN-to-nucleus
    reuniens circuit exert opposite influences on defensive responses to
    visual threats (Salay 2021). Proposed function of long-range inhibitory
    vLGN projections: releasing motor targets such as SC from suppression,
    since vLGN cells prefer bright stimuli while dark shadows activate SC and
    drive escape (Ciftcioglu 2020; hypothesis, not tested for SC-projecting
    cells). Circuit function has no property field.
  quote_keys: [238410529_5d954f1d, 217593649_83051103]
  closest_field: null
