# Unplaced findings for lgv_igl_sox14_gabaergic_neuron (NEW), vLGN GABA report ingest 2026-11-25
- finding: >
    Afferent retinal input: Sox14+ IGL/LGv neurons receive sparse-to-moderate
    RGC synaptic input, probably heavier in ventral than dorsal LGv/IGL;
    Sox14+ cells are sparse where retinal innervation is densest (vLGNe, IGL)
    and enriched in vLGNi, which receives fewer retinal projections. Afferent
    inputs are not AXON_TARGET locations.
  quote_keys: [247159795_caaf839c, 247159795_a2cf4a69]
  closest_field: anatomical_location
- finding: >
    Developmental origin: the type is defined by derivation from the rostral
    thalamic progenitor domain (pTH-R), as opposed to pTH-C (dLGN) and the
    prethalamus (ventral LGv/IGL component). pTH-R progenitors express the
    proneural bHLH factors Ascl1 and Tal1 and fate-mapping with these markers
    shows pTH-R contributes to IGL and vLG. Ascl1/Tal1 are progenitor-domain
    markers, not shown to be expressed by the mature neurons.
  quote_keys: [247159795_aeeef91c, 247159795_d79097dc, 13741105_cc00f279]
  closest_field: defining_markers
