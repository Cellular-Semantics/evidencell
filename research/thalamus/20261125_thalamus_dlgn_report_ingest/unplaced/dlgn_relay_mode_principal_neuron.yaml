- finding: >
    Defining afferent connectivity: each relay-mode LGN principal cell receives
    retinal input from 1-5 ganglion cells of mostly the same type, all from one
    eye (single-cell-initiated transsynaptic tracing). Wang et al. (2024)
    restate this as input from a small number of functionally similar RGCs.
    Afferent input pattern; no node property field holds it.
  quote_keys: [10004494_03dd7881, 267806869_6f6c417b]
