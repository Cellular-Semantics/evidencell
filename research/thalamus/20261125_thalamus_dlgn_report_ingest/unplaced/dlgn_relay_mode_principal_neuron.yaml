- finding: >
    Functional interpretation (report text, Rompani et al. 2017): relay-mode
    neurons are the most specialised of the three modes, wired for relatively
    faithful transmission of a single retinal feature channel
    ("channel-preserving relay"), in contrast to combination and binocular
    combination modes.
  quote_keys: [10004494_03dd7881]
  closest_field: electrophysiology
