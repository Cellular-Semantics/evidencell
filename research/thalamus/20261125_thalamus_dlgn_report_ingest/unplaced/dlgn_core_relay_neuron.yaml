- finding: >
    In rat, the rostroventral central core is composed of cells receiving input
    primarily from fast-conducting, large type I RGCs (vs type II and III RGC
    input to the shell). Afferent input, not an axon target.
  quote_keys: [16328698_79efc008]
  closest_field: null
- finding: >
    Core and shell both receive retinal input; the shell additionally receives
    direction-selective RGC and superior colliculus input, so the core lacks
    the shell's motion-pathway afferents (stated by contrast only).
  quote_keys: [264598574_32e8c9a5]
  closest_field: null
- finding: >
    Core neurons are the main source of the dense V1 layer-4 projection. The
    quote states dLGN axons target L4 densely and attributes only the L1
    projection to the shell; core-to-L4 is the report's inference. Recorded on
    anatomical_location as AXON_TARGET with support WEAK. A further general
    statement (LGN axons branch in L4 with L6 collaterals) comes from rat
    organotypic co-culture citing cat work and was not cited.
  quote_keys: [264598574_32e8c9a5, 44977478_e2adb19c]
  closest_field: anatomical_location
- finding: >
    Cross-species correspondence: mouse dLGN core TC neurons align
    transcriptomically with primate magnocellular and parvocellular neurons
    (shell neurons align with koniocellular neurons).
  quote_keys: [237389962_1dd0f6d1]
  closest_field: null
- finding: >
    Y-like relay cells occupy a central core that also contains ipsilateral-eye
    projections; the ipsilateral zone is not shown to be coextensive with the
    core, so no ipsilateral-zone location was recorded for this node.
  quote_keys: [16328698_cc12bb7a]
  closest_field: anatomical_location
