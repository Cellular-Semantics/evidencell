- finding: >
    Defining afferent connectivity: each binocular combination-mode LGN
    principal cell receives retinal input from up to 91 ganglion cells from
    both eyes, with functionally specialised ipsilateral inputs joining
    broadly distributed contralateral inputs (single-cell-initiated
    transsynaptic tracing). Afferent input pattern; no node property field
    holds it.
  quote_keys: [10004494_03dd7881]
  closest_field: null
- finding: >
    Functional interpretation (report text, Rompani et al. 2017; Wang et al.
    2024): binocular combination-mode neurons integrate visual features
    across the two eyes, in contrast to the channel-preserving relay mode
    and the within-eye combination mode. The Wang et al. quote in the store
    only restates relay mode, so it is not cited here.
  quote_keys: [10004494_03dd7881]
  closest_field: electrophysiology
- finding: >
    No mapping between binocular combination mode and the ipsilateral-
    recipient zone, X/Y/W-like morphology or core/shell location is
    established in the sources (Y-like cells occupy the core that receives
    ipsilateral projections, but no link to this mode is stated).
  quote_keys: [10004494_03dd7881, 16328698_cc12bb7a]
