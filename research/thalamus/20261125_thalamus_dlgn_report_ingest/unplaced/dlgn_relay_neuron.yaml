# Unplaced findings for dlgn_relay_neuron (ENRICH) — 20261125_thalamus_dlgn_report_ingest
# Population-level findings from the mouse dLGN relay report with no CellTypeNode field.

- finding: >
    Relay neurons are 80-90% of mouse dLGN neurons; the C57BL/6 dLGN holds
    ~21,200 neurons, of which ~20,000 are inferred to be thalamocortical
    projection neurons. Heiberg et al. (circuit model) give 75-80% relay cells
    and 20-25% interneurons — a discrepancy between sources.
  quote_keys: [286491924_f2e9799b, 4792744_5b4f0ea0, 4792744_89d92cb0, 4792744_68bb30ae, 3626777_ca418205]
  closest_field: null

- finding: >
    Relay neurons originate from the caudal progenitor domain of the thalamic
    ventricular zone (prosomere 2) during rodent embryogenesis.
  quote_keys: [4601077_8f3fc6a4]
  closest_field: null

- finding: >
    Retinal ganglion cells make strong glutamatergic driver synapses onto
    relay neurons that evoke fast, reliable EPSPs driving spikes, but retinal
    terminals are only ~10% of synaptic inputs; the majority (up to 95% of
    dLGN terminals) are nonretinal — corticothalamic, TRN, local interneuron,
    pretectal and brainstem — and modulate retinogeniculate gain.
  quote_keys: [1225644_425d38ca, 26076888_f3def9a4, 4807205_9a361c91, 54481879_7b1dac63]
  closest_field: electrophysiology

- finding: >
    Corticothalamic stimulation evokes large, facilitating glutamatergic
    responses in identified relay neurons, while also recruiting TRN and
    local interneuron inhibition onto them.
  quote_keys: [2891889_eb2be0be, 2891889_ee9d8456]
  closest_field: electrophysiology

- finding: >
    Tonic inhibition through extrasynaptic high-affinity GABA-A receptors
    regulates the gain of thalamic relay neurons (thalamic relay neurons in
    general, not dLGN-specific in the quote).
  quote_keys: [264044014_94422eb1]
  closest_field: electrophysiology

- finding: >
    Pretectal input to dLGN targets interneurons more than relay cells, so
    its activation disinhibits relay cells and increases their responses to
    retinal input.
  quote_keys: [277785001_d5f8258d]
  closest_field: null

- finding: >
    Retinogeniculate refinement: relay cells initially receive input from a
    dozen or so RGCs, reduced to a few by activity-dependent pruning; the
    remaining synapses are strengthened by AMPA receptor insertion. Retinal
    input is required for normal relay-cell dendritic growth.
  quote_keys: [15010690_25e2d46c, 250147404_04b470de, 73481430_405494f9, 271906359_c81f28b6]
  closest_field: morphology

- finding: >
    dLGN relay neurons carry retinotopically precise visual signals to V1,
    with small receptive fields; mouse dLGN contains, besides center-surround
    cells, direction- and orientation-selective neurons (population-level
    functional diversity; the DS/OS subset is left to the shell /
    direction-selective nodes).
  quote_keys: [264598574_32e8c9a5, 8247989_b49fb8a2, 36416152_7fcc72ba]
  closest_field: null
