- finding: >
    Shell neurons receive direction-selective RGC and superior colliculus input
    (in addition to retinal input shared with the core); afferent inputs, not an
    axon target.
  quote_keys: [264598574_32e8c9a5, 14389058_e2e97d92]
  closest_field: anatomical_location
- finding: >
    The shell coincides with a superficial cryptic lamina targeted by
    genetically identified RGC axons (DS-RGCs; tOFF-alpha RGCs restricted to a
    specific laminar depth of dLGN). Input-defined territory, not a relay-cell
    marker.
  quote_keys: [14389058_e2e97d92, 1519009_e1b7a237]
  closest_field: anatomical_location
- finding: >
    Direction- and orientation-selective visual responses are enriched in
    superficial dLGN / DS-RGC termination zones; superficial region holds
    anterior/posterior direction-selective neurons intermingled with
    non-direction-selective neurons and horizontal motion-axis selective cells.
    Receptive-field tuning, not intrinsic electrophysiology.
  quote_keys: [36416152_7fcc72ba, 3598591_8c3025f0, 3598591_b52f6d24, 14389058_e2e97d92]
  closest_field: electrophysiology
