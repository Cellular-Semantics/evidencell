# Unplaced findings for dlgn_w_like_relay_cell (NEW) — 20261125_thalamus_dlgn_report_ingest

- finding: >
    Relative abundance: Y-like cells are more prevalent than X- and W-like
    cells in mouse dLGN (as in cat), so W-like cells are a minority relay class.
  quote_keys: [16328698_cc12bb7a]
  closest_field: null

- finding: >
    Cross-species correspondence: the dendritic architecture of mouse W-like
    relay cells closely resembles that of cat W cells; the rodent relay classes
    resemble those of cats and higher mammals.
  quote_keys: [16328698_79efc008, 4601077_8f3fc6a4]
  closest_field: morphology

- finding: >
    Overlap with the dLGN shell: W-like cells lie along the perimeter /
    dorsolateral shell, a domain Krahe et al. relate (via rat work, Reese 1988)
    to input from slowly conducting type II and III RGCs. The shell may also
    contain non-W-like relay cells, so the relation between W-like cells and
    dlgn_shell_relay_neuron is overlap, not recorded containment. Retinal
    input type is not shown directly for W-like cells.
  quote_keys: [16328698_cc12bb7a, 16328698_79efc008, 4601077_8f3fc6a4, 286491924_f2e9799b]
  closest_field: anatomical_location

- finding: >
    Krahe et al. 2011 found no electrophysiological properties distinguishing
    X-, Y- and W-like relay cells. Recorded as a caveat in notes; no
    W-like-specific electrophysiology profile exists.
  quote_keys: [16328698_cc12bb7a]
  closest_field: electrophysiology
