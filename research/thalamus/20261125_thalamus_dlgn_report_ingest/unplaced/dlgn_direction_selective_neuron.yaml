- finding: >
    The remaining superficial dLGN neurons respond to both anterior and
    posterior directions (horizontal motion-axis selectivity) - a distinct
    axis-selective population in the same zone, not direction-selective cells
    and with no KB node.
  quote_keys: [3598591_8c3025f0]
