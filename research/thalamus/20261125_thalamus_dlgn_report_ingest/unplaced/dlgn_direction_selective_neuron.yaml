- finding: >
    Direction tuning is attributed to retinal input: direction- and
    orientation-selective LGN neurons are enriched where direction-selective
    RGCs terminate, and dLGN is proposed to integrate opposing DS-RGC subtypes.
    The shell receives direction-selective RGC and superior colliculus input.
    Afferent connectivity; no field holds inputs.
