- finding: >
    Cortex-projecting thalamic nuclei derive from the NEUROG1/NEUROG2-marked
    pTH-C progenitor domain (caudal thalamic progenitors, cTh.Pro); Otx2 is
    required in these progenitors to repress GABAergic differentiation.
    Developmental lineage markers for the class, not adult LD markers; LD not
    named in the sources.
  quote_keys: ["13741105_7feebb43", "254404676_f49607a7", "14280583_84f828be"]
  closest_field: defining_markers
- finding: >
    Postsubicular inputs to the laterodorsal thalamic nucleus travel largely by
    a nonfornical route via the internal capsule (rat). Afferent input, not a
    property field.
  quote_keys: ["11875160_ddc91eba"]
  closest_field: null
- finding: >
    The dorsal retrosplenial cortex has spatially topological connections with
    the dorsal visual cortex and "lateral thalamus" (mouse). LD is not named and
    the direction of the connection is not stated, so not recorded as an
    AXON_TARGET.
  quote_keys: ["275580744_084dfc3d"]
  closest_field: anatomical_location
- finding: >
    dLGN and LP are the only mouse dorsal thalamic nuclei with substantial
    numbers of GABA-immunoreactive interneurons, implying few interneurons
    accompany LD projection neurons (inference; LD not named).
  quote_keys: ["4792744_c3d90356"]
  closest_field: colocated_types
