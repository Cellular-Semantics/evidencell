# Findings for ppvt_glutamatergic_neuron that fit no CellTypeNode property field.
- finding: >
    Neuropeptides involved in depression-like behaviour are more highly
    expressed in the posterior PVT than elsewhere along the antero-posterior
    axis (rodent review); no individual peptide is named in the quote, so
    nothing can be recorded under neuropeptides.
  quote_keys: ["231597608_b01066a1"]
  closest_field: neuropeptides
- finding: >
    Optogenetic activation of the pPVT-CeA pathway induces mechanical
    hypersensitivity in naive rats, and the downstream target of this
    descending facilitation pathway is the glutamatergic population of the
    ventrolateral periaqueductal gray. A circuit-level behavioural and
    downstream-target finding, not a property of the pPVT cell itself.
  quote_keys: ["221841412_ee9020be", "221841412_69081b2d"]
  closest_field: null
- finding: >
    Pharmacological inactivation of the posterior PVT, unlike the anterior
    PVT, did not change sucrose seeking under reward omission (rat). A
    negative behavioural result that distinguishes pPVT from aPVT
    functionally but asserts no cellular property.
  quote_keys: ["207218608_40dbc14a"]
  closest_field: null
- finding: >
    Anterior and posterior PVT subpopulations respond differently to
    appetite-related neuropeptides and their chemogenetic activation has
    opposing effects on food consumption (mouse); no peptide or receptor gene
    is named, so no neuropeptide or marker entry follows.
  quote_keys: ["264359607_d839d41e"]
  closest_field: neuropeptides
- finding: >
    Aversive experience recruits the posterior PVT together with
    corticotropin-releasing hormone signalling in the central amygdala to
    promote passive responding; the CRH in this circuit is released locally
    in the CE, not asserted as a pPVT neuron product.
  quote_keys: ["49208529_0485207c"]
  closest_field: neuropeptides
