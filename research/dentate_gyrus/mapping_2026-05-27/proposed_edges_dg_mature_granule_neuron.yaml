# Every edge is therefore evidencell:UncertainRelationship (rule v: unresolvable)
# or skos:broadMatch where the classical Tbr1+ glutamatergic property is shared
# but anatomical location and Prox1 signature are discordant. No AT signal is
# available for dg_mature_granule_neuron in this run.

