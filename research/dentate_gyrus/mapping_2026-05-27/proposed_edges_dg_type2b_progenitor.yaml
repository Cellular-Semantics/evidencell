        supports: SUPPORT
        reference: "https://doi.org/10.1038/s41586-023-06812-z"
        explanation: |
          Cluster 0513 (DG-PIR Ex IMN_2 sub-cluster) carries the highest Eomes
          expression (8.93) among the candidate cohort, with co-expression of Sox2
