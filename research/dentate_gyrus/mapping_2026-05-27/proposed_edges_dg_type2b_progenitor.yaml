        alignment: CONSISTENT
        notes: |
          DG-restricted soma distribution split between granule cell layer (where SGZ
          immediately abuts on its hilar side) and polymorph layer. MERFISH boundary
          imprecision (and the SGZ being a narrow band between layers) accounts for the
          flanking-layer dominance. Corpus callosum component is small.
      - property: marker_Eomes
