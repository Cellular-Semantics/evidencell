# 2026-05-27 mapping re-run for dg_neuroblast (Dentate Gyrus Neuroblast / Type-3 Progenitor)
# Stage B output: proposed MappingEdges against top 5 rank-0 clusters and top 5 rank-1 supertypes
# from discovery_2026-05-27.
# Predicates follow the 2026-05-26 rubric (PartialOverlapMatch DEPRECATED).
#
# IMPORTANT CONTEXT — Atlas coverage gap for DG neurogenesis lineage:
#   The classical dg_neuroblast node is the DCX+/Tis21+/Ki67+ adult-neurogenic
#   neuroblast (type-3) population of the dentate gyrus subgranular zone.
#   Per the classical node notes and the dg_type2b_progenitor mapping_notes
#   in kb/graphs/dentate_gyrus/20260414_dentate_gyrus_report_ingest.yaml, the
#   transcriptomic correlates in CCN20230722 are clusters 0511-0513 (DG-PIR Ex
#   IMN_*, the immature-neuron lineage). NONE of those clusters appear in the
#   2026-05-27 discovery output for dg_neuroblast at rank 0 or rank 1.
#
#   Instead, the cohort filter (region=MBA:10702 DG + nt_type=glutamatergic)
#   produced candidates that are unrelated cell types: pyramidal-projection
#   glutamatergic clusters (ENT, CA1-ProS, CA3) and cerebellar/brainstem
#   supertypes (CB Granule, DCO UBC, SMC NN, DC NN). All candidates returned
#   score=0 with region_fraction=0.0 — i.e., NO candidate has SOMA in DG
#   (MBA:10702) and NONE express the DG-neuroblast defining markers
#   (DCX/Ki67/Tis21/Eomes/Prox1) at meaningful levels. The expected DG-IMN
#   clusters 0511-0513 are filtered out by the discovery scorer, possibly
#   because their atlas nt_type is annotated as "Glut" while the cohort
#   filter "glutamatergic (committed but not yet functional)" pulled from
#   the classical-node nt_type string did not match, or because their soma
#   are annotated to DG granule cell layer (MBA:10703 molecular / 10705
#   granule cell layer) rather than the polymorph/SGZ MBA:10702 used in
#   the cohort context. Discovery-level investigation required.
#
#   Consequently, every edge below is marked evidencell:UncertainRelationship
#   with semapv:UnspecifiedMatching — none of these candidates is a
#   plausible match for dg_neuroblast. Edges are written to preserve a
#   complete audit trail of the discovery cohort.
