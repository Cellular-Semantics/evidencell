# IMPORTANT CONTEXT — expected atlas correlates absent from discovery output:
#   The classical dg_immature_granule_neuron node (CL:9900002, immature
#   dentate gyrus granule neuron) is defined as the postmitotic, synaptically
#   integrating stage marked by DCX+/NeuN+/Tbr1+ PRIOR TO calbindin (Calb1)
#   acquisition. Per the classical node notes in
#   kb/graphs/dentate_gyrus/20260414_dentate_gyrus_report_ingest.yaml the
#   transcriptomic correlates in CCN20230722 are clusters 0514 and 0515
#   (Tbr1+/Prox1+/Igfbpl1+ DG-PIR Ex IMN). NEITHER of these clusters appears
#   in the 2026-05-27 discovery output at rank 0 or rank 1.
#
#   The cohort filter (region=MBA:632 + nt_type=glutamatergic) instead
#   returned mature/maturing DG granule and CA3 pyramidal types. Every
#   candidate below has Prox1 in the mature-GC range and Calb1 in the
#   moderate-to-high range (mature/maturing DG granule profile) or — for
#   the CA3 candidate — no Prox1 expression at all. None match the
#   defining Calb1-negative property of the classical immature granule
#   neuron. The atlas gene panel does not include DCX/NeuN/Igfbpl1/Tis21,
#   so positive defining markers cannot be cross-checked here.
#
#   Consequently every edge below is either evidencell:UncertainRelationship
#   (mature-GC types whose Calb1+ profile directly contradicts the
#   immature-stage defining negative-marker, but which share the Prox1+ DG
#   granule lineage) or skos:broadMatch where the supertype contains all
#   mature DG sub-clusters of the relevant lineage. The CA3 candidate is
#   off-lineage and is flagged accordingly. The actual atlas correlate
#   (CLUS_0514/0515) should be re-surfaced via a discovery re-run with the
#   appropriate cohort filter (likely DG polymorph/SGZ + immature-neuron
#   markers).
