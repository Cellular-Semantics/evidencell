  # ── Rank-0 (cluster) edges ─────────────────────────────────────────────

  - id: edge_dg_type2a_progenitor_to_CS20230722_CLUS_0593
    lit_type: dg_type2a_progenitor
    taxonomy_type: CS20230722_CLUS_0593
    mapping_predicate: evidencell:UncertainRelationship
    mapping_cardinality: "1:1"
    mapping_justification: semapv:UnspecifiedMatching
    property_comparisons:
      - property: nt_type
        node_a_value: "glutamatergic (lineage committed, not yet functional)"
        node_b_value: "null (subpallial GABAergic immature neuron lineage; Gad2 mean 4.36)"
        alignment: DISCORDANT
        notes: |
          Cluster sits in the Subpallium-GABA;NN-IMN-GC neighbourhood with
          Gad2 (4.36) > Slc17a7 (1.07) — a GABAergic immature-neuron identity,
          incompatible with the glutamatergic-committed DG type-2a node.
      - property: location
        node_a_value: "dentate gyrus subgranular zone (SOMA)"
        node_b_value: "Dentate gyrus polymorph layer 20; Dentate gyrus granule cell layer 12; corpus callosum body 10/7; Caudoputamen 9; lateral ventricle 9; Olfactory areas 7"
        alignment: DISCORDANT
        notes: |
          DG soma component exists (polymorph + granule cell layer) but the
          modal soma distribution spans corpus callosum, caudoputamen, lateral
          ventricle and olfactory areas — characteristic of OB-bound RMS
          subpallial immature neurons, not SGZ DG type-2a.
      - property: marker_Sox2
        node_a_value: "Sox2+ (defining)"
        node_b_value: "Sox2: 8.09 (precomputed mean) — high"
        alignment: CONSISTENT
      - property: marker_Nestin
        node_a_value: "Nestin+ (defining)"
        node_b_value: "not in precomputed panel; defining markers are Top2a/Pif1/Clvs1 (proliferating IMN)"
        alignment: UNKNOWN
        notes: |
          Top2a expression confirms proliferating identity; cell-cycle status
          matches transit-amplifying expectation.
      - property: negative_marker_DCX
        node_a_value: "DCX absent (defining negative)"
        node_b_value: "not in precomputed panel; Igfbpl1 is a MERFISH marker (immature-neuron module)"
        alignment: UNKNOWN
        notes: |
          Cluster name 'Inh IMN' (inhibitory immature neuron) and Igfbpl1
          membership both suggest active immature-neuron programmes — DCX is
          a likely marker, in which case this would violate the type-2a
          DCX-negative annotation.
      - property: negative_marker_GFAP
        node_a_value: "GFAP absent"
        node_b_value: "not in precomputed panel; cluster is not astrocytic"
        alignment: CONSISTENT
    evidence:
      - evidence_type: ATLAS_METADATA
        supports: REFUTE
        reference: "https://doi.org/10.1038/s41586-023-06812-z"
        explanation: |
          0593 OB-STR-CTX Inh IMN_1 is a proliferating (Top2a+) GABAergic
          immature-neuron cluster of subpallial origin destined for olfactory
          bulb / striatum / cortex, not the DG glutamatergic neurogenic
          lineage. The modal MERFISH soma distribution (corpus callosum,
          caudoputamen, lateral ventricle, olfactory areas) traces the RMS,
          and the Gad2/Sox2/Prox1/Eomes profile is GABAergic-immature-neuron-
          like rather than DG type-2a. The minor DG-polymorph (20 cells) and
          DG-granule-layer (12 cells) components likely reflect MERFISH
          ambiguity at the SGZ boundary rather than genuine DG residency.
    caveats:
      - |
        Highest-scoring rank-0 candidate but biologically refuted: GABAergic
        identity, subpallial neighbourhood, and OB/striatal/cortical soma
        distribution all preclude DG type-2a identity.
      - |
        DG component (~32 cells total in two layers) is plausible noise rather
        than evidence of DG residency for this cluster.
    unresolved_questions:
      - |
        Is there any cluster within the Pallium-Glut neighbourhood with an
        Ascl1+/Hes5+/Nestin+ (but Eomes-negative) profile that would
        correspond to the canonical SGZ type-2a stage? Discovery did not
        return one — likely reflects atlas under-sampling of the
        transit-amplifying compartment.
    proposed_experiments:
      - |
        Re-examine the WMB DG-PIR Ex IMN clusters 0511–0513 (the type-2b
        correlates) at the cell level for an Ascl1+/Nestin+/DCX- subpopulation
        that may correspond to type-2a but is currently absorbed into 0511.
      - |
        Cross-reference Hochgerner et al. 2018 (GSE95315) DG developmental
        trajectory clusters against WMB clusters to localise a candidate
        type-2a transcriptomic correlate if one exists in the source dataset.
    discovery_score:
      score: 2
      rank_in_cohort: 1
      cohort_size: 5
      next_best_score: 2
      rank: 0
