          a small dentate molecular-layer fraction with no SGZ presence.
      - property: marker_Sox2
        node_a_value: "Sox2+ (defining marker, classical)"
        node_b_value: "Sox2: 6.21 (precomputed mean)"
        alignment: CONSISTENT
