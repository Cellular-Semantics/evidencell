# 2026-05-27 mapping re-run for dg_type2a_progenitor
# Stage B output: proposed MappingEdges against top 5 rank-0 clusters
# and top 5 rank-1 supertypes from discovery_2026-05-27.
# Predicates follow the 2026-05-26 rubric.
#
# Context: per the classical node's own notes, type-2a is NOT resolved as a
# distinct cluster in the Allen Brain Cell Atlas DG taxonomy. The earliest
# DG-PIR Ex IMN clusters (e.g. 0511) already express Eomes/Tbr2, a type-2b
# marker. Discovery returned candidates filtered on Sox2 expression within
# the DG region, but the survival cohort is dominated by non-neurogenic
# Sox2+ populations (astrocytes, oligo precursors/NFOL, ependymal) and a
# proliferating immature-neuron cluster of subpallial/OB origin (0593).
# No candidate matches the canonical type-2a (Nestin+/Sox2+/DCX-/GFAP-)
# transit-amplifying progenitor profile of the SGZ. Consequently all edges
# below are UncertainRelationship.
