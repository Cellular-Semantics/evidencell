        node_a_value: "Nestin+ (defining marker, classical)"
        node_b_value: "not in precomputed panel"
        alignment: UNKNOWN
      - property: negative_marker_DCX
        node_a_value: "DCX absent (classical type-2a)"
        node_b_value: "not in precomputed panel"
        alignment: UNKNOWN
      - property: negative_marker_GFAP
        node_a_value: "GFAP absent (classical type-2a; distinguishes from type-1 RGL)"
        node_b_value: "supertype labelled 'Astroependymal'; constituent defining markers include Gfap, Fabp7"
        alignment: DISCORDANT
        notes: |
          Atlas-defining marker set (Gfap, Cnmd, Id1, Fabp7) directly violates the
          type-2a GFAP-negative classical annotation.
    evidence:
      - evidence_type: ATLAS_METADATA
        supports: REFUTE
        reference: "https://doi.org/10.1038/s41586-023-06812-z"
        explanation: |
          1169 Astroependymal NN_1 is a non-neuronal astroependymal supertype with
          GFAP among its defining markers and soma centred on third ventricle and
          medial habenula. Profile is incompatible with the SGZ-localised
          Nestin+/Sox2+/GFAP-/DCX- type-2a transit-amplifying progenitor. Sox2
          positivity drove its appearance in the discovery cohort but is not
          specific evidence of a type-2a relationship.
    caveats:
      - |
        Non-neuronal supertype; GFAP defining marker conflicts with type-2a
        GFAP-negative annotation.
      - |
        Soma distribution is ventricular/septal/habenular, not in DG SGZ.
      - |
        Discovery filter relied on Sox2 + DG-region presence; the small DG
        molecular-layer fraction (38 cells) and pan-Sox2 expression in
        astroependymal cells explain the spurious cohort placement.
    unresolved_questions:
      - |
        Does this supertype contain any Hes5+/Nestin+ radial-glia-like (type-1)
        component that could serve as the parental population for the type-2a
        stage, or is it strictly ependymal/tanycyte?
