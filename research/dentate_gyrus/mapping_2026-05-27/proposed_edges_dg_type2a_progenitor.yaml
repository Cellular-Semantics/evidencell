          Type-2a is a lineage-committed neuronal progenitor; this supertype is
          a non-neuronal astroependymal class with no neurotransmitter assignment.
      - property: location
        node_a_value: "dentate gyrus subgranular zone (SOMA)"
        node_b_value: "third ventricle 683; Medial habenula 417; Lateral septal nucleus ventral 268; third ventricle 53; Dentate gyrus molecular layer 38"
        alignment: DISCORDANT
        notes: |
          Soma distribution centred on third ventricle / medial habenula /
