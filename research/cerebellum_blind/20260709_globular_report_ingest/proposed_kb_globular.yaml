    morphology:
      description: >-
        Rare, small inhibitory interneuron with a small rounded (globular) soma
        located underneath the Purkinje cell layer, with the soma extending into
        the granular layer. Its most distinctive feature is a long axon projecting
        mainly in the transverse direction (parallel to the folial axis), spanning
        neighboring microzones — in contrast to candelabrum cells, whose axons
        ascend locally in a sagittal plane. Small in number and intermingled with
        small Golgi cells; historically grouped with Lugaro cells (as the
        under-PC-layer subgroup) but morphologically distinct from fusiform Lugaro
        cells, Golgi cells and molecular-layer basket/stellate cells.
      sources:
        - ref: "PMID:22235322"
          method: morphological identification (GAD67-GFP mice) / slice electrophysiology
          scope: mouse cerebellar cortex
          quote_key: "14276970_0b2772de"
        - ref: "PMID:35578131"
          method: light microscopy / anatomy
          scope: mouse cerebellar cortex
          quote_key: "248832318_c6f9d2fc"
        - ref: "PMID:34194302"
          method: review / anatomy
          scope: mouse cerebellar cortex
          quote_key: "235419102_58b36aaf"
    electrophysiology:
      description: >-
        Silent at rest. Receives prominent spontaneous IPSCs (highest frequency,
        ~50–60 Hz, and largest amplitude among the small granular-layer
        interneuron classes, versus small Golgi and small fusiform Lugaro cells),
        including robust monosynaptic inhibitory input from Purkinje cell axon
        collaterals, and likely excitatory monosynaptic mossy-fiber input. Fires
        spike discharges in response to both serotonin (5-HT) and noradrenaline.
        Has lower input resistance and is less excitable than candelabrum cells.
        Sits in a Purkinje-cell feedback loop integrating PC collateral inhibition
        with mossy-fiber excitation under monoaminergic modulation.
      sources:
        - ref: "PMID:22235322"
          method: slice electrophysiology / pharmacology
          scope: mouse cerebellar cortex
          quote_key: "14276970_0ded592e"
        - ref: "PMID:22235322"
          method: slice electrophysiology (sIPSC frequency/amplitude comparison)
          scope: mouse cerebellar cortex
          quote_key: "14276970_4dd4ada9"
        - ref: "PMID:35578131"
          method: electrophysiology (input resistance comparison vs CCs)
          scope: mouse cerebellar cortex
          quote_key: "248832318_c6f9d2fc"
