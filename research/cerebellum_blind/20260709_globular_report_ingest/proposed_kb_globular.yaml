    colocated_types:
      - neighboring_type: Purkinje cell
        notes: robustly inhibited by monosynaptic Purkinje cell axon collateral input, forming a PC–globular cell feedback loop (PMID:22235322, quote_key 14276970_4dd4ada9)
      - neighboring_type: Golgi cell
        notes: transverse axons of Lugaro/globular cells innervate Golgi cells (~10 Lugaro/globular cells converge on one Golgi cell) (PMID:34194302, quote_key 235419102_58b36aaf)
      - neighboring_type: candelabrum cell
        notes: distinct from candelabrum cells — globular soma sits in granular layer with transverse axon and lower input resistance, vs CC somata in molecular layer with sagittal ascending axon and higher input resistance (PMID:35578131, quote_key 248832318_c6f9d2fc)
    definition_references:
      - "PMID:22235322"
      - "PMID:35578131"
      - "PMID:34194302"
      - "DOI:10.1101/2021.04.09.439172"
    notes: >-
      Globular / glycinergic (GLC) cells are mapped by three-marker logic
      (Nxph1+, Aldh1a3+, Slc6a5+) to the transcriptomic PLI2 / GLC-like class,
      distinct from candelabrum cells (PLI1; Oxtr-Cre+, Aldh1a+, Slc6a5-) and
      Lugaro cells (PLI3; Htr2a+, Slc6a5+). Historically the "globular cell" is
      treated as the under-PC-layer subgroup of Lugaro/globular cells; markers
      and mapping are provisional and should be verified against primary data.
      No CL term exists for the glycinergic globular / PLI2-like Purkinje-layer
      interneuron — candidate CL contribution. Physiology from Hirono et al. 2012
      (mouse GAD67-GFP slice recordings); no subtypes of the globular cell itself
      are described.
