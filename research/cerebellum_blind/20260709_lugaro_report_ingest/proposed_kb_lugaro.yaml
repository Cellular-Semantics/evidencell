        notes: Lugaro cell locally inhibits Golgi cells; serotonin-driven Lugaro firing is presynaptic to Golgi cells (PMID:10684885, quote_key 9985750_983d981c; PMID:35578131, quote_key 233245440_9b6b19b2)
      - neighboring_type: molecular layer interneuron
        notes: Lugaro cell locally inhibits molecular layer interneurons (basket/stellate) (PMID:35578131, quote_key 233245440_9b6b19b2)
      - neighboring_type: Purkinje cell
        notes: Lugaro/globular cells receive monosynaptic inhibitory input from Purkinje cell axon collaterals (PMID:22235322, quote_key 14276970_4dd4ada9)
