    notes: >-
      Lugaro cells are commonly divided into two related anatomical/molecular
      variants: fusiform Lugaro cells (elongated fusiform soma within the granule
      cell layer, bipolar dendrites; putative markers Htr2a/Edil3) and globular
      cells (small rounded soma directly beneath the Purkinje cell layer; putative
      markers Aldh1a3/Slc6a5, responsive to both serotonin and noradrenaline).
      Reviews treat these as closely related subgroups of one Lugaro/globular
      class. The transcriptomic PLI3 cluster (Kozareva/Osorno) is identified as
      Lugaro cells via Htr2a + Slc6a5. Non-gene immunolabels historically used
      for anatomical study (Rat303, SMI311, chondroitin sulfate proteoglycans)
      are markers of Lugaro/globular cells but are not asserted as defining_markers
      here because they are not gene products (PMID:34194302, quote_key
      235419102_58b36aaf).
