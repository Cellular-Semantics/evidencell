    morphology:
      description: >-
        Small, morphologically distinctive inhibitory Purkinje-layer interneuron
        of the cerebellar cortex. Classic fusiform Lugaro cells have a slender
        spindle-shaped soma within the granule cell layer just beneath the
        Purkinje cell layer with bipolar dendrites extending parallel to the
        Purkinje cell layer; globular cells have a small rounded soma directly
        under the Purkinje cell layer. Axons form a parasagittal plexus with long
        transverse branches running parallel to the parallel fibers, projecting
        into the molecular layer. Neighboring cells are interconnected as a
        somatodendritic meshwork whose compartments align with zebrin II
        (aldolase C) cerebellar compartments. Hard to distinguish from small
        Golgi cells by morphology alone.
      sources:
        - ref: "PMID:22235322"
          method: anatomy / electrophysiology (GAD67-GFP)
          scope: mouse cerebellar cortex
          quote_key: "14276970_0b2772de"
        - ref: "PMID:23894597"
          method: genetic labeling / anatomy
          scope: mouse cerebellar cortex
          quote_key: "1394480_194fe57e"
        - ref: "PMID:32470477"
          method: neurochemical / genetic labeling
          scope: mouse cerebellar cortex
          quote_key: "219105292_3797906f"
    electrophysiology:
      description: >-
        Selectively excited by serotonin (5-HT), driven into sustained steady
        firing in the ~5-15 Hz range; this monoaminergic excitation relays the
        serotonergic signal into the local inhibitory network. Globular Lugaro
        cells additionally respond to noradrenaline, receive robust monosynaptic
        inhibitory input from Purkinje cell axon collaterals and excitatory
        mossy-fiber input, forming a monoaminergically modulated feedback loop.
        As an interneuron-selective interneuron the Lugaro cell inhibits Golgi
        cells and molecular layer interneurons.
      sources:
        - ref: "PMID:10684885"
          method: electrophysiology / pharmacology
          scope: rat cerebellar vermis slices
          quote_key: "9985750_983d981c"
        - ref: "PMID:22235322"
          method: electrophysiology / pharmacology
          scope: mouse cerebellar cortex
          quote_key: "14276970_4dd4ada9"
    anatomical_location:
