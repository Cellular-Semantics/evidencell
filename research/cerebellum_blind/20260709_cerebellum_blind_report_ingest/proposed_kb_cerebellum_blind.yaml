            method: immunohistochemistry
            scope: mouse basket cell pinceaux
            quote_key: "222167171_a9c43f32"
            marker_type: PROTEIN
      - symbol: Kcna1
        ncbi_gene_id: null
        sources:
          - ref: "https://doi.org/10.7554/eLife.55569"
            method: immunohistochemistry
            scope: mouse basket cell pinceaux
            quote_key: "222167171_a9c43f32"
            marker_type: PROTEIN
      - symbol: Grid1
        ncbi_gene_id: null
        sources:
          - ref: "PMID:24872547"
            method: in situ / immunolabel
            scope: mouse molecular layer interneurons
            quote_key: "8585958_c30f821f"
            marker_type: TRANSCRIPT
    negative_markers:
      - symbol: Calb1
        ncbi_gene_id: null
        sources:
          - ref: "PMID:22492029"
            method: immunostaining
            scope: mouse cerebellum
            quote_key: "41293753_2d217397"
            marker_type: PROTEIN
    morphology:
      description: >-
        Early-born molecular-layer interneuron populating the lower/inner third
        of the molecular layer; axons converge to enwrap Purkinje cell somata as
        the perisomatic 'basket' and form specialized pinceau terminals around the
        Purkinje axon initial segment (axon collaterals from 5-7 basket cells
        contribute to each pinceau); each basket cell contacts multiple Purkinje
        cells in the same sagittal plane. Basket-versus-stellate identity lies on
        a morphological continuum.
      sources:
        - ref: "PMID:22492029"
          method: immunostaining / anatomy
          scope: mouse cerebellum
          quote_key: "41293753_12d23e0a"
        - ref: "PMID:30742002"
          method: anatomy / genetic tracing
          scope: mouse cerebellum
          quote_key: "59945454_09563575"
        - ref: "PMID:35701402"
          method: morphological reconstruction / fate mapping
          scope: mouse molecular layer interneurons
          quote_key: "213840122_c2acdac4"
    electrophysiology:
      description: >-
        Provides feed-forward and lateral GABAergic inhibition to Purkinje cell
        somata/axon initial segment, setting Purkinje firing rate; loss of
        basket-cell inhibition changes Purkinje firing rate and decreases
        complex-spike rate; electrically and chemically coupled to other
        molecular-layer interneurons with sagittally biased network structure.
      sources:
        - ref: "PMID:30742002"
          method: optogenetics / recording
          scope: mouse cerebellum
          quote_key: "59945454_e6f6e5c8"
        - ref: "PMID:24857665"
          method: optogenetics / recording
          scope: mouse cerebellum
          quote_key: "17043664_253c8de1"
    anatomical_location:
      - id: UBERON:0002974
        label: molecular layer of cerebellar cortex
        name_in_source: cerebellar cortex, molecular layer (inner/lower third)
        sources:
          - ref: "PMID:35701402"
            method: morphological reconstruction
            scope: mouse molecular layer
            quote_key: "213840122_c2acdac4"
          - ref: "PMID:30742002"
            method: anatomy
            scope: mouse cerebellum
            quote_key: "59945454_09563575"
    colocated_types:
      - neighboring_type: Purkinje cell
        notes: axons form perisomatic baskets and pinceaux on Purkinje cell soma/AIS (PMID:30742002, quote_key 59945454_09563575)
    definition_references:
      - "PMID:35701402"
      - "PMID:22492029"
      - "PMID:30742002"
      - "DOI:10.7554/eLife.55569"
      - "PMID:20711348"
    notes: >-
      The basket/stellate division is a morphological continuum, not absolute
      (Briatore 2010, Brown 2018, Wang 2020). Basket-cell pinceaux are further
      organized into zonal modules of distinct pinceau sizes aligned with
      Purkinje-cell functional zones, marked by HCN1/Kv1.1/PSD95/GAD67
      (Zhou et al. 2020). Maps imperfectly onto transcriptomic MLI1/MLI2 classes.

