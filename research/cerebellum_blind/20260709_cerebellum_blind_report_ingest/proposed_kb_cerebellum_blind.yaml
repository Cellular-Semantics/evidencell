          method: review
          scope: cerebellar cortex
          quote_key: "216044470_e743c407"
    defining_markers:
      - symbol: Calb1
        ncbi_gene_id: null
        sources:
          - ref: "PMID:3199205"
            method: in situ / Northern hybridization
            scope: mature mouse cerebellum
            quote_key: "17950457_01e4d1a0"
            marker_type: TRANSCRIPT
      - symbol: Pvalb
        ncbi_gene_id: null
        sources:
          - ref: "PMID:22492029"
            method: immunostaining
            scope: mouse cerebellar sections
            quote_key: "41293753_2d217397"
            marker_type: PROTEIN
      - symbol: RORa
        ncbi_gene_id: null
        sources:
          - ref: "PMID:30742002"
            method: immunolabel
            scope: mouse cerebellum
            quote_key: "59945454_b21703e0"
            marker_type: PROTEIN
    morphology:
      description: >-
        Soma located in the single-cell-thick Purkinje cell layer (a monolayer);
        one of the most extensively branched, flattened planar dendritic arbors
        in the brain projecting into the molecular layer; single inhibitory axon
        projecting to the deep cerebellar nuclei and vestibular nuclei; axon
        initial segment enwrapped by the basket-cell pinceau.
      sources:
        - ref: "PMID:26136256"
          method: review
          scope: mouse cerebellar cortex
          quote_key: "15503971_069ce0d2"
        - ref: "PMID:38352514"
          method: review
          scope: cerebellar cortex
          quote_key: "267384488_3b6eedbd"
        - ref: "PMID:38585758"
          method: review
          scope: mouse cerebellum
          quote_key: "268857461_d94370f3"
    electrophysiology:
      description: >-
        Sole output neuron of the cerebellar cortex; integrates up to ~200,000
        parallel-fiber inputs plus climbing-fiber input that is pruned to a 1:1
        ratio during development; generates simple spikes and climbing-fiber-driven
        complex spikes; complex-spike activity shows ~10 Hz rhythmicity and
        parasagittally organized synchrony; simple-spike pattern shaped by
        stellate-cell inhibition and firing rate set by basket-cell inhibition.
      sources:
        - ref: "PMID:10087085"
          method: in vivo multi-electrode recording
          scope: awake rat crus 2a
          quote_key: "36404032_d8cc22d5"
        - ref: "PMID:38585758"
          method: review
          scope: mouse cerebellum
          quote_key: "268857461_d94370f3"
        - ref: "PMID:30742002"
          method: in vivo recording
          scope: mouse cerebellum
          quote_key: "59945454_e6f6e5c8"
    anatomical_location:
      - id: UBERON:0002979
        label: Purkinje cell layer of cerebellar cortex
        name_in_source: cerebellar cortex, Purkinje cell layer
        sources:
          - ref: "PMID:26136256"
            method: review
            scope: cerebellar cortex
            quote_key: "15503971_069ce0d2"
          - ref: "PMID:32390933"
            method: review
            scope: cerebellar cortex
            quote_key: "216044470_e743c407"
    definition_references:
      - "PMID:26136256"
      - "PMID:38585758"
      - "PMID:32390933"
      - "PMID:3199205"
      - "PMID:10087085"
    notes: >-
      ZebrinII (aldolase C) parasagittal zonation of Purkinje cells organizes
      associated interneuron zones (Sillitoe 2008, Brown 2018). Pvalb and RORa
      are shared with molecular layer interneurons and are not Purkinje-specific;
      Calb1 is the specific Purkinje marker (negative in basket cells).

  - id: basket_cell_cerebellum
    name: Cerebellar basket cell (molecular layer interneuron)
    definition_basis: CLASSICAL_MULTIMODAL
    species: null
    is_terminal: false
    cl_mapping:
