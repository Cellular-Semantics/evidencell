name: Cerebellar cortical interneurons and Purkinje cells — draft classical types (blind)
description: Draft evidence graph for classical cerebellar cortical cell types (Purkinje cell, basket cell, stellate cell, candelabrum cell) plus the MLI1/MLI2 transcriptomic classes, extracted from an ASTA deep research report. Node properties are synthesis-derived and require primary literature verification. Edges empty pending mapping evidence.
