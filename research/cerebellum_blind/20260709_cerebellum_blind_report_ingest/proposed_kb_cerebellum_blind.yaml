      - symbol: Grid1
        ncbi_gene_id: null
        sources:
          - ref: "PMID:24872547"
            method: in situ / immunolabel
            scope: mouse molecular layer interneurons
            quote_key: "8585958_c30f821f"
            marker_type: TRANSCRIPT
    morphology:
      description: >-
        Later-born molecular-layer interneuron integrating into the upper/outer
        third of the molecular layer; axons innervate the smooth shafts of
        Purkinje cell distal dendrites exclusively; each stellate cell contacts
        multiple Purkinje cells in the same sagittal plane. Shares a
        ventricular-zone progenitor pool with basket cells and lies on the same
        morphological continuum.
      sources:
        - ref: "PMID:30742002"
          method: anatomy
          scope: mouse cerebellum
          quote_key: "59945454_5ca8f6ac"
        - ref: "PMID:38352514"
          method: review
          scope: cerebellar cortex
          quote_key: "267384488_3b6eedbd"
        - ref: "PMID:38585758"
          method: review
          scope: mouse cerebellum
          quote_key: "268857461_d94370f3"
    electrophysiology:
      description: >-
        Provides GABAergic dendritic inhibition shaping Purkinje dendritic
        integration and simple-spike patterning; loss of stellate-cell inhibition
        alters simple-spike pattern and increases complex-spike rate; participates
        in structured interneuron-interneuron chemical and electrical networks.
      sources:
        - ref: "PMID:30742002"
          method: optogenetics / recording
          scope: mouse cerebellum
          quote_key: "59945454_e6f6e5c8"
    anatomical_location:
      - id: UBERON:0002974
        label: molecular layer of cerebellar cortex
        name_in_source: cerebellar cortex, molecular layer (outer/upper third)
        sources:
          - ref: "PMID:30742002"
            method: anatomy
            scope: mouse cerebellum
            quote_key: "59945454_5ca8f6ac"
          - ref: "PMID:38585758"
            method: review
            scope: mouse cerebellum
            quote_key: "268857461_d94370f3"
    colocated_types:
      - neighboring_type: Purkinje cell
        notes: axons terminate on smooth shafts of Purkinje cell distal dendrites (PMID:30742002, quote_key 59945454_5ca8f6ac)
    definition_references:
      - "PMID:30742002"
      - "PMID:38585758"
      - "PMID:35701402"
      - "PMID:38352514"
      - "PMID:20711348"
    notes: >-
      Classically distinguished from basket cells by upper-ML position and
      dendritic (not somatic) targeting, but the division is a morphological
      continuum (Briatore 2010, Wang 2020). Does not map cleanly onto
      transcriptomic MLI1/MLI2 classes. Pvalb and RORa are shared with basket
      cells and Purkinje cells; no stellate-specific marker is reported.

  - id: candelabrum_cell_cerebellum
    name: Cerebellar candelabrum cell (Purkinje-layer interneuron)
    definition_basis: CLASSICAL_MULTIMODAL
    species: null
    is_terminal: false
    cl_mapping:
      cl_term:
        id: "CL:4042030"
        label: candelabrum cell
        name_in_source: candelabrum cell
      mapping_type: EXACT
    nt_type:
      name_in_source: GABAergic
      sources:
        - ref: "PMID:35578131"
          method: snRNAseq / electrophysiology
          scope: mouse cerebellar cortex
          quote_key: "233245440_edf83720"
    morphology:
      description: >-
        Molecularly distinct GABAergic interneuron with a small soma near the
        Purkinje cell layer, dendrites extending pially through the molecular
        layer, and local beaded axons ramifying within the molecular layer;
        present across all cerebellar lobules and reported as the most abundant
        Purkinje-layer interneuron; neither a molecular-layer interneuron nor a
        Golgi cell.
      sources:
        - ref: "PMID:35578131"
          method: light microscopy / snRNAseq / serial EM
          scope: mouse cerebellar cortex
          quote_key: "233245440_70215095"
        - ref: "PMID:35578131"
          method: electrophysiology / EM
          scope: mouse cerebellar cortex
          quote_key: "233245440_edf83720"
    electrophysiology:
      description: >-
        High input resistance renders firing highly sensitive to synaptic inputs;
        excited by mossy fibers and granule cells and strongly inhibited by
        Purkinje cells; in turn inhibits molecular-layer interneurons, forming an
        inhibitory ring (PC inhibits CC, CC inhibits MLI, leading to PC
        disinhibition).
      sources:
        - ref: "PMID:35578131"
          method: electrophysiology / serial EM
          scope: mouse cerebellar cortex
          quote_key: "233245440_9c1b350f"
        - ref: "PMID:35578131"
          method: electrophysiology
          scope: mouse cerebellar cortex
          quote_key: "233245440_edf83720"
    anatomical_location:
      - id: UBERON:0002979
        label: Purkinje cell layer of cerebellar cortex
        name_in_source: cerebellar cortex, Purkinje cell layer
        sources:
          - ref: "PMID:35578131"
            method: light microscopy
            scope: mouse cerebellar cortex
            quote_key: "233245440_70215095"
    colocated_types:
      - neighboring_type: molecular layer interneuron
        notes: candelabrum cell inhibits molecular-layer interneurons (part of inhibitory ring) (PMID:35578131, quote_key 233245440_9c1b350f)
      - neighboring_type: Purkinje cell
        notes: strongly inhibited by Purkinje cells (PMID:35578131, quote_key 233245440_9c1b350f)
    definition_references:
      - "PMID:35578131"
      - "PMID:37745401"
    notes: >-
      Identified as a molecularly distinct type by snRNAseq (Kozareva et al.
      2020; Osorno et al. 2021/2022), distinct from MLIs and Golgi cells.
      No positive molecular markers reported in the ingested quotes (GAP).
      Candelabrum cells preferentially receive Purkinje-collateral input and
      target MLI1 over MLI2 (Lackey et al. 2025).

  - id: mli_transcriptomic_classes_cerebellum
    name: Molecular layer interneuron transcriptomic classes MLI1 / MLI2 (class I / class II)
    definition_basis: PRIOR_TRANSCRIPTOMIC
    species: null
    is_terminal: false
    cl_mapping:
      cl_term:
        id: "CL:4042035"
        label: molecular layer interneuron
        name_in_source: molecular layer interneuron
      mapping_type: BROAD
    nt_type:
      name_in_source: GABAergic
      sources:
        - ref: "https://doi.org/10.1101/2020.03.04.976407"
          method: snRNAseq / electrophysiology
          scope: mouse cerebellum
          quote_key: "214725795_3d3df51c"
    defining_markers:
      - symbol: Sorcs3
        ncbi_gene_id: null
        sources:
          - ref: "PMID:35262281"
            method: snRNAseq
            scope: mouse cerebellum (class I / MLI1)
            quote_key: "247317953_380921bf"
            marker_type: TRANSCRIPT
      - symbol: Nxph1
        ncbi_gene_id: null
        sources:
          - ref: "PMID:35262281"
            method: snRNAseq
            scope: mouse cerebellum (class II / MLI2)
            quote_key: "247317953_380921bf"
            marker_type: TRANSCRIPT
      - symbol: Pvalb
        ncbi_gene_id: null
        sources:
          - ref: "PMID:34446581"
            method: snRNAseq / scATAC
            scope: mouse cerebellum (MLI2)
            quote_key: "237308705_5cd4bd6a"
            marker_type: TRANSCRIPT
    neuropeptides:
      - symbol: Nxph1
        ncbi_gene_id: null
        sources:
          - ref: "PMID:34446581"
            method: snRNAseq
            scope: mouse cerebellum
            quote_key: "237308705_5cd4bd6a"
            marker_type: TRANSCRIPT
    morphology:
      description: >-
        Two molecularly and functionally distinct MLI types that both span a
        continuous morphological gradient through the thickness of the molecular
        layer, so they do not correspond one-to-one to the classical
        basket/stellate shape categories.
      sources:
        - ref: "https://doi.org/10.1101/2020.03.04.976407"
          method: snRNAseq / electrophysiology
          scope: mouse cerebellum
          quote_key: "214725795_3d3df51c"
    electrophysiology:
      description: >-
        MLI1 (class I) primarily inhibit Purkinje cells, are electrically coupled
        to each other, fire synchronously on the millisecond timescale in vivo,
        and synchronously pause Purkinje firing; MLI2 (class II) are not
        electrically coupled, primarily inhibit MLI1 (disinhibiting Purkinje
        cells), and gate cerebellum-dependent learning. The two classes differ
        markedly in spontaneous firing, excitability, and electrical coupling.
      sources:
        - ref: "PMID:38692278"
          method: electrophysiology / serial EM / optogenetics
          scope: mouse cerebellum
          quote_key: "269458929_c5430ce6"
        - ref: "PMID:37745401"
          method: electrophysiology
          scope: mouse cerebellum
          quote_key: "262069620_9af08e3e"
        - ref: "PMID:35262281"
          method: review / snRNAseq
          scope: mouse cerebellum
          quote_key: "247317953_380921bf"
    anatomical_location:
      - id: UBERON:0002974
        label: molecular layer of cerebellar cortex
        name_in_source: cerebellar cortex, molecular layer (both classes span full thickness)
        sources:
          - ref: "https://doi.org/10.1101/2020.03.04.976407"
            method: snRNAseq / electrophysiology
            scope: mouse cerebellum
            quote_key: "214725795_3d3df51c"
    colocated_types:
      - neighboring_type: Purkinje cell
        notes: MLI1 inhibit Purkinje cells; MLI2 inhibit MLI1 leading to Purkinje disinhibition (PMID:38692278, quote_key 269458929_c5430ce6)
    definition_references:
      - "DOI:10.1101/2020.03.04.976407"
      - "PMID:38692278"
      - "PMID:37745401"
      - "PMID:35262281"
      - "PMID:34446581"
    notes: >-
      MLI1 and MLI2 (Kozareva et al. 2020) correspond to class I and class II
      (Lowenstein et al. 2022); proposed as the underlying cell-type structure
      that the basket/stellate morphological categories only partially capture.
      No CL term exists for the class split; CL:4042035 is the closest (BROAD)
      parent — candidate CL contribution for two new subtypes. Purkinje
      collaterals preferentially target MLI2 over MLI1 (Lackey et al. 2025).
      Nxph1 is expressed by both classes but at higher levels / with Pvalb in
      MLI2; marker assignment to the two classes is subtype-dependent and should
      be verified against primary data.

