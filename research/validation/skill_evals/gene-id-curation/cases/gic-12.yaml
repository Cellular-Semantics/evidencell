title: Brain-wide Correspondence Between Neuronal Epigenomics and Long-Distance Projections
evidence:
  source: doi:10.1101/2023.05.01.538832
  quote_key: 258464391_5a791974
  text: "Through this integration, we identified a total of 58 thalamic neuronal cell clusters (Fig. 4a),\
    \ of which 33 clusters were enriched for Epi-Retro-Seq neurons (Fig. 4b). It is worth noting that\
    \ neurons dissected from different anatomical regions within the thalamus were located in distinct\
    \ sets of clusters 17 (Fig. 4c), as expected from prior descriptions based on analysis of scRNA-seq\
    \ data 7 , suggesting that these molecularly defined cell clusters also have a spatial organization.\
    \ In Figure 4b, we assessed the degree of enrichment of each projection in each cluster. Similar to\
    \ what was observed in the hypothalamus, each population of thalamic projection neurons exhibited\
    \ enrichment in distinct subsets of cell clusters, with each cluster showing enrichment for a specific\
    \ set of projections, sometimes only one. Notably, the clusters enriched for TH \0SC, TH \0VTA, TH\
    \ \0P, and TH \0cortex were mostly mutually exclusive. Regarding cortical projections, TH \0PTLp and\
    \ TH \0VISp neurons exhibited enrichment in a largely overlapping set of clusters, but with varying\
    \ degrees of enrichment. TH \0MOp and TH \0SSp neurons also shared most of their enriched clusters,\
    \ which differed from those enriched for TH \0PTLp and TH \0VISp. These results support the notion\
    \ of a separation of thalamic cell types between the visual and motor pathways in the thalamus and\
    \ highlight the heterogeneity of cell types within each pathway. Notably, TH \0RSP neurons showed\
    \ no overlap in enriched clusters with any other cortical projections, and were uniquely enriched\
    \ in clusters 13, 26 and 47. These clusters were annotated by their gene expression patterns as belonging\
    \ to the anteroventral (AV) nucleus (clusters 13 and 26), and anterodorsal (AD) nucleus (cluster 47),\
    \ which is consistent with TH \0RSP projections originating from anterior thalamic nuclei 21 . In\
    \ summary, TH neurons projecting to cortex vs. subcortical targets were enriched in distinct sets\
    \ of clusters."
