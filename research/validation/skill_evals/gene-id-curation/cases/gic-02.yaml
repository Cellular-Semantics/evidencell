title: Dopaminoceptive D1 and D2 neurons in ventral hippocampus arbitrate approach and avoidance in anxiety
evidence:
  source: PMID:37546856
  quote_key: 260336826_acc436ad
  text: In the vCA1 pyramidal cell layer, gradual enrichment of both D1 and D2 cells emerges ventral to
    the rhinal fissure, along with the diffuse 21 transition from vCA1 to vSub. Together, these semiquantitative
    observations indicate a precise topographical organization of D1 and D2 cells across vHipp subfields
    and layers, most notably in the DG and in the caudal-most parts of vCA1/vSub.
