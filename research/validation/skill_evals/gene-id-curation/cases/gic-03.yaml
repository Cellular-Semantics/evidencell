title: Dorsal and ventral mossy cells differ in their axonal projections throughout the dentate gyrus
  of the mouse hippocampus
evidence:
  source: PMID:33600026
  quote_key: 231953329_ceaf8acb
  text: 'dorsal MC axons are an exception to this rule. We used two mouse lines that allow for Cre‐dependent
    viral labeling of MCs and their axons: dopamine receptor D2 (Drd2‐Cre) and calcitonin receptor‐like
    receptor (Crlr‐Cre). A single viral injection into the dorsal DG to label dorsal MCs resulted in labeling
    of MC axons in both the IML and middle molecular layer (MML)'
