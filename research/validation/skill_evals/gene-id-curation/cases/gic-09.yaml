id: gic-09
name: M2
taxon: NCBITaxon:39107
title: Synaptic organisation and behaviour-dependent activity of mGluR8a-innervated GABAergic trilaminar
  cells projecting from the hippocampus to the subiculum
evidence:
  source: PMID:32016558
  quote_key: 211024938_f54179c3
  text: In the hippocampal CA1 area, the GABAergic trilaminar cells have their axon distributed locally
    in three layers and also innervate the subiculum. Trilaminar cells have a high level of somato-dendritic
    muscarinic M2 acetylcholine receptor, lack somatostatin expression and their presynaptic inputs are
    enriched in mGluR8a
