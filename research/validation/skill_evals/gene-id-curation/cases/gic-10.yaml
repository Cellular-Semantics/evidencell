title: Tectal-derived interneurons contribute to phasic and tonic inhibition in the visual thalamus
evidence:
  source: PMID:27929058
  quote_key: 264044014_f908cf73
  text: . during early postnatal development Sox14/Otx2-expressing precursor cells migrate from the dorsal
    midbrain to generate dLGN- INs. The unexpected extra-diencephalic origin of dLGN-INs sets them apart
    from GABAergic neurons of the reticular thalamic nucleus. Using optogenetics we show that at increased
    firing rates tectal-derived dLGN-INs generate a powerful form of tonic inhibition that regulates the
    gain of thalamic relay neurons through recruitment of extrasynaptic high-affinity GABAA receptors
