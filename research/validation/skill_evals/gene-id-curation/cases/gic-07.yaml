id: gic-07
name: ENK
taxon: NCBITaxon:10116
title: Differential firing pattern and response to lighting conditions of rat intergeniculate leaflet
  neurons projecting to suprachiasmatic nucleus or contralateral intergeniculate leaflet.
evidence:
  source: PMID:23103793
  quote_key: 25997395_d6b35c15
  text: The intergeniculate leaflet (IGL) of the lateral geniculate body in the rat is a population of
    GABAergic neurons that can be divided into two, anatomically and neurochemically distinct populations.
    One population comprises neuropeptide-Y (NPY)-positive neurons that form the geniculohypothalamic
    tract innervating the suprachiasmatic nuclei (SCN) and the other population comprises enkephalin-positive
    (ENK) neurons giving rise to the geniculo-geniculate tract innervating the contralateral IGL (cIGL)
