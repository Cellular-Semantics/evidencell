id: gic-05
name: GAD
taxon: NCBITaxon:9685
title: Somatostatin-like immunoreactivity characterizes neurons of the nucleus reticularis thalami in
  the cat and monkey
evidence:
  source: PMID:6133921
  quote_key: 2564943_95c06a97
  text: the inhibition exerted by the nucleus reticularis operates by means of y-aminobutyric acid (GABA)
    because they could demonstrate, in neurons of the nucleus, high immunoreactivity to the synthetic
    enzyme of the GABA mechanism, glutamic acid decarboxylase (GAD). We report here that at least the
    majority of neurons in the nucleus reticular-is of the cat are also characterized by immunoreactivity
    to antisera prepared against somatostatin, a neuropeptide itself reported to have mainly inhibitory
    effects on neural and hormonal function (see Iversen et al., 1978a, b;Reichlin, 1980)
