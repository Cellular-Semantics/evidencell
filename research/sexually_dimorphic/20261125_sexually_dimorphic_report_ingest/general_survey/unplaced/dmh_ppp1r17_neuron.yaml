- finding: >
    Causal behavioural role: chemogenetic activation of the DMH PPP1R17
    neurons decreases food intake and body weight in ob/ob mice and under a
    scheduled-feeding protocol, while chemogenetic inhibition increases both.
    The authors interpret the population as restricting binges of eating /
    limiting overconsumption. The schema has no field for a perturbation-based
    functional role.
  quote_keys:
