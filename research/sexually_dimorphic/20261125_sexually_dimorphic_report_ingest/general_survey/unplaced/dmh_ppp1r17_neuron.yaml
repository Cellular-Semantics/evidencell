# Run: 20261125_sexually_dimorphic_report_ingest_general_survey

- finding: >
    Activity state tracks food intake rather than direct leptin sensing: in
    leptin-deficient ob/ob mice the DMH PPP1R17 neurons constitutively express
    cFos, and this is suppressed by leptin treatment and to a similar extent by
    pair-feeding; reducing the food available during scheduled feeding also
    lowers cFos in these neurons. The authors conclude the leptin effect is
    indirect and secondary to reduced food intake. No property field holds a
    stimulus-dependent activity state.
