      - "PMID:33633549"
    notes: >
      SEXUAL DIMORPHISM (relocated here from the former morphology block, which held
      dimorphism prose rather than morphology). Female-biased: females have larger and
      more numerous CRF neurons in the dorsolateral BNST than males; the difference is
      not evident at postnatal day 5 and emerges by adulthood; ovariectomy reduces CRF
      neuron number in females and orchiectomy increases it in males (quote_key
      59307485_a26aefc1, PMID:30691514; quote_key 279874350_b2b4adba,
      https://doi.org/10.3389/fncir.2025.1593443). Recorded structurally as
      sex_bias: FEMALE_BIASED.

      MORPHOLOGY GAP. No morphological reconstruction data exist for this population in
      the corpus, so no morphology block is asserted. The only morphology-adjacent datum
      is the female-biased soma-size difference above; Nguyen et al. 2016 explicitly list
      correlation of BNST neurochemical markers with morphology as future work.

      TYPE III ASYMMETRY (important caveat). ~95% of rat BNSTALG Type III neurons express
      CRF mRNA — i.e. P(CRF+ | Type III) = 0.95 is measured. The converse,
      P(Type III | CRF+), is NOT measured anywhere in this corpus, and Silberman et al.
      2013 report at least four electrophysiologically separable subtypes among identified
      BNST CRF neurons. Type III is therefore a SUBSET of the CRF population, and this node
      must NOT be described as 'the Type III population'. The subset is modelled as the
      separate node bnstalg_type_iii_crf_neuron.

      PRIOR KB ERROR CORRECTED. The previous electrophysiology description and notes
      attributed CRF identity to 'type II' dlBNST neurons on the basis of Ide et al. 2013.
      Ide's type II cells are cells that RESPOND to exogenous CRF; they are not shown to
      express Crh. The CRF-associated physiological class is Type III.

      NT-DIRECTION CONTRADICTION IN THE LITERATURE. Nguyen et al. 2016 (as reported by
      Companion et al. 2018, quote_key 53099693_f0c5c390) state that ~98% of CRF+ neurons
      in dlBNST are GABAergic. Companion et al. also state the converse in a single sentence
      ('98% of GABAergic neurons ... entail a CRF phenotype', quote_key 53099693_aa80db1b);
      the ASTA report reproduced both directions. Only the Nguyen direction
      (P(GABAergic | CRF+) ≈ 98%) is asserted here. The converse would imply CRF+ cells are
      nearly the entire dlBNST GABAergic population, which is inconsistent with the
      peptide-defined mosaic (Pdyn, Penk, Nts, Npy, Pnoc, Sst, Tac1, Tac2, Avp; Pkcd/Drd1
      in ovBNST) described in quote_key 231848933_2ec86aed.

      Also distinguished from the calbindin+ principal nucleus of BNST (Kiss1+,
      male-biased). CL:4072021 is a BROAD match — a BNST-specific child term is a
      candidate for a new CL contribution.

