            quote_key: "4940077_5b783374"
    electrophysiology:
      description: >
        Not a single membrane-property class. In identified mouse BNST CRF neurons there
        are AT LEAST FOUR electrophysiologically separable subtypes — more heterogeneity
        than earlier schemes describe, and notably more than CeA CRF neurons recorded under
        the same conditions (Silberman et al. 2013). In rat BNSTALG, CRF identity is
        strongly associated with the classic Type III physiological class: ~95% of Type III
        neurons express CRF mRNA, and Type III cells carry a characteristic membrane-current
        and ion-channel alpha-subunit profile (little discernible Ih; Cav3.3+; Kir2.2/2.3
        enriched) (Dabrowska et al. 2013; Hazra et al. 2011). NOTE the directionality: only
        P(CRF+ | Type III) has been measured; P(Type III | CRF+) has not, so Type III is a
        SUBSET of the CRF population and not a synonym for it (see the child node
        bnstalg_type_iii_crf_neuron).
        SEPARATELY, and not a statement about CRF-expressing cells: pharmacological studies
        show that bath-applied CRF depolarizes / increases the excitability of 'type II'
        dlBNST neurons, that NPY opposes this in the same type II cells, and that CRF
        signalling increases inhibitory synaptic input onto type III neurons. These are
        local-circuit RESPONSE results identifying CRF TARGETS; the type II cells concerned
        were not shown to express Crh.
      sources:
        - ref: "PMID:23325234"
          method: "whole-cell patch-clamp in identified CRF neurons (CRF reporter mouse)"
          scope: "adult mouse BNST; at least four separable CRF-neuron subtypes"
          quote_key: "16233294_39d761a0"
        - ref: "PMID:24009552"
          method: "whole-cell patch-clamp + single-cell RT-PCR"
          scope: "adult rat BNSTALG; 95% of Type III neurons CRF mRNA+"
          quote_key: "4940077_5b783374"
        - ref: "PMID:21310239"
          method: "whole-cell patch-clamp + single-cell RT-PCR (ion channel alpha subunits)"
          scope: "adult rat BNSTALG Type I-III classification (Ih, IA, IT, IK(IR))"
          quote_key: "8615463_87500419"
        - ref: "PMID:23554470"
          method: "whole-cell patch-clamp with bath-applied CRF and NPY"
          scope: "adult rat dlBNST; CRF/NPY RESPONSE in type II neurons (targets, not CRF-expressing cells)"
          quote_key: "14550592_657c9f06"
          support: PARTIAL
          notes: >
            CORRECTION OF A PRIOR KB ERROR. The canonical KB previously read this result as
            evidence that BNST CRF neurons are 'type II'. It is not: Ide et al. record the
            response of dlBNST neurons to exogenous CRF, with no demonstration that the
            responding type II cells express Crh.
        - ref: "PMID:31451580"
          method: "whole-cell patch-clamp (review of prior pharmacology)"
          scope: "naive rat dlBNST; CRF depolarizes type II, increases inhibitory input to type III"
          quote_key: "201756623_c60073e7"
          support: PARTIAL
        - ref: "PMID:36698552"
