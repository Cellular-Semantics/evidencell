# Draft KB — sexually_dimorphic (dlBNST CRF neurons)
# Source: ASTA deep research report — inputs/deepsearch/dlBNST_CRF.pdf
#   plus targeted full-text retrieval (Hazra et al. 2011 body text; Daniel et al. 2019)
# Ingestion date: 2026-09-11
# Status: DRAFT — NOT for direct write into kb/. Human gate required.
# Property assertions reference quotes in references/sexually_dimorphic/references.json
# Classical nodes proposed by: asta-report-ingest (dlBNST_CRF run)
#
# Relationship to the canonical KB
# --------------------------------
# `bnst_crf_neuron` ALREADY EXISTS in
#   kb/graphs/sexually_dimorphic/20260425_sexually_dimorphic_report_ingest.yaml
# and is referenced by two mapping edges
#   (edge_bnst_crf_neuron_to_cs20230722_supt_0393, edge_bnst_crf_neuron_to_cs20230722_supt_0358).
# The node below is an ENRICHMENT of that node: the id is unchanged and every
# pre-existing property is preserved, except for two documented corrections
# (see notes on the node and validation_notes.json):
#   1. electrophysiology.description previously attributed CRF identity to
#      'type II' dlBNST neurons (Ide et al. 2013). Ide's type II cells are cells
#      that RESPOND to exogenous CRF; they are not shown to express Crh. Recast as
#      a pharmacological/local-circuit result, with the Type III association
#      (Dabrowska et al. 2013; Hazra et al. 2011) stated separately.
#   2. morphology.description previously held sexual-dimorphism prose (cell size,
#      cell number, gonadal-hormone dependence). That is not morphology and the
#      corpus contains NO morphological reconstruction data for any of these
#      types. The content moves to sex_bias + notes; the morphology block is dropped.
#
# Two new nodes are proposed:
#   bnstalg_type_iii_crf_neuron           — child/subset of bnst_crf_neuron (rat)
#   anterior_bnst_crf_glutamatergic_neuron — sibling; sparse evidence, LOW confidence

