        BROAD match. A BNST-specific child term does not yet exist — the female-biased
        dlBNST CRF population is a potential CL contribution. The CL:4072021 definition
        enumerates PVN, hippocampus, piriform area, central amygdalar nucleus,
        Barrington's nucleus and inferior olivary complex as locations, and does not
        mention BNST, reinforcing BROAD rather than EXACT.
