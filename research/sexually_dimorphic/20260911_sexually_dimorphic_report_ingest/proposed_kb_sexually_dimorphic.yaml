      - symbol: Crh
        ncbi_gene_id: null
        sources:
          - marker_type: TRANSCRIPT
            ref: "PMID:24009552"
            method: "single-cell RT-PCR"
            scope: "adult rat BNSTALG; 95% of Type III neurons"
            quote_key: "4940077_5b783374"
    electrophysiology:
      description: >
        One of three physiologically and genetically distinct BNSTALG subclasses (Type I-III)
        defined primarily by the expression pattern of four membrane currents — Ih, IA, IT and
        IK(IR). Type III neurons show little discernible Ih, and accounted for 21% of the
        sampled BNSTALG population (Type I 11%, Type II 66%). Unbiased hierarchical cluster
        analysis followed by discriminant function analysis of ion-channel alpha-subunit
        transcripts segregated BNSTALG neurons into three groups that positively correlated
        with the existing electrophysiological Type I-III classification; Type I and Type III
        appear genetically homogeneous, whereas Type II subdivides into three genetically
        distinct subgroups. Type III is the putative CRF class: ~95% express CRF mRNA. Type III
        neurons receive increased inhibitory synaptic input under CRF signalling and, unlike
        type II, do not respond directly to CRF or NPY. After chronic social stress, Type III
        alone increases Crf mRNA and decreases Ptpn5 mRNA, marking it as the CRF population
        most sensitive to chronic stress.
      sources:
        - ref: "PMID:21310239"
          method: "whole-cell patch-clamp + single-cell RT-PCR; hierarchical clustering + DFA"
          scope: "adult rat BNSTALG"
          quote_key: "8615463_87500419"
        - ref: "PMID:21310239"
          method: "whole-cell patch-clamp"
          scope: "adult rat; Type III shows little discernible Ih (cf. Hammack et al. 2007)"
          quote_key: "8615463_f9227d8a"
        - ref: "PMID:21310239"
          method: "whole-cell patch-clamp"
          scope: "adult rat; Type I 11%, Type II 66%, Type III 21% of sample"
          quote_key: "8615463_5315ebbf"
        - ref: "PMID:24009552"
          method: "whole-cell patch-clamp + single-cell RT-PCR"
          scope: "adult rat; ~95% of Type III neurons CRF mRNA+"
          quote_key: "4940077_5b783374"
        - ref: "PMID:30878403"
          method: "whole-cell patch-clamp + single-cell RT-PCR after chronic social stress"
          scope: "adult rat BNSTALG; Type III-selective transcriptomic change"
          quote_key: "76666373_c8d78753"
        - ref: "PMID:31451580"
          method: "whole-cell patch-clamp (review of prior pharmacology)"
          scope: "naive rat dlBNST; CRF increases inhibitory synaptic input onto type III neurons"
          quote_key: "201756623_c60073e7"
        - ref: "PMID:23554470"
          method: "whole-cell patch-clamp with bath-applied CRF and NPY"
          scope: "adult rat dlBNST; only type II, not type I or III, responded to CRF and NPY"
          quote_key: "14550592_657c9f06"
    colocated_types:
      - neighboring_type: "BNSTALG Type I neuron"
        spatial_relationship: INTERSPERSED
        notes: >
          Type I (11% of sample) and Type II (66%) are recorded from the same BNSTALG
          territory; Type I and III are genetically homogeneous populations whereas Type II
          subdivides into three genetically distinct subgroups. Evidence: quote_key
          8615463_87500419, 8615463_5315ebbf (PMID:21310239).
      - neighboring_type: "BNSTALG Type II neuron"
        spatial_relationship: INTERSPERSED
        notes: >
          Type II is the majority class (66%), expresses Cav3.1 and Kv1.4 (absent in Type III)
          and 5-HT7 receptors, and is the class that responds directly to CRF and NPY.
          Evidence: quote_key 8615463_a14b307e, 8615463_3be541ed, 8615463_1de4a71c
          (PMID:21310239); quote_key 14550592_657c9f06 (PMID:23554470).
    cl_mapping:
      cl_term:
        id: CL:4072021
        label: "corticotropin-releasing neuron"
        name_in_source: "corticotropin-releasing neuron"
      mapping_type: BROAD
      mapping_notes: >
        No CL term exists for an electrophysiologically defined BNSTALG Type III class, nor
        for any BNSTALG-specific cell class. BROAD parent mapping to CL:4072021 only.
        Candidate for a new CL term capturing the BNSTALG Type III CRF class, distinguished
        from PVN parvocellular CRF neurons by an OTR+/Oxt- profile and from sibling BNSTALG
        types by the Cav3.3+/Cav3.1-/Kv1.4-/5-HT7- channel and receptor signature.
    is_terminal: false
    definition_references:
      - "PMID:21310239"
      - "PMID:24009552"
      - "PMID:30878403"
      - "PMID:23325234"
      - "PMID:31451580"
    notes: >
      SUBSET RELATIONSHIP, NOT SYNONYMY. This node is a SUBSET of bnst_crf_neuron. The
      measured quantity is P(CRF+ | Type III) = 0.95 (Dabrowska et al. 2013). The converse,
      P(Type III | CRF+), is not measured in this corpus, and Silberman et al. 2013 report at
      least four electrophysiologically separable subtypes among identified mouse BNST CRF
      neurons (quote_key 16233294_39d761a0, PMID:23325234). Type III must therefore not be
      treated as the whole CRF population, nor bnst_crf_neuron as 'the Type III population'.

      SPECIES. All Type I-III evidence is rat (Hazra 2011, Dabrowska 2013, Daniel 2019),
      whereas bnst_crf_neuron is a mouse node. The Type I-III scheme has not been shown to
      transfer cleanly to mouse; Silberman et al. note that mouse BNST CRF neurons fall into
      more categories than previously described, possibly because of rat/mouse physiological
      differences, recording site, or recording conditions.

      CHANNEL SUBUNIT NAMING. Marker symbols use current gene symbols; the source uses
      protein/channel names (Cav3.3 = Cacna1i, Cav3.1 = Cacna1g, HCN4 = Hcn4, Kv4.2 = Kcnd2,
      Kv1.4 = Kcna4, Kir2.2 = Kcnj12, Kir2.3 = Kcnj4). The mapping is recorded in each
      source's notes field. Kv3.4 (Kcnc4) is expressed in only 9% of Type III neurons and is
      not asserted as a marker (quote_key 8615463_3be541ed).

      NO MORPHOLOGY. The classification is physiological and molecular; no morphological data
      are reported.

      Oxt-negativity and Oxtr-positivity are scoped to the contrast with PVN parvocellular CRF
      neurons — they establish that this is a distinct extra-hypothalamic CRF class, but do
      not discriminate among BNST cell types.

