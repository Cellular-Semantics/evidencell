    cl_mapping:
      cl_term:
        id: CL:4072021
        label: "corticotropin-releasing neuron"
        name_in_source: "corticotropin-releasing neuron"
      mapping_type: BROAD
      mapping_notes: >
        Only CL:4072021 (general CRH-secreting neuron) is available as a broad parent.
        CL:0000679 (glutamatergic neuron) was considered as a transmitter-defined second
        parent, but no existing term intersects CRF identity with a glutamatergic phenotype
        in BNST. Mapping confidence is CANDIDATE rather than MODERATE given the sparse
        evidence (3 quotes, no ephys, no morphology) and the uncertain boundary with the
        GABAergic dlBNST population acknowledged in the source report itself.
    is_terminal: false
    definition_references:
      - "PMID:26718312"
      - "PMID:30362199"
      - "PMID:40484173"
    notes: >
      LOW CONFIDENCE NODE. Existence rests on a single primary assertion — Nguyen et al. 2016
      report that CRH-expressing BNST cells comprise GABAergic and glutamatergic
      subpopulations (quote_key 20682700_f320baf2) — plus the complementary observation that
      within dlBNST ~98% of CRF+ neurons are GABAergic (quote_key 53099693_f0c5c390), which
      locates the glutamatergic minority largely outside dlBNST.

      NO negative_markers are asserted. Marking this node Gad1-ABSENT would be an inference
      from the GABAergic/glutamatergic partition rather than a direct measurement; no quote
      reports a Gad1-negative assay in these cells.

      NO vesicular glutamate transporter gene is named for this population in the corpus. The
      transcriptomically defined anteromedial BNST VGluT3 (Slc17a8) cell type of Ly et al.
      2025 (quote_key 279163821_eacca7d6) is NOT linked to CRF and must not be conflated with
      this node — that type in fact transmits GABA.

      NO electrophysiological or morphological data exist for this subset; ephys work on BNST
      CRF neurons is dominated by the GABAergic dlBNST/BNSTALG population.

      The PVN parallel (Crh+ neurons split into five clusters, 1/3/4 primarily glutamatergic
      and 2/5 GABAergic, with highly subtype-specific stress responses; quote_key
      245474064_d05aff0c) is an interpretive frame from a different brain region and is NOT
      used as evidence for any property of this node.

      The quantitative figures circulating in the source report — CRH+ cells as ~8% of adBNST
      neurons, and 98.2% GABAergic — could not be traced to a verbatim quote from Nguyen et
      al. 2016 in references.json; only the secondary restatement in Companion et al. 2018 is
      available. Round 2 target: retrieve Nguyen et al. 2016 full text.

