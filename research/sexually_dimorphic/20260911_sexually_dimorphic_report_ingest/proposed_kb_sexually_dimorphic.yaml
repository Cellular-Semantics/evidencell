        notes: >
          A BNST microcircuit comprising Crf interneurons modulated by serotonin that
          regulate separate long-range BNST projection neurons — i.e. part of the Crf
          population is local-circuit rather than long-range. Evidence: quote_key
          231848933_27d3cac4 (PMID:33633549); quote_key 201756623_e388bbee (PMID:31451580).
