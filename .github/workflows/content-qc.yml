name: Content QC

# Provenance sweep over kb/ + reports/: quote_keys, PMIDs, DOIs and AT run_refs
# must resolve against the validated stores. These are the pre-edit hook's own
# checks run corpus-wide, which is what catches content written by paths that
# never fire the hook — scripts, bulk migrations, and PRs from other checkouts.
#
# Deliberately a separate workflow from ci.yml so it carries its own README
# badge. It does need the OAK ontologies: report CURIEs are resolved against
# the live ontologies (#142), and MBA alone is over half of them, so skipping
# the setup would leave the majority of the check unrun — visible in the
# coverage report, but unrun. The semsql DBs are restored from cache; the
# file-adapter OBOs are ~20 MB fetched fresh.
#
# The run is baselined: `qc_content_baseline.json` records the findings that
# existed when the sweep was introduced, and the job fails only on findings
# absent from it. That keeps the badge meaningful from day one while the
# backlog is worked down. When the baseline reaches zero entries, drop the
# --baseline flag here and delete the file.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "*refactor*"]

jobs:
  content-qc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Restore OAK semsql cache
        id: cache-oak
        uses: actions/cache@v4
        with:
          path: ~/.data/oaklib
          key: oak-semsql-${{ hashFiles('conf/oak_config.yaml') }}-v2
          restore-keys: |
            oak-semsql-

      - name: Pre-cache CL and UBERON semsql DBs (on cache miss)
        if: steps.cache-oak.outputs.cache-hit != 'true'
        run: |
          uv run runoak -i sqlite:obo:cl info CL:0000000 >/dev/null
          uv run runoak -i sqlite:obo:uberon info UBERON:0000955 >/dev/null

      - name: Fetch file-adapter OBOs (NCBITaxon slim, MBA, DHBA, HOMBA)
        run: just fetch-oak-dbs

      - name: Content provenance sweep
        run: just qc-content --baseline

      - name: Upload findings report
        if: always()
        run: uv run python -m evidencell.qc_content --json qc-content-findings.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qc-content-findings
          path: qc-content-findings.json
          if-no-files-found: ignore
