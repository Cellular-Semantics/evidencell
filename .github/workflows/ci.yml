name: CI

on:
  push:
    branches: ["main", "report_gen"]
  pull_request:
    # `*refactor*` glob covers umbrella branches like
    # `map_cell_type_refactor_phase2_3` so PRs targeting a long-lived
    # refactor branch get the same CI as PRs targeting main. GitHub
    # reads this filter from the BASE branch's copy of the workflow
    # — keep this entry on every umbrella branch that needs CI.
    branches: ["main", "*refactor*"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Run fast tests (no OAK DB / network)
        run: uv run pytest -m "not integration" --no-cov -q
