  Cluster labels derived by hierarchical marker gene rule-based assignment
  (gene expression > 0 thresholds); original GEO deposit did not include
  cluster labels. Neuronal cells only (MC-08/04/10/13-15/17-20 absent or
  not assigned; non-neuronal excluded during QC).
