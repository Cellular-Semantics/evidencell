    morphology:
      description: >
        Medium-to-large multipolar neuron with a plump soma (35-45 µm) and
        relatively short dendrites; in the caudal LC and subcoeruleus these are
        interspersed with smaller fusiform noradrenergic neurons (~15 µm) having
        triangular somata and two tufts of long dendrites. Somata form a highly
        compact nuclear core (~1500 neurons per side in mouse; ~25% of
        noradrenergic neurons have a neighbour within 25 µm), while dendrites
        extend into the pericoerulear surround. Axons arborise across nearly the
        whole neuraxis — cortex, hippocampus, amygdala, thalamus, hypothalamus,
        cerebellum, brainstem and spinal cord.
      sources:
        - ref: "PMID:33725122"
          method: "review (LC cytoarchitecture, soma size measurements)"
          scope: "human locus coeruleus, rostro-caudal gradient"
          quote_key: "232263466_959af3b0"
        - ref: "PMID:35741613"
          method: "tissue clearing + 3D soma position mapping"
          scope: "adult mouse brainstem LC core"
          quote_key: "248497638_cda0a069"
        - ref: "PMID:25183958"
          method: "review (projection anatomy)"
          scope: "LC noradrenergic projections across the neuraxis"
          quote_key: "16354027_79a2e68e"
    electrophysiology:
      description: >
        Slow spontaneous pacemaker firing (~1-2 Hz in slice; ~1-5 Hz across
        preparations) with broad action potentials and a pronounced subthreshold
        membrane-potential oscillation. Standard slice identification combines
        tonic spontaneous firing with absence of Ih and little or no
        hyperpolarising membrane-potential sag. Neurons switch from tonic to
        phasic burst discharge in response to salient stimuli, and are inhibited
        by somatodendritic α2 autoreceptor activation (inhibition is stronger in
        hippocampus-projecting than in mPFC-projecting cells). Neighbouring
        same-type neurons are electrically coupled via dendritic gap junctions.
        LC neurons additionally show intrinsic CO2/H+ sensitivity and
        compartment-specific glutamatergic drive (GluA1 with VGLUT2 on somata;
        GluA1-GluA4 with VGLUT1 on distal dendrites).
      sources:
        - ref: "PMID:18940593"
          method: "whole-cell patch clamp, acute coronal slice"
          scope: "adult mouse LC — pacemaker 1-2 Hz, no Ih, no sag"
          quote_key: "1659738_1755f0e3"
        - ref: "PMID:31430399"
          method: "review + in vitro slice recording of retrogradely labelled LC neurons"
          scope: "adult C57Bl6/N mouse LC"
          quote_key: "201115485_fb3ee02c"
        - ref: "PMID:37719465"
          method: "review + slice electrophysiology"
          scope: "mouse/rat LC — gap-junction coupling, subthreshold oscillation"
          quote_key: "261468837_3a2dfc19"
    colocated_types:
      - neighboring_type: "peri_lc_gabaergic_neuron"
        spatial_relationship: INTERSPERSED
        notes: >
          The densely packed noradrenergic core is embedded within a
          heterogeneous surround of non-noradrenergic (TH-negative) cells, among
          them the peri-LC GABAergic population; TH-negative cells are also found
          intermingled with the core itself. Supporting quotes:
          270489273_f3c96847 (Zouridis et al., 2024; PMID:38872397) and
          273433369_45bcf7fc (Slavova et al., 2024; PMID:39427811).
    cl_mapping:
      cl_term:
        id: CL:0008025
        label: "noradrenergic neuron"
        name_in_source: "noradrenergic neuron"
      mapping_type: BROAD
      mapping_notes: >
        CL:0008025 (a neuron that releases noradrenaline as a neurotransmitter)
        is the closest available term, but it is a parent class: CL has no
        locus-coeruleus-specific noradrenergic neuron term. CL:3000002
        (sympathetic noradrenergic neuron) does not apply. Mapping confidence
        MEDIUM. A CL new-term request for an LC (A6) noradrenergic neuron child
        of CL:0008025 would be a reasonable contribution.
    definition_references:
      - "PMID:33725122"
      - "PMID:29791834"
      - "PMID:31430399"
      - "PMID:37719465"
      - "PMID:37487094"
    is_terminal: false
    notes: >
      NPY CONTRADICTION (carry forward to mapping): Caramia et al., 2023
      (PMID:37487094) report by single-cell RNA-seq that mouse LC NE neurons
      express transcripts for galanin and >19 other neuropeptides but NOT Npy,
      and Slavova et al., 2024 (PMID:39427811) state that in mice NPY is
      secreted exclusively by GABAergic cells of the peri-LC. An older review,
      Carvalho et al., 2014 (PMID:25183958), nevertheless lists neuropeptide Y
      among the peptides secreted by LC cell bodies (alongside vasopressin,
      somatostatin, enkephalin, neurotensin, CRH and galanin). Npy is recorded
      here as a negative marker on the strength of the two recent,
      species-explicit, method-explicit sources; the older review claim may
      reflect pooled LC/peri-LC tissue or a species difference and should not be
      treated as settled. The same Slavova review is the source for CRF
      co-secretion, so the Crh neuropeptide entry rests partly on a source whose
      NPY claim is contradicted elsewhere.

      SPECIES: species is deliberately left null. Soma-size and cell-number
      figures come from human (Holland et al., 2021) and mouse (Baral et al.,
      2022; Carvalho et al., 2014) sources; LC cell counts differ by roughly an
      order of magnitude between them (~1500-3000 per side in rodent vs
      10,000-50,000 in human). Electrophysiology is mouse/rat slice work.

      SUSPECTED HETEROGENEITY (may warrant splitting later): the report treats
      LC-NE as one internally heterogeneous classical type rather than discrete
      subtypes. Documented axes are (i) two major morpho-electric types with gap
      junction coupling preferentially within type (McKinney et al., 2023;
      PMID:36734517); (ii) projection-defined subgroups differing in α2
      autoreceptor inhibition (Wagner-Altendorf et al., 2019; PMID:31430399) and
      in cortical-module-specific signalling (Breton-Provencher et al., 2022;
      PMID:35650441); (iii) graded dorsal-vs-ventral molecular and positional
      gradients tied to projection bias and task coding (Su et al., 2026;
      PMID:41993290, PMID:42749800); (iv) a developmental partition — >99%
      En1-derived, r0-derived dorsal vs r1-derived ventral, mostly Pax7+
      alar-plate origin with a smaller Pax7-negative subpopulation having sparse
      thalamic projections (Plummer et al., 2017, PMID:28775681; Chandler et
      al., 2019, PMID:31619493); (v) four genetically separable mature NE
      subpopulations across the rostral hindbrain, one projecting to cortex from
      outside LC proper (Robertson et al., 2013; PMID:23852112); (vi) Phox2a+/
      TH-negative 'resting noradrenergic' cells in rostral LC (Terrier et al.,
      2024; PMID:38364691) — these are TH-negative yet noradrenergic-lineage and
      sit awkwardly inside a Th-positive node definition.

      BOUNDARY: the node describes LC proper (A6). The LC complex forms a
      continuum with the subcoeruleus and A7 nuclei (Plummer et al., 2017;
      Manger et al., 2021, PMID:34827485), so the boundary of this type against
      SubC/A7 noradrenergic neurons is not sharp.

      ANATOMY TERM: UBERON:0002148 (locus ceruleus) is used as the primary term;
      no MBA/DHBA term was resolved during ingest. The second location entry
      (UBERON:0003023 pontine tegmentum) is the containing structure, recorded
      because several sources localise the nucleus only to that level — it is
      not a second soma territory.

