    evidence:
      - evidence_type: ATLAS_METADATA
        supports: SUPPORT
        atlas: WMBv1 (Yao et al. 2023, CCN20230722)
        cell_set_accession: CS20230722_CLUS_4548
        nt_consistent_with_classical: true
        nt_type:
          name_in_source: Nora
        defining_markers:
          - symbol: Slc6a2
          - symbol: Chrnb3
        merfish_markers:
          - symbol: Dbh
          - symbol: Chrnb3
          - symbol: Calcr
        neuropeptides:
          - symbol: Gal
          - symbol: Calca
          - symbol: Adcyap1
        ccf_distribution: >
          Of the 12 noradrenergic (nt_type Nora) clusters in WMBv1, this is the
          only one with any cells assigned to Locus ceruleus (MBA:147). It holds
          25.0% of all LC-assigned cells in the taxonomy (20/80), 33.9% of
          Barrington's nucleus (41/121) and 16.5% of sublaterodorsal nucleus
          (35/212), against 2.9% of laterodorsal tegmental, 2.2% of pontine
          central gray and 1.8% of parabrachial. The ~10x step between the first
          three structures and the rest localises it to the immediate LC complex
          rather than the wider dorsal pons.
        explanation: >
          Transcriptomic identity and anatomical assignment agree. The cluster is
          typed noradrenergic and carries the noradrenaline transporter Slc6a2
          plus Dbh, matching the classical node's defining markers; its
          neuropeptide profile includes galanin, which the classical node also
          records. It is Hox-negative and En1-positive, unlike the caudal
          Nora clusters (4530/4539 Hoxb8, 4533 Hoxb5) that correspond to the
          medullary A1/A2 groups — consistent with a rostral r0/r1 origin.

      - evidence_type: LITERATURE
        supports: SUPPORT
        reference: PMID:29791834
        study_type: bacTRAP translational profiling, adult mouse LC
        snippet: >-
          .We note that genes required for NE synthesis and release, including
          Gch1, Slc6a2, Slc18a2, Dbh, and Th, are highly enriched in the LC
          translatome, and therefore constitute useful markers for this neuronal
          population.
        explanation: >
          Establishes Slc6a2 and Dbh as LC markers independently of the atlas.
          Both are present on this cluster (Slc6a2 as a defining marker, Dbh as a
          MERFISH marker), so the marker correspondence does not rest on the
          atlas's own annotation.

      - evidence_type: LITERATURE
        supports: SUPPORT
        reference: PMID:31619493
        study_type: developmental lineage tracing, mouse
        snippet: >-
          .Greater than 99% of LC-NE neurons are derived from the embryonic
          hindbrain progenitor domain defined by En1 expression.
        explanation: >
          En1 is a transcription-factor marker of this cluster. A developmental
          marker is independent of the mature neurochemical phenotype, so this
          corroborates LC identity on an axis the atlas metadata and the marker
          evidence do not share.

