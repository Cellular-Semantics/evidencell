    caveats:
      - caveat_type: LOW_CELL_COUNT
        description: >
          The cluster has 22 10x cells, and Locus ceruleus is the 634th of 653
          CCF regions by cell count (80 cells total). LC is under-sampled in
          WMBv1 relative to its true size — its neighbour parabrachial nucleus
          has 75x more cells. The mapping rests on a small sample on both sides.
      - caveat_type: MERFISH_REGISTRATION_UNCERTAINTY
        description: >
          80 LC-assigned cells are spread over 103 clusters, 86 of which hold one
          cell or fewer. That tail is registration scatter around a small nucleus.
          This cluster's 33.9% share of Barrington's nucleus — a CRH+
          glutamatergic population with no resident noradrenergic neurons — is
          most likely misregistration rather than biology.
      - caveat_type: AMBIGUOUS_MAPPING
        description: >
          Sibling cluster CS20230722_CLUS_4547 sits in the same supertype
          (1007 NTS Dbh Glut_4), is also LC-assigned, and shares Phox2a, En1 and
          Dbh, but is typed Glut and lacks Slc6a2. Its relationship to this node
          is unresolved — see unresolved_questions.
      - caveat_type: CROSS_SPECIES_EXTRAPOLATION
        description: >
          Several classical properties (soma size, cell number) derive from human
          LC; the atlas is mouse. The classical node leaves species null for this
          reason.
      - caveat_type: TAXONOMY_LEVEL_MISMATCH
        description: >
          The classical type is internally heterogeneous along six documented
          axes (see the node's notes). WMBv1 resolves LC into at most two
          clusters at 22 and 59 cells, so the atlas is coarser than the
          literature and this edge cannot express that substructure.

    unresolved_questions:
      - >
        Is CS20230722_CLUS_4547 a second LC population or the same type? It is
        Dbh+/Phox2a+/En1+ but typed Glut and lacks Slc6a2, which is the profile
        Terrier et al. 2024 (PMID:38364691) describe for Phox2a+/TH-negative
        "resting noradrenergic" cells in rostral LC. Testing this needs Th and
        Slc6a2 expression values, which the current node_expression table does
        not carry (it holds a 35-gene hippocampal panel with no catecholaminergic
        genes). Run `just fetch-mapmycells CCN20230722` then `just add-expression`
        to make it answerable.
      - >
        Does this cluster contain subcoeruleus/A7 noradrenergic neurons as well
        as LC proper? If so the relationship is closer to PartialOverlapMatch
        than closeMatch.
      - >
        Npy: the classical node records it as a negative marker, but this cluster
        has mean Npy 0.51 (80th percentile across clusters, though only ~4% of
        the corpus maximum) while neighbouring clusters are at 0.00. This may be
        peri-LC admixture rather than LC expression.

    proposed_experiments:
      - >
        Segmentation-area test of the two-morphology hypothesis. The classical
        node records two soma populations — 35-45 um plump multipolar cells, and
        ~15 um fusiform cells concentrated in caudal LC and subcoeruleus. If this
        cluster spans both, its LC-assigned cells should be systematically larger
        than its sublaterodorsal-assigned cells. Testable from ABC Atlas MERFISH
        cell-level metadata (segmented cell area per cell, grouped by CCF
        assignment within cluster 4548) — not from the taxonomy summary in
        kb/taxonomy, which holds no morphometric field. Caveats: a 2D section
        gives a chord rather than a maximum diameter; LC is densely packed, which
        is where segmentation is least reliable; and n=22 is almost certainly
        underpowered. Of the six heterogeneity axes this is the only one spatial
        transcriptomics could adjudicate.
      - >
        Annotation transfer from a dedicated LC dataset. WMBv1 dissection tags
        cannot carry this mapping alone at n=80 region-wide. An AT run against an
        LC-targeted dataset (e.g. Luskin et al. 2025, already in the region's
        reference store) would give a direct F1 anchor and could raise this edge
        above MODERATE.
