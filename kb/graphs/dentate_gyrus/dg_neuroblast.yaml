        notes: Low but non-zero Mki67 mRNA; consistent with a small fraction of cycling progenitors in this cluster
      - property: marker_PSA-NCAM
        node_a_value: PSA-NCAM; PROTEIN; positive (post-translational polysialylation of NCAM1)
        node_b_value: not present in defining_markers
        alignment: NOT_ASSESSED
        notes: PSA-NCAM is a post-translational glycan epitope; intrinsically undetectable by RNA-seq. No transcript-level correlate is available.
      - property: marker_Nestin
        node_a_value: Nestin; PROTEIN; positive at type-2b stage only (IHC)
        node_b_value: not present in defining_markers
