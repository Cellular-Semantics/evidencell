    is_terminal: false
    notes: 'The developmental sequence distinguishes type-2a (Nestin+/Sox2+), type-2b (Nestin+/DCX+), and type-3 (DCX+) stages. A transcription factor cascade (Pax6 > Ngn2 > Tbr2 > NeuroD > Tbr1) marks stage transitions (Hodge et al. 2008). Potential HETEROGENEITY: the three transit-amplifying stages may warrant separate nodes. DUPLICATE RECORD, MERGE DEFERRED: ''dg_neuroblast_imn'' in kb/graphs/immature_neurons/20260422_immature_neurons_report_ingest.yaml carries the identical name and describes the same cell type, curated independently as part of a cross-region immature-neuron survey. That record contributes colocated_types this one lacks. Merging them is a curator decision that has not been made. Do not treat the two as independent types.'
