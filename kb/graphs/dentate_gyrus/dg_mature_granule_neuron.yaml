        cell_set_accession: CS20230722_CLUS_0506
      - evidence_type: LITERATURE
        supports: SUPPORT
        explanation: Establishes stage-6 mature identity as DCX−/NeuN+/Calbindin+. DG Glut clusters collectively represent this terminal state; absence of DCX/Eomes and presence of mature TF core (Glis3, Neurod2) distinguishes them from upstream neuroblast and immature GN clusters.
        reference: PMID:40519263
        snippet: Neuroblasts progress toward immature postmitotic granule neurons co-expressing DCX and NeuN (stage 5), and eventually become terminally differentiated neurons (stage 6) expressing calbindin and NeuN.
        study_type: REVIEW
      - evidence_type: LITERATURE
        supports: SUPPORT
        explanation: Confirms Tbr1 marks terminally differentiated postmitotic granule cells. DG Glut clusters represent the Tbr1+ mature stage even though Tbr1 does not appear as a cluster-distinguishing marker.
        reference: PMID:18385329
        snippet: Tbr1 expression was observed only in postmitotic granule cells and was not detected in progenitor cells, because Tbr1 never colocalized with nestin-GFP.
        study_type: EXPERIMENTAL
      - evidence_type: ANNOTATION_TRANSFER
        run_ref: at_run_20260427_hochgerner2018_dg_mmc_wmbv1
        supports: SUPPORT
        explanation: MapMyCells transfer of Hochgerner 2018 Granule-mature cells (n=1712; GSE95315) to WMBv1. Cluster 0506 DG Glut_2 is the best cluster match (F1=0.665, coverage=0.833, purity=0.553). Subclass 037 DG Glut achieves F1=0.711 (coverage=0.980). High group purity (83% of confident cluster-level cells map to 0506) confirms this as the primary atlas correlate of mature granule neurons in Hochgerner 2018.
