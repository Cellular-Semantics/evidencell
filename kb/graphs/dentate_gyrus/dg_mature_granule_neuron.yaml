      - PMID:11875571
      - PMID:15107864
      - PMID:29335606
      - GEO:GSE95315
    is_terminal: false
    notes: 'Terminal differentiation endpoint of the adult neurogenesis lineage in the dentate gyrus. Tis21 expression decreases in mature granule cells compared to the maturing stage (Attardo et al. 2009). No subtypes discussed in this report. DUPLICATE RECORD, MERGE DEFERRED: ''dg_mature_granule_neuron_imn'' in kb/graphs/immature_neurons/20260422_immature_neurons_report_ingest.yaml carries the identical name and describes the same cell type, curated independently as part of a cross-region immature-neuron survey. That record contributes colocated_types this one lacks. Merging them is a curator decision that has not been made. Do not treat the two as independent types.'
