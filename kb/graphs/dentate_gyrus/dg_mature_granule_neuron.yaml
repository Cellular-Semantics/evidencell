    caveats:
      - &id001
        caveat_type: MARKER_NOT_SPECIFIC
        description: 'Classical markers are defined by protein IHC (DCX, Ki67, PSA-NCAM, Nestin for neuroblast; DCX, NeuN, PSA-NCAM, Tis21 for immature GN; Calbindin, NeuN, Tbr1 for mature GN). Atlas defining_markers are derived from scRNA-seq: (1) protein abundance does not track mRNA linearly for structural proteins; (2) PSA-NCAM is a post-translational glycan epitope undetectable by transcriptomics; (3) broadly expressed stage markers are filtered out in cluster-level marker selection. APPROXIMATE alignments reflect this methodological gap, not biological discordance.'
      - caveat_type: DISTRIBUTED_ACROSS_CLUSTERS
        description: 'TYPE_A_SPLITS: CL:2000089 (mature granule neuron) is split across nine DG Glut clusters (0502-0510) representing topographic variants (dorsal/ventral/posterior GCL) and neuropeptide/functional variants. Cluster CS20230722_CLUS_0506 covers the DG do (dorsal outer GCL) subpopulation. All nine clusters together constitute the full classical type.'
    unresolved_questions:
      - Is Calb1 mRNA expressed but below atlas detection threshold in CS20230722_CLUS_0506, or does calbindin protein arise via post-transcriptional regulation? MERFISH or smFISH with Calb1 probe would resolve this.
      - Do the distinct neuropeptide profiles (Cck) in cluster CS20230722_CLUS_0506 reflect stable functional subtypes of mature granule neurons or transient activity-dependent states?
    proposed_experiments:
      - MERFISH or smFISH co-labelling for Calb1, Glis3, and Glis3 in adult mouse DG to confirm Calb1 expression within cells mapping to CS20230722_CLUS_0506.
      - IHC co-labelling of Calbindin protein with MERFISH-validated markers for the DG do (dorsal outer GCL) region to confirm spatial overlap.
    mapping_cardinality: 1:n
    mapping_justification: semapv:UnreviewedManualMapping
