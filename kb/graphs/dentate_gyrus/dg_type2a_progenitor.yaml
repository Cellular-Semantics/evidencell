        id: CL:0011020
        label: neural progenitor cell
        name_in_source: type-2a progenitor
      mapping_type: EXACT
      mapping_notes: 'CL:9900003 (dentate gyrus type-2a neural progenitor, child of CL:0011020 neural progenitor cell) is an exact match — defined as the Nestin+/Sox2+/ DCX− amplifying progenitor in the SGZ prior to doublecortin expression. No atlas cluster confidently resolves this stage; it precedes the earliest DG-PIR Ex IMN clusters (0511–0513) in the neurogenesis lineage.

        '
    definition_references:
      - PMID:40519263
      - PMID:18385329
      - PMID:37082558
      - PMID:29335606
      - GEO:GSE95315
    is_terminal: false
    notes: 'Type-2a is the first transit-amplifying stage, distinct from the quiescent type-1 radial glia-like stem cell (GFAP+/Sox2+/Nestin+). The type-2a stage is not resolved as a distinct cluster in the Allen Brain Cell Atlas DG taxonomy — the earliest atlas cluster (0511, DG-PIR Ex IMN_1) already expresses Eomes/Tbr2, a type-2b marker. Atlas coverage for type-2a is a known gap: no mapping edge is written for this node. See edge_dg_type2b_progenitor_to_CS20230722_CLUS_0511 for the earliest atlas-resolvable stage in this lineage.

      '
