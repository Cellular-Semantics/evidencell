    mapping_notes: 'CL:9900004 (dentate gyrus type-2b neural progenitor, child of
      CL:0011020 neural progenitor cell) is an exact match — defined as the Nestin+/DCX+/
      Eomes(Tbr2)+ transiently amplifying progenitor in the SGZ. Atlas cluster 0511
      (DG-PIR Ex IMN_1, Eomes+/Sox6+) is the primary transcriptomic correlate; cluster
      0512 (Eomes+/Prox1+) represents the type-2b/type-3 transition.

      '
  definition_references:
