      immature neuron) is an exact match — defined as the postmitotic, synaptically
      integrating stage marked by DCX+/NeuN+/Tbr1+ prior to calbindin acquisition.
      Atlas clusters 0514 and 0515 (Tbr1+/Prox1+/ Igfbpl1+) provide the transcriptomic
      evidence for this term.

