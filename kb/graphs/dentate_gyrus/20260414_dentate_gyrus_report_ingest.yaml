  - PMID:40519263
  - PMID:37082558
  - PMID:29412992
  - GEO:GSE95315
  is_terminal: false
  notes: 'The Tbr2/Eomes TF is the canonical type-2b marker; Hodge et al. 2008 (PMID:18385329)
    established that 64% of Tbr2+ SGZ cells co-label with DCX. Sox6 co-expression
    (atlas cluster 0511) provides the transcriptomic anchor. Progression from type-2b
    to neuroblast (type-3) involves loss of Nestin and upregulation of DCX with concomitant
    loss of Eomes.

    '
