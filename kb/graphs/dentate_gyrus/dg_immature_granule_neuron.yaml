      - property: location_soma
        node_a_value: inner granule cell layer (GCL); UBERON:0005381
        node_b_value: DGdo,me (dentate gyrus dorsal/medial blade); HIP:0.98
        alignment: CONSISTENT
        notes: DGdo,me is a sub-region of the classical GCL specification. MERFISH validates Tbr1, Prox1, Igfbpl1, Emx2 in this spatial context.
      - property: marker_DCX
