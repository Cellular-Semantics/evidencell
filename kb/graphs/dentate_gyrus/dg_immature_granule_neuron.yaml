        ncbi_gene_id:
    neuropeptides: []
    cl_mapping:
      cl_term:
        id: CL:4042028
        label: immature neuron
        name_in_source: immature granule neuron
      mapping_type: EXACT
      mapping_notes: 'CL:9900002 (immature dentate gyrus granule neuron, child of CL:4042028 immature neuron) is an exact match — defined as the postmitotic, synaptically integrating stage marked by DCX+/NeuN+/Tbr1+ prior to calbindin acquisition. Atlas clusters 0514 and 0515 (Tbr1+/Prox1+/ Igfbpl1+) provide the transcriptomic evidence for this term.

        '
    definition_references:
      - PMID:40519263
      - PMID:37082558
      - PMID:16399667
      - PMID:19482889
      - PMID:26056581
      - PMID:16267214
      - PMID:16341203
      - PMID:15107864
      - PMID:11875571
      - PMID:29335606
      - GEO:GSE95315
    is_terminal: false
    notes: 'CL:9900002 was proposed based on this node — the Tbr1+/Prox1+/Igfbpl1+ marker profile from clusters 0514/0515 and the classical DCX+/NeuN+ description from PMID:40519263/37082558 together define the term. Tis21 expression reappears during this maturation phase (Attardo et al. 2009), potentially related to functional integration. DUPLICATE RECORD, MERGE DEFERRED: ''dg_immature_granule_neuron_imn'' in kb/graphs/immature_neurons/20260422_immature_neurons_report_ingest.yaml carries the identical name and describes the same cell type, curated independently as part of a cross-region immature-neuron survey. That record contributes colocated_types this one lacks. Merging them is a curator decision that has not been made. Do not treat the two as independent types.'
