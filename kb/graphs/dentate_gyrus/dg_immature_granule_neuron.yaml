        node_b_value: not in atlas defining_markers; precomputed stats Btg2 mean = 0.0193 (near-zero)
        alignment: APPROXIMATE
        notes: Btg2 (Tis21) mRNA near-zero in precomputed stats; IHC may detect transiently accumulated protein not captured by scRNAseq; APPROXIMATE retained pending further resolution
    evidence:
      - evidence_type: ATLAS_METADATA
        supports: SUPPORT
        explanation: 'EXACT CL:9900002 (immature dentate gyrus granule neuron) in atlas; curator annotation ''late neuroblast/immature granule cell''. TF markers: Tbr1 (canonical postmitotic TF; Hodge et al. 2008), Prox1, Emx2 (MERFISH), Igfbpl1 (MERFISH), Ccbe1 (scoped). Anatomy: DGdo,me HIP:0.98. NT: Glut. No Calbindin (Calb1) — consistent with immature (not mature) stage. Discovery composite score 0.82.'
        atlas: Allen Brain Cell Atlas CCN20230722
        cell_set_accession: CS20230722_CLUS_0514
      - &id001
        evidence_type: LITERATURE
        supports: SUPPORT
        explanation: Establishes stage-5 definition (DCX+/NeuN+/Calbindin−). Absence of Calbindin from cluster defining_markers is consistent with pre-terminal immature identity.
        reference: PMID:40519263
        snippet: Neuroblasts progress toward immature postmitotic granule neurons co-expressing DCX and NeuN (stage 5), and eventually become terminally differentiated neurons (stage 6) expressing calbindin and NeuN.
        study_type: REVIEW
      - &id002
        evidence_type: LITERATURE
        supports: SUPPORT
        explanation: Tbr1 onset marks postmitotic transition from neuroblast to immature granule neuron. Tbr1 present as TF marker; bridges atlas TF evidence to classical postmitotic immature granule neuron stage.
        reference: PMID:18385329
        snippet: Tbr1 expression was observed only in postmitotic granule cells and was not detected in progenitor cells, because Tbr1 never colocalized with nestin-GFP.
        study_type: EXPERIMENTAL
      - &id003
        evidence_type: LITERATURE
        supports: SUPPORT
        explanation: Confirms Tis21 re-expression in postmitotic adult DG neurons. Consistent with postmitotic Tbr1+ identity of this cluster.
        reference: PMID:19482889
        snippet: Concomitant with this, an increasing proportion of the BrdU/Tis21-GFP-double-positive cells expressed markers of postmitotic neurons, that is, NeuN and CB
        study_type: EXPERIMENTAL
      - evidence_type: ANNOTATION_TRANSFER
        run_ref: at_run_20260427_hochgerner2018_dg_mmc_wmbv1
        supports: PARTIAL
        explanation: MapMyCells transfer of Hochgerner 2018 Granule-immature cells (n=1333; GSE95315) to WMBv1. The majority map to 037 DG Glut (F1=0.566 subclass) and best cluster 0507 DG Glut_2 (F1=0.510), consistent with an immature granule neuron identity. A minority (27 cells, 2%) map to cluster 0514 DG-PIR Ex IMN_2 (F1=0.211), suggesting overlap with a transitional neuroblast-like population. Weak PARTIAL support for 0514; the dominant atlas representation is the DG Glut lineage (0506/0507).
        source_dataset_accession: GEO:GSE95315
        source_cluster_label: Granule-immature
        n_cells_total: 1333
        target_atlas: WMBv1
        method: MapMyCells hierarchical algorithm (cell_type_mapper v1.7.1, from_specified_markers)
        bootstrap_threshold: 0.8
        n_cells_after_filter: 1051
        metrics_by_level:
          - taxonomy_level: CLASS
            taxonomy_rank: 3
            best_target_name: 04 DG-IMN Glut
            best_target_accession: CS20230722_CLAS_04
            f1_score: 0.5683297180043384
            n_cells_mapped: 262
            median_bootstrap: 0.9
            coverage: 0.9849624060150376
            purity: 0.39939024390243905
        best_mapping_rank: 2
        f1_source_relpath: at_results.yaml
    caveats:
      - &id004
        caveat_type: MARKER_NOT_SPECIFIC
        description: 'Classical markers are defined by protein IHC (DCX, Ki67, PSA-NCAM, Nestin for neuroblast; DCX, NeuN, PSA-NCAM, Tis21 for immature GN; Calbindin, NeuN, Tbr1 for mature GN). Atlas defining_markers are derived from scRNA-seq: (1) protein abundance does not track mRNA linearly for structural proteins; (2) PSA-NCAM is a post-translational glycan epitope undetectable by transcriptomics; (3) broadly expressed stage markers are filtered out in cluster-level marker selection. APPROXIMATE alignments reflect this methodological gap, not biological discordance.'
      - caveat_type: DISTRIBUTED_ACROSS_CLUSTERS
        description: 'TYPE_A_SPLITS: dg_immature_granule_neuron maps across two clusters: CS20230722_CLUS_0514 (this edge) and CS20230722_CLUS_0515. Both carry EXACT CL:9900002 and share the Tbr1+/Prox1+/Emx2+/Igfbpl1+ core TF profile. Neither cluster alone fully represents the classical type.'
      - caveat_type: OTHER
        description: 12 proposed literature evidence items (proposed_evidence_dg_immature_granule_neuron.yaml) are pending review and attachment to this edge and its companion to CS20230722_CLUS_0515. Items above are the most load-bearing.
    unresolved_questions:
      - 'What is the biological basis for the two-cluster split (0514 vs 0515) at the immature GN stage? Possibilities: maturational sub-stage, sex composition, or circadian/activity-dependent transcriptional state.'
      - Does Dcx mRNA appear in clusters 0514/0515 below the atlas marker ranking threshold? A targeted query on the full atlas feature matrix would resolve the DCX alignment.
      - Why does cluster 0514 show a Gad1 nt_marker signal (score 5.56)? Transient GABAergic signalling in immature granule neurons, doublet artefact, or contamination?
    proposed_experiments:
      - Anti-DCX and anti-Tbr1 co-stain on adult mouse DG to confirm Tbr1+ inner-GCL cells are also DCX+/NeuN+ at protein level, bridging atlas TF and classical profiles.
      - Query full Allen Brain Cell Atlas CCN20230722 feature matrix for Dcx, Rbfox3, Btg2 in clusters 0514/0515 to check expression below the marker ranking threshold.
    mapping_cardinality: 1:n
    mapping_justification: semapv:UnreviewedManualMapping
