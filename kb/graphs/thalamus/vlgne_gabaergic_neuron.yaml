    morphology:
      description: >
        vLGNe is the magnocellular division of vLGN and contains large cells,
        in contrast to the parvocellular vLGNi (Monavarfeshani et al., 2017;
        review of rodent cytoarchitecture, cell class not specified in the
        quote).
      sources:
        - ref: "PMID:28965517"
          method: "review of cytoarchitecture (magnocellular vLGNe with large cells)"
          scope: "nocturnal rodent vLGN"
          quote_key: "4601077_b2845e93"
    colocated_types:
      - neighboring_type: "vlgni_gabaergic_neuron"
        spatial_relationship: "ADJACENT"
        notes: >
          vLGNe and vLGNi are separated by a small neuron-free, fibre-rich
          neuropil (Monavarfeshani et al., 2017; PMID:28965517, quote
          4601077_b2845e93). vLGNi GABAergic types are transcriptomically
          distinct from those of vLGNe (Sabbagh et al., 2020; PMID:32497303,
          quote 219328889_a1d23e11).
      - neighboring_type: "lgv_igl_sox14_gabaergic_neuron"
        spatial_relationship: "INTERSPERSED"
        notes: >
          Sox14+ cells are sparse in the densely retinorecipient vLGNe and
          enriched in vLGNi (Brock et al., 2022; PMID:36280260, quote
          247159795_a2cf4a69).
    definition_references:
      - "PMID:32497303"
      - "PMID:36609305"
      - "PMID:39160068"
      - "PMID:28965517"
      - "PMID:36280260"
    notes: >
      SUSPECTED HETEROGENEITY: vLGNe contains transcriptionally distinct
      GABAergic subtypes in at least four adjacent sublaminae (Sabbagh et al.,
      2020, quotes 219328889_a1d23e11 and 219328889_ea819292; Stebbins et al.,
      2024, quote 271906359_1bfec86c); properties here pool them. The sources
      in this run name no markers for vLGNe GABAergic neurons as a whole, so
      no defining markers are recorded. Sox14 is not one: Sox14+ cells are
      sparse in vLGNe (quote 247159795_a2cf4a69), but sparse is not absent,
      so it is not recorded as a negative marker either.

      LOCATION: the sources name the external vLGN (vLGNe); MBA has no term
      by that name. MBA:300 (LGv lateral zone) is used as the Allen
      counterpart of vLGNe, the lateral-medial axis being the one along which
      vLGN laminae are stratified (quote 255502436_f64915a5); the equivalence
      is a curator judgement, not stated in the sources.

      AXON TARGETS: LHb and LPBN projections are reported for RGC-innervated
      vLGN/IGL GABAergic neurons pooled; they are attributed to vLGNe only
      because retinal axons terminate exclusively there within vLGN, so
      these entries are WEAK.
