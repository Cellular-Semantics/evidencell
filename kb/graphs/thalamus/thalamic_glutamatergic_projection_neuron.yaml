    morphology:
      description: >
        Relay-type projection neuron with "bushy" (elongated soma, longer and
        less frequently branching dendrites) and "radiate" (angular multipolar
        soma, dichotomously branching dendrites) somatodendritic patterns; the
        axon arises from the soma and rarely branches locally. Long-range
        axonal projection styles range from core-like (low within-type
        variability) to matrix-like (moderate variability; e.g. MD Calb1
        neurons with widespread, tangentially distributed axons terminating in
        cortical layers 1-3 plus collaterals to caudate putamen). Transcriptional
        identity covaries with axonal morphology.
      sources:
        - ref: "PMID:27411890"
          method: "juxtacellular labelling, somatodendritic reconstruction"
          scope: "adult mouse midline thalamus"
          quote_key: "18133281_be32f064"
        - ref: "PMID:34616072"
          method: "sparse labelling + whole-brain single-neuron reconstruction"
          scope: "adult mouse thalamic core vs matrix neurons"
          quote_key: "238420839_a675a306"
        - ref: "PMID:42320642"
          method: "single-neuron 3D reconstruction (projectomics)"
          scope: "adult mouse MD Calb1 neurons — matrix type"
          quote_key: "289441883_3e761209"
    electrophysiology:
      description: >
        Not directly characterised in the report. Thalamic principal cells
        have two firing modes (tonic and burst); intrinsic membrane and
        synaptic properties vary along a continuum (e.g. CM to VA to VL)
        rather than forming discrete profiles. Genes defining the main
        mediolateral (primary-secondary-tertiary) transcriptional axis are
        enriched for ion channels and neurotransmitter receptors, implying
        systematic variation in response properties across thalamus.
      sources:
        - ref: "PMID:35102334"
          method: "review (whole-cell recording studies)"
          scope: "mouse motor thalamus CM/VA/VL; thalamic principal cells generally"
          quote_key: "246443644_b53c8967"
        - ref: "https://doi.org/10.1101/241315"
          method: "bulk + single-cell RNA-seq of retrogradely labelled neurons"
          scope: "adult mouse thalamus — PC1 enriched for receptors and ion channels"
          quote_key: "116905066_97cf9838"
        - ref: "PMID:31527803"
          method: "transcriptomics integrated with anatomy and physiology"
          scope: "adult mouse thalamus — transcriptional identity tied to membrane properties"
          quote_key: "202579938_b1d68316"
