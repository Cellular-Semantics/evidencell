    notes: >
      SUSPECTED HETEROGENEITY (may warrant splitting later): this is a family
      node, not a single uniform type. Documented axes: (i) a graded
      mediolateral primary-secondary-tertiary transcriptional axis repeated
      across sensory, motor and cognitive pathways, with intermediate cells
      within and between nuclei (Phillips et al., 2017/2019; doi
      10.1101/241315, PMID:31527803); (ii) within VL, Pvalb-selective,
      Tnnt1-selective and intermediate neurons coexist; (iii)
      projection-target-biased clusters by Epi-Retro-Seq (Zhou et al., 2023);
      (iv) ABC atlas class 18 TH Glut spans many subclasses/supertypes/clusters
      in the thalamic region (Turner et al., 2025); (v) core vs matrix (Pvalb vs
      Calb1) projection styles. PVT, ATN and dLGN relay neurons are authored as
      separate nucleus-specific nodes (pvt_glutamatergic_neuron,
      anterior_thalamic_nucleus_excitatory_neuron, dlgn_relay_neuron) that are
      members of this family.

      MARKERS: only Slc17a6 is a pan-type marker. Pvalb, Tnnt1, Calb1, Calb2
      and Necab1 are subpopulation/gradient markers along the transcriptional
      axis and should not be scored as required for every member. The
      Pvalb=core / Calb1=matrix correspondence is established in primates;
      whether it holds in mouse is stated as unresolved (Zhao et al., 2026;
      PMID:42320642). Slc17a6 sources are human snRNA-seq; mouse confirmation
      of the marker rests on the class-level atlas annotation.

      SPECIES: species left null — morphology and most transcriptomics are
      mouse; Slc17a6 marker and MD location support include human data.

      REFERENCE STORE: corpus IDs 116905066 (Phillips et al., 2018) and
      116906088 (Phillips et al., 2017) both resolve to doi 10.1101/241315 —
      two versions of the same bioRxiv preprint; the published version is
      PMID:31527803.
