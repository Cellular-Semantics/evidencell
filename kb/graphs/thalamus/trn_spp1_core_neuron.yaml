        PMID/DOI refs.
    definition_references:
      - "PMID:32699411"
      - "PMID:39630580"
      - "PMID:41622438"
    is_terminal: false
    notes: >
      PARENT / GRADIENT POLE: subtype of trn_gabaergic_neuron. This node is
      one pole of a continuous Spp1/Ecel1 transcriptomic gradient within
      trn_gabaergic_neuron, not a discrete cluster. Li et al. 2020
      (PMID:32699411, quote 220696191_0d9ab57d) describe TRN heterogeneity as
      "a transcriptomic gradient of two negatively correlated gene-expression
      profiles", with mutually exclusive markers only in neurons at the
      extremes. Hartley et al. 2024 (quote 274495776_ea6ec372) refer to "the
      two transcriptional poles of this gradient". Intermediate cells
      between the poles are not covered by this node. Atlas mapping should
      expect a gradient, not a 1:1 cluster.

      POSSIBLE PV OVERLAP (not asserted): this population may overlap the PV+
      rhythmogenic, first-order-projecting TRN population (Clemente-Perez et
      al., 2017, PMID:28591583). Neither the report nor the quotes state this
      correspondence, so Pvalb is not asserted. Gad1 and Pvalb are reported
      for TRN neurons generally (see trn_gabaergic_neuron), not for this
      pole specifically.

      MORPHOLOGY CAVEAT: the larger-soma / larger-dendrite description comes
      from a review (Flores et al., 2026) of "core (inner)" neurons. The
      review cites Lam et al. 2011, Li et al. 2020 and Martinez-Garcia et al.
      2020, and only Li et al. tie core identity to Spp1.

      SPECIES: species left null; evidence is mouse.
