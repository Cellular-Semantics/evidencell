          quote_key: "220696191_0d9ab57d"
    electrophysiology:
      description: >
        High bursting activity. Projects to first-order thalamic nuclei and
        contributes to sleep spindle generation and to delta rhythm power
        during slow-wave sleep.
      sources:
        - ref: "PMID:39630580"
          method: "summary of Li et al., 2020 (slice electrophysiology + in vivo perturbation)"
          scope: "mouse TRN Spp1+ neurons"
          quote_key: "274495776_ea6ec372"
