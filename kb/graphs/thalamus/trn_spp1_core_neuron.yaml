    morphology:
      description: >
        Core-like anatomical organisation within the TRN. Core (inner) TRN
        neurons are described as having larger somata and more extensive
        dendritic trees than edge neurons, allowing greater integration of
        synaptic inputs.
      sources:
        - ref: "PMID:41622438"
          method: "review"
          scope: "TRN core vs edge neurons"
          quote_key: "285258741_478ed0bb"
