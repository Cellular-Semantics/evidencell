name: "Anterior Thalamic Nuclei (ATN) Excitatory Projection Neuron"
description: >
  Evidence graph component for the excitatory projection neuron of the
  anterior thalamic nuclei (AD, AV, AM) — a nucleus-specific member of the
  thalamic glutamatergic projection neuron family, proposed from the ASTA deep
  research report on thalamic neuron types and extended from the ASTA report
  on ATN glutamatergic neurons. Parent of the nucleus-level child types
  anterodorsal_thalamic_nucleus_excitatory_neuron,
  anteroventral_thalamic_nucleus_excitatory_neuron and
  anteromedial_thalamic_nucleus_excitatory_neuron; carries the properties
  shared by all three.
