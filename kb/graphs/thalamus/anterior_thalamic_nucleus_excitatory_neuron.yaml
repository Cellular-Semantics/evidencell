    notes: >
      HIERARCHY: parent of three nucleus-level child nodes —
      anterodorsal_thalamic_nucleus_excitatory_neuron (AD),
      anteroventral_thalamic_nucleus_excitatory_neuron (AV) and
      anteromedial_thalamic_nucleus_excitatory_neuron (AM) — created from the
      ATN_Glut ASTA report (2026-11-15). Kapustina et al. (2024;
      PMID:38427564) identify three discrete excitatory clusters
      corresponding to AD, AV and AM, each with graded variation along a
      dorsomedial-ventrolateral axis; Hintiryan et al. (2025; PMID:40593635)
      nest 13 projection-defined types within these nuclei. Nucleus-specific
      markers (AD Pvalb/Htr2a; AV C1ql2/Bdnf; AM Rspo2/Tnnt1) are on the
      child nodes. This node carries the shared scaffold; the per-nucleus
      anatomy entries above are retained from the first ingest.

      MARKERS: Slc17a6 (vGluT2) plus developmental lineage markers Sox2 and
      Cadm1 (Govek et al., 2022), which are shared with other cTh.N1-derived
      nuclei (VPM, VA/VL, VM) and so are not ATN-specific. ATN neurons arise
      in the Gbx2+ dorsal thalamic glutamatergic lineage (Gbx2 lineage gives
      rise to the entire thalamic complex; Li et al., 2012, PMID:23056596) —
      not asserted as an adult marker. Glutamatergic ATN TC neurons often
      express low Gad1/Gad2 transcript but very low GAD protein and no GABA
      transporter protein (Clasca et al., 2012 review; PMID:22606998) — a
      caveat for transcript-based NT calls; not recorded as markers.

      NT TYPE: glutamatergic — Kapustina (excitatory clusters), Govek
      (glutamatergic lineage), Hintiryan (all 13 projection types
      glutamatergic) and vGluT2 expression.

      DEVELOPMENT: thalamic neurons are born E10.5-E16.5 in mouse
      (PMID:23056596); AD/AV/AM are among the first glutamatergic nuclei to
      differentiate (PMID:36476860). Fate-mapping in chick suggests ATN
      derives from the Olig3 lineage, whose nuclei generally show driver-like
      properties (review inference, PMID:22606998) — not used as an ephys
      assertion.

      ELECTROPHYSIOLOGY: no intrinsic ephys reported for the ATN as a whole;
      head-direction firing (AD > AV) is recorded on the child nodes.

      CONNECTIVITY: Papez-circuit node — inputs from mammillary bodies via the
      mammillothalamic tract and from the subicular complex (fornical and
      nonfornical routes); reciprocal with retrosplenial, presubicular and
      cingulate cortex; afferents largely segregated by nucleus with little
      collateralization (Wright et al., 2013; PMID:23504917).

      SPECIES: species left null pending primary verification; cited
      evidence is mouse and rat.

      SPECIES: mouse: the defining sources are mouse studies; some cited evidence is rat. Each
      source's species is in its scope. Set from the MeSH organisms of the cited primary papers
      (#216); to be confirmed from primary literature.
