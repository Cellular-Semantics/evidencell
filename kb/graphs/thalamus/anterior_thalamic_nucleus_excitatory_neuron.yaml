    notes: >
      SUSPECTED HETEROGENEITY (likely to warrant splitting into AD, AV and AM
      nodes): Kapustina et al. (2024; PMID:38427564) identify three discrete
      excitatory clusters corresponding to AD, AV and AM, each with graded
      variation along a dorsomedial-ventrolateral axis; AM additionally
      contains discrete subdomains in THALMANAC (Turner et al., 2025). The
      node is kept at ATN level here because the report gives no per-nucleus
      markers.

      MARKERS: no marker genes are named in the report or in the cited quotes
      (Kapustina et al. report marker genes but the quote does not list them).
      defining_markers is therefore left empty; Slc17a6 is expected by
      family membership but is not asserted here without a source.

      NT TYPE: the sources say "excitatory" (Kapustina) and "glutamatergic"
      (Govek et al., 2022, developmental lineage); glutamatergic identity is
      also consistent with membership in the thalamic glutamatergic
      projection neuron family.

      ELECTROPHYSIOLOGY: not described in the report.

      SPECIES: species left null pending primary verification; all cited
      evidence is mouse.

      Member of the thalamic_glutamatergic_projection_neuron family.
