    morphology:
      description: >
        Thalamocortical relay-cell plan shared by all ATN projection neuron
        types: a small number of primary dendrites (3.8 +/- 0.1), no local
        axon, and elaborate tufted distal dendrites bearing spines. Axonal
        projection: AV and AD neurons projecting to retrosplenial cortex (RSP)
        are uniquely enriched in AV/AD transcriptomic clusters that share no
        enriched clusters with other cortical projections; nucleus-specific
        cortical output biases are recorded on the child nodes.
      sources:
        - ref: "PMID:40593635"
          method: "single-neuron reconstruction (morphological and topological analysis)"
          scope: "adult mouse ATN projection neurons"
          quote_key: "279797062_6369b05f"
        - ref: "https://doi.org/10.1101/2023.05.01.538832"
          method: "Epi-Retro-Seq (retrograde labelling + single-nucleus methylome)"
          scope: "adult mouse AV/AD RSP-projecting neurons"
          quote_key: "258464391_5a791974"
