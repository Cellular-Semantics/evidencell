    is_terminal: false
    notes: >
      SUSPECTED HETEROGENEITY (may warrant splitting later): mouse PVT
      resolves into four continuous types along the anterior-posterior axis,
      with aPVT and pPVT populations having nearly non-overlapping projections
      and opposing effects on food consumption (Shima et al., 2022;
      PMID:37862168), and into five molecularly distinct subtypes (PVT1-5)
      organised on combined molecular gradients with differing cortical
      projection overlap (Gao et al., 2023; PMID:36867023). Human PVT neurons
      (ExN_CALB) correspond mostly to mouse posterior PVT (Nishioka et al.,
      2026; PMID:41501055).

      MARKERS: Calb1/Calb2 are used as PVT indicators but are explicitly not
      PVT-exclusive (PMID:41501055) — they are also gradient markers across
      the wider thalamic projection-neuron family. Calb1/Calb2 transcript
      evidence is human; Calb2 protein evidence is mouse midline thalamus
      generally.

      SCOPE OF MIDLINE EVIDENCE: the Lara-Vasquez et al. (2016;
      PMID:27411890) morphology and electrophysiology data come from neurons
      across midline thalamic nuclei, not PVT alone; the CR+ vs CR- split may
      not be PVT-specific. The midline nuclear group location entry is the
      containing structure, recorded for that reason.

      SPECIES: species left null — mouse and human sources pooled (rat
      sources added 2026-11-14).

      Member of the thalamic_glutamatergic_projection_neuron family (tertiary
      end of the trans-thalamic transcriptional gradient).

      ENRICHMENT 2026-11-14 (PVT_Glut report; run
      20261114_thalamus_pvt_report_ingest). This node is treated as an
      umbrella over graded, partly discrete subtypes. Gao et al. 2023
      (PMID:36867023) PVT1-5 cluster markers (multiplex FISH): PVT1 Esr1,
      Col12a1, Npffr1 (posterior); PVT2 Hcrtr1, Drd3, Cxcl14 (anterior); PVT3
      Npffr1, Hs6st3, Rxfp1 (middle AP); PVT4 Drd3, Cbln2, Tesc (anterior);
      PVT5 Thy1 (anterior). These are subtype markers and are NOT recorded as
      defining_markers of the umbrella; Drd3 is included as an anterior-biased
      gradient marker with that caveat, and Gal (dorsolateral subset) as a
      neuropeptide with a subset caveat. Medio-lateral axis: Gal dorsolateral,
      Col12a1/Hs6st3 medial at middle and posterior levels. A third axis is
      the dense calretinin+ core vs the PVT/mediodorsal transition zone, which
      receive different subcortical and cortical layer 5 vs layer 6 input
      (Biro et al. 2025; PMID:40925677). Projection-defined groups (NAcSh-,
      BSTDL-, CeL-, DMH-projecting; dmNAcSh vs vmNAcSh) are intermixed and
      heavily collateralized (Li et al. 2021; PMID:34032911); pPVT-CeA
      glutamatergic projection neurons (Liang et al. 2020, PMID:32958568;
      Pliota et al. 2018, PMID:29904149) are a projection-defined posterior
      subset without a molecular marker. Human-mouse MD-PVT gradient is
      largely conserved with species differences in neuropeptide/
      neuromodulator receptor genes (Schulmann et al. 2024; PMID:39282422).
      Weak/scattered PVALB and CALB1 immunoreactivity, typical of
      matrix-like higher-order thalamus (PMID:22606998).

      MARKER-DEFINED SUBSETS written as separate nodes: apvt_gck_neuron
      (Gck+ anterior PVT; Gaspari et al. 2022) and apvt_crh_neuron (CRF+
      anterior PVT; Engelke et al. 2021, rat). Relationship of either to the
      PVT1-5 clusters is unresolved.

      NOT RECORDED (insufficient direct support in the quote store): the
      report also mentions Slc17a7, Pdyn, Cartpt, Bdnf and Gck for this
      umbrella. Slc17a7 appears only as part of a Slc17a6/Slc17a7 selection
      filter in Gao et al.; CART and dopamine/orexin quotes describe
      afferent fibres into PVT, not PVT neuron expression (PMID:20886038,
      PMID:25477789); the Pdyn quote concerns hypothalamic PVN, not PVT;
      Bdnf in PVT is supported only by a deletion experiment (PMID:25600269).
      Neuropeptide expression in PVT is graded along the antero-posterior
      axis and differs between mouse and rat (Curtis et al. 2021;
      PMID:33584216).
