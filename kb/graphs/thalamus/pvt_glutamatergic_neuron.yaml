    morphology:
      description: >
        Midline thalamic projection neurons with relatively uniform
        somatodendritic morphology and no sharply distinct morphological
        types; both "bushy"-like and "radiate"-like dendritic patterns occur.
        The axon arises from the soma with little or no local branching.
        Anterior and posterior PVT subpopulations have nearly non-overlapping
        axonal projection patterns, with an intermediate population.
      sources:
        - ref: "PMID:27411890"
          method: "juxtacellular labelling, somatodendritic reconstruction"
          scope: "adult mouse midline thalamus"
          quote_key: "18133281_be32f064"
        - ref: "PMID:37862168"
          method: "axon projection mapping"
          scope: "adult mouse aPVT vs pPVT"
          quote_key: "264359607_8626b44b"
    electrophysiology:
      description: >
        Calretinin (Calb2)-positive midline thalamic neurons are
        physiologically distinct from CR-negative neurons and are
        differentially engaged during hippocampal network oscillations; CR
        expression, rather than nuclear location, is a major determinant of
        firing pattern across brain states.
      sources:
        - ref: "PMID:27411890"
          method: "in vivo juxtacellular recording under anaesthesia"
          scope: "adult mouse midline thalamus (not PVT-restricted)"
          quote_key: "18133281_85d006d7"
    cl_mapping:
