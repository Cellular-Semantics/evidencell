          scope: "rodent PVT"
          quote_key: "247109407_f5b6e106"
        - ref: "PMID:36867023"
          method: "snRNA-seq integration with ThalamoSeq projection-labelled atlas"
          scope: "adult mouse PVT subtypes PVT1-4"
          quote_key: "251021326_6820b736"
    electrophysiology:
      description: >
        Calretinin (Calb2)-positive midline thalamic neurons are
        physiologically distinct from CR-negative neurons and are
        differentially engaged during hippocampal network oscillations; CR
        expression, rather than nuclear location, is a major determinant of
        firing pattern across brain states. No intrinsic PVT-specific firing
        classification in the 2026-11-14 report; state-dependent findings
        only: excitability of posterior PVT-to-CeA projection neurons is
        increased after spared nerve injury (rat), and anterior PVT neuron
        firing differentiates reward availability in a cued sucrose-seeking
        task (rat).
      sources:
