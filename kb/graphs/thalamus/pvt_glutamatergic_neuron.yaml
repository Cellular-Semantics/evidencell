    is_terminal: false
    notes: >
      SUSPECTED HETEROGENEITY (may warrant splitting later): mouse PVT
      resolves into four continuous types along the anterior-posterior axis,
      with aPVT and pPVT populations having nearly non-overlapping projections
      and opposing effects on food consumption (Shima et al., 2022;
      PMID:37862168), and into five molecularly distinct subtypes (PVT1-5)
      organised on combined molecular gradients with differing cortical
      projection overlap (Gao et al., 2023; PMID:36867023). Human PVT neurons
      (ExN_CALB) correspond mostly to mouse posterior PVT (Nishioka et al.,
      2026; PMID:41501055).

      MARKERS: Calb1/Calb2 are used as PVT indicators but are explicitly not
      PVT-exclusive (PMID:41501055) — they are also gradient markers across
      the wider thalamic projection-neuron family. Calb1/Calb2 transcript
      evidence is human; Calb2 protein evidence is mouse midline thalamus
      generally.

      SCOPE OF MIDLINE EVIDENCE: the Lara-Vasquez et al. (2016;
      PMID:27411890) morphology and electrophysiology data come from neurons
      across midline thalamic nuclei, not PVT alone; the CR+ vs CR- split may
      not be PVT-specific. The midline nuclear group location entry is the
      containing structure, recorded for that reason.

      SPECIES: species left null — mouse and human sources pooled.

      Member of the thalamic_glutamatergic_projection_neuron family (tertiary
      end of the trans-thalamic transcriptional gradient).
