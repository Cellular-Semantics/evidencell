    morphology:
      description: >
        Midline thalamic projection neurons with relatively uniform
        somatodendritic morphology and no sharply distinct morphological
        types; both "bushy"-like and "radiate"-like dendritic patterns occur.
        The axon arises from the soma with little or no local branching.
        Anterior and posterior PVT subpopulations have nearly non-overlapping
        axonal projection patterns, with an intermediate population.
        PVT neurons give dense, highly collateralized projections to the
        nucleus accumbens shell, dorsolateral BST and lateral central
        amygdala; regardless of presumed target most PVT neurons collateralize
        to a common set of forebrain regions, and neurons projecting to
        different targets are intermixed rather than forming localized
        subpopulations (rat). Cortical projection biases differ by
        transcriptomic subtype: PVT1/PVT3 toward temporal association,
        perirhinal, auditory and entorhinal cortex; PVT2/PVT4 toward
        prelimbic, infralimbic, orbital, gustatory and insular cortex (mouse,
        inferred by integration with a projection-labelled thalamic atlas).
      sources:
        - ref: "PMID:27411890"
          method: "juxtacellular labelling, somatodendritic reconstruction"
          scope: "adult mouse midline thalamus"
          quote_key: "18133281_be32f064"
        - ref: "PMID:37862168"
          method: "axon projection mapping"
          scope: "adult mouse aPVT vs pPVT"
          quote_key: "264359607_8626b44b"
