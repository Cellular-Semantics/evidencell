name: "Gck+ Anterior PVT Glutamatergic Neuron"
description: >
  Evidence graph component for the glucokinase (Gck)-expressing neuron of the
  anterior paraventricular nucleus of the thalamus, a marker-defined subset of
  the PVT glutamatergic projection neuron, proposed from the ASTA deep research
  report on PVT glutamatergic neurons.
