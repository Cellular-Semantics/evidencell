    morphology:
      description: >
        Long-range GABAergic projection neuron whose axons leave the vLGN/IGL
        and inhibit CaMKIIa-expressing neurons in the lateral habenula (Huang
        et al., 2019; Kerschensteiner, 2022). Somatodendritic morphology of
        identified LHb-projecting cells is not described in the sources.
      sources:
        - ref: "PMID:30795900"
          method: "projection-defined circuit study (vLGN/IGL GABA neurons inhibit CaMKIIa LHb neurons)"
          scope: "mouse vLGN/IGL"
          quote_key: "72332556_28081399"
        - ref: "PMID:35385673"
          method: "review citing Huang et al., 2019"
          scope: "mouse vLGN and IGL"
          quote_key: "248001630_8eed194e"
    definition_references:
      - "PMID:30795900"
      - "PMID:35385673"
      - "PMID:32497303"
    notes: >
      SINGLE PRIMARY SOURCE / POOLED REGIONS: all properties rest on Huang et
      al. 2019 (quote 72332556_28081399); the Kerschensteiner 2022 review and
      Sabbagh et al. 2020 restate it. Sources pool vLGN and IGL, so the
      relative contribution of each nucleus, and the vLGN lamina of origin,
      are not stated. SUSPECTED HETEROGENEITY: which transcriptomic vLGN
      GABAergic subtypes make up the LHb-projecting population is unresolved
      (Sabbagh et al., 2020, quote 219328889_9273e4f7). Brock et al. 2022
      report only a sparse LHb projection from Sox14+ LGv/IGL neurons (quote
      247159795_f4eefc59); overlap with this population is unknown.
