    morphology:
      description: >
        Hemispheric dendritic architecture, resembling cat W cells. Dendritic
        fields show no orientation bias with respect to the optic tract or dLGN
        boundaries. Classifiable by dendritic morphology from early postnatal
        ages.
      sources:
        - ref: "PMID:22131405"
          quote_key: "16328698_cc12bb7a"
          method: "quantitative analysis of dendritic architecture of dye-filled relay cells"
          scope: "mouse dLGN, early postnatal to adult"
        - ref: "PMID:22131405"
          quote_key: "16328698_79efc008"
          method: "comparison of mouse relay-cell dendritic architecture with cat X, Y and W cells"
          scope: "mouse dLGN"
        - ref: "PMID:28965517"
          quote_key: "4601077_8f3fc6a4"
          method: "review statement citing Krahe et al. 2011 and Ling et al. 2012"
          scope: "nocturnal rodent dLGN — hemispheric W-like TC cells"
        - ref: "PMID:41814933"
          quote_key: "286491924_2e18d254"
          method: "review statement citing Krahe et al. 2011"
          scope: "mouse dLGN — W-like TRCs are hemispheric in shape"
        - ref: "PMID:26741374"
          quote_key: "1639353_9dec09a7"
          method: "review statement citing Krahe et al. 2011 — subgroups defined by dendritic architecture and ocular specificity"
          scope: "mouse LGN relay neurons — W-(hemispherical) subgroup"
    definition_references:
      - "PMID:22131405"
      - "PMID:28965517"
      - "PMID:41814933"
    notes: >
      Location sources differ in wording: the primary study (Krahe et al. 2011)
      places W-like cells along the perimeter of dLGN, while reviews
      (Monavarfeshani et al. 2017; Stebbins et al. 2026) say they occupy the
      dorsolateral shell; the source report frames this as enrichment, not
      exclusive occupancy, and the shell may also hold relay cells of other
      classes. Krahe et al. found no electrophysiological properties
      distinguishing W-like from X- and Y-like relay cells, and the sources give
      no molecular marker, so the class is defined by dendritic morphology and
      position only.
