        Searched CL for geniculate, relay, thalamic, thalamocortical and
        W-cell terms; no term describes a dLGN morphological relay-cell class.
        CL:4023068 (excitatory neuron with soma in the thalamic complex) contains
        the type and is the most specific such term; parent type shares this
