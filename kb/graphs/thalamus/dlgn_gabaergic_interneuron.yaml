    morphology:
      description: >
        Local (intrinsic) interneuron of dLGN. Highly complex, widespread
        dendritic processes that often cross eye-specific borders; mature
        arbors adopt a bipolar architecture after a developmental phase of
        exuberant branching and pruning. Neurites are bifunctional: they
        receive retinal synapses and also release GABA. Dual output onto
        thalamocortical relay cells via classical axonal F1 terminals and
        presynaptic dendritic F2 terminals; F2 terminals (dendritic spines
        expressing mGluR5) participate in retinogeniculate triads within
        glomeruli. A single EM-reconstructed mouse interneuron made 623
        outputs and innervated 256 thalamocortical cells across functionally
        distinct subregions.
      sources:
        - ref: "https://doi.org/10.1101/2023.05.01.538832"
          method: "statement citing prior anatomy"
          scope: "adult mouse LGd"
          quote_key: "258464391_a576f421"
        - ref: "PMID:24359973"
          method: "GAD67-GFP reporter imaging of dendritic arbors"
          scope: "mouse dLGN, postnatal weeks 1-5"
          quote_key: "15010690_ba27881b"
        - ref: "PMID:30842249"
          method: "developmental morphological reconstruction (GAD67-GFP)"
          scope: "mouse dLGN, postnatal development"
          quote_key: "73481430_7cb9656b"
        - ref: "PMID:32142646"
          method: "serial section electron microscopy reconstruction of one interneuron"
          scope: "mouse visual thalamus"
          quote_key: "198259790_6a9719ba"
        - ref: "PMID:29252999"
          method: "statement in source (F1 axonal vs F2 dendritic outputs)"
          scope: "rodent dLGN"
          quote_key: "26076888_589136d8"
    electrophysiology:
      description: >
        Dendrites support brief Na+ action potentials and long-lasting Ca2+
        spikes, whereas axons support only Na+ spikes; APs initiated (most
        likely at the axon initial segment) backpropagate actively and with
        high fidelity into the fine filiform dendritic appendages, giving
        near-synchronous axonal and dendritic GABA release. Diverse firing
        patterns on somatic depolarisation (tonic firing, periodic bursting,
        initial burst followed by tonic spiking, spike-frequency adaptation);
        some cells show rebound bursts after hyperpolarisation. Prominent Ih,
        modulated by cyclic nucleotides and PIP2 (HCN3-rich). Retain ~8-10
        retinal inputs through the first 5 postnatal weeks (no pruning,
        unlike relay cells). Group I mGluR agonist (DHPG) depolarises and
        group II mGluR agonists hyperpolarise these interneurons; group I
        mGluR-driven dendrodendritic (F2) GABA release is TTX-insensitive and
        L-type Ca2+ channel dependent. At increased firing rates they generate
        tonic GABA_A inhibition of relay neurons via extrasynaptic
        high-affinity GABA_A receptors.
      sources:
        - ref: "PMID:20386723"
          method: "statement in source (dendritic vs axonal spikes)"
          scope: "rodent dLGN"
          quote_key: "11224139_4166977c"
        - ref: "PMID:22171033"
          method: "dendritic imaging + whole-cell recording"
          scope: "rodent dLGN slices"
          quote_key: "15995215_8df8c238"
        - ref: "PMID:21980270"
          method: "somatic current clamp (as summarised for compartmental model)"
          scope: "rodent dLGN"
          quote_key: "53306582_69468622"
        - ref: "PMID:27121468"
          method: "whole-cell patch clamp + cluster analysis"
          scope: "mouse dLGN interneurons"
          quote_key: "1898525_516c7674"
        - ref: "PMID:17192427"
          method: "whole-cell recording + mGluR pharmacology"
          scope: "rodent dLGN slices"
