      SPECIES DIFFERENCE / HETEROGENEITY: Bakken et al. (2021;
      PMID:34473054) report expanded diversity of GABAergic neurons in primate
      vs mouse dLGN; human thalamus more generally shows a large expansion of
      GABAergic neurons, most originating outside the thalamus (Kim et al.,
      2023; PMID:37824646). A mouse-defined node may not transfer cleanly to
      primate. Human medial-thalamic inhibitory neurons express SOX14,
      consistent with midbrain origin (PMID:39282422; PMID:42818922), but no
      quote ties SOX14 to mouse dLGN interneurons specifically.

