    notes: >
      CL MAPPING: no CL term specific to LGN/thalamic GABAergic interneuron;
      mapped BROAD to CL:0011005 GABAergic interneuron (2026-11-14 run;
      previously left empty). Potential CL new-term contribution.

      MARKERS: positive markers now sourced from the 2026-11-14 report —
      Gad1 (via GAD67-GFP reporter lines; PMID:24359973, PMID:30842249),
      Sox14 and Otx2 (PMID:27929058; stated for the dorsal-midbrain precursor
      cells that generate dLGN-INs — adult expression not asserted by the
      quote), Grm5/mGluR5 (on F2 dendritic spines; PMID:23392677,
      PMID:17192427 — pharmacological/EM evidence, not a transcriptomic
      marker), and Hcn3 (PMID:27121468). The report's transcriptomics section
      is labelled LLM-generated/unsourced and was not used to assert markers.
      The earlier "sparse evidence / no markers" caveat is superseded. Sox14
      also marks human medial-thalamic inhibitory neurons (PMID:39282422;
      PMID:42818922), consistent with the midbrain-origin finding.

      DEVELOPMENTAL ORIGIN: dLGN-INs derive from Sox14/Otx2-expressing
      precursors that migrate from the dorsal midbrain (tectum) in early
      postnatal development, setting them apart from TRN GABAergic neurons
      (264044014_f908cf73, PMID:27929058). Recruitment into visual thalamus
      depends on retinal input signalling astrocytes (FGF15; SHH from RGCs;
      247085323_cb2b38fe, 247085323_67c5e927, PMID:36342840).

      ABUNDANCE (CONTRADICTION): unbiased stereology with GABA
      immunolabeling gives 5.6% of adult mouse dLGN neurons
      (4792744_fdf8e890, PMID:29706872), explicitly lower than earlier
      estimates of 10-20% (210870509_6e5369ef, PMID:31964831) or 20-25%
      (53306582_41ba60ad, PMID:21980270).

      SUSPECTED HETEROGENEITY (not split): rodent literature treats dLGN
      interneurons as one, or at most one-two, homogeneous classes
      (11224139_ff5d45fb, PMID:20386723; 210870509_6e5369ef, PMID:31964831).
      Leist et al. 2016 (1898525_516c7674, PMID:27121468) resolved two mouse
      subclasses by unsupervised cluster analysis: small cells (depolarised
      RMP, stronger anomalous rectification, faster/higher-frequency APs,
      rebound bursting, higher Ih density; nNOS-negative) vs large cells
      (lower Ih; nNOS/Nos1-positive). Nos1 is therefore a subset marker and is
      not listed as a positive or negative marker for the whole node.
      In ferret LGNd, a subset of interlaminar-zone interneurons is
      "PGN-like" — parvalbumin-positive, excited by thalamocortical axon
      collaterals, rhythmic rebound low-threshold Ca2+ spikes at 1-4 Hz,
      depolarised by serotonin, 1S,3R-ACPD and CCK8S, biphasic response to
      ACh (7411015_1b734c58, 7411015_dc5df80b, PMID:8815875). This is
      species-specific and Pvalb is not asserted for the node.

      SPECIES DIFFERENCE: Bakken et al. (2021; PMID:34473054) report expanded
      diversity of GABAergic neurons in primate vs mouse dLGN; human thalamus
      more generally shows a large expansion of GABAergic neurons, most
      originating outside the thalamus (Kim et al., 2023; PMID:37824646).
      Interneurons are ubiquitous in carnivoran and primate thalamus but
      largely confined to dLGN in rodents (264044014_1ddc2e36,
      PMID:27929058). In cat, feedforward-inhibitory interneurons lie within
      the main dLGN layers, distinct from recurrent-inhibitory perigeniculate
      neurons (14045536_5c901cc5, PMID:21127903). A mouse-defined node may
      not transfer cleanly to primate.

      SPECIES: species left null; most cited primary data are from mouse.
