    cl_mapping:
      cl_term:
        id: CL:0000617
        label: "GABAergic neuron"
        name_in_source: "GABAergic"
      mapping_type: BROAD
      mapping_notes: >
        Confidence LOW. BROAD to the generic GABAergic neuron only. No CL
        term exists for thalamic reticular nucleus neurons or their
        subtypes (searched: thalamic reticular nucleus, reticular thalamic,
        perigeniculate, prethalamus, GABAergic neuron thalamus, Spp1, Ecel1).
        Potential CL new-term contribution. CL:0000617 definition carries no
        PMID/DOI refs.
    definition_references:
      - "PMID:32699411"
      - "PMID:39630580"
    is_terminal: false
    notes: >
      PARENT / GRADIENT POLE: subtype of trn_gabaergic_neuron. This node is
      one pole of a continuous Spp1/Ecel1 transcriptomic gradient within
      trn_gabaergic_neuron, not a discrete cluster. Li et al. 2020
      (PMID:32699411, quote 220696191_0d9ab57d) describe TRN heterogeneity as
      "a transcriptomic gradient of two negatively correlated gene-expression
      profiles", with mutually exclusive markers only in neurons at the
      extremes. Hartley et al. 2024 (quote 274495776_ea6ec372) refer to "the
      two transcriptional poles of this gradient". Intermediate cells
      between the poles are not covered by this node. Atlas mapping should
      expect a gradient, not a 1:1 cluster.

      POSSIBLE SOM OVERLAP (not asserted): this population may overlap the
      SOM+ limbic, higher-order-projecting TRN population (Clemente-Perez et
      al., 2017, PMID:28591583). Neither the report nor the quotes state this
      correspondence, so Sst is not asserted.

      MORPHOLOGY CAVEAT: the report says shell/edge neurons have smaller
      somata and less extensive dendrites than core neurons. That is only an
      inference from Flores et al. 2026 (quote 285258741_478ed0bb), which
      describes core neurons as larger, so it is not asserted here.

      SPECIES: species left null; evidence is mouse.
