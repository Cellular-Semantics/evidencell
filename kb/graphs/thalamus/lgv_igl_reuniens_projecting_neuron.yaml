          quote_key: "238410529_5d954f1d"
    definition_references:
      - "PMID:33171117"
      - "PMID:34610302"
    notes: >
      TRANSMITTER CONFLICT: nt_type is recorded as GABAergic on weak, inferred
      grounds (Salay et al. 2021 describe a vLGN-to-Re circuit among vLGN GABA
      neurons, quote 238410529_5d954f1d; most vLGN neurons are GABAergic,
      quote 286491924_d474808b), but Huang et al. 2020 describe the
      Re-projecting vLGN/IGL cells as CaMKIIa neurons that "activate" Re
      neurons, implying excitatory output (quote 226284065_834809d9). Stebbins
      et al. 2026 report at least two excitatory vLGN neuron types (quote
      286491924_d7a92ebc), so an excitatory Re-projecting population is
      plausible. Whether the Huang 2020 and Salay 2021 Re-projecting
      populations are the same cells is unresolved. The CaMKIIa label may
      reflect promoter-driven viral targeting rather than measured endogenous
      expression. POOLED REGIONS: Huang 2020 pools vLGN and IGL.
