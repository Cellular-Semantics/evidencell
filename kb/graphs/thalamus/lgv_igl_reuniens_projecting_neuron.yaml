    morphology:
      description: >
        Long-range projection neuron whose axons leave the vLGN/IGL and reach
        the nucleus reuniens, where they activate CaMKIIa-expressing Re neurons
        (Huang et al., 2020; Salay et al., 2021). Somatodendritic morphology of
        identified Re-projecting cells is not described in the sources.
      sources:
        - ref: "PMID:33171117"
          method: "projection-defined circuit study"
          scope: "mouse vLGN/IGL"
          quote_key: "226284065_834809d9"
        - ref: "PMID:34610302"
