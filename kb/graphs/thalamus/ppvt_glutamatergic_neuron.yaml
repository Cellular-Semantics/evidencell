    electrophysiology:
      description: >
        No baseline intrinsic profile in the sources. The excitability of
        retrogradely identified pPVT-to-central-amygdala projection neurons
        is increased in the spared-nerve-injury neuropathic pain model, so
        the only recorded property is a state-dependent change, not a
        baseline e-type.
      sources:
        - ref: "PMID:32958568"
          method: "slice recording of pPVT-CeA projection neurons, SNI vs control"
          scope: "male rat pPVT"
          quote_key: "221841412_405f324a"
    morphology:
      description: >
        Projection neurons. No somatodendritic description in the sources.
        The axon projection pattern of the posterior PVT subpopulation is
        nearly non-overlapping with that of the anterior subpopulation, with
        an intermediate population between them (mouse). pPVT neurons project
        to the central amygdala. Cortical projection bias of the posterior
        and middle clusters PVT1/PVT3 toward temporal association,
        perirhinal, auditory and entorhinal cortex is inferred from
        correlation with a projection-labelled thalamic atlas, not traced
        (mouse).
      sources:
        - ref: "PMID:37862168"
          method: "axon projection mapping"
          scope: "adult mouse anterior vs posterior PVT subpopulations"
          quote_key: "264359607_d839d41e"
        - ref: "PMID:32958568"
          method: "retrograde identification of pPVT-CeA projection neurons; pathway optogenetics"
          scope: "male rat pPVT"
          quote_key: "221841412_405f324a"
        - ref: "PMID:36867023"
          method: "snRNA-seq integration with the ThalamoSeq projection-labelled atlas (correlation)"
          scope: "adult mouse PVT clusters PVT1/PVT3"
          quote_key: "251021326_6820b736"
    definition_references:
      - "PMID:36867023"
      - "PMID:37862168"
      - "PMID:32958568"
      - "PMID:29904149"
    notes: >
      SUSPECTED HETEROGENEITY: only one transcriptomic cluster (Gao et al.
      2023, PMID:36867023: PVT1) is strongly represented posteriorly, while
      Col12a1 and Hs6st3 mark medial cells at both middle and posterior AP
      levels and PVT3 straddles the middle, so posterior PVT is not a clean
      molecular unit. Npffr1, Hs6st3 and Rxfp1 are shared with or specific to
      PVT3 and are therefore not recorded as defining markers here; they
      belong on the deferred PVT1/PVT3 nodes.

      GRADIENT, NOT BOUNDARY: Shima et al. (PMID:37862168) find the PVT
      transcriptome continuous along the anterior-posterior axis with an
      intermediate population, so membership of this node is a matter of
      position along a gradient.

      SPECIES: molecular, location and projection-pattern evidence is mouse
      (Gao 2023; Shima 2022). The pPVT-CeA circuit evidence, including the
      electrophysiology, is male rat only (Liang 2020, PMID:32958568), where
      pPVT is defined by injection site, not molecular identity; Pliota 2018
      (PMID:29904149) likewise defines posterior PVT anatomically.

      GLUTAMATERGIC IDENTITY is asserted directly only for the rat pPVT-CeA
      population (pPVTGlu+); for the mouse posterior clusters it is inferred
      from Gao et al.'s Slc17a6/Slc17a7+, Gad1/Gad2- selection.

      Cortical targets recorded with support: WEAK are correlations between
      cluster gene expression and ThalamoSeq projection patterns, reported
      jointly for PVT1 and PVT3, not anterograde tracing of pPVT cells.
