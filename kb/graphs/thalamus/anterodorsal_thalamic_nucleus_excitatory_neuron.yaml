    is_terminal: false
    notes: >
      HIERARCHY: subtype of anterior_thalamic_nucleus_excitatory_neuron
      (ATN); shared ATN properties (Slc17a6, glutamatergic identity, relay-cell
      morphology, Papez-circuit placement) are recorded on the parent.
      Slc17a6 applies here by inheritance.

      SUBTYPES NOTED (not separate nodes): Hintiryan et al. (2025;
      PMID:40593635) define two projection-defined types — AD1 (dorsolateral
      AD; postsubiculum, LD/LI visual areas, mammillary regions) and AD2
      (ventromedial AD; retrosplenial, visual, postsubicular, mammillary
      regions). No marker separating AD1 from AD2 is reported. Kapustina et
      al. (2024; PMID:38427564) report graded dorsomedial-ventrolateral
      transcriptional variation within AD.

      NEGATIVE MARKER (transgene, not recorded as a gene marker): the
      Grp_KH288-Cre driver labels a subset of AV neurons but none in AD
      (Brennan et al.; PMID:30858601). This is a BAC-transgenic line and
      does not establish absence of endogenous Grp transcript.

      CONNECTIVITY: inputs from the lateral mammillary nucleus — whose
      thalamic projections are exclusively to AD, bilaterally (head-direction
      system; PMID:33309908, PMID:25538571) — and from para/postsubiculum via
      a nonfornical internal-capsule route (PMID:25616174, PMID:32132227).
      Reciprocal connections with postsubiculum and presubiculum
      (PMID:33069688). Mouse AD sends moderate projections to ACC (some
      reports: area 24a, not 24b; PMID:35240879). Anterior thalamus strongly
      recruits low-rheobase layer 3 pyramidal cells in granular RSC
      (PMID:34170817); AD Htr2a+ cells are hypothesised to be the inputs
      boosted by psychedelics (PMID:40957902).

      FUNCTION / DISEASE: many autism and schizophrenia risk genes are
      expressed in AD; AD is necessary for contextual memory encoding, and
      risk-gene knockdown causes AD neuron hyperexcitability (Roy et al.,
      2021; PMID:34197733) — a perturbation phenotype, not a baseline ephys
      property.

      SPECIES: cited evidence mixes mouse (markers, projection types) and
      rat (bifurcation, head-direction recordings); species left null.
