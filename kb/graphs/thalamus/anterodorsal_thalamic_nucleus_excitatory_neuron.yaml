    electrophysiology:
      description: >
        In vivo: the anterodorsal nucleus contains head-direction cells — more
        prominently than the anteroventral nucleus — which signal heading
        independent of location. No intrinsic (slice) electrophysiology
        reported.
      sources:
        - ref: "PMID:25195980"
          method: "review (in vivo single-unit recording literature)"
          scope: "rodent anterior thalamic nuclei"
          quote_key: "9155344_6ed594e2"
    morphology:
      description: >
        Somatodendritic plan as for the parent ATN type (few primary dendrites,
        no local axon, tufted spiny distal dendrites). Axonal projections:
        AD1 neurons (dorsolateral AD) project to postsubiculum, laterodorsal
        and laterointermediate visual areas and subcortical mammillary
        regions; AD2 neurons (ventromedial AD) project to retrosplenial,
        visual, postsubicular and mammillary regions. In rat, AD provides the
        greatest proportion of neurons bifurcating to different retrosplenial
        areas (up to ~15% of labelled cells), though most AD thalamocortical
        projections arise from separate neuronal populations.
      sources:
        - ref: "PMID:40593635"
          method: "brain-wide anterograde/retrograde connectomics"
          scope: "adult mouse AD1/AD2"
          quote_key: "279797062_79c8b7ec"
        - ref: "PMID:36089888"
          method: "dual retrograde tracing (collateral analysis)"
          scope: "rat anterior thalamic nuclei"
          quote_key: "252197625_57f7cb82"
