    is_terminal: false
    notes: >
      SUBSET OF pvt_glutamatergic_neuron: this is a marker-defined
      subpopulation of the PVT glutamatergic projection neuron (anterior PVT).
      The schema has no parent/subtype slot on CellTypeNode, so the
      relationship is recorded here only.

      EVIDENCE LIMITS: rat-only and connectivity/behaviour-only, from a single
      study (Engelke et al. 2021; PMID:33947849). The report mentions this
      population only in its connectivity section, not in its subtype
      profiles. aPVT CRF neurons are preferentially recruited during
      approach-food vs avoid-predator conflict, and the aPVT-CRF to NAc
      pathway suppresses food seeking and increases avoidance. No intrinsic
      electrophysiology described.

      NT TYPE INFERRED: glutamatergic identity is inferred from PVT
      principal-cell context (PVT-wide vGLUT2 expression and absence of
      intrinsic GABAergic neurons), not shown directly for CRF+ cells.

      MARKER EVIDENCE: the detection modality for Crh/CRF (transgenic line,
      ISH or IHC) is not stated in the quoted abstract; marker_type
      TRANSCRIPT is provisional pending primary verification. Crh is listed as
      both a defining marker and a neuropeptide.

      LOCATION: no ontology term for anterior PVT; the parent PVT term
      (UBERON:0001920) is used with name_in_source "aPVT".

      UNRESOLVED: relationship to mouse transcriptomic clusters (Gao et al.
      2023 PVT1-5) and to apvt_gck_neuron is not addressed.
