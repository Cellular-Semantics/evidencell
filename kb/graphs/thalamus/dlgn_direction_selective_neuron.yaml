        spatial_relationship: INTERSPERSED
        notes: >
          In the superficial 75 um of dLGN, anterior- and posterior-direction-selective
          neurons are intermingled with non-direction-selective neurons (Marshel
          et al. 2012, PMID:23177957, quote 3598591_8c3025f0).
    nt_type:
      name_in_source: "excitatory"
      cl_terms:
        - id: CL:0000679
          label: "glutamatergic neuron"
          name_in_source: "excitatory"
      sources:
        - ref: "PMID:41814933"
          quote_key: "286491924_f2e9799b"
          method: "INFERRED, not shown for this type — dLGN thalamocortical relay cells are excitatory and are 80-90% of dLGN neurons; glutamatergic identity assumes that most recorded direction-selective units are relay cells"
          scope: "mouse dLGN thalamocortical relay cells (general statement, not about direction-selective neurons)"
          support: WEAK
    electrophysiology:
      description: >
        Defined by visual response tuning, not intrinsic firing properties.
        Direction-selective to anterior or posterior (horizontal) motion; in the
        superficial ~75 um of dLGN, upward- and downward-selective neurons are
        nearly absent. The authors interpret dLGN as maintaining and sharpening
        retinal direction selectivity. Direction-selective responses are also
        found in extracellular recordings of mouse LGN, where direction- and
        orientation-selective units form a substantial population beyond
        center-surround cells. Intrinsic properties (firing pattern, bursting)
        are not reported for these neurons.
      sources:
        - ref: "PMID:23177957"
          quote_key: "3598591_8c3025f0"
          method: "in vivo two-photon calcium imaging of visual responses"
          scope: "mouse dLGN, superficial 75 um"
        - ref: "PMID:23177957"
          quote_key: "3598591_b52f6d24"
          method: "authors' interpretation of imaging results"
          scope: "mouse dLGN, superficial 75 um"
        - ref: "PMID:23486939"
          quote_key: "36416152_7fcc72ba"
          method: "in vivo multisite extracellular recording"
          scope: "mouse LGN"
        - ref: "PMID:23177957"
          quote_key: "3598591_37c33b69"
          method: "random-wiring model fitted to two-photon calcium imaging results"
          scope: "mouse dLGN, superficial region; model prediction of DSRGC input connectivity, not measured connectivity"
          added_by: "evidence_extraction_dlgn_direction_selective_neuron_20261126"
        - ref: "PMID:28965513"
          quote_key: "4807205_d2302f7c"
          method: "review statement citing V1 inactivation studies (mouse Zhao et al. 2013; Scholl et al. 2013)"
          scope: "mouse and cat dLGN TC neurons; direction/orientation selectivity persists after V1 inactivation (secondary citation; not specific to the superficial DS population)"
          added_by: "evidence_extraction_dlgn_direction_selective_neuron_20261126"
        - ref: "PMID:38917805"
          quote_key: "257758447_74d08653"
          method: "in vivo two-photon imaging of dLGN interneurons; statement about DS dLGN neurons cites Marshel et al. 2012"
          scope: "mouse dLGN; superficial DS dLGN neurons prefer horizontal-axis motion (secondary citation)"
          notes: "Same passage reports that DS interneurons, including horizontal-axis-preferring ones, are more prevalent in superficial than deep dLGN — so part of the superficial DS population imaged by tuning alone may be interneurons (see node notes on cell class)."
          added_by: "evidence_extraction_dlgn_direction_selective_neuron_20261126"
        - ref: "PMID:26741374"
          quote_key: "1639353_b39d8ffc"
          method: "introduction statement citing Marshel et al. 2012"
          scope: "mouse superficial LGN; anterior-posterior motion selectivity (secondary citation; calls the cells relay cells without independent evidence)"
          added_by: "evidence_extraction_dlgn_direction_selective_neuron_20261126"
    definition_references:
      - "PMID:23177957"
      - "PMID:23486939"
      - "PMID:26727264"
    notes: >
      Location: Marshel et al. imaged the superficial 75 um of dLGN; placing the
      cells in the shell rests on other sources equating the superficial
      direction-selective RGC lamina with the calbindin-positive shell, not on
      Marshel's own description. Cell class: the sources identify these cells by
      tuning only. They are not shown to be relay (thalamocortical) cells, and
      dLGN interneurons are also feature selective, so the glutamatergic nt_type
      is a weak inference from relay cells being the large majority of dLGN
      neurons. SUSPECTED HETEROGENEITY: anterior- and posterior-preferring cells
      are grouped here; whether they are distinct types is not addressed.
