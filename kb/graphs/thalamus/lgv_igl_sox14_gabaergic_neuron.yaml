    morphology:
      description: >
        Projection neuron morphology: sparse local arborization with a main
        projection extending ventrally (Brock et al., 2022; Sox14+ neurons in
        LGv and IGL). IGL and LGv are composed almost exclusively of GABAergic
        projection neurons (Brock et al., 2022, pooled LGv/IGL statement).
      sources:
        - ref: "PMID:36280260"
          method: "single-cell / sparse labelling of Sox14+ neurons (Fig. 1E-G; labelling method not named in quote)"
          scope: "mouse LGv and IGL — Sox14+ neurons"
          quote_key: "247159795_61ac7818"
        - ref: "PMID:36280260"
          method: "statement citing prior work (IGL/LGv composed almost exclusively of GABAergic projection neurons)"
          scope: "mouse IGL/LGv, pooled"
          quote_key: "247159795_fb7a534b"
    colocated_types:
      - neighboring_type: "vlgni_gabaergic_neuron"
        spatial_relationship: "INTERSPERSED"
        notes: >
          Sox14+ cells are enriched in the internal LGv (vLGNi) (Brock et al.,
          2022; PMID:36280260, quote 247159795_a2cf4a69). The two populations
          overlap; neither is shown to contain the other.
      - neighboring_type: "vlgne_gabaergic_neuron"
        spatial_relationship: "INTERSPERSED"
        notes: >
          Sox14+ cells are sparse in the external LGv (vLGNe) and IGL, where
          retinal innervation is dense (Brock et al., 2022; PMID:36280260, quote
          247159795_a2cf4a69).
    definition_references:
      - "PMID:36280260"
    notes: >
      LOCATION WORDING: Brock et al. (2022) define "Sox14+ neurons" as cells of
      the dorsal IGL/LGv, pTH-R-derived, as distinct from a ventral prethalamic
      component (quote 247159795_d79097dc), yet describe the morphology of
      "Sox14+ neurons in ventral LGv and IGL" (quote 247159795_61ac7818). Soma
      location is therefore recorded at the level of LGv (MBA:178) and IGL
      (MBA:27) without a dorsal/ventral restriction; check against the paper.

      DISTRIBUTION WITHIN LGv: Sox14+ cells are enriched in vLGNi and sparse in
      vLGNe and IGL (quote 247159795_a2cf4a69), so the type is not uniformly
      distributed across LGv laminae.

      SINGLE SOURCE: all properties here rest on one paper (Brock et al.,
      2022). Projection targets were traced from Sox14+ neurons pooled across
      LGv and IGL; which targets arise from LGv vs IGL cells is not resolved.

      GATA2: recorded from a pooled IGL/LGv statement citing prior work; not
      shown to be specific to the Sox14+ pTH-R-derived component (the
      prethalamic-derived ventral component may also express it).
