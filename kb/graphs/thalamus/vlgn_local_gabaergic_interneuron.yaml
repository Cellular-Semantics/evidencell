            marker_type: TRANSGENE_REPORTER
            method: "Gad67-GFP transgenic reporter"
            scope: "mouse visual thalamus"
            quote_key: "210870509_130a6a38"
            notes: >
              Per the same paper, Gad67-GFP is a faithful interneuron reporter in
              adult dLGN but labels only a subset of GABAergic cells elsewhere in
              visual thalamus.
          - ref: "PMID:36609305"
            marker_type: TRANSGENE_REPORTER
            method: "GAD67-GFP transgenic reporter (citing Su et al., 2011)"
            scope: "mouse vLGN"
            quote_key: "255502436_6bc6f6ca"
    definition_references:
      - "PMID:31964831"
      - "PMID:36342840"
    notes: >
      The sources assert the presence of local GABAergic interneurons in vLGN
      only in introductory statements citing older work (Harrington 1997;
      Moore 1994; Arcelli 1997); no quote gives markers, morphology or
      physiology that distinguish them from vLGN GABAergic projection neurons,
      which make up most of the nucleus. The population may not be separable
      from vlgn_gabaergic_neuron on current evidence.
