    notes: >
      Calb1 and Necab1 are graded, not discrete: Bakken et al. (2021) find mouse
      dLGN TC neurons cannot be split into discrete transcriptomic types, and
      shell neurons show opposing gradients to Pvalb, which is enriched in the
      core. Pvalb is therefore lower in shell than core but is not shown to be
      absent, so it is not recorded as a negative marker. Classic accounts use
      calbindin protein to delimit the shell zone itself (Leiwe et al. 2016);
      whether every shell relay cell is calbindin-immunopositive is not stated.
      SUSPECTED HETEROGENEITY: the shell is enriched for, but not exclusive to,
      W-like relay cells (reviews citing Krahe et al. 2011), and the superficial
      dLGN contains direction-selective neurons intermingled with
      non-direction-selective neurons (Marshel et al. 2012). The V1 layer-1
      target rests on a review of retrograde tracing; shell neurons are not
      shown to project only to L1.
