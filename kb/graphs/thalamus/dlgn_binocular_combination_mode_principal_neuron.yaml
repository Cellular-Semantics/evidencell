      Single primary study (Rompani et al. 2017); no independent study in
      the sources characterises binocular combination-mode cells. Rompani
      describe input "modes" of individually traced principal cells, so
      whether binocular combination mode marks a stable cell type or a
      connectivity state is unsettled. The sources do not place these cells
      relative to the ipsilateral-recipient zone, core/shell or X/Y/W-like
      morphology, and no marker or transcriptomic identity is established,
      so no morphology, marker or sub-nuclear location is recorded here.
