    notes: >
      SUSPECTED HETEROGENEITY / OPEN IDENTITY: the sublamina of origin (vLGNe
      vs vLGNi) and the molecular identity of SC-projecting vLGN GABAergic
      neurons are not stated in the sources. Sox14+ LGv/IGL neurons also
      project heavily to the SC (Brock et al., 2022, quote 247159795_9ed56c01);
      whether they overlap this population is unknown. The Salay et al. 2021
      abstract (quote 238410529_5d954f1d) describes the vLGN-to-SC circuit in
      a study of vLGN GABA neurons but does not explicitly state that the
      SC-projecting cells are GABAergic.
