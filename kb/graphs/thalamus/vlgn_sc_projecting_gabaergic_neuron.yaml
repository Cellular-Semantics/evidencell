    morphology:
      description: >
        Long-range GABAergic projection neuron whose axons leave the vLGN and
        terminate in the superior colliculus (Li et al., 2023; Ciftcioglu et
        al., 2020). Virtually all vLGN neurons, including the projection
        neurons, are GABAergic (Govindaiah et al., 2023). Somatodendritic
        morphology of identified SC-projecting cells is not described in the
        sources.
      sources:
