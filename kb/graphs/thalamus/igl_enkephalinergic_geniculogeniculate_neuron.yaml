        snippet: >-
          In rat, two main GABAergic subpopulations can be distinguished in
          the IGL: neurons synthesizing neuropeptide Y (NPY), which directly
          innervates the suprachiasmatic nuclei, and enkephalinergic cells,
          which connect contralaterally located leaflets
        explanation: >
          Names enkephalinergic, contralaterally projecting cells as one of two
          GABAergic subpopulations of the IGL. That places this node inside
          the IGL GABAergic neuron population as a proper subset, because the
          NPY cells are the sibling subset.
        study_type: ELECTROPHYSIOLOGICAL
      - evidence_type: LITERATURE
        supports: SUPPORT
        reference: "PMID:23103793"
        snippet: >-
          the other population comprises enkephalin-positive (ENK) neurons
          giving rise to the geniculo-geniculate tract innervating the
          contralateral IGL (cIGL)
        explanation: >
          The same source describes the IGL as a population of GABAergic
          neurons divided into two distinct populations. Enkephalin-positive
          geniculo-geniculate neurons are the second of these, so they are a
          subset of the IGL GABAergic neuron.
        study_type: MULTIMODAL
