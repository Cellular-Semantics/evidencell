    morphology:
      description: >
        Projection neuron. Its axons form the geniculo-geniculate tract to the
        contralateral IGL. It receives direct retinal innervation. It is
        hypothesised to act as a powerful interneuron-like inhibitory element
        on itself and on NPY-synthesising neurons, in the ipsilateral and the
        contralateral IGL. No somatodendritic description in the evidence.
      sources:
        - ref: "PMID:23103793"
          method: "statement in source (background); geniculo-geniculate tract"
          scope: "rat IGL"
          quote_key: "25997395_d6b35c15"
        - ref: "PMID:25856520"
          method: "statement in source citing Takatsuji et al., 1989 and Juhl et al., 2007"
          scope: "rodent IGL"
          quote_key: "8694896_b4e52a8c"
        - ref: "PMID:27916729"
          method: "hypothesis from slice electrophysiology (met-enkephalin application)"
          scope: "rat IGL"
          quote_key: "27232578_ac034fba"
    electrophysiology:
      description: >
        Has a T-type Ca2+ current (I_T). In vivo, the neurons fire in an
        infra-slow (<0.1 Hz) oscillatory (ISO) pattern of rhythmic bursts.
        All neurons identified as projecting to the contralateral IGL show
        ISO, which is sustained in the light and diminished or absent in
        darkness.
      sources:
        - ref: "PMID:30803080"
          method: "statement in source (background); patch clamp literature"
          scope: "rat IGL ENK neurons"
          quote_key: "73460105_a5d177e9"
        - ref: "PMID:23103793"
          method: "in vivo extracellular recording with antidromic identification of cIGL projection"
          scope: "rat IGL, urethane anaesthesia, light vs dark"
          quote_key: "25997395_7e370bae"
        - ref: "PMID:28041911"
          method: "in vivo extracellular recording"
          scope: "urethane-anaesthetised Wistar rat; putatively enkephalinergic IGL neurons; light-on only"
          quote_key: "3372643_98d9d287"
