    is_terminal: false
    notes: >
      PARENT TYPE: one of the two main GABAergic subpopulations of the IGL;
      subtype of igl_gabaergic_neuron (see edge below).

      INFERRED-IDENTITY CAVEAT: the enkephalinergic identity of the
      electrophysiologically defined group is partly inferred. Chrobok et
      al., 2016 (PMID:27208616, quote 12882742_30978228) define the I_T group
      only as "neurons that do not synthesise NPY". Later papers equate it
      with ENK cells (Palus-Chramiec et al., 2019, PMID:30803080, quote
      73460105_a5d177e9). ISO cells are called "putatively enkephalinergic"
      (Chrobok et al., 2017, PMID:28041911, quote 3372643_98d9d287), and
      the ISO cells of Blasiak et al., 2013 are identified by projection
      (cIGL), not by ENK labelling. The NPY-negative group may also include
      the "third cell group ... with unknown neurotransmitter content"
      (PMID:23432696, quote 36406110_2999c838) or Thankachan Type I
      (NPY-lacking) cells (PMID:16207879, quote 9130790_8fa09d39). So the
      negative marker Npy and the I_T / ISO properties may describe a
      superset of the true ENK class.

      PHARMACOLOGY: met-enkephalin hyperpolarises putatively enkephalinergic
      IGL neurons via mu-opioid receptors (Palus et al., 2017, PMID:27916729,
      quote 27232578_ac034fba).

      HETEROGENEITY: the report notes no finer molecular subdivision within
      the ENK class.

      MARKERS: Penk is the rat-convention gene symbol for the precursor of
      the "enkephalin" (met-enkephalin) named in the sources. Evidence is
      protein (immunohistochemical), not transcript.

      CL MAPPING: no CL term found for an enkephalinergic CNS neuron (only
      sympathetic ganglion and myenteric enkephalin neurons). cl_mapping is
      left empty (CANDIDATE). Potential CL new-term contribution under
      CL:0000617 GABAergic neuron.

      SPECIES: rat.

