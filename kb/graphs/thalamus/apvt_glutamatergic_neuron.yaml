    morphology:
      description: >
        Projection neurons. No somatodendritic description in the sources.
        The axon projection pattern of the anterior PVT subpopulation is
        nearly non-overlapping with that of the posterior subpopulation, with
        an intermediate population between them (mouse). aPVT neurons project
        to the nucleus accumbens and the amygdala (rat). Cortical projection
        bias of the anterior clusters PVT2/PVT4 toward prelimbic,
        infralimbic, orbital, gustatory and insular areas is inferred from
        correlation with a projection-labelled thalamic atlas, not traced
        (mouse).
      sources:
        - ref: "PMID:37862168"
          method: "axon projection mapping"
          scope: "adult mouse anterior vs posterior PVT subpopulations"
          quote_key: "264359607_d839d41e"
        - ref: "PMID:28426970"
          method: "optogenetic photoinhibition of aPVT projections"
          scope: "rat aPVT"
          quote_key: "207218608_40dbc14a"
        - ref: "PMID:36867023"
          method: "snRNA-seq integration with ThalamoSeq projection-labelled atlas (correlation)"
          scope: "adult mouse PVT clusters PVT2/PVT4"
          quote_key: "251021326_6820b736"
    definition_references:
      - "PMID:37862168"
      - "PMID:36867023"
      - "PMID:28426970"
    notes: >
      SUSPECTED HETEROGENEITY: three transcriptomic clusters (Gao et al.
      2023, PMID:36867023: PVT2, PVT4, PVT5) are most anteriorly represented,
      so this population is not molecularly uniform. Drd3 (PVT2 and PVT4)
      is the antero-posterior gradient marker, so its expression is graded
      rather than all-or-none. Cluster markers enriched in anterior PVT
      (Hcrtr1 for PVT2; Tesc and Cbln2 for PVT4; Thy1 for PVT5; quote keys
      251021326_3d4954d5, 251021326_19d51130, 251021326_6e3c6191) mark single
      clusters, not all anterior cells, so they are not recorded as
      defining_markers here; they belong on the deferred PVT2/PVT4/PVT5
      nodes.

      SPECIES: molecular, location and projection-pattern evidence is mouse
      (Gao 2023; Shima 2022, PMID:37862168); the NAc and amygdala targets are
      from rat, where aPVT is defined by injection site, not by molecular
      identity (Do-Monte 2017, PMID:28426970).

      GLUTAMATERGIC IDENTITY is inferred: shown for the PVT as a whole and
      by Gao et al.'s Slc17a6/Slc17a7+, Gad1/Gad2- selection, not by a
      direct test on anterior cells.
