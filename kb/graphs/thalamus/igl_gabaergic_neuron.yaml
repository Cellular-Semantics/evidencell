        snippet: >-
          The intergeniculate leaflet (IGL) is a flat retinorecipient thalamic
          structure implicated in orchestrating circadian rhythm, historically
          considered to be a subdivision of the neighboring ventrolateral
          geniculate nucleus (VLG).
        explanation: >
          Places the IGL anatomically within the LGv/IGL complex that the
          parent node pools. The IGL is a leaflet historically treated as a
          subdivision of the VLG (= LGv), so neurons restricted to the IGL are
          a spatial subset of the LGv/IGL population.
        study_type: ELECTROPHYSIOLOGICAL
