    notes: >
      PARENT TYPE: narrower than lgv_igl_gabaergic_neuron, which pools LGv and
      IGL GABAergic neurons. This node is restricted to the IGL (see edge
      below). The coarse parent's evidence is mouse; this node's evidence is
      almost entirely rat.

      SUBTYPES: two main peptide/projection classes are modelled as child
      nodes: igl_npy_geniculohypothalamic_neuron (NPY+, projects to the SCN)
      and igl_enkephalinergic_geniculogeniculate_neuron (ENK+, projects to the
      contralateral IGL) (Blasiak et al., 2013, PMID:23103793, quote
      25997395_d6b35c15; Palus et al., 2017, PMID:27916729, quote
      27232578_7306b2da).

      SUSPECTED HETEROGENEITY (not modelled as nodes): (1) Blasiak et al.,
      2013 (PMID:23432696, quote 36406110_2999c838) state that "a third cell
      group is present with unknown neurotransmitter content" in the rat IGL,
      citing Moore & Card 1994. (2) Thankachan & Rusak 2005 (PMID:16207879,
      quote 9130790_8fa09d39) define three juxtacellularly labelled classes in
      the "IGL/VLG". Type I lacks NPY and is sustained-activated by light.
      Type II has strong somatic NPY and a varied light response. Type III has
      patchy/internalised NPY, interpreted as NPY recipients rather than
      producers. Their anatomy crosses the IGL/VLG boundary, so these classes
      sit partly within the coarse LGv/IGL parent as well as here. There is
      no established one-to-one mapping of Type I/II/III onto the ENK/NPY
      classes.

      CROSS-SPECIES HOMOLOGY: the medial zone of the cat vLGN, which contains
      SCN-projecting neurons and NPY-immunoreactive processes, is proposed as
      a homologue of the rodent IGL (Pu & Pickard, 1996, PMID:8836531, quote
      34655061_6fdab967). The rodent IGL is described as a homologue of the
      primate pregeniculate nucleus (Blasiak et al., 2013, PMID:23432696,
      quote 36406110_0c02eb87). Neither homologue is asserted as a location
      here.

      MARKERS: no gene-level defining marker is given in the evidence. GABA is
      established by immunocytochemistry statements, and Npy/Penk each mark
      only a subpopulation, so defining_markers is left empty. Gene symbols
      Npy/Penk are rat-convention renderings of the protein names "NPY" and
      "enkephalin" in the sources.

      MORPHOLOGY: no single-cell somatodendritic description in the evidence.

      ELECTROPHYSIOLOGY (unquoted): the report also states that orexin A
      depolarises IGL neurons through non-selective cation channels
      (Palus-Chramiec et al., 2019, PMID:30803080). No quote in the store
      carries that claim, so it is not asserted in the electrophysiology
      field. Met-enkephalin hyperpolarises both putative NPY and putative ENK
      IGL neurons via mu-opioid receptors (Palus et al., 2017, PMID:27916729,
      quote 27232578_ac034fba).

      SPECIES: rat for all IGL-specific evidence. Cat appears only as a
      homology note.

