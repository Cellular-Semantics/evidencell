          1993)
        explanation: >
          The parent is defined as GABAergic. This shows that IGL neurons meet
          the parent's transmitter criterion as well as its anatomical one,
          so the IGL GABAergic neuron is narrower than (contained in) the
          LGv/IGL GABAergic neuron. Background statement citing Moore et al.,
          1993, in rat.
        study_type: ELECTROPHYSIOLOGICAL
