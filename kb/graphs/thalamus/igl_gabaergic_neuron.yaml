    electrophysiology:
      description: >
        Network level: the IGL shows slow (infra-slow / ultradian) rhythmic
        oscillations that need retinal (photic) input and are maintained by
        the oscillatory activity of the GABAergic neurons. GABA_A receptors
        take part in generating them. Single-cell level: the population splits
        on subthreshold currents into a T-type Ca2+ current (I_T) group, which
        does not synthesise NPY, and an A-type K+ current (I_A) group, which is
        NPY-positive.
      sources:
        - ref: "PMID:15366259"
          method: "review of in vivo extracellular recordings"
          scope: "rat IGL"
          quote_key: "14019540_d34397fa"
        - ref: "PMID:15120585"
          method: "in vivo extracellular recording with GABA_A antagonism"
          scope: "rat IGL"
          quote_key: "27043440_ee83c36c"
        - ref: "PMID:27208616"
          method: "whole-cell patch clamp (acute slice) with NPY identification"
          scope: "rat IGL"
          quote_key: "12882742_30978228"
