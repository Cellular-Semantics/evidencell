    notes: >
      INHERITED: shared ATN properties (Slc17a6, glutamatergic identity, relay-cell
      morphology, Papez-circuit placement) are recorded on the parent.
      Slc17a6 applies here by inheritance.

      SUSPECTED HETEROGENEITY / SUBTYPES NOTED (not separate nodes): AM is
      the most heterogeneous ATN nucleus. Hintiryan et al. (2025;
      PMID:40593635) define at least eight projection-defined types: AM1
      (throughout; cingulate + RSC; no marker), AM2 (ventrolateral;
      prefrontal, prostriata, ventral visual), AM3 (throughout; Tnnt1+;
      prefrontal, cingulate, RSC), ADP (dorsal posterior AM; Cacna2d1+;
      prelimbic, cingulate, visual), AMd (dorsal middle AM; cingulate,
      visual), AMv (ventral middle AM; prelimbic, cingulate), AMdc (rostral
      dorsal cap; Tnnt1+; prelimbic, cingulate) and AMV (caudal ventral
      border; Col5a1+; ventral orbital, agranular insular, entorhinal);
      Calb1 marks at least one more broadly distributed AM type. Col5a1,
      Cacna2d1 and Calb1 are subtype markers and are not asserted as
      defining markers of the whole AM node. THALMANAC (Turner et al., 2025)
      also resolves discrete transcriptomic subdomains within AM. May warrant
      splitting if transcriptomic correspondence is established.

      CONNECTIVITY: inputs from the ipsilateral medial mammillary nucleus
      (pars medialis; earliest mammillothalamic target, E20-21 in rat;
      PMID:33309908, PMID:25538571); proximal dorsal subiculum almost
      exclusively via the fornix (PMID:25616174, PMID:26855336,
      PMID:32132227); heavy ACC input and MCC input (PMID:32964131,
      PMID:41840687). Afferents to AM and AV largely segregated
      (PMID:23504917). AM (with VAL) provides thalamic synaptic input to
      callosal OPCs underlying motor cortex (PMID:31625910).

      ELECTROPHYSIOLOGY: none reported for AM neurons.

      SPECIES: cited evidence mixes mouse and rat; species left null.
