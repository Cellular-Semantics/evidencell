    morphology:
      description: >
        Somatodendritic plan as for the parent ATN type. Axonal projections:
        of the principal anterior thalamic nuclei, only AM contains neurons
        bifurcating to both anterior cingulate cortex and adjacent prefrontal
        or retrosplenial cortex (modest numbers, rat). AM (with AV) has
        reciprocal connections with anterior cingulate, secondary motor and
        entorhinal cortex and contributes to prelimbic projections; AM is a
        principal thalamic source of input to mouse ACC areas 24a/24b.
        Projection-defined AM types target combinations of prefrontal,
        cingulate, retrosplenial, visual, orbital, insular and entorhinal
        cortex (see notes).
