          quote_key: "285258741_478ed0bb"
    electrophysiology:
      description: >
        Electrophysiological properties differ between neurons at the two
        extremes of the transcriptomic gradient (distinct properties for the
        Spp1 vs Ecel1 subpopulations). TRN subpopulations share activity
        patterns according to the principal thalamic structures they project
        to.
        [Added 2026-11-14 from TRN_GABA.pdf:] Fast-spiking; generate
        repetitive spike bursts at spindle frequency (Na+ action potentials
        driven by low-threshold Ca2+ spikes) that initiate sleep spindles in
        NREM sleep. No tonic GABA-A current (lack alpha4/delta subunits).
        TRN/PGN neurons inhibit one another, mainly via GABA-A and
        occasionally GABA-B receptors. Limbic-projecting TRN neurons track
        arousal, whereas sensory-projecting neurons participate in spindles
        and are suppressed by attention. PV but not SOM cells are
        rhythmogenic. Visual TRN neurons in awake monkey show high background
        firing (~45 spikes/s) and fast strong transient visual responses
        that are modulated by attention. Group I mGluR activation depolarises
        and group II mGluR activation hyperpolarises TRN neurons; adenosine
        (A1) presynaptically suppresses nRT inhibitory output.
      sources:
