      SUSPECTED HETEROGENEITY (may warrant splitting into core/Spp1 and
      shell/Ecel1 nodes): TRN heterogeneity is a continuous transcriptomic
      gradient of two negatively correlated expression programmes, with
      mutually exclusive Spp1 and Ecel1 at the extremes; the two
      subpopulations form distinct TRN-thalamus subnetworks with first-order
      vs higher-order nuclei and differentially regulate sleep (Li et al.,
      2020; PMID:32699411). Spp1 and Ecel1 are therefore subpopulation
      markers, not pan-TRN markers. Roy et al. (2022; PMID:35102334, quote
      246443644_61cfc49b) additionally describe PV- and SST-labelled TRN
      subpopulations in mouse that are also present in human; not asserted
      as markers here because the quote does not specify the assay.
      [2026-11-14: the split has now been made — see trn_spp1_core_neuron
      and trn_ecel1_shell_neuron, written as poles of this gradient. Hartley
      et al. 2024 (PMID:39630580, quote 274495776_ea6ec372) restate the
      Spp1-core/high-burst/first-order vs Ecel1-shell/low-burst/higher-order
      split. Pvalb and Sst are now asserted from other quotes — see below.]

      ATLAS CONTEXT: in the ABC atlas, RT neurons fall in class 12 HY GABA,
      shared with zona incerta, LGv and hypothalamus (Turner et al., 2025) —
      they are not in the thalamus-proper glutamatergic class.

      SPECIES: species left null; primary evidence is mouse.
      [2026-11-14: the TRN_GABA.pdf sources add rat, cat, PGN (carnivore)
      and macaque evidence; species remains null.]

      --- Added 2026-11-14 from inputs/deepsearch/TRN_GABA.pdf ---

      CONTRADICTION (homogeneity): Sellers et al. 2014 (PMID:24929424, quote
      13962500_281f85a8) call TRN neurons "a near homogeneous population"
      defined by parvalbumin expression. This conflicts with the Spp1/Ecel1
      gradient (Li et al., 2020) and with PV+ vs SOM+ subpopulations
      (Clemente-Perez et al., 2017, PMID:28591583) — both views kept.

      CONTRADICTION (Pvalb coverage): Sellers et al. 2014 treat PV as
      defining for TRN; Flores et al. 2026 (PMID:41622438, quote
      285258741_478ed0bb) give PV in ~70% of TRN cells; Malinova et al. 2013
      report PV always colocalised with GABA in rat TRN (the converse
      direction, not coverage). Pvalb is therefore a majority, not
      universal, marker. Several Pvalb/Sst marker_type values are PROTEIN by
      assumption because the quotes do not name the assay (flagged in each
      source's method).

      CONTRADICTION (Sst, species): in cat and monkey, at least the majority
      of TRN neurons show somatostatin-like immunoreactivity, proposed as a
      defining characteristic of the nucleus (Graybiel & Elde 1983,
      PMID:6133921, quotes 2564943_95c06a97, 2564943_ee27b032). In rodent,
      SOM marks a subpopulation distinct from PV cells, linked to limbic
      circuits and higher-order nuclei (Clemente-Perez et al., 2017; review
      Inserra et al. 2021, PMID:33645311, quote 232077377_39d5ae3a). Cho et
      al. 2025 (preprint, https://doi.org/10.1101/2025.10.05.680571, quote
      282307079_44a45345) report intra-TRN inhibition arising mainly from
      SOM onto PV TRN neurons. Graybiel also reports TRN neurons negative for
      avian pancreatic polypeptide antisera (not asserted as a gene, since
      the antigen-to-gene mapping is ambiguous).

      CONTRADICTION (mutual inhibition): slice physiology shows potent
      GABA-A (occasionally GABA-B) mutual inhibition between PGN/TRN cells
      (Sanchez-Vives et al. 1997, PMID:9348356, quote 15405814_b54e66d7),
      while the same quote notes that Pinault et al. found axonal synaptic
      interactions between reticular cells in adult rat to be rare on
      morphological grounds.

      ADDITIONAL HETEROGENEITY (not split): (i) limbic vs sensory sectors and
      sub-networks (Halassa et al., 2014, PMID:25126786; one limbic, five
      sensory and one rostral motor sector — Villalobos et al. 2022,
      PMID:35896962, quote 251108998_6032faf3); (ii) somatosensory TRN has
      three tiers (inner to outer receive input from POm, VPM, VPL), and
      roughly a quarter of neurons receive convergent input from multiple
      thalamic nuclei, distributed evenly through the TRN's thickness (Lam
      et al. 2011, PMID:21543609, quote 17803026_048c557a); (iii) two types of
      gap-junction-coupled clusters — within-module clusters vs clusters
      across the TRN's thickness that target first- and higher-order nuclei;
      coupling reduced but not abolished in connexin36 knockouts (Lee et al.
      2014, PMID:25253862, quote 22250359_a2c2e373); (iv) PV neurons of
      sensory TRN regulate social memory (Gao 2024, PMID:39024916, quote
      271245495_d8c25eae — the source calls them "interneurons").

      PERIGENICULATE NUCLEUS: the carnivore perigeniculate nucleus (visual
      TRN sector) is treated as part of this population (Sanchez-Vives et
      al. 1997). No separate anatomical_location entry was added; PGN data
      are flagged by scope in the sources.

      DEVELOPMENTAL ORIGIN: TRN neurons derive from GABAergic progenitors of
      the embryonic prethalamus (p3) (Sellers et al. 2014, quote
      13962500_5ff436ed; Jager et al. 2016, PMID:27929058). These progenitors
      express Ascl1 and depend on Dlx1, Dlx2 and Arx (quote
      264044014_14d3b43b). An Ascl1->Isl1 cascade promotes TRN fate (Nguyen et
      al. 2024, PMID:39625482, quote 274463686_3ce3bd17). These are
      progenitor/developmental TFs, so they are not asserted as adult
      defining_markers.

      RECEPTORS / MODULATION: TRN GABAergic neurons express pre- and
      postsynaptic 5-HT2A and 5-HT1A receptors (Htr2a, Htr1a; Inserra et al.
      2021, quote 232077377_781ba52b). Goitia et al. 2015 (PMID:26484945,
      quote 35643051_a7773555) give functional evidence for presynaptic
      5-HT1A/5-HT2A on TRN terminals. Adenosine A1 presynaptically suppresses
      nRT inhibitory currents (Ulrich & Huguenard 1995, PMID:7576639, quote
      16754940_ba112480). Not asserted as markers (low specificity).

      UNSUPPORTED REPORT MARKERS: the report mentions Slc32a1 and a Nos1
      negative. No quote supports either for TRN neurons (the Weil et al.
      2022 quote concerns PHb neurons and dLGN interneurons), so neither is
      asserted.
