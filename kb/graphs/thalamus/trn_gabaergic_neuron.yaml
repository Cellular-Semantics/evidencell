    morphology:
      description: >
        Somatodendritic morphology not described in the report. Neurons at
        the two extremes of the transcriptomic gradient show core-like vs
        shell-like anatomical organisation within the nucleus, and connect
        differentially with first-order vs higher-order thalamic nuclei.
        [Added 2026-11-14 from TRN_GABA.pdf:] HRP-filled reticular nucleus
        cells (cat) have thin axons with intrareticular collaterals and
        diffuse branches through much of the ventral posterior and posterior
        thalamic nuclei; dendrites end in processes resembling synaptic
        terminals (GAD-immunoreactive presynaptic dendrites). Biocytin-filled
        perigeniculate neurons often carry beaded intra-PGN axon collaterals.
        The vast majority of nRT-thalamic terminals form a single synapse per
        postsynaptic target on thin distal dendrites of relay cells. Core
        (inner) TRN neurons are reported to have larger somata and more
        extensive dendritic trees than edge neurons.
      sources:
        - ref: "PMID:32699411"
          method: "scRNA-seq + anatomy + connectivity mapping"
          scope: "adult mouse TRN"
          quote_key: "220696191_0d9ab57d"
        - ref: "PMID:4020436"
