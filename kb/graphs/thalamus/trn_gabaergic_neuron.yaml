    notes: >
      CL MAPPING: no CL term found for thalamic reticular nucleus neuron;
      cl_mapping left empty (CANDIDATE) — potential CL new-term contribution
      (parent would be CL:0000617 GABAergic neuron).

      SUSPECTED HETEROGENEITY (may warrant splitting into core/Spp1 and
      shell/Ecel1 nodes): TRN heterogeneity is a continuous transcriptomic
      gradient of two negatively correlated expression programmes, with
      mutually exclusive Spp1 and Ecel1 at the extremes; the two
      subpopulations form distinct TRN-thalamus subnetworks with first-order
      vs higher-order nuclei and differentially regulate sleep (Li et al.,
      2020; PMID:32699411). Spp1 and Ecel1 are therefore subpopulation
      markers, not pan-TRN markers. Roy et al. (2022; PMID:35102334, quote
      246443644_61cfc49b) additionally describe PV- and SST-labelled TRN
      subpopulations in mouse that are also present in human; not asserted
      as markers here because the quote does not specify the assay.

      ATLAS CONTEXT: in the ABC atlas, RT neurons fall in class 12 HY GABA,
      shared with zona incerta, LGv and hypothalamus (Turner et al., 2025) —
      they are not in the thalamus-proper glutamatergic class.

      SPECIES: species left null; primary evidence is mouse.
