      description: >
        Somatodendritic morphology not described in the report. Neurons at
        the two extremes of the transcriptomic gradient show core-like vs
        shell-like anatomical organisation within the nucleus, and connect
        differentially with first-order vs higher-order thalamic nuclei.
      sources:
