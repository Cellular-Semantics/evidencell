          scope: "cat somatosensory TRN"
          quote_key: "11351142_bb87302f"
        - ref: "PMID:9348356"
          method: "biocytin fills in slices"
          scope: "perigeniculate nucleus (visual sector of TRN)"
          quote_key: "15405814_6a2f954f"
        - ref: "PMID:19005050"
          method: "terminal ultrastructure"
          scope: "rodent somatosensory thalamus — nRT-thalamic terminals"
          quote_key: "29575561_d20cd0c6"
        - ref: "PMID:41622438"
