    morphology:
      description: >
        Retina-recipient thalamocortical neuron projecting to primary visual
        cortex (V1). Distinct morphological and connectional TC types are
        described in dLGN of mice, cats and primates, but transcriptomic
        differences between them are subtle relative to their differences in
        morphology and cortical projection targets.
      sources:
        - ref: "PMID:34473054"
          method: "review of prior anatomy + transcriptomics"
          scope: "mouse, human and macaque dLGN"
          quote_key: "237389962_9b813d38"
        - ref: "PMID:34831385"
          method: "review"
          scope: "dLGN of mice, cats and primates"
          quote_key: "244102130_41b92975"
    electrophysiology:
      description: >
        Intrinsic properties of mouse dLGN relay neurons are not described in
        the report. LGN in rodents and monkeys contains subpopulations
        distinguished by single-cell electrophysiological properties, spatial
        localisation and inputs from distinct retinal ganglion cell subtypes.
      sources:
        - ref: "PMID:35102334"
          method: "review"
          scope: "rodent and monkey LGN subpopulations"
          quote_key: "246443644_61cfc49b"
    colocated_types:
      - neighboring_type: "dlgn_gabaergic_interneuron"
        spatial_relationship: INTERSPERSED
        notes: >
          dLGN is the one central thalamic nucleus with a (sparse) population
          of local GABAergic interneurons among its excitatory relay neurons.
          Supporting quote: 258464391_a576f421 (Zhou et al., 2023;
          https://doi.org/10.1101/2023.05.01.538832).
    cl_mapping:
      cl_term:
        id: CL:4023068
        label: "thalamic excitatory neuron"
        name_in_source: "thalamic excitatory neuron"
      mapping_type: BROAD
      mapping_notes: >
        Broad parent only; mapping confidence LOW. CL:4023187 'koniocellular
        cell' (LGN koniocellular-layer neuron, primate-oriented) is a RELATED
        candidate for the Calb1/Necab1 shell subpopulation, not for the whole
        dLGN relay type.
    definition_references:
      - "PMID:34473054"
      - "PMID:34831385"
      - "PMID:36476860"
      - "https://doi.org/10.1101/2023.05.01.538832"
    is_terminal: false
    notes: >
      SUSPECTED HETEROGENEITY: in adult mouse, dLGN TC neurons cannot be
      grouped into discrete transcriptomic types; diversity is a modest graded
      core-shell axis — Pvalb-enriched core neurons (aligning with primate M/P)
      vs Calb1/Necab1-enriched shell neurons (aligning with primate
      koniocellular) (Bakken et al., 2021; PMID:34473054). Primates by contrast
      have discrete M, P and two K types. A shell vs core split could be made
      later if the mapping requires it. The ENRICHED marker modifiers reflect
      opposing gradients, not presence/absence.

      SPECIES-DEPENDENT CLAIMS: morphology statements pool mice, cats and
      primates; the M/P/K framework is primate.

      ADDITIONAL MARKER NOT ASSERTED: Roy et al. (2022; PMID:35102334, quote
      246443644_61cfc49b) cite Spp1 as an LGN marker from monkey bulk arrays,
      with comparable mouse expression. Not asserted as a defining marker
      because it is nucleus-level bulk evidence and Spp1 also marks one
      extreme of the TRN gradient.

      SPECIES: species left null.

      Member of the thalamic_glutamatergic_projection_neuron family (primary
      end of the trans-thalamic transcriptional axis).
