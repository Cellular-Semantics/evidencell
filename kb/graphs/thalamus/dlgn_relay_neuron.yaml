    colocated_types:
      - neighboring_type: "dlgn_gabaergic_interneuron"
        spatial_relationship: INTERSPERSED
        notes: >
          dLGN is the one central thalamic nucleus with a (sparse) population
          of local GABAergic interneurons among its excitatory relay neurons.
          Supporting quote: 258464391_a576f421 (Zhou et al., 2023;
          https://doi.org/10.1101/2023.05.01.538832).
          The interneurons are in direct synaptic apposition with relay
          neurons: they inhibit them via axonal F1 terminals and via
          presynaptic dendrites (F2 terminals) that form triads with a retinal
          terminal on the relay-cell dendrite; local interneurons and TRN are
          the main sources of inhibitory input to relay neurons in mouse
          dLGN. Supporting quotes: 26076888_af7e5f6a, 26076888_f3def9a4
          (Yang et al., 2017; PMID:29252999).
