  Evidence graph component for the principal (thalamocortical relay) neuron of
  the dorsal lateral geniculate nucleus — a nucleus-specific member of the
  thalamic glutamatergic projection neuron family, proposed from the ASTA deep
  research report on thalamic neuron types.
