    morphology:
      description: >
        Retina-recipient thalamocortical neuron projecting to primary visual
        cortex (V1). Distinct morphological and connectional TC types are
        described in dLGN of mice, cats and primates, but transcriptomic
        differences between them are subtle relative to their differences in
        morphology and cortical projection targets.
        In mouse, dLGN relay cells have highly stereotyped, complex dendritic
        arbors, classifiable from quantitative dendritic architecture into
        biconical, radially symmetrical and hemispheric (X-, Y- and W-like)
        profiles; these features are present at early postnatal ages and
        dendritic fields resemble the adult pattern after the first postnatal
        week (El-Danaf et al., 2015; Krahe et al., 2011).
      sources:
        - ref: "PMID:34473054"
          method: "review of prior anatomy + transcriptomics"
          scope: "mouse, human and macaque dLGN"
          quote_key: "237389962_9b813d38"
        - ref: "PMID:34831385"
          method: "review"
          scope: "dLGN of mice, cats and primates"
          quote_key: "244102130_41b92975"
        - ref: "PMID:26174426"
          method: "analysis of relay-cell dendritic morphology across postnatal development"
          scope: "postnatal mouse dLGN relay cells"
          quote_key: "5842285_4ec71661"
        - ref: "PMID:22131405"
          method: "quantitative analysis of relay-cell dendritic architecture"
          scope: "early postnatal mouse dLGN relay cells"
          quote_key: "16328698_cc12bb7a"
        - ref: "PMID:28965517"
          method: "review statement (citing Krahe et al., 2011; Ling et al., 2012)"
          scope: "nocturnal rodent dLGN TC cells — biconical X-like, symmetrical Y-like, hemispheric W-like classes"
          quote_key: "4601077_32262ceb"
        - ref: "PMID:41814933"
          method: "review statement in introduction (citing Krahe et al., 2011)"
          scope: "mouse dLGN TRCs — 80-90% of dLGN neurons; W-, X-, Y-like dendritic shapes"
          quote_key: "286491924_2e18d254"
        - ref: "PMID:26741374"
          method: "introduction statement citing dendritic-architecture classification (Krahe et al., 2011)"
          scope: "mouse LGN relay neurons"
          quote_key: "1639353_9dec09a7"
    electrophysiology:
      description: >
        Intrinsic properties of mouse dLGN relay neurons are not described in
        the report. LGN in rodents and monkeys contains subpopulations
        distinguished by single-cell electrophysiological properties, spatial
        localisation and inputs from distinct retinal ganglion cell subtypes.
        The 2026-11-25 mouse dLGN relay report adds: relay neurons fire in
        tonic and burst modes, the balance between them regulated by
        retinogeniculate synaptic dynamics (Kerschensteiner et al., 2017);
        active membrane properties and spike firing mature rapidly over the
        first postnatal week(s), before eye opening (El-Danaf et al., 2015);
        and the morphologically distinct relay-cell classes showed no
        additional distinguishing electrophysiological properties (Krahe et
        al., 2011).
      sources:
        - ref: "PMID:35102334"
          method: "review"
          scope: "rodent and monkey LGN subpopulations"
          quote_key: "246443644_61cfc49b"
        - ref: "PMID:28965524"
