          quote_key: "286491924_f2e9799b"
          method: "review statement — TRCs (divided into W-, X- and Y-like types) described as excitatory; glutamatergic transmitter inferred from excitatory thalamocortical identity, not shown directly for X-like cells"
          scope: "mouse dLGN thalamocortical relay cells"
        - ref: "PMID:28965517"
          quote_key: "4601077_8f3fc6a4"
