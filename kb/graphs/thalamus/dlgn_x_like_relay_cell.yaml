          scope: "rodent dLGN TC relay cells"
    morphology:
      description: >
        Biconical dendritic architecture, resembling cat X cells. Tends to be
        smaller than Y- and W-like relay cells. Dendritic fields show no
        orientation bias with respect to the optic tract or dLGN boundaries.
        Classifiable by dendritic morphology from early postnatal ages.
      sources:
        - ref: "PMID:22131405"
          quote_key: "16328698_cc12bb7a"
          method: "quantitative analysis of dendritic architecture of dye-filled relay cells"
          scope: "mouse dLGN, early postnatal to adult"
        - ref: "PMID:28965517"
          quote_key: "4601077_8f3fc6a4"
          method: "review statement citing Krahe et al. 2011 and Ling et al. 2012"
          scope: "nocturnal rodent dLGN — biconical X-like cells"
        - ref: "PMID:41814933"
          quote_key: "286491924_f2e9799b"
          method: "review statement citing Krahe et al. 2011"
          scope: "mouse dLGN — X-like TRCs are biconical"
    definition_references:
      - "PMID:22131405"
      - "PMID:28965517"
      - "PMID:41814933"
    notes: >
      Location sources disagree: the primary study (Krahe et al. 2011) places
      X-like cells primarily in the monocular ventral region of dLGN, while
      reviews (Monavarfeshani et al. 2017; Stebbins et al. 2026) summarise X-
      and Y-like cells as occupying the ventromedial core. Krahe et al. found no
      electrophysiological properties distinguishing X-like from Y- and W-like
      relay cells, and the sources give no molecular marker, so the class is
      defined by dendritic morphology and position only.
