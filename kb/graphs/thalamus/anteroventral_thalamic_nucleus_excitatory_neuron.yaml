    is_terminal: false
    notes: >
      HIERARCHY: subtype of anterior_thalamic_nucleus_excitatory_neuron
      (ATN); shared ATN properties (Slc17a6, glutamatergic identity, relay-cell
      morphology, Papez-circuit placement) are recorded on the parent.
      Slc17a6 applies here by inheritance.

      SUBTYPES NOTED (not separate nodes): Hintiryan et al. (2025;
      PMID:40593635) define AV1 (dorsomedial), AV2 (ventrolateral) and AV3
      (dorsolateral) projection types, without unique markers for each.
      Kapustina et al. (2024; PMID:38427564) report a dorsomedial-
      ventrolateral transcript gradient in AV that covaries with protein
      products and long-range inputs — suspected continuous heterogeneity.

      TRANSGENE MARKER (not recorded as a gene marker): the Grp_KH288-Cre
      driver labels a subset of AV neurons but none in AD (PMID:30858601);
      this BAC-transgenic labelling does not establish endogenous Grp
      expression, and labels only a subset.

      CONNECTIVITY: inputs from the ipsilateral medial mammillary nucleus
      (pars lateralis; PMID:33309908, PMID:25538571); from presubiculum and
      distal dorsal subiculum, mostly via the fornix, with postsubicular
      input to lateral dorsal AV via a nonfornical route (PMID:25616174,
      PMID:26855336, PMID:32132227); light ACC input restricted to AVDM
      (PMID:32964131); MCC/PCC (not ACC) input to AVVL and AVDM in mouse
      (PMID:41840687). Afferents to AV and AM are largely segregated, with
      <1% double-labelled cells except laterodorsal tegmental input
      (PMID:23504917). Reciprocal with ACC, secondary motor and entorhinal
      cortex (PMID:33069688). AV and AD regulate memory specificity and
      contextual encoding respectively via RSC projections (PMID:34197733).

      SPECIES: cited evidence mixes mouse and rat; species left null.
