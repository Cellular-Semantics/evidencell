          quote_key: "9155344_6ed594e2"
    morphology:
      description: >
        Somatodendritic plan as for the parent ATN type. Axonal projections:
        AV is the major thalamic source to granular retrosplenial cortex
        (RSCg), targeting primarily layer 1 and particularly L1a, with sparser
        branching in deeper layers and dysgranular RSC; AV injections give
        heavy termination in layers 1-4 of granular RSC (Rgb) and a light
        projection restricted to layer 1 of anterior cingulate Cg2. Single
        AV axons in rat granular RSC are heterogeneous — type 1 arborise only
        in layer Ia, type 2 also branch in layers III/IV. Projection-defined
        types: AV1 (dorsomedial; prelimbic, ACC, anterior RSC), AV2
        (ventrolateral; granular RSC, ventral visual stream), AV3
        (dorsolateral; prefrontal and visual cortex).
      sources:
        - ref: "PMID:30858601"
          method: "anterograde AAV-ChR2 tracing (wild-type and Grp_KH288-Cre mice)"
          scope: "adult mouse AV to granular RSC"
          quote_key: "73729161_fddda88d"
        - ref: "PMID:22013412"
          method: "single-axon reconstruction (BDA)"
          scope: "rat AV axons in granular retrosplenial cortex"
          quote_key: "903275_698804ed"
        - ref: "PMID:32964131"
          method: "anterograde tracing"
          scope: "rat AV injections — RSC and ACC terminations"
          quote_key: "221820655_60ae409c"
        - ref: "PMID:40593635"
          method: "brain-wide connectomics"
          scope: "adult mouse AV1-AV3"
          quote_key: "279797062_79c8b7ec"
