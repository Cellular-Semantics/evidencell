          scope: "rodent dLGN TC relay cells"
    electrophysiology:
      description: >
        No intrinsic firing properties have been described for relay-mode
        cells specifically. Population-level slice recordings estimate that
        mature (3-week) mouse dLGN relay cells receive functional input from
        only 1-3 RGCs, a convergence consistent with the 1-5 RGC relay mode;
        these estimates are not resolved by integration mode.
      sources:
        - ref: "https://doi.org/10.1186/1749-8104-8-24"
          method: "discussion statement — retinal convergence estimated from EPSP amplitude vs optic-tract stimulus intensity (acute slice whole-cell recording), citing prior work"
          scope: "postnatal mouse dLGN relay cells (all, not mode-resolved) — 1-3 RGC inputs per relay neuron by 3 weeks of age"
          quote_key: "255986294_3197b85b"
    definition_references:
      - "PMID:28231464"
      - "PMID:38386556"
    notes: >
      Single primary study (Rompani et al. 2017); the Wang et al. (2024)
      statement only restates it. Rompani describe input "modes" of
      individually traced principal cells, so whether relay mode marks a
      stable cell type or a connectivity state is unsettled. No mapping
      between convergence modes and X/Y/W-like morphology, core/shell
      location, markers or transcriptomic identity has been established, so
      no morphology, marker or sub-nuclear location is recorded here.
