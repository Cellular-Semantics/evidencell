    evidence:
      - evidence_type: LITERATURE
        supports: SUPPORT
        reference: "PMID:27916729"
        snippet: >-
          In rat, two main GABAergic subpopulations can be distinguished in
          the IGL: neurons synthesizing neuropeptide Y (NPY), which directly
          innervates the suprachiasmatic nuclei, and enkephalinergic cells,
          which connect contralaterally located leaflets
        explanation: >
          Names NPY-synthesising, SCN-innervating neurons as one of two
          GABAergic subpopulations of the IGL. That places this node inside
          the IGL GABAergic neuron population as a proper subset, because the
          enkephalinergic cells are the sibling subset.
        study_type: ELECTROPHYSIOLOGICAL
      - evidence_type: LITERATURE
        supports: SUPPORT
        reference: "PMID:23103793"
        snippet: >-
          The intergeniculate leaflet (IGL) of the lateral geniculate body in
          the rat is a population of GABAergic neurons that can be divided
          into two, anatomically and neurochemically distinct populations. One
          population comprises neuropeptide-Y (NPY)-positive neurons that form
          the geniculohypothalamic tract innervating the suprachiasmatic
          nuclei (SCN)
        explanation: >
          An independent source makes the same division: the IGL GABAergic
          population divides into two distinct populations, and the
          NPY-positive geniculohypothalamic neurons are one of them.
        study_type: MULTIMODAL
