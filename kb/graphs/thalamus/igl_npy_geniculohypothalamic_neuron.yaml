    morphology:
      description: >
        Projection neuron. Its axons form the geniculohypothalamic tract and
        terminate in the suprachiasmatic nucleus. No somatodendritic
        description in the evidence.
      sources:
        - ref: "PMID:23103793"
          method: "statement in source (background)"
          scope: "rat IGL"
          quote_key: "25997395_d6b35c15"
        - ref: "PMID:23432696"
          method: "statement in source (background)"
          scope: "rat IGL"
          quote_key: "36406110_2999c838"
    electrophysiology:
      description: >
        In vitro, all NPY-positive IGL neurons express a marked A-type K+
        current (I_A). In vivo, SCN-projecting IGL neurons fire at a low,
        irregular rate in the light, and most increase firing in darkness. In
        vitro, identified NPY-positive IGL neurons are excited by the
        relaxin-3 receptor agonist R3/I5.
      sources:
        - ref: "PMID:27208616"
          method: "whole-cell patch clamp (acute slice) with NPY identification"
          scope: "rat IGL"
          quote_key: "12882742_30978228"
        - ref: "PMID:23103793"
          method: "in vivo extracellular recording with antidromic identification of SCN projection"
          scope: "rat IGL, urethane anaesthesia, light vs dark"
          quote_key: "25997395_7e370bae"
        - ref: "PMID:23432696"
          method: "in vitro patch clamp with post hoc NPY identification"
          scope: "rat IGL"
          quote_key: "36406110_fb6083ff"
    cl_mapping:
      cl_term:
        id: CL:4072016
        label: "NPY interneuron"
        name_in_source: "NPY interneuron"
      mapping_type: RELATED
      mapping_notes: >
        Shares NPY+ GABAergic identity, but the CL term is an interneuron
        (cortical layers II-III/VI, medial geniculate, inferior colliculus).
        IGL NPY cells are SCN-projecting projection neurons, so the match is
        neither BROAD nor EXACT. The OLS record has no definition references.
        Potential CL new-term contribution under CL:0000617.
    definition_references:
      - "PMID:23103793"
      - "PMID:27916729"
      - "PMID:23432696"
      - "PMID:27208616"
    is_terminal: false
    notes: >
      PARENT TYPE: one of the two main GABAergic subpopulations of the IGL;
      subtype of igl_gabaergic_neuron (see edge below).

      HETEROGENEITY / THANKACHAN CLASSES: Thankachan & Rusak 2005
      (PMID:16207879, quote 9130790_8fa09d39) describe Type II IGL/VLG
      neurons (large amounts of NPY throughout the soma; light responses of
      suppression, complex or none). These likely correspond to this class.
      Their Type III neurons carry patchy/internalised NPY and are interpreted
      as NPY recipients, not producers. Do not assign Type III cells here on
      NPY immunolabel alone. Note the anatomy is "IGL/VLG", not IGL alone.

      PHARMACOLOGY: met-enkephalin hyperpolarises putatively NPY-synthesising
      IGL neurons via mu-opioid receptors (Palus et al., 2017, PMID:27916729,
      quote 27232578_ac034fba). The quote does not isolate this class, so it
      is not included in the electrophysiology description.

      CROSS-SPECIES: in cat, SCN-projecting neurons and NPY-immunoreactive
      processes are found in the medial vLGN, which is proposed as homologous
      to the rodent IGL (Pu & Pickard, 1996, PMID:8836531, quote
      34655061_6fdab967). Not asserted as a location for this rat-defined
      node.

      MARKERS: Npy is the rat-convention symbol for the protein "NPY"
      (neuropeptide Y) named in the sources. Evidence is immunohistochemical
      (protein), not transcript.

      SPECIES: rat.

