    definition_references:
      - "PMID:22131405"
      - "PMID:34473054"
      - "PMID:28965517"
      - "PMID:41814933"
      - "PMID:37913772"
    notes: >
      Pvalb is graded, not discrete: Bakken et al. (2021) find mouse dLGN TC
      neurons cannot be split into discrete transcriptomic types, and core
      neurons show opposing gradients to Calb1 and Necab1, which are enriched
      in the shell. Calb1/Necab1 are therefore lower in core than shell but are
      not shown to be absent, so they are not recorded as negative markers.
      The sources give no positive marker defining core as a class; core is
      delimited as the non-shell (calbindin-negative zone) part of dLGN.
      SUSPECTED HETEROGENEITY: the core is enriched for, but not shown to be
      exclusive to, X- and Y-like relay cells; Krahe et al. (2011) place X-like
      cells "primarily" in the monocular ventral region and Y-like cells in a
      central core that also contains ipsilateral-eye projections, and suggest
      a possible third (posterodorsal monocular) domain, so primary-study and
      review descriptions of core extent differ. The V1 layer-4 target is
      reported for dLGN axons as a whole; that core neurons are the main source
      of the dense L4 projection is inferred, not traced.
