        notes: >
          Derived label: the 682 cells of the published glutamatergic dLGN
          cluster (GEO cluster_label "LGd") that came from the dLGN-core
          dissection (GEO dissection_roi), scored in run
          at_run_20261117_bakken2021_lgn_coreshell_mmc_wmbv1. The paper
          places every dLGN glutamatergic cell in that cluster, so these
          cells are dLGN relay neurons. The label is a DISSECTION
          ENRICHMENT, not a transcriptomic type. PARTIAL, not SUBSET: the
          authors call the microdissections enrichments, and core/shell is a
          graded axis with intermediate cells, so shell relay cells in the
          core dissection cannot be excluded. The same dissection also holds
          cells of neighbouring nuclei (RT, LP, LGv/IGL GABAergic types),
          which sit in other clusters and are excluded from this label.
          Boundaries were drawn against CCFv3, the same core subdivision as
          this node's anatomical_location (MBA:496345668).
          NEGATIVE RESULT: WMBv1 does not resolve core from shell. 97.2% of
          the label's cells land in cluster 2650 TH Prkcd Grin2c Glut_2,
          which also receives 99.7% of "LGd shell". Purity of 2650 within
          Bakken LGd cells is 0.67 (core) vs 0.33 (shell), which only
          reflects the 2:1 core:shell cell ratio; F1 (0.80 at cluster)
          is not evidence of a core-specific WMB type. This matches the
          paper's finding that mouse dLGN relay neurons form one graded type,
          not discrete core and shell types. Label key:
          planning/content-notes/thalamus_bakken2021_labels.md (Q5).
    morphology:
      description: >
        Not a single morphology: the core is occupied by X-like relay cells
        (biconical dendritic fields, tending to be smaller) and Y-like relay
        cells (radially symmetrical dendritic fields), classified from
        quantitative dendritic architecture (Krahe et al., 2011).
      sources:
        - ref: "PMID:22131405"
          quote_key: "16328698_cc12bb7a"
          method: "quantitative analysis of relay-cell dendritic architecture"
          scope: "mouse dLGN relay cells from early postnatal ages"
        - ref: "PMID:28965517"
