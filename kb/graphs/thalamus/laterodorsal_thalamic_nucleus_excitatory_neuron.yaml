    morphology:
      description: >
        Class-level plan of a thalamic projection neuron: a long-range axon
        that leaves the thalamus toward cortex (LD projects to all visual
        cortical areas in mouse), giving collaterals to the reticular nucleus
        on exit, with no recurrent intrathalamic excitatory connections.
        Dendrites and axons are elaborated after migration from the thalamic
        ventricular zone to the mantle zone. No LD-specific somatodendritic
        morphology is reported.
      sources:
        - ref: "PMID:39956708"
          quote_key: "276403731_be403f5d"
          method: "review statement"
          scope: "thalamic projection neurons generally (LD not named)"
        - ref: "PMID:36817644"
          quote_key: "256505257_9adf1766"
          method: "developmental review"
          scope: "developing mouse thalamus, excitatory neurons generally (LD not named)"
        - ref: "PMID:31265129"
          quote_key: "195771773_2251c6d3"
          method: "retrograde tracing"
          scope: "adult mouse LD — cortical projection field"
    definition_references:
      - "PMID:31265129"
      - "PMID:31333412"
      - "PMID:39956708"
      - "PMID:35687680"
    notes: >
      Almost all property evidence here is class-level (thalamic or dorsal
      thalamic glutamatergic projection neurons) applied to LD by inference;
      the only LD-specific statement is its mouse cortical projection to all
      visual areas (PMID:31265129). Slc17a6/VGluT2 marks the class and does
      not distinguish LD from other dorsal thalamic nuclei; no LD-specific
      marker or neuropeptide is reported. Parcellation caveat: many authors
      have regarded the lateral dorsal nucleus as part of the anterior
      thalamic nuclei because of its limbic associations (PMID:24009563,
      quote_key 8320008_654be176); here it is treated as a separate nucleus.
      Suspected heterogeneity: in rat, ventrolateral LD (LDVL) receives
      visual cortical input while medial LD does not (PMID:31265129), not
      resolved into mouse cell populations.
