    morphology:
      description: >
        Somatodendritic morphology not described in the report. GABAergic
        neurons of ventral/lateral thalamic regions including LGv are
        described as either reciprocally connected with thalamic excitatory
        neurons or projecting to subcortical targets such as basal ganglia and
        brainstem; the quote does not separate LGv from RT on this point.
      sources:
        - ref: "https://doi.org/10.1101/2023.05.01.538832"
          method: "statement citing prior anatomy"
          scope: "adult mouse LGv and RT GABAergic neurons (pooled)"
          quote_key: "258464391_a576f421"
