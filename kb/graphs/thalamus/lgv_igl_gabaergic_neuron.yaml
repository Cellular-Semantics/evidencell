    morphology:
      description: >
        Somatodendritic morphology not described in the report. GABAergic
        neurons of ventral/lateral thalamic regions including LGv are
        described as either reciprocally connected with thalamic excitatory
        neurons or projecting to subcortical targets such as basal ganglia and
        brainstem; the quote does not separate LGv from RT on this point.
        From the vLGN GABA report (2026-11-25): Sox14+ (pTH-R-derived)
        neurons in ventral LGv and IGL have projection-neuron morphology,
        with sparse local arborization and a main projection extending
        ventrally (Brock et al., 2022). vLGN neurons have wide dendritic
        arbors that span the length and/or width of the nucleus and are often
        asymmetric, unlike the compact arbors of dLGN (Ciftcioglu et al.,
        2020; recorded vLGN cells, not identified as GABAergic in the quote).
      sources:
        - ref: "PMID:36280260"
          method: "genetic labelling of Sox14+ neurons, single-cell morphology (Fig. 1E–G)"
          scope: "mouse ventral LGv and IGL, Sox14+ neurons"
          quote_key: "247159795_61ac7818"
        - ref: "PMID:32350041"
          method: "dendritic arbor reconstruction of recorded vLGN cells"
          scope: "adult mouse vLGN, both sexes"
          quote_key: "217593649_83051103"
        - ref: "https://doi.org/10.1101/2023.05.01.538832"
          method: "statement citing prior anatomy"
          scope: "adult mouse LGv and RT GABAergic neurons (pooled)"
          quote_key: "258464391_a576f421"
