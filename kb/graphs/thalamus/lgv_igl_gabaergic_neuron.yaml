    is_terminal: false
    notes: >
      CL MAPPING: no CL term found for LGv/IGL GABAergic neuron; cl_mapping
      left empty (CANDIDATE) — potential CL new-term contribution (parent
      would be CL:0000617 GABAergic neuron).

      DEVELOPMENTAL ORIGIN: derived from Shh-responsive rostral thalamic
      progenitors (rTh.Pro, corresponding to the pTH-R domain), distinct from
      the cTh.Pro lineages that give rise to most thalamic glutamatergic
      neurons (Govek et al., 2022; PMID:36476860; Price et al., 2012,
      PMID:22435047, quote 12701386_00a5d63e, describing pTH-R as
      Nkx2.2/Mash1-expressing).

      SUSPECTED HETEROGENEITY: in ABC atlas analyses LGv contributes cells to
      both class 12 HY GABA and class 20 MB GABA (Turner et al., 2025),
      suggesting more than one GABAergic population; LGv and IGL are also
      pooled here and may warrant separate nodes.

      MARKERS: no fine subtype markers are given in the report; defining
      markers left empty. Human embryonic SOX14/NKX2.2 GABAergic neurons of
      rostral-thalamus origin (Kim et al., 2023; PMID:37824646, quote
      261125104_c81e4ce7) are a plausible developmental counterpart but are
      not asserted here.

      ELECTROPHYSIOLOGY: not described in the report.

      SPECIES: species left null; evidence is mouse.
