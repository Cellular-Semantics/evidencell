    electrophysiology:
      description: >
        Receives excitatory synaptic input from layer V corticothalamic
        terminals: optogenetic stimulation of these terminals evoked excitatory
        postsynaptic activity in 10 of 21 vLGNi neurons tested (acute slice).
        Firing properties not characterised in the source passages.
      sources:
        - ref: "PMID:36609305"
          method: "whole-cell patch-clamp with optogenetic stimulation of layer V corticothalamic terminals"
          scope: "mouse vLGNi, acute slice"
          quote_key: "255502436_c6353105"
          notes: >
            Recorded cells are vLGNi neurons; their GABAergic identity is
            inferred from virtually all vLGN neurons being GABAergic, not
            tested per cell in the quote.
          added_by: "evidence_extraction_vlgni_gabaergic_neuron_20261126"
    morphology:
      description: >
        vLGNi is the parvocellular division of vLGN, in contrast to the
        magnocellular vLGNe with its large cells (Monavarfeshani et al., 2017;
        review of rodent cytoarchitecture, cell class not specified in the
        quote).
      sources:
        - ref: "PMID:28965517"
          method: "review of cytoarchitecture (parvocellular vLGNi)"
          scope: "nocturnal rodent vLGN"
          quote_key: "4601077_b2845e93"
    colocated_types:
      - neighboring_type: "vlgne_gabaergic_neuron"
        spatial_relationship: "ADJACENT"
        notes: >
          vLGNi and vLGNe are separated by a small neuron-free, fibre-rich
          neuropil (Monavarfeshani et al., 2017; PMID:28965517, quote
          4601077_b2845e93). vLGNi GABAergic types are transcriptomically
          distinct from those of vLGNe (Sabbagh et al., 2020; PMID:32497303,
          quote 219328889_a1d23e11), and vLGNe is transcriptionally and
          cytoarchitectonically distinct from vLGNi (Govindaiah et al., 2023;
          PMID:36609305, quote 255502436_f820743a).
      - neighboring_type: "lgv_igl_sox14_gabaergic_neuron"
        spatial_relationship: "INTERSPERSED"
        notes: >
          Sox14+ cells are enriched in vLGNi and sparse in vLGNe and IGL
          (Brock et al., 2022; PMID:36280260, quote 247159795_a2cf4a69). The
          two populations overlap; neither is shown to contain the other.
    definition_references:
      - "PMID:32497303"
      - "PMID:36609305"
      - "PMID:28965517"
      - "PMID:39160068"
      - "PMID:36280260"
    notes: >
      SUSPECTED HETEROGENEITY: the sources say transcriptomically distinct
      GABAergic cell types reside in vLGNi (plural; Sabbagh et al., 2020, quote
      219328889_a1d23e11) but neither name nor count them; properties here pool
      them.

      RETINAL INPUT: sources differ in strength of wording - vLGNi receives
      "little, if any" retinal input (Monavarfeshani et al., 2017, quote
      4601077_b2845e93) versus "no retinal input" (Sabbagh et al., 2020, quote
      219328889_ea819292); Brock et al. (2022, quote 247159795_a2cf4a69)
      report fewer, not absent, retinal projections there.

      SOX14: recorded as ENRICHED, not as a pan-vLGNi marker. It is not shown
      that every vLGNi GABAergic neuron expresses Sox14, and Sox14+ cells also
      occur in vLGNe and IGL.

      LOCATION: the sources name the internal vLGN (vLGNi); MBA has no term by
      that name. MBA:316 (LGv medial zone) is used as the Allen counterpart of
      vLGNi, matching MBA:300 (LGv lateral zone) for vLGNe on the sibling node,
      the lateral-medial axis being the one along which vLGN laminae are
      stratified (quote 255502436_f64915a5); the equivalence is a curator
      judgement, not stated in the sources.
