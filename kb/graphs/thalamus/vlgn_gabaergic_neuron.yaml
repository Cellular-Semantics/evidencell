    morphology:
      description: >
        Population includes GABAergic projection neurons (virtually all vLGN
        neurons are GABAergic, including the projection neurons; Govindaiah et
        al., 2023). vLGN neurons have wide dendritic arbors that span the length
        and/or width of the nucleus and are often asymmetric, unlike the compact
        arbors of dLGN (Ciftcioglu et al., 2020; recorded vLGN cells, not
        identified as GABAergic in the quote). Cell size differs by lamina:
        the external vLGN (vLGNe) is magnocellular with large cells, the
        internal vLGN (vLGNi) parvocellular (Monavarfeshani et al., 2017).
      sources:
        - ref: "PMID:36609305"
          method: "statement citing prior work (vLGN projection neurons are GABAergic)"
          scope: "mouse vLGN"
          quote_key: "255502436_f64915a5"
        - ref: "PMID:32350041"
          method: "dendritic arbor reconstruction of recorded vLGN cells"
          scope: "adult mouse vLGN, both sexes"
          quote_key: "217593649_83051103"
        - ref: "PMID:28965517"
          method: "review of cytoarchitecture (magnocellular vLGNe, parvocellular vLGNi)"
          scope: "nocturnal rodent vLGN"
          quote_key: "4601077_b2845e93"
