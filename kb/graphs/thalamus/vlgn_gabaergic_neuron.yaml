    definition_references:
      - "PMID:32497303"
      - "PMID:36609305"
      - "PMID:34610302"
      - "PMID:41814933"
      - "PMID:28965517"
    notes: >
      SUSPECTED HETEROGENEITY: properties here pool transcriptomically distinct
      GABAergic populations of the retinorecipient external vLGN (vLGNe) and
      the non-retinorecipient internal vLGN (vLGNi); vLGNe GABAergic types
      occupy at least four adjacent sublaminae (Sabbagh et al., 2020, quote
      219328889_a1d23e11; Stebbins et al., 2024, quote 271906359_1bfec86c).
      Sources also differ on cell class: Su et al. 2020 (quote
      210870509_2b108b46) state that vLGN contains local GABAergic
      interneurons, while others emphasise GABAergic projection neurons, so
      the population likely mixes local and projection neurons.

      MARKERS: Sox14 is not recorded as a defining marker although Brock et al.
      2022 (quote 247159795_aeeef91c) list it with Gata2 for IGL/LGv: Sox14+
      cells are enriched in vLGNi and sparse in vLGNe (quote
      247159795_a2cf4a69), and mark the dorsal pTH-R-derived component only
      (quote 247159795_d79097dc). Gata2 comes from a statement about pooled
      IGL/LGv citing prior work; whether it covers the ventral prethalamic-
      derived LGv cells is not stated.

      TRANSMITTER CAVEAT: Huang et al. 2020 (quote 226284065_834809d9)
      describe CaMKIIα vLGN/IGL neurons that activate nucleus reuniens
      neurons, an excitatory output that does not fit a GABAergic population;
      the Re AXON_TARGET entry is therefore WEAK. Several projection targets
      (LHb, LPBN) are reported for vLGN/IGL pooled.
