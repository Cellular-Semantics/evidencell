      description: 'Long-range projecting SOM+ interneuron with soma in stratum oriens; projects to medial septum. Distinguished from OLM cell by presence of long-range projection axon.

        '
      sources:
        - ref: PMID:27997999
          method: morphological reconstruction
          scope: rat CA1
          quote_key: 4934764_093c71c6
        - ref: PMID:27997999
          snippet: In addition to these exclusively locally terminating SOM-expressing interneurons, a diverse population of long-range SOM-expressing GABAergic neurons send projections to the medial septum and/or retrohippocampal cortical areas
          support: SUPPORT
          source: cite_traverse_2026_04_10
        - ref: PMID:29250747
          snippet: they form a reciprocal long-range GABAergic septo-hippocampal circuit. Many long-range GABAergic neurons simultaneously form local synapses in CA1 and en passant synapses in several remote areas
          support: SUPPORT
          source: cite_traverse_2026_04_10
        - ref: PMID:38470935
          snippet: Two main types of SOM-containing cells in area CA1 of the hippocampus are oriens-lacunosum-moleculare (OLM) cells and hippocampo-septal (HS) cells. These cell types show many similarities in their soma-dendritic architecture, but they have different axonal targets, display different activity patterns in vivo and are thought to have distinct network functions.
          support: SUPPORT
          source: cite_traverse_2026_04_10
