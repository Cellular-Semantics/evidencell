edges:
  - id: edge_hippocampo_septal_cell_ca1_to_CS20230722_SUPT_0216
    lit_type: hippocampo_septal_cell_ca1
    taxonomy_type: CS20230722_SUPT_0216
    relationship: skos:broadMatch
    evidence:
      - evidence_type: ATLAS_METADATA
        supports: PARTIAL
        explanation: 'Sst Gaba_3 supertype is MGE-derived Sst+ GABA interneuron in hippocampal stratum oriens (CA1 SO: 818 cells, largest single location). HS cell is Sst+ GABAergic with soma in CA1 stratum oriens — both properties match. However, the supertype also captures OLM cells and potentially bistratified cells; the HS-specific feature (long-range projection to medial septum) is not resolvable from atlas metadata. The Reln defining marker of SUPT_0216 is inconsistent with HS cell identity (Reln is an OLM marker). This is a shared supertype with OLM and other SO interneurons, not an HS-specific target.

          '
      - evidence_type: ANNOTATION_TRANSFER
        run_ref: at_run_20260508_yao2021_hpf_ssv4_mmc_wmbv1
        supports: PARTIAL
        target_atlas: WMBv1
        method: MapMyCells (default parameters)
        source_dataset_accession: GEO:GSE185862
        source_cluster_label: Sst
        n_cells_total: 273
        best_mapping_rank: 2
        metrics_by_level:
          - taxonomy_level: CLASS
            taxonomy_rank: 3
            best_target_name: 07 CTX-MGE GABA
            best_target_accession: CS20230722_CLAS_07
            f1_score: 0.4133738601823709
            n_cells_mapped: 272
            median_bootstrap: 1.0
            coverage: 0.9963369963369964
            purity: 0.2607861936720997
          - taxonomy_level: SUBCLASS
            taxonomy_rank: 2
            best_target_name: 053 Sst Gaba
            best_target_accession: CS20230722_SUBC_053
            f1_score: 0.9833024118738404
            n_cells_mapped: 265
            median_bootstrap: 1.0
            coverage: 0.9888059701492538
            purity: 0.977859778597786
        explanation: 'MapMyCells local annotation transfer of Yao 2021 (GSE185862) SSv4 Sst subclass (n=273 HIP cells) onto WMBv1. Sst cells map strongly to SUBC_053 (F1=0.983) at SUBCLASS level. At SUPERTYPE level, SUPT_0216 (Sst Gaba_3) receives 83/273 Sst cells (F1=0.488, purity=1.0). PARTIAL: hippocampo-septal cells are Sst+ long-range projection neurons; the Sst SSv4 label is mixed and cannot discriminate this cell type. SUPT_0219 (Sst Gaba_6) is the dominant Sst supertype target (F1=0.759) and may be a better correspondent for some Sst subtypes. Yao 2021 SSv4 ''Sst'' subclass (n=273 HIP cells) encompasses multiple Sst interneuron types (OLM, bistratified, hippocampo-septal, oriens-oriens, and others); subtype resolution requires a dataset with morphologically identified Sst-IN labels.'
        f1_source_relpath: at_results.yaml
    property_comparisons:
      - property: nt_type
        node_a_value: GABAergic
        node_b_value: not asserted
        alignment: NOT_ASSESSED
        notes: NT data missing on one side.
      - property: location
        node_a_value: CA1 stratum oriens [UBERON:0014552]
        node_b_value: Hippocampal formation [MBA:1089] count_100um=2145 [painted]; Field CA1 [MBA:382] count_100um=1559 [painted]; Field CA1, stratum oriens [MBA:399] count_100um=1463 [painted]
        alignment: CONSISTENT
        notes: 'region_fraction_100um: 0.539; strict region_fraction: 0.305; region_evidence: SELF'
      - property: marker_Sst
        node_a_value: Sst — defining marker
        node_b_value: 'Sst: 11.44; cohort_pct 0.905; child-coverage 1.000'
        alignment: CONSISTENT
        notes: val=11.44; cohort percentile 0.905; child-cluster coverage 1.000
      - property: neuropeptide_Sst
        node_a_value: Sst — neuropeptide (classical)
        node_b_value: 'Sst: 11.44; cohort_pct 0.905; child-coverage 1.000'
        alignment: CONSISTENT
        notes: val=11.44; cohort percentile 0.905; child-cluster coverage 1.000
    caveats:
      - caveat_type: AMBIGUOUS_MAPPING
        description: "SUPT_0216 is shared across OLM, HS, and bistratified CA1-SO Sst+ interneurons; independent OLM cluster annotation transfer (Winterer 2019 / GSE124847) maps the majority of OLM cells to this supertype. HS-specific identity is not isolable here.\n"
      - caveat_type: MARKER_NOT_SPECIFIC
