  morphology:
    description: 'Large horizontally-oriented soma at oriens/alveus border. Horizontal
      dendrites in stratum oriens, densely decorated with long spines. Axon projects
      vertically through pyramidale and radiatum, ramifies extensively in stratum
      lacunosum-moleculare with dense terminal arborizations and heavily packed varicosities.
      Some axon collaterals with boutons in stratum oriens.

      '
    sources:
