      - caveat_type: OTHER
        description: "Legacy edge outside the current Stage A top-50 cohort at rank 0; property_comparisons not refreshed (see #111).\n"
    unresolved_questions:
      - "Is Sst expression in this Lamp5 Lhx6 cluster biologically meaningful? OLM morphology/ephys present?"
