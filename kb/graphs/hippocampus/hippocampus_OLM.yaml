  electrophysiology:
    description: 'Regular-to-fast spiking with tonic or mildly adapting firing. Pronounced
      sag response to hyperpolarizing current (Ih via HCN2 h-channels). Theta spiking
      resonance. High input resistance, slow membrane time constants. Anti-Hebbian
      LTP dependent on Ca2+-permeable AMPA receptors. Phase-locked to theta rhythms
      (4-12 Hz).

      '
    sources:
    - ref: PMID:33093823
