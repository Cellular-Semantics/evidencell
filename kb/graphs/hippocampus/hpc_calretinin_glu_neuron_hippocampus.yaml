    caveats:
      - caveat_type: AMBIGUOUS_MAPPING
        description: "CS20230722_SUPT_0135 reference cells strongly express Reln and Trp73 alongside Calb2, consistent with Cajal-Retzius identity. Classical Cajal-Retzius cells are developmentally transient and may not correspond to the adult SLM/OML calretinin-positive glutamatergic neurons of the classical literature; the WMBv1 \"HPF CR\" designation may specifically label Cajal-Retzius remnants captured during adult brain profiling.\n"
      - caveat_type: OTHER
        description: "CS20230722_SUPT_0135 has n=5 WMBv1 reference cells total (1 per child cluster) — the smallest representation of any HPF Glut supertype. Atlas-side expression means (Calb2 marker_Calb2 CONSISTENT, val 4.86, cohort percentile 0.848) and marker comparisons rest on a statistically thin reference set regardless of how cleanly the annotation transfer F1 lands.\n"
      - caveat_type: OTHER
        description: "Calb2 on the classical node has no primary citation (defining_markers entry carries an empty refs list). The marker concordance with WMBv1 atlas precomputed expression is therefore unanchored on the literature side; curator review recommended before treating Calb2 alignment as supporting evidence in further mappings.\n"
    unresolved_questions:
      - Is SUPT_0135 a Cajal-Retzius remnant population or does it represent the adult SLM/OML Calb2+/Slc17a8+ glutamatergic neurons described in the literature? ISH validation of Trp73 and Calb2 co-expression in adult SLM/OML would resolve this.
      - Why is Slc17a8 (VGluT3) absent from SUPT_0135 given that SLM glutamatergic neurons are described as VGluT3+? Is VGluT3 expression limited to a subset of Calb2+ SLM cells, or is the classical node definition too broad?
      - Is CS20230722_SUPT_0135 a Cajal-Retzius remnant population or does it represent the adult SLM/OML Calb2+/Slc17a8+ glutamatergic neurons described in the literature?
      - Why is Slc17a8 (VGluT3) absent from CS20230722_SUPT_0135 given that SLM glutamatergic neurons are described as VGluT3+? Is VGluT3 expression limited to a subset of Calb2+ SLM cells, or is the classical node definition too broad?
    proposed_experiments:
      - Annotation transfer from a dataset of validated adult Calb2+ SLM/OML glutamatergic neurons (i.e. not Cajal-Retzius-labelled) against WMBv1 with MapMyCells; target F1 >= 0.80 at SUPERTYPE level. Output AnnotationTransferEvidence on this edge; resolves open question 1 by distinguishing the Cajal-Retzius and adult interpretations of CS20230722_SUPT_0135.
      - Inspect MERFISH soma positions for CS20230722_SUPT_0135 cells in WMBv1 to confirm stratum lacunosum-moleculare / outer molecular layer placement at single-cell resolution beyond the painted-region rollup (region_fraction_100um 0.823 currently on the edge).
      - Targeted literature search ("calretinin SLM glutamatergic mouse" and "VGluT3 SLM hippocampus") to anchor Calb2 (and clarify Slc17a8 status) to a primary study on laminar-position-confirmed adult cells.
