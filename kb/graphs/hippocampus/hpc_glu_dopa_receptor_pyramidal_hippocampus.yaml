  Nodes are CLASSICAL_MULTIMODAL stubs. Defining markers are based on established

  transcriptomic and anatomical literature; ncbi_gene_ids and per-marker sources

  require primary literature verification. Edges at LOW/MODERATE confidence from

  atlas metadata and annotation transfer (Hochgerner 2018 / CCN20230722).

  '
