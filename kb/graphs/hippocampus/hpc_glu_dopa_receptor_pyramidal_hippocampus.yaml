edges:
  - id: edge_hpc_glu_dopa_receptor_pyramidal_hippocampus_to_supt_0069
    lit_type: hpc_glu_dopa_receptor_pyramidal_hippocampus
    taxonomy_type: CS20230722_SUPT_0069
    relationship: skos:closeMatch
    evidence:
      - evidence_type: ANNOTATION_TRANSFER
        run_ref: at_run_20260508_yao2021_hpf_ssv4_mmc_wmbv1
        supports: PARTIAL
        explanation: 'SUPT_0069 (0069 CA1-ProS Glut_1) is the highest-scoring candidate for ventral CA1 pyramidal cells in WMBv1 (shared target with ca1_pc_hippocampus). Yao 2021 CA1-ProS cells (n=1704) map to SUPT_0069 with 59.3% purity and F1=0.744. The ventral CA1 / ventral subiculum location of hpc_glu_dopa_receptor_pyramidal cells suggests they are a subpopulation within CA1-ProS or SUB-ProS supertypes. Without Drd1/Drd2-specific expression data in the atlas, it is not possible to determine which specific supertype(s) capture the dopamine receptor-expressing subset. This edge is provisional and should be upgraded once AT evidence from a ventral hippocampus dataset with D1R/D2R labelling is available.

          '
        source_dataset_accession: GEO:GSE185862
        source_cluster_label: CA1-ProS (Yao 2021 subclass)
        n_cells_total: 1704
        target_atlas: WMBv1 (CCN20230722)
        method: MapMyCells local (precomputed_stats CCN20230722)
        metrics_by_level:
          - taxonomy_level: SUPERTYPE
            best_target_name: 0069 CA1-ProS Glut_1
            f1_score: 0.744
            n_cells_mapped: 1011
            taxonomy_rank: 1
            best_target_accession: CS20230722_SUPT_0069
            coverage: 0.593
            purity: 0.999
        best_mapping_rank: 1
    property_comparisons:
      - property: nt_type
        node_a_value: glutamatergic
        node_b_value: glutamatergic (SUBC_016 CA1-ProS Glut)
        alignment: CONSISTENT
      - property: location
        node_a_value: ventral CA1 / ventral subiculum (UBERON:0002421)
        node_b_value: SUPT_0069 in CA1-ProS Glut subclass (dorsal + ventral CA1)
        alignment: APPROXIMATE
        notes: 'The dopamine receptor-expressing cells are specifically described in ventral hippocampus (Godino et al., 2023), while SUPT_0069 captures the full CA1-ProS range (dorsal + ventral). WMBv1 does not clearly separate dorsal/ventral CA1 at the supertype level without MERFISH SOMA location breakdown.

          '
      - property: marker_Drd1
        node_a_value: defining marker Drd1 (D1 dopamine receptor)
        node_b_value: not listed in SUPT_0069 defining markers
        alignment: DISCORDANT
        notes: Drd1 mean_expression=0.09 in SUPT_0069 — effectively absent (precomputed_stats.h5, supertype level)
      - property: marker_Drd2
        node_a_value: defining marker Drd2 (D2 dopamine receptor)
        node_b_value: not listed in SUPT_0069 defining markers
        alignment: DISCORDANT
        notes: Drd2 mean_expression=0.02 in SUPT_0069 — effectively absent (precomputed_stats.h5, supertype level)
    caveats:
      - caveat_type: AMBIGUOUS_MAPPING
        description: "The dopamine receptor-expressing pyramidal cells are described as a ventral-specific subpopulation (Godino et al., 2023) within vCA1/vSubiculum. The curation decision (distinct type vs. property annotation on existing nodes) is unresolved. If resolved as a property annotation, this edge should be replaced by Drd1/Drd2 expression annotations on the CA1 and subicular pyramidal cell nodes.\n"
      - caveat_type: DISCORDANT_ANATOMY
        description: "The classical type is specifically ventral (vCA1 / vSub) but CS20230722_SUPT_0069 captures the full dorsoventral CA1-ProS range. WMBv1 does not split dorsal vs. ventral CA1 at the supertype level without per-cell MERFISH soma breakdown.\n"
      - caveat_type: MARKER_NOT_SPECIFIC
        description: "Drd1 (mean=0.09) and Drd2 (mean=0.02) on CS20230722_SUPT_0069 are effectively absent at supertype-level mean expression. This is consistent with sparse-subpopulation dilution but precludes marker-based confirmation at this taxonomy level.\n"
      - caveat_type: OTHER
        description: "Edge fell outside the current Stage A top-50 cohort and property_comparisons were not refreshed in the most recent discovery pass; curator review recommended (#111).\n"
    unresolved_questions:
      - 'Is hpc_glu_dopa_receptor_pyramidal_hippocampus a distinct cell type or a property of vCA1/vSubiculum pyramidal cells? See curation_decisions_needed in validation_notes.json.

        '
      - 'Does any CA1-ProS supertype specifically enrich for ventral CA1 (which would provide a candidate for Drd1/Drd2-expressing cells)?

        '
      - "SUPT_0069 fell outside current Stage A top-50 and warrants curator review (#111); the existing edge's property_comparisons were not refreshed in the most recent discovery pass.\n"
    proposed_experiments:
      - "Run add-expression for Drd1 and Drd2 on the CA1-ProS supertypes (CS20230722_SUPT_0069 through SUPT_0074) and their child clusters to identify any ventral-enriched supertype or cluster whose Drd1/Drd2 mean is in the top decile of the CA1-ProS cohort.\n"
      - "Targeted MapMyCells annotation transfer from a ventral hippocampus dataset with Drd1-Cre and/or Drd2-Cre driver labelling onto WMBv1 (CCN20230722); target F1 >= 0.50 at supertype and F1 >= 0.30 at cluster level on the D1R+/D2R+ pyramidal subset; output AnnotationTransferEvidence replacing the current CA1-ProS-wide AT signal.\n"
      - "Curator review of validation_notes.json curation decision — distinct classical type vs. Drd1/Drd2 expression annotation on the existing vCA1/vSubiculum pyramidal cell nodes.\n"
    mapping_justification: semapv:ManualMappingCuration
    mapping_cardinality: "1:n"
    confidence: LOW
    confidence_score: 0.35
    rationale: "[tier:STRONGEST] CA1-ProS annotation transfer (F1=0.74 at supertype on at_run_20260508_yao2021_hpf_ssv4_mmc_wmbv1) anchors CS20230722_SUPT_0069 as the highest-confidence CA1-pyramidal supertype, but 0 of 2 markers CONSISTENT — Drd1 mean=0.09 and Drd2 mean=0.02 on the supertype are effectively absent. The discordance is consistent with the classical type being a sparse ventral subpopulation diluted by dorsal CA1-ProS at the supertype level (Godino et al., 2023 [1]).\n"
    reconciliation_note: "close vs. broad — the AT signal targets CA1-ProS broadly without Drd1/Drd2-labelled cells, so the supertype assignment cannot distinguish whether ventral D1R/D2R pyramidals enrich for any specific CA1-ProS child. closeMatch with 1:n is the cautious call; a Drd1/Drd2-targeted AT run would either upgrade to closeMatch 1:1 on a single child cluster or push the predicate to broadMatch.\n"
