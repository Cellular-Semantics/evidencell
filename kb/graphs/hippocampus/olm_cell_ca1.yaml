    notes: |-
      Chamberland 2024 Chrna2-IN subfamily. Defined by combinatorial Sst-Flp;Chrna2-Cre genetics. The set of cells captured under this label is a subset of the canonical OLM population (olm_cell_ca1 in hippocampus_GABAergic_interneurons.yaml); cross-mapping edge to olm_cell_ca1 should be added when both graphs are co-loaded. Per Chamberland 2024, Chrna2-IN somata sit deep in O/A and project to CA1 stratum lacunosum-moleculare (canonical OLM projection).

      Defined by transgene, not by morphology: Sst+/Chrna2+ cells captured by the Chrna2-Cre
      line (Chamberland 2024, PMID:38640347). No morphological reconstruction is recorded on
      this node, so its status as an O-LM subset rests on marker identity and laminar position
      (deep in oriens/alveus) rather than on the oriens-soma / SLM-axon criterion that defines
      olm_cell_ca1.

      Note Chrna2-Cre is the line most of the older O-LM literature used, so this population
      is close to what that literature called O-LM outright. Whether it is a proper subset of
      olm_cell_ca1 or effectively coextensive with it is open -- the atlas evidence does not
      settle it, since this node maps best to CS20230722_CLUS_0771 while olm_cell_ca1 maps
      best to CS20230722_CLUS_0768, two different clusters under the same supertype.

