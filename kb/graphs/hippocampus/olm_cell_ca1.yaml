    notes: |-
      No CL term exists for OLM cell. CL:4023017 'sst GABAergic interneuron' is nearest superclass but does not capture OLM-specific morphology. Molecularly heterogeneous: contains a PV+ subpopulation with distinct theta vs gamma coupling. Npy expression is consistent in mouse but absent in rat (species difference). Ndnf::Nkx2-1 intersection selectively targets OLM cells. At least 3 Chrna2+ subclusters identified.
      [cite_traverse_2026_04_10] PMID:19176803: horizontal interneurons in stratum oriens of the hippocampal CA1 area are often studied as a single group of interneurons, they include several cell types in addition to O-LM cells
      [cite_traverse_2026_04_10] PMID:20463218: dendrite-targeting inhibitory interneurons, such as oriens lacunosum-moleculare (O-LM) cells, regulate dendritic Na+ or Ca2+ spikes and synaptic plasticity by innervating dendritic domains of principal neurons

      ---
      [Migrated from asta-ingest stub `olm_hippocampus` on 2026-06-10]

      HETEROGENEITY: The OLM class contains molecularly heterogeneous subpopulations. Zhang et al. (2025) report a PV-positive OLM subset that fires in the gamma range (vs theta for SST-only OLM cells). Thulin et al. (2025) identify three Sst/Pnoc subclusters with differential dorsal-ventral connectivity. These may warrant separate nodes in future iterations. TRPV1 expression (Hurtado-Zavala et al., 2017) is reported in a subpopulation but not confirmed by other sources. Lacaille 1987 described O/A interneurons with axons branching in stratum oriens and pyramidale (not SLM) — these are likely a distinct population from canonical O-LM cells. Species: most morphology data from rat; marker/transgenic data from mouse. Cross-species validation pending.

      Definition history. O-LM has been characterised through successive methods, each
      potentially narrowing the last, and the subtypes recorded below are partly a record of
      what each method could capture rather than established biological subdivisions.

        morphology  (Cajal 1893 onwards) soma and horizontal dendrites in stratum oriens,
                    axon arborising in stratum lacunosum-moleculare. The defining criterion.
        markers     SST, with NPY, TRPV1, mGluR1, Reln reported variously.
        transgene   Chrna2-Cre (Leao 2012) and intersectional lines (Chamberland 2024) made
                    the type easy to target, and each line defines a population by what it
                    labels rather than by morphology.

      Reading the transgenic literature matters here. Claims that Chrna2 is 'a specific marker
      for OLM' (PMID:29487503, PMID:31420995, PMID:23042082) are targeting claims -- the line
      reliably labels OLM cells -- not completeness claims that every OLM cell is Chrna2+.
      Chamberland 2024 (PMID:38640347) reports a second, Ndnf::Nkx2-1-defined OLM population,
      which is compatible with the earlier work under that reading but not under the stronger
      one. Treat this node as the morphologically-defined general type, of which the linked
      subfamilies are candidate subsets.

      At least three further partitions of O-LM are documented in the literature and are NOT
      yet represented here: Winterer 2019 Sst-OLM vs Htr3a-OLM (Htr3a in ~10% of O-LM cells;
      pooled in at_run_20260408_winterer_olm_mmc_wmbv1 rather than recorded as structure);
      a PV-co-expressing subset contributing to gamma rather than theta (Fernandez 2024,
      Que 2021); and dorsoventral differences in presynaptic input (Thulin 2025). Whether any
      of these coincide with the Chamberland subfamilies is unresolved.
