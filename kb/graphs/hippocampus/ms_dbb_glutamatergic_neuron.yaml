    morphology:
      description: Soma in medial septum/diagonal band of Broca; account for ~23% of MS projections to hippocampus; project preferentially to hippocampal interneurons with somata in stratum oriens near the alveus.
      sources:
        - ref: PMID:29250747
          method: review
          scope: rodent septohippocampal
          quote_key: 21358766_0c242fdc
        - ref: PMID:29250747
          method: review
          scope: rodent septohippocampal
          quote_key: 21358766_01840c4a
    electrophysiology:
      description: 'Highly heterogeneous firing in four subtypes: (1) fast-spiking with little AP accommodation, occasional spontaneous firing, sometimes pronounced Ih sag; (2) cluster-firing (8-14 Hz) with subthreshold membrane oscillations and strong AP accommodation — UNIQUE to glutamatergic MS-DBB neurons; (3) burst-firing (distinct from GABAergic burst pattern) with little/no sag; (4) slow-firing with broad accommodating APs. Can spontaneously fire rhythmically at theta frequencies. Activity rises before locomotion onset and during running.'
      sources:
        - ref: PMID:29250747
          quote_key: 21358766_0c242fdc
        - ref: PMID:21106833
          quote_key: 15897856_d5424e2a
        - ref: PMID:21106833
          quote_key: 15897856_5e7429ed
    definition_references:
      - PMID:29250747
      - PMID:21106833
      - PMID:32132227
    is_terminal: false
    notes: 'Four electrophysiologically distinct VGluT2+ subgroups (fast-spiking, cluster-firing, burst-firing, slow-firing). Cluster firing is a unique electrophysiological marker for glutamatergic (not GABAergic) MS-DBB neurons. Soma is extrahippocampal — node retained because the cell projects into hippocampal formation; UBERON soma assignment is approximate (hippocampal formation used as nearest umbrella term).


      CL mapping note: No CL term for medial septal / diagonal band of Broca glutamatergic neuron. CL:0000679 (glutamatergic neuron) too broad. Potential CL contribution.'
