        explanation: 'Lamp5 Lhx6 Gaba_1 supertype is MGE-derived (Lhx6+) Lamp5+ GABA interneuron. Ivy cells are nNOS+ (Nos1+) Lamp5+ GABAergic interneurons, soma near stratum pyramidale, MGE-derived (Lhx6+ expected). The supertype markers include Lamp5 and Lhx6 as DEFINING_SCOPED, consistent with Ivy cell identity. Tricoire 2011 and Bhatt 2023 confirm Ivy cells are NGFC.M type (Lhx6+/Lamp5+/Id2+). However, anatomy shows CA3 SO (179), CA3 SR (235), DG mol (263) with no CA1 stratum pyramidale — Ivy cell preferred location in CA1 SP is absent.

          '
