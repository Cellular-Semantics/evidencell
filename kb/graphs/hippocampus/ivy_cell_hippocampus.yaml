    rationale: "[tier:STRONGEST] Two independent annotation-transfer runs converge here: the Yao 2021 hippocampal-formation SMART-Seq v4 Lamp5 source maps to CS20230722_SUPT_0203 with F1=0.90 (run_ref at_run_20260508_yao2021_hpf_ssv4_mmc_wmbv1; purity 0.989, 711/868 cells), and the Harris 2018 Cacna2d1.Lhx6.Reln class maps with F1=0.81 (run_ref at_run_20260512_harris_class_mmc_wmbv1; 246/3663 cells). Atlas precomputed expression confirms 3 of 3 defining markers (Nos1=7.78, Npy=4.62, Lamp5=6.73; Lamp5 atlas tag DEFINING_SCOPED) and 3 of 3 negative markers below their atlas-defining thresholds at the supertype mean. Location is DISCORDANT (region_fraction_100um: 0.090) — supertype somata skew to DG and Field CA3 (MBA:463) rather than CA1 stratum pyramidale; reading this as atlas-side undersampling of CA1 SP Lamp5 Lhx6 cells given the AT convergence, not as a true off-target call. The supertype-level call is broadMatch-like in shape (one classical type to a supertype whose in-graph child CS20230722_CLUS_0731 carries supporting marker evidence but no cluster-level AT signal) so committing closeMatch + 1:n rather than exactMatch.\n"
    reconciliation_note: "Ivy and stratum-lacunosum-moleculare neurogliaform cells (Tricoire 2010, PMID:20147544) share neurochemical and developmental properties; the parallel edge_neurogliaform_cell_hippocampus_to_CS20230722_SUPT_0203 maps to the same supertype. Whether they are transcriptomically distinct within SUPT_0203 is an open question (see unresolved_questions).\n"
