        explanation: 'Vip Gaba_7 supertype has Vip as a DEFINING marker consistent with IS-2 and IS-3 subtypes (VIP+/CR+). Hippocampal anatomy present across multiple layers: CA1 SO (24), CA3 SO (25), CA1 SR (26), CA3 SR (17), CA1 SP (11), CA3 SP (23). The multi-laminar CA1 distribution matches IS cell soma locations spanning SO, SR, and SLM. However, the classical IS interneuron node covers three subtypes (IS-1: CR+/VIP-, IS-2: VIP+, IS-3: VIP+/CR+) — only IS-2 and IS-3 would map to a VIP supertype. Qrfpr, Stk32a, Igfbp4 are additional defining markers with no correspondence established in classical IS literature.

