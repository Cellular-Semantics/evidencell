          quote_key: 259953057_09a50fe2
        - ref: PMID:24671999
          snippet: IS3 cells in the mouse hippocampus were similar to those described originally in the rat hippocampus. These cells innervated heavily the O/A border, although occasional axonal branches were found in the RAD and PYR. Their dendritic arbors were often unipolar (47% of cells), suggesting that these cells are preferentially recruited through the activation of the Schaffer collaterals
          support: SUPPORT
          source: cite_traverse_2026_04_10
        - ref: PMID:24671999
          snippet: In several cases (n ϭ 5 slices/2 animals), the dendrites of 2-3 CR-positive cells of this subtype were found to form dendro-dendritically connected clusters (Fig. 6C1, top inset), which is a hallmark of the type I interneuron-specific (IS1) interneuron described previously in the rat CA1 hippocampus
          support: SUPPORT
          source: cite_traverse_2026_04_10
    electrophysiology:
      description: Not extensively characterized in available reference set
      sources:
        - ref: PMID:24671999
          snippet: This subtype of IS cells exhibited a remarkable anatomical diversity, with cell bodies that occupied different layers and an axon that projected mostly within the RAD and PYR. Similar to IS3 cells, IS1 cells exhibited a high input resistance but were more heterogeneous in terms of firing properties. Therefore, more than one subtype of putative IS1 cells is likely to be found within this group of CR-positive interneurons.
          support: SUPPORT
          source: cite_traverse_2026_04_10
