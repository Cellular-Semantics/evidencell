    notes: 'Three subtypes: IS-1 (CR+), IS-2 (VIP+), IS-3 (CR+/VIP+). Majority of VIP subclass are IS cells. Ephys not extensively characterized. CL mapping only covers VIP+ subtypes.

      [cite_traverse_2026_04_10] PMID:23162426: a subgroup of interneurons, the so-called interneuron-specific (IS) interneurons, specializes in innervating exclusively other GABAergic cells

      '
    morphology:
      description: 'Selectively contacts other interneurons rather than pyramidal cells; plays disinhibitory role in circuit. Identified by ultrastructural evidence of selective interneuron targeting.

        '
      sources:
