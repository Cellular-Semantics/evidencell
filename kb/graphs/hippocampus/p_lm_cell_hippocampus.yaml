      - evidence_type: ATLAS_METADATA
        supports: WEAK
        explanation: 'The P-LM cell has its soma in stratum pyramidale and is SST+. SUPT_0219 (Sst Gaba_6) is SST-subclass and has defining Sst marker. However, the atlas anatomy for SUPT_0219 is predominantly CA3 (CA3 SO 305, CA3 lucidum 99, CA3 SR 167, CA3 pyr 261) with no CA1 representation. The P-LM cell is a CA1 type. This anatomical mismatch weakens the candidate assignment. Assignment is retained as a placeholder pending richer evidence; the SST+ stratum pyramidale signature provides weak but non-zero support.

