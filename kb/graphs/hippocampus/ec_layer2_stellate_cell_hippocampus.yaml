    caveats:
      - caveat_type: AMBIGUOUS_MAPPING
        description: "The Yao 2021 L2 IT ENTl subclass may include both Reln+ stellate cells and minor non-stellate populations in lateral EC layer II; the PIR component of SUPT_0042's name reflects a shared transcriptomic signature with piriform cortex and the supertype catchment extends into piriform/olfactory areas (region_fraction_100um=0.23).\n"
      - caveat_type: SINGLE_DATASET
        description: "Annotation transfer evidence comes from a single Yao 2021 SSv4 dataset (GEO:GSE185862); independent replication with a stellate-specific source cohort would strengthen the call.\n"
    unresolved_questions:
      - 'Does SUPT_0042 expression include a significant piriform cortex component in the WMBv1 MERFISH data, or is the PIR-ENTl designation primarily driven by transcriptomic similarity rather than spatial overlap?

        '
      - 'Is Reln expressed in SUPT_0042 at the level expected for stellate cells? Running add-expression for Reln on CCN20230722 precomputed stats would confirm.

        '
      - "Does the classical Reln+ stellate population distribute across both lateral EC supertypes (SUPT_0042 family) and medial EC supertypes (SUPT_0051/0052/0053 families)?\n"
    proposed_experiments:
