            f1_score: 0.9833024118738404
            n_cells_mapped: 265
            median_bootstrap: 1.0
            coverage: 0.9888059701492538
            purity: 0.977859778597786
        explanation: MapMyCells local annotation transfer of Yao 2021 (GSE185862) SSv4 Sst subclass (n=273 HIP cells) onto WMBv1. SUPT_0216 (Sst Gaba_3) receives 83/273 Sst cells (F1=0.488, purity=1.0). R-LM (radiatum-lacunosum-moleculare) cells are interneurons residing near the stratum radiatum/lacunosum boundary; if Sst+, SUPT_0216 is a plausible candidate. PARTIAL because the Sst subclass label is mixed; SUPT_0219 (Sst Gaba_6) is the dominant Sst target (F1=0.759). Yao 2021 SSv4 'Sst' subclass (n=273 HIP cells) encompasses multiple Sst interneuron types (OLM, bistratified, hippocampo-septal, oriens-oriens, and others); subtype resolution requires a dataset with morphologically identified Sst-IN labels.
