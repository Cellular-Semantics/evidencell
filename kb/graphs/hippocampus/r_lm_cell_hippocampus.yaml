edges:
  - id: edge_r_lm_cell_hippocampus_to_CS20230722_SUPT_0216
    lit_type: r_lm_cell_hippocampus
    taxonomy_type: CS20230722_SUPT_0216
    relationship: evidencell:UncertainRelationship
    evidence:
      - evidence_type: ATLAS_METADATA
        supports: PARTIAL
        explanation: 'Sst Gaba_3 supertype has strong CA1 stratum oriens representation (818 cells) and Sst-subclass identity, consistent with the SST+ R-LM cell soma location in stratum oriens. Reln is a defining marker of SUPT_0216, which may distinguish it from OLM cells (Chrna2+/Reln+). However, R-LM cells were identified in GIN transgenic mice in a single study (Oliva et al. 2000) without transcriptomic characterisation, so the match is speculative. The Sst Gaba_3 supertype is also the primary candidate for OLM cells (based on MapMyCells annotation transfer with Chrna2-Cre data), meaning this supertype likely contains multiple SST+ stratum oriens types.

          '
      - evidence_type: ANNOTATION_TRANSFER
        run_ref: at_run_20260508_yao2021_hpf_ssv4_mmc_wmbv1
        supports: PARTIAL
        target_atlas: WMBv1
        method: MapMyCells (default parameters)
        source_dataset_accession: GEO:GSE185862
        source_cluster_label: Sst
