name: Chamberland 2024 Sst-IN subfamilies → WMBv1
description: 'Four functional sub-populations of hippocampal Sst-expressing interneurons
  defined by Chamberland et al. 2024 (PMID:38640347) using intersectional Cre/Flp
  genetics. Each subfamily targets a distinct postsynaptic partner and occupies a
  characteristic depth in stratum oriens / alveus.

  Promoting these from a re-labelling scheme (within at_run_20260512_chamberland_subfamily_mmc_wmbv1)
  to first-class CellTypeNodes lets us cite Chamberland 2024 subfamilies from KB mapping
  edges directly, alongside classical-morphology types (olm_cell_ca1, bistratified,
  etc.) in kb/graphs/hippocampus/hippocampus_GABAergic_interneurons.yaml.

  '
