    OLM population (olm_cell_ca1 in hippocampus_GABAergic_interneurons.yaml); cross-mapping
    edge to olm_cell_ca1 should be added when both graphs are co-loaded. Per Chamberland
    2024, Chrna2-IN somata sit deep in O/A and project to CA1 stratum lacunosum-moleculare
    (canonical OLM projection).

    '
