    notes: >
      Chamberland 2024 Sst::Nos1-IN subfamily. Long-range-projecting
      Sst interneurons localised to CA1 stratum oriens / alveus, with
      axons projecting to medial septum and contralateral hippocampus
      (canonical hippocampo-septal / back-projection identity).
      Maps to WMBv1 SUPT_0241 / CLUS_0859 (Sst Chodl Gaba_4) with
      F1=0.97 — biologically consistent because the Sst Chodl branch
      contains long-range-projecting Sst types, not the cortical Sst
      Gaba subclass. Note the **cross-supertype** mapping (Sst Chodl
      ≠ Sst Gaba). Likely overlaps the classical
      hippocampo_septal_cell_ca1 type in
      hippocampus_GABAergic_interneurons.yaml.

