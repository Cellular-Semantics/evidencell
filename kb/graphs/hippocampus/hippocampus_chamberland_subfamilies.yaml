# Hippocampus Chamberland 2024 functional Sst-IN subfamilies → WMBv1
# Source: Chamberland et al. 2024 (PMID:38640347, DOI:10.1073/pnas.2306382121)
# AT runs: at_run_20260512_chamberland_subfamily_mmc_wmbv1
# Phase 2 plan: planning/at_blind_region_drop_findings_2026-05-12.md § g, h
# Created: 2026-05-12

name: "Chamberland 2024 Sst-IN subfamilies → WMBv1"
description: >
  Four functional sub-populations of hippocampal Sst-expressing interneurons
  defined by Chamberland et al. 2024 (PMID:38640347) using intersectional
  Cre/Flp genetics. Each subfamily targets a distinct postsynaptic partner
  and occupies a characteristic depth in stratum oriens / alveus.

  Promoting these from a re-labelling scheme (within
  at_run_20260512_chamberland_subfamily_mmc_wmbv1) to first-class
  CellTypeNodes lets us cite Chamberland 2024 subfamilies from KB
  mapping edges directly, alongside classical-morphology types
  (olm_cell_ca1, bistratified, etc.) in
  kb/graphs/hippocampus/hippocampus_GABAergic_interneurons.yaml.

brain_region:
  id: UBERON:0005371
  label: "hippocampus stratum oriens"
  name_in_source: "stratum oriens / alveus"

target_atlas: "WMBv1"

species:
  id: NCBITaxon:10090
  label: Mus musculus
  name_in_source: "Mus musculus"

creation_date: "2026-05-12"


