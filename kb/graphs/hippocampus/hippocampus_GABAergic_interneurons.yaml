          source: cite_traverse_2026_04_10
        - ref: PMID:24671999
          snippet: In several cases (n ϭ 5 slices/2 animals), the dendrites of 2-3 CR-positive cells of this subtype were found to form dendro-dendritically connected clusters (Fig. 6C1, top inset), which is a hallmark of the type I interneuron-specific (IS1) interneuron described previously in the rat CA1 hippocampus
