    is_terminal: false
    notes: 'No CL term exists for OLM cell. CL:4023017 ''sst GABAergic interneuron'' is nearest superclass but does not capture OLM-specific morphology. Molecularly heterogeneous: contains a PV+ subpopulation with distinct theta vs gamma coupling. Npy expression is consistent in mouse but absent in rat (species difference). Ndnf::Nkx2-1 intersection selectively targets OLM cells. At least 3 Chrna2+ subclusters identified.

      [cite_traverse_2026_04_10] PMID:19176803: horizontal interneurons in stratum oriens of the hippocampal CA1 area are often studied as a single group of interneurons, they include several cell types in addition to O-LM cells

      [cite_traverse_2026_04_10] PMID:20463218: dendrite-targeting inhibitory interneurons, such as oriens lacunosum-moleculare (O-LM) cells, regulate dendritic Na+ or Ca2+ spikes and synaptic plasticity by innervating dendritic domains of principal neurons


      ---

      [Migrated from asta-ingest stub `olm_hippocampus` on 2026-06-10]


      HETEROGENEITY: The OLM class contains molecularly heterogeneous subpopulations. Zhang et al. (2025) report a PV-positive OLM subset that fires in the gamma range (vs theta for SST-only OLM cells). Thulin et al. (2025) identify three Sst/Pnoc subclusters with differential dorsal-ventral connectivity. These may warrant separate nodes in future iterations. TRPV1 expression (Hurtado-Zavala et al., 2017) is reported in a subpopulation but not confirmed by other sources. Lacaille 1987 described O/A interneurons with axons branching in stratum oriens and pyramidale (not SLM) — these are likely a distinct population from canonical O-LM cells. Species: most morphology data from rat; marker/transgenic data from mouse. Cross-species validation pending.

      '
    morphology:
      description: 'Soma and horizontal dendrites confined to stratum oriens, often with spines; axon projects perpendicularly through SR to stratum lacunosum-moleculare where it forms dense varicose terminal arbor; collateral axons also in stratum oriens. Large elongated soma at oriens-alveus border. Stereotyped morphology first described by Cajal (1893).

        '
      sources:
        - ref: PMID:20421280
          method: biocytin fill
          scope: adult rat CA1
          quote_key: 3106274_e54f60e9
        - ref: PMID:31420995
          method: DAB staining
          scope: mouse hippocampus
          quote_key: 201041756_c6648415
        - ref: PMID:26021702
          method: biocytin fill
          scope: rat CA1
          quote_key: 15101210_fb549732
        - ref: PMID:38470935
          snippet: we estimated that an OLM cell receives about 8400, whereas an HS cell about 15600 synaptic inputs, about 16% of which are GABAergic
          support: SUPPORT
          source: cite_traverse_2026_04_10
        - ref: PMID:10777798
          snippet: a noticeable feature of hippocampal EGFP-expressing interneurons in area CA1 of GIN mice was the localization of their often oval-shaped somata to SO, with dendrites running parallel to the strata borders. Such morphology is characteristic of O-LM cells
          support: SUPPORT
          source: cite_traverse_2026_04_10
        - ref: PMID:10804195
          snippet: Type I interneurons had large horizontally oriented cell somata located at the border of stratum oriens and the alveus, indicating that these cells were most likely identical with the previously described somatostatin-positive oriens-lacunosum moleculare (O-LM) cells
          support: SUPPORT
          source: cite_traverse_2026_04_10
        - ref: "PMID:33991454"
          method: "biocytin fill + reconstruction"
          scope: "mouse CA1"
          quote_key: "234597703_fda66a57"
        - ref: "PMID:10804195"
          method: "intracellular fill + reconstruction"
          scope: "mouse CA1 stratum oriens"
          quote_key: "6652630_6ba030f8"
