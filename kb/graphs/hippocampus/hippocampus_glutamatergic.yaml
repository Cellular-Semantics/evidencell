    notes: "[Migrated from asta-ingest stub `ca1_pyramidal_cell` on 2026-06-10]\n\nAMBIGUITY: Ventral CA1 pyramidal neurons express D1/D2 dopamine receptors (45.1% of D1/D2 cells in vHipp are glutamatergic) — likely projection-specific vCA1/vSubiculum subtypes; dorsal CA1 pyramidal cells are D1R-negative. Np65-positive glutamatergic neurons are not CA1-specific (also CA2-3 and subiculum)."
