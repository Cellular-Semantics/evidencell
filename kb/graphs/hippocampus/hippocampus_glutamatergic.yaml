      label: dentate gyrus neuron
      name_in_source: dentate gyrus neuron
    definition: A dentate gyrus neuron with soma in the polymorphic layer (UBERON:0002928)
      (Scharfman & Myers, 2012), capable of glutamate secretion as a neurotransmitter
      (Scharfman & Bernstein, 2015). Distinguished by a large multipolar soma, thorny
      excrescences on proximal dendrites, and commissural/associational axon projections
      terminating in the inner molecular layer of the dentate gyrus (Scharfman & Myers,
      2012). Electrophysiologically characterised by a depolarised resting membrane
      potential, prominent hyperpolarisation-activated cation current (Ih), and firing
      accommodation (Scharfman & Myers, 2012). In rodents, serves as a major excitatory
      neuron of the dentate hilus providing feedback excitation to granule cells (Sun
      et al., 2017).
