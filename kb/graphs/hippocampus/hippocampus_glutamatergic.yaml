  proposed_cl_term:
    label: CA1 pyramidal cell
    parent_cl_term:
      id: CL:1001571
      label: hippocampal pyramidal neuron
      name_in_source: hippocampal pyramidal neuron
    definition: A hippocampal pyramidal neuron with soma located in the pyramidal
      layer of hippocampal area CA1 (UBERON:0014548) (Cembrowski et al., 2016; Müller
      & Remy, 2017), forming the dominant excitatory projection population of the
      CA1 subfield. As the primary output cell of Ammon's horn, it projects via the
      subiculum to entorhinal cortex and is capable of glutamate secretion as a neurotransmitter
      (Dale et al., 2015). In mouse, it is distinguished from CA2 and CA3 pyramidal
      neurons by soma position within the CA1 stratum pyramidale and by expression
      of wolframin (Wfs1), an endoplasmic reticulum-resident membrane protein enriched
      in deep-sublayer CA1 cells (Cembrowski et al., 2016).
    xrefs:
