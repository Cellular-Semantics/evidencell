  electrophysiology:
    description: CA2 pyramidal cells exhibit more efficient dendritic propagation
      than CA1, with entorhinal cortical inputs producing 5-6 fold larger somatic
      EPSPs sufficient to drive action potential output. Schaffer collateral inputs
      to CA2 are atypically resistant to canonical activity-dependent LTP. CA2 neurons
      are enriched for mitochondrial protein-encoding genes compared to CA1, consistent
      with higher metabolic demand.
    sources:
    - ref: PMID:28213444
      method: patch-clamp (slice)
      scope: mouse CA2 vs CA1 pyramidal neurons, entorhinal input
      quote_key: 207513684_bb3793d4
    - ref: PMID:22904370
      method: electrophysiology (LTP induction at SC-CA2)
      scope: mouse hippocampal CA2
      quote_key: 20853920_19e668eb
    - ref: PMID:41473278
      method: transcriptomics + mitochondrial imaging
      scope: mouse CA1 vs CA2 hippocampus
      quote_key: 284018783_0507bb17
  morphology:
    description: CA2 pyramidal cells bear dense dendritic spines but lack the thorny
      excrescences of CA3; soma size is intermediate between CA1 and CA3; apical dendrites
      show distinct branching patterns.
    sources:
    - ref: PMID:24166578
      method: biocytin fill + intracellular labeling; DIC microscopy in acute slice
      scope: adult mouse hippocampus, P15-P18
      quote_key: 18746823_437ba8b3
  proposed_cl_term:
    label: CA2 pyramidal cell
    parent_cl_term:
      id: CL:1001571
      label: hippocampal pyramidal neuron
      name_in_source: hippocampal pyramidal neuron
    definition: A hippocampal pyramidal neuron with soma located in the pyramidal
      layer of hippocampal area CA2 (Cembrowski et al., 2016; Sanchez-Aguilera et
      al., 2021). Distinguished from CA1 and CA3 pyramidal neurons by expression of
      Pcp4, Rgs14, and Amigo2 in rodents (San Antonio et al., 2014; Caruana et al.,
      2012), and by absence of the CA1 marker wolframin (Wfs1) (Evans et al., 2018).
      Receives strong LTP-competent input from entorhinal cortex at distal dendrites,
      while Schaffer collateral inputs to proximal dendrites are resistant to canonical
      LTP in wild-type animals (Chevaleyre & Siegelbaum, 2010). Required for social
      memory in mice (Hitti & Siegelbaum, 2014).
    xrefs:
    - PMID:27113915
    - PMID:24166578
    - PMID:22904370
    - PMID:29911178
    - PMID:24572357
    - PMID:20510860
    - CS20230722_SUPT_0100
    status: SUBMITTED
    cl_id: https://github.com/obophenotype/cell-ontology/issues/3651
  negative_markers:
  - symbol: Wfs1
    ncbi_gene_id: NCBIGene:22393
    sources:
    - ref: PMID:29911178
      method: immunolabeling (anti-WFS1 antibody)
      scope: adult mouse hippocampus, CA2 versus CA1
      quote_key: 49237374_714b76e3
      marker_type: PROTEIN
  definition_references:
  - PMID:27113915
  - PMID:33956790
  - PMID:26346726
  - PMID:24166578
  - PMID:22904370
  - PMID:29911178
  - PMID:24572357
  - PMID:20510860
  notes: 'CA2 pyramidal cells express Pcp4, Rgs14, and Amigo2 as defining markers
    and do not express the CA1 marker Wfs1 (Evans et al. 2018, PMID:29911178). CA2
    is essential for social memory: genetic inactivation of CA2 pyramidal neurons
    via Amigo2-Cre causes a pronounced deficit in social recognition with no change
    in general sociability (Hitti & Siegelbaum 2014, PMID:24572357). Entorhinal cortex
    inputs produce strong LTP at distal CA2 dendrites, forming a powerful disynaptic
    cortico-hippocampal loop, while SC (Schaffer collateral) inputs are resistant
    to canonical LTP (Chevaleyre & Siegelbaum 2010, PMID:20510860).'
