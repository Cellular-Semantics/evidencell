    notes: 'CA3 pyramidal cells are the principal glutamatergic neurons of hippocampal area CA3, forming the main excitatory relay of the trisynaptic circuit: they receive mossy fiber input from dentate gyrus granule cells via thorny excrescences on proximal apical dendrites (a defining morphological hallmark unique to CA3 among Ammon''s horn pyramidal cells), and project via Schaffer collaterals to CA1. The dense recurrent collateral network underlies pattern completion memory models and enables single CA3 neurons to act as hub neurons capable of triggering network bursts (PMID:23271650). No molecular marker exclusively specific to CA3 has been identified in classical literature; the thorny excrescence morphology and mossy fiber innervation remain the primary defining criteria.


