      method: review (anatomical classification of hippocampal principal cell types)
      scope: mouse/rat hippocampus, adult
      quote_key: 2281033_5b9805ff
  defining_markers: []
  electrophysiology:
    description: In adult CA3, single pyramidal neurons can act as hub neurons capable
      of triggering network bursts when fast GABAergic transmission is blocked, reflecting
      the high recurrent excitatory connectivity of the CA3 pyramidal cell network.
    sources:
    - ref: PMID:23271650
      method: patch-clamp + multineuron Ca2+ imaging
      scope: juvenile and adult mouse hippocampal CA3
      quote_key: 3153294_53089f6d
  morphology:
    description: CA3 pyramidal cells bear thorny excrescences on their proximal apical
      dendrites that are postsynaptic targets of dentate granule cell mossy fiber
      terminals, forming primarily glutamatergic mixed electrical-chemical synapses
      (gap junctions plus glutamatergic chemical synapses, coupled by Connexin-36).
    sources:
    - ref: https://doi.org/10.3389/fnana.2012.00013
      method: electron microscopy + immunohistochemistry
      scope: adult rat hippocampus mossy fibers on CA3pyr
      quote_key: 1115431_2cbd1dc8
    - ref: PMID:24319410
      method: review (anatomy + physiology)
      scope: rodent hippocampal mossy fiber pathway to CA3
      quote_key: 7458943_e2eed73d
  cl_mapping:
    cl_term:
      id: CL:1001571
      label: hippocampal pyramidal neuron
      name_in_source: CA3 pyramidal cell
    mapping_notes: CA3 pyramidal cells are a subpopulation of hippocampal pyramidal
      neurons; CL:1001571 covers all hippocampal pyramidal neurons without anatomical
      resolution to individual subfields. No CA3-specific CL term currently exists.
    mapping_type: BROAD
  definition_references:
  - PMID:27113915
  - PMID:26402459
  - PMID:26346726
  - PMID:24319410
  - PMID:23271650
  notes: 'CA3 pyramidal cells are the principal glutamatergic neurons of hippocampal
    area CA3, forming the main excitatory relay of the trisynaptic circuit: they receive
    mossy fiber input from dentate gyrus granule cells via thorny excrescences on
    proximal apical dendrites (a defining morphological hallmark unique to CA3 among
    Ammon''s horn pyramidal cells), and project via Schaffer collaterals to CA1. The
    dense recurrent collateral network underlies pattern completion memory models
    and enables single CA3 neurons to act as hub neurons capable of triggering network
    bursts (PMID:23271650). No molecular marker exclusively specific to CA3 has been
    identified in classical literature; the thorny excrescence morphology and mossy
    fiber innervation remain the primary defining criteria.'
  proposed_cl_term:
    label: CA3 pyramidal cell
    parent_cl_term:
      id: CL:1001571
      label: hippocampal pyramidal neuron
      name_in_source: hippocampal pyramidal neuron
    status: SUBMITTED
    cl_id: https://github.com/obophenotype/cell-ontology/issues/3653
