    notes: "[Migrated from asta-ingest stub `dg_mossy_cell` on 2026-06-10]\n\nDorsal vs. ventral mossy cells differ in axonal projection (dorsal: IML+MML; ventral: IML only). Reelin-positive mossy cells in the dentate hilus are predominantly glutamatergic (in contrast to GABAergic reelin+ cells in the molecular layer). HETEROGENEITY: dorsal/ventral subtypes likely warrant separate atlas correspondence.\n\nCL mapping note: No CL term found for hilar mossy cell. Children of CL:4023062 (dentate gyrus neuron) include granule cell (CL:2000089), basket cell (CL:2000087), kisspeptin neuron (CL:4023124) and stellate cell (CL:2000090); none matches mossy cell. Potential CL contribution."
    synonyms:
      - term: dg_mossy_cell
        synonym_type: HISTORICAL
