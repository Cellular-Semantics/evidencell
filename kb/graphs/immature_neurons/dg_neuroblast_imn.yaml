        modifier: "absent until stage 6 (mature granule cell)"
        ncbi_gene_id:
      - symbol: GFAP
        modifier: "absent in type-2/3 neuroblasts (distinguishes from type-1 RGL)"
        ncbi_gene_id:
    neuropeptides: []
    colocated_types:
      - neighboring_type: "type-1 RGL stem cells"
        spatial_relationship: "ADJACENT"
        notes: "Immediate lineage precursors in SGZ niche (PMID:40519263, quote_key=279046466_b2e95c41)."
    cl_mapping:
      cl_term:
        id: CL:0000031
        label: "neuroblast (sensu Vertebrata)"
        name_in_source: "neuroblast / type-3 progenitor"
      mapping_type: BROAD
      mapping_notes: >
        CL:0000031 is the canonical vertebrate neuroblast class and encompasses
        SGZ-born migrating DCX+ type-3 neuroblasts. CL:1000042 (forebrain
        neuroblast) is a closer BROAD subclass. No dentate-gyrus-specific
        neuroblast term exists in CL; CL:2000089 (dentate gyrus granule cell)
        covers only the mature, terminally differentiated stage.
    definition_references:
      - "PMID:40519263"
      - "PMID:18385329"
      - "PMID:19482889"
      - PMID:29335606
      - GEO:GSE95315
    is_terminal: false
    notes: >-
      HETEROGENEITY: The node captures type-3 neuroblasts primarily; type-2a (Nestin+/Sox2+) and type-2b (Nestin+/DCX+) earlier stages are related but distinct intermediate progenitors and may warrant separate sub-nodes. No dedicated UBERON term for subgranular zone; dentate gyrus (UBERON:0001885) used as container. DUPLICATE RECORD, MERGE DEFERRED: this node and 'dg_neuroblast' in kb/graphs/dentate_gyrus/20260414_dentate_gyrus_report_ingest.yaml carry the identical name and describe the same cell type, curated independently in two contexts. This record was renamed from 'dg_neuroblast' so that each file defines a distinct node id; the dentate_gyrus record is the one carried by reports/dentate_gyrus/ and is the richer of the two on literature references. Whether to merge them, and which properties survive, is a curator decision that has not been made. Do not treat the two as independent types.

