            best_target_name: "28 CB GABA"
            f1_score: 0.050
            n_cells_mapped: 1175
            median_bootstrap: 1.0
            coverage: 1.000
            purity: 0.026
          - taxonomy_level: SUBCLASS
            best_target_name: "309 CB PLI Gly-Gaba"
            best_target_accession: CS20230722_SUBC_309
            f1_score: 0.633
            n_cells_mapped: 1117
            median_bootstrap: 1.0
            coverage: 0.998
            purity: 0.463
          - taxonomy_level: SUPERTYPE
            best_target_name: "1144 CB PLI Gly-Gaba_1"
            best_target_accession: CS20230722_SUPT_1144
            f1_score: 0.717
            n_cells_mapped: 1059
            median_bootstrap: 1.0
            coverage: 0.953
            purity: 0.575
          - taxonomy_level: CLUSTER
            best_target_name: "5178 CB PLI Gly-Gaba_1"
