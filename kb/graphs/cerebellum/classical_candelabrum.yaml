          label: GABAergic neuron
          name_in_source: "GABA"
    defining_markers:
      - symbol: Nxph1
        sources:
          - marker_type: TRANSCRIPT
            method: "snRNA-seq (snDrop-seq, SCP795)"
            scope: "adult mouse cerebellar cortex, PLI1 cluster"
            snippet: "PLI1s (Nxph1+, Aldh1a3+, Slc6a5−)"
            ref: "PMID:35578131"
      - symbol: Aldh1a3
        sources:
          - marker_type: TRANSCRIPT
            method: "snRNA-seq (snDrop-seq, SCP795)"
            scope: "adult mouse cerebellar cortex, PLI1 cluster"
            snippet: "PLI1s (Nxph1+, Aldh1a3+, Slc6a5−)"
            ref: "PMID:35578131"
      - symbol: Klhl1
        sources:
          - marker_type: TRANSCRIPT
            method: "snRNA-seq"
            scope: "adult mouse cerebellar cortex, PLI class"
            snippet: "canonical PLI marker Klhl1; MLIs branch from each other later than from PLIs"
            ref: "PMID:34616064"
    negative_markers:
      - symbol: Slc6a5
        sources:
          - marker_type: TRANSCRIPT
            method: "snRNA-seq (snDrop-seq, SCP795)"
            scope: "adult mouse cerebellar cortex, PLI1 vs PLI2/PLI3"
            snippet: "PLI1s (Nxph1+, Aldh1a3+, Slc6a5−); Slc6a5 absent in CCs but present in PLI2s"
            ref: "PMID:35578131"
    is_terminal: false

  - id: wmb_cluster_5178
    name: "5178 CB PLI Gly-Gaba_1"
    definition_basis: ATLAS_TRANSCRIPTOMIC
    atlas: WMBv1
    taxonomy_id: CCN20230722
    cell_set_accession: CS20230722_CLUS_5178
    taxonomy_level: CLUSTER
    parent_hierarchy:
      - {level: SUPERTYPE, name: "CB PLI Gly-Gaba_1 (1144)", cell_set_accession: CS20230722_SUPT_1144}
      - {level: SUBCLASS, name: "CB PLI Gly-Gaba (309)", cell_set_accession: CS20230722_SUBC_309}
      - {level: CLASS, name: "CB GABA (28)", cell_set_accession: CS20230722_CLAS_28}
    species: {id: NCBITaxon:10090, label: "Mus musculus", name_in_source: "Mus musculus"}
    anatomical_location:
      - id: MBA:1145
