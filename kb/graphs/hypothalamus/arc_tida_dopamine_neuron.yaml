      mapping_type: EXACT
      mapping_notes: >
        Searched "tuberoinfundibular" (no hit), then "dopaminergic neuron"
        (CL:0000700) and walked its descendants, finding CL:4072009 "A12
        dopaminergic neuron" (exact synonym "hypothalamic arcuate nucleus
        dopaminergic neuron"), defined as "a type of dopaminergic neuron found
        in the arcuate hypothalamic nucleus, involved in neuroendocrine
        regulation, metabolic homeostasis and prolactin secretion." This
        matches the node by location (arcuate), transmitter (dopamine, TH+/
        AADC+, DBH-), and defining function (prolactin regulation) — the
        classical A12 group and the TIDA population are the same population
        under different naming conventions. EXACT.
    definition_references:
      - "PMID:39919032"
      - "PMID:31420539"
    notes: >
      Both sources are secondary descriptions rather than primary
      characterisations of this population: PMID:39919032 is a review of A12
      neurons and PMID:31420539 names the type only in the introduction to a
      developing-arcuate single-cell study. Neither names an assay for any
      marker, so every marker source is NOT_STATED and all of them need
      primary verification at evidence-extraction. Neither quoted passage
      states a species — the node's Mus musculus assignment comes from the
      mouse framing of PMID:31420539 and of the report as a whole, so a
      cross-species reading of the enzyme complement (TH+/AADC+/DBH-) is
      possible and should be checked. The marker complement given is the
      generic central-dopaminergic one and does not by itself separate this
      type from other arcuate Th-positive populations, which the same source
      says exist; no marker unique to TIDA neurons is reported here. No
      sex-bias, electrophysiology or morphology assertion is made by either
      source, so those fields are left absent rather than inferred.
