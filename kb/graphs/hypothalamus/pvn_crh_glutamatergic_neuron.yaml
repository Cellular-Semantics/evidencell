      mapping_type: BROAD
      mapping_notes: >
        Searched (OAK CL semsql DB, ols4 unavailable): "CRH neuron" (returns only
        CL:4072021), "glutamatergic neuron" (CL:0000679), "paraventricular",
        "parvocellular", "parvicellular", "vasopressin", "hypothalamic neuron" —
        no CL term exists for a glutamatergic- or Slc17a6-defined subset of CRH
