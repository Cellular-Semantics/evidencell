        the parent pvn_crh_neuron (cl_mapping EXACT to CL:4072021) carrying a
        glutamatergic molecular signature, per its subtype_of assertion, so
        CL:4072021 is the nearest and most specific containing term — more
        specific than CL:0000679 (glutamatergic neuron), which does not capture
        the CRH-defining criterion. Would need a CL term combining "CRH neuron"
        and "glutamatergic" for EXACT.
    is_terminal: false
    definition_references:
      - "https://doi.org/10.1101/2021.08.31.458231"
      - "PMID:33060330"
      - "PMID:24009552"
      - "PMID:37599997"
    notes: >
      The Slc17a6-defined split of PVN Crh neurons, and the concentration of
      the Crh+/Slc17a6+ cells in the dorsal parvocellular subdivision, rest on
      a single source (Short et al. 2021, a preprint) in neonatal male mice;
      neither has been reproduced in adult or female animals.

      The anatomical grounding of that subdivision is provisional. Short et al.
      write "dorsal parvocellular subdivision of the PVN"; MBA:439 (PVHdp) is
      the closest Allen structure by name, but it sits in the descending
      (preautonomic) division, whereas the classical hypophysiotropic CRH
      population is placed in the medial parvocellular region (Keller et al.
      2021). Whether the source means PVHdp or a dorsal part of the
      parvicellular division is not settled by the quoted passage, so the
      MBA:439 entry should be re-checked against the paper's figures before
      being used for mapping.

      Sources disagree on whether a non-glutamatergic Crh population exists in
      PVN at all. Xu et al. 2020 report that every PVH cluster carries
      Slc17a6 and lacks Slc32a1, which leaves no room for the sparse
      Crh+/Gad2+ group Short et al. describe; that disagreement is what makes
      the glutamatergic qualifier in this node's definition a claim rather
      than a formality.

      Slc17a6 and Sim1 are reported for PVH neurons broadly, not for this type
      specifically; they support the node's transmitter and regional identity
      but do not discriminate it from neighbouring PVH classes. Crh is the
      only marker here that is specific to the parent class.
