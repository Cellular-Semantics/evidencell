name: "Anterior parvicellular PVN CRH neuron"
description: >
  Evidence graph component for the rostral-projecting CRH neuron of the
  anterior parvicellular area of the paraventricular hypothalamus, proposed
  from the ASTA deep research report PVN_CRH_neurons.pdf.
brain_region:
  id: MBA:1097
  label: Hypothalamus
  name_in_source: "hypothalamic paraventricular nucleus (PVN/PVH)"
