    electrophysiology:
      description: >
        Intrinsic biophysical and synaptic properties are homogeneous across
        the Crh-reporter-defined PVN population. Excitability is set by a
        balance of glutamatergic excitation, noradrenergic drive and strong
        GABAergic inhibition, the latter delivered in both phasic and tonic
        forms; no distinct e-type label has been assigned.
      sources:
        - ref: "PMID:23724107"
          quote_key: "17422230_7b738f29"
          method: "whole-cell recording of tdTomato-labelled PVN neurons; optogenetic manipulation via viral Cre-driven channelrhodopsin"
          scope: "Crh-IRES-Cre;Ai14 mouse, PVN"
        - ref: "PMID:22593735"
          quote_key: "8197728_39d59cd0"
          method: "review of synaptic regulation; GABA, glutamate and norepinephrine named as the three orchestrating transmitters"
          scope: "rodent PVN neuroendocrine CRH neurons"
        - ref: "PMID:24495609"
          quote_key: "22774749_3ac5ba2b"
          method: "review; phasic and tonic GABAergic inhibition onto CRH neurons, the tonic component carried by the GABA-A receptor delta subunit"
          scope: "mouse PVN"
    morphology:
      description: >
        Small-bodied (parvocellular) neurosecretory neurons. Among CRH
        populations reconstructed brain-wide, hypothalamic CRH neurons have the
        smallest somatic volumes and the simplest dendritic branching. Two
        morphological groups are distinguished by somatic location and
        dendritic varicosities: rostral-projecting cells of the anterior
        parvicellular area with fewer and smaller varicosities, and cells of
        the periventricular area with more and larger varicosities on dendrites
        directed toward the third ventricle.
      sources:
        - ref: "PMID:33722214"
          quote_key: "232240856_f5066bcf"
          method: "CRH-IRES-Cre;Ai32 line + fMOST whole-brain imaging with single-neuron dendritic reconstruction"
          scope: "adult mouse, hypothalamic CRH neurons compared with other brain-wide CRH populations"
        - ref: "PMID:33722214"
          quote_key: "232240856_88d14a13"
          method: "fMOST reconstruction; classification by somatic location and dendritic varicosity number and size"
          scope: "adult mouse hypothalamus"
        - ref: "PMID:40497964"
          quote_key: "279024393_5ad42b00"
          method: "review; parvocellular neurosecretory neurons described as small-bodied, contrasted with large-bodied magnocellular cells"
          scope: "mouse PVN"
    cl_mapping:
      cl_term:
        id: CL:4072021
        label: "corticotropin-releasing neuron"
        name_in_source: "PVN CRH neuron"
      mapping_type: EXACT
      mapping_notes: >
        Searched "corticotropin-releasing neuron" and "CRH neuron" in CL.
        CL:4072021 ("a specialised type of interneuron defined by the
        secretion of corticotropin-releasing hormone (CRH) ... primarily
        located in the paraventricular nucleus (PVN) of the hypothalamus")
        matches this node's defining criterion and primary location
        directly — distinct from pvn_crfr1_neuron, which is defined by the
        CRF receptor and is RELATED (not EXACT) to this same CL term.
    definition_references:
      - PMID:23724107
      - PMID:24009552
      - PMID:33060330
      - PMID:22593735
      - PMID:33722214
    notes: >
      Reporter-line dependence: most marker, morphology and electrophysiology
      evidence for this type comes from Crh-IRES-Cre reporter mice rather than
      from endogenous CRH detection. Concordance in the PVN is good but not
      complete (PMID:23724107: 80.5% of reporter-positive somata are
      CRH-immunoreactive), and PMID:30266597 reports reporter/peptide
      discrepancies in other regions, so reporter-defined counts should not be
      read as CRH-expressing-cell counts.
      Neurotransmitter discrepancy: the glutamatergic assertion follows
      PMID:24009552, PMID:33060330 and PMID:37599997, and PMID:33060330
      specifically finds no Vgat in any PVH cluster; a single-cell study of
      neonatal PVN (https://doi.org/10.1101/2021.08.31.458231) nevertheless
      resolves a sparse Gad2-expressing Crh+ group. Whether that group is a
      developmental feature, a dissection artefact or a genuine adult minority
      is unresolved by the sources here.
      Neuropeptide discrepancy: PMID:23724107 reports that Crh-reporter PVN
      neurons abundantly express CRH protein but not the other PVN phenotypic
      neuropeptides, whereas PMID:10377355 and PMID:22593735 describe a
      parvocellular subset that co-expresses and co-secretes AVP with CRH. Avp
      is therefore recorded as a subset neuropeptide, not a property of the
      whole population.
      Subset markers: connexin 36 (Gjd2) is reported only for subsets of PVN
      CRH neurons and only through an EGFP reporter (PMID:19405960). Sim1 is a
      marker of PVH neurons as a class (PMID:33060330, PMID:34705510), not a
      discriminating marker for the CRH population.
      Compartmental caveat: PMID:3044519 describes the PVN as a dynamic mosaic
      in which the neuromediator combination of individual neurons varies with
      physiological state, so the marker set recorded here should be read as a
      typical rather than an invariant phenotype.
