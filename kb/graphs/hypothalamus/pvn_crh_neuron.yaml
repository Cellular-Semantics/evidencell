        spatial_relationship: INTERSPERSED
        notes: >
          The PVN contains several intermixed peptidergic neurosecretory
          populations alongside the CRH neurons (PMID:40119815). The nucleus is
          compartmental, with topographically segregated cellular units
          specified by combinations of neuromediators whose composition varies
          with physiological state (PMID:3044519).
      - neighboring_type: "PVN CRFR1 neuron"
        spatial_relationship: ADJACENT
        notes: >
          PVN CRF neurons form synapses on neighbouring CRFR1-expressing PVN
          neurons and activate them by releasing CRF (PMID:29352046); the CRFR1
          population is a local postsynaptic partner, not a subset of this type.
