    notes: >
      No neurotransmitter identity is recorded: none of the three sources
      states the fast transmitter of Grp+ DMH neurons, and the DMH contains
      both GABAergic and glutamatergic neurons, so none can be inferred
      safely. Grp expression constrains the peptide output only, not the fast
      transmitter. Morphology, intrinsic electrophysiology and developmental
      origin are likewise undefined in the supplied sources. Grp is a DMH
      marker in local anatomical context — enriched in the DMH relative to
      adjacent hypothalamic regions — rather than a brain-wide exclusive
      marker, so assignment of a Grp-expressing neuron to this type depends on
      anatomical context; the report's own caveat is that Grp by itself
      probably does not define a complete unique DMH cell type, and the
      sources do not establish whether all DMH Grp+ neurons form one
      transcriptomic cluster. The negative markers are cluster-level exclusion
      criteria applied when DMH neuron types were selected (clusters enriched
      for a neighbouring-nucleus gene were discarded), not direct per-cell
      absence measurements in this population. The three sources characterise
      overlapping but non-identical populations: PMID:22473294 profiles DMH
      tissue rather than a cell type, PMID:37624889 selects DMH clusters by
      marker panel, and PMID:34728342 profiles a refeeding-activated
      compact-DMH population that expresses Grp together with Pdyn, Cck and
      Trhr; the PVN projection is therefore recorded as weak, inferred
      evidence. The relation of this type to the neighbouring Pdyn, Cck and
      Ppp1r17 DMH classes is unresolved in the supplied material and may
      involve substantial overlap.
