    notes: >
      Thinly characterised: the supplied sources give Lepr transcript
      expression and DMH location only. No neurotransmitter identity is
      recorded because none of the sources states the fast transmitter or
      peptide output of this population, and the broader DMH contains both
      GABAergic and glutamatergic neurons, so no transmitter can be inferred
      safely; morphology, intrinsic electrophysiology, connectivity and
      developmental origin are likewise undefined in the sources. Lepr is
      expressed in several other hypothalamic regions (ARC, LHA, VMH), so
      assignment of a Lepr-expressing neuron to this type depends on
      anatomical context rather than on the marker alone. The sources do not
      establish whether all DMH Lepr+ neurons form one transcriptomic cluster
      or several related subtypes. The negative markers are cluster-level
      exclusion criteria applied when DMH neuron types were selected (clusters
      enriched for a neighbouring-nucleus gene were discarded), not direct
      per-cell absence measurements.
