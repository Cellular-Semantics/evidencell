      - "PMID:26629409"
      - "PMID:22987798"
      - "PMID:34018926"
      - "PMID:31605642"
    notes: >
      HETEROGENEITY. This is an anatomically defined population and no single
      marker captures all of it. Kim et al. 2019 (PMID:31626771) resolve 17
      transcriptomic types within VMHvl, several of them sexually dimorphic,
      and report that many of those types contain neurons with different
      projection-target preferences, so transcriptomic identity does not map
      cleanly onto connectivity or behaviour. Affinati et al. 2021
      (PMID:34018926) reach a coarser VMH-wide scheme — 24 clusters simplified
      to 6 classes — in which the ventrolateral VMH still splits into two
      major classes rather than forming one molecular compartment. Kammel et
      al. 2019 (PMID:31605642) review the same point from the sex-difference
      side.

      MARKER SCOPE. Esr1 (ERα) and Cyp19a1 (aromatase) are recorded with
      modifier ENRICHED, not as properties of every VMHvl neuron: Sokolowski
      et al. 2016 (PMID:27209204) score them as substantial VMHvl
      subpopulations, and the supporting sources treat ERα as a marker for a
      socially and metabolically relevant subset. Slc17a6 (Vglut2) is the only
      marker here asserted of the population as a whole, and even that is
      stated as "nearly all" VMH neurons.

      SF-1 CONFLICT. Cheung et al. 2015 (PMID:26629409) state that nearly all
      VMH neurons express both SF-1 (Nr5a1) and Vglut2, but that claim is
      VMH-wide; Cheung et al. 2013 (PMID:22987798) and Sohn et al. 2016
      (PMID:27656404) show that VMHvl specifically retains Sf1-lineage history
      while losing ongoing SF-1 expression (virtually absent from the
      Sf-1TauGFP reporter by E14.5, absent in adult vlVMH). The negative
      marker entry is therefore scoped to VMHvl, and SF-1 should be read as a
      VMH-wide developmental lineage marker rather than an adult VMHvl marker.

      LEPTIN RECEPTOR — NOT RECORDED AS A NEGATIVE MARKER. Affinati et al.
      2021 (PMID:34018926) find Lepr marking a single dorsomedial class, and
      Higgins et al. 2024 (PMID:38279680) place the majority of Leprb puncta
      in the dorsomedial and central subregions, but Higgins also notes that
      Caron et al. reported greater Leprb expression in the dorsomedial AND
      ventrolateral subregions at P10. "Relatively weak in adult VMHvl" is not
      the same as shown absent, so no negative_markers entry was written.

      CROSS-SPECIES / PREPARATION SCOPE. The electrophysiology and morphology
      entries come from vGluT2-GFP recordings and imaging across the whole VMH
      (Fu et al. 2008, PMID:18495877) and are not VMHvl-specific; the
      melanocortin responses described are synaptically mediated rather than
      intrinsic membrane properties.
