    electrophysiology:
      description: >
        Spontaneously active in hypothalamic slice. α-MSH, melanotan II (MTII)
        and selective MC3R or MC4R agonists are all inhibitory, reducing the
        spontaneous firing rate and hyperpolarising the cells, while the
        MC3/4R antagonist SHU9119 is excitatory. The melanocortin effects are
        indirect: with synaptic activity blocked neither MTII nor AgRP evoked
        any hyperpolarisation or change in input resistance; MTII instead
        increased spontaneous and miniature IPSC frequency, and AgRP acted by
        presynaptic, Gi/Go-dependent inhibition of EPSCs. AgRP and MTII were
        additive rather than mutually antagonistic.
      sources:
        - ref: "PMID:18495877"
          quote_key: "14673789_04f5929a"
          method: "whole-cell recording of 370 VMH glutamatergic neurons in hypothalamic slices from a vGluT2-promoter-GFP mouse"
          scope: >
            Mouse VMH glutamatergic (vGluT2-GFP) neurons, acute hypothalamic
            slices; recorded across the nucleus and not restricted to the
            ventrolateral subdivision.
    morphology:
      description: >
        Large numbers of dendrites extend out of the core of the nucleus into
        the surrounding cell-poor shell; these shell dendrites, but not the
        core, receive frequent appositions from AgRP-immunoreactive axons.
      sources:
        - ref: "PMID:18495877"
          quote_key: "14673789_04f5929a"
          method: "vGluT2-promoter-GFP labelling of VMH neurons with AgRP immunohistochemistry"
          scope: >
            Mouse VMH, whole nucleus — the dendritic core/shell arrangement is
            reported for VMH glutamatergic neurons generally, not specifically
            for VMHvl.
