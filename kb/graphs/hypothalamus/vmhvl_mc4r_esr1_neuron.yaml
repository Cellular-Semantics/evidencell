  Evidence graph component for the MC4R/ERα VMHvl neuron, proposed from the
  ASTA deep research report VMHvl_neurons.pdf.
brain_region:
  id: MBA:1097
  label: Hypothalamus
  name_in_source: "ventrolateral ventromedial hypothalamic nucleus (VMHvl)"
target_atlas: "NOT_APPLICABLE_CLASSICAL_ONLY"
species:
  id: NCBITaxon:10090
  label: Mus musculus
  name_in_source: "female mice"
