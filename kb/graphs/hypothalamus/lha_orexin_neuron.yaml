    electrophysiology:
      description: >
        Wake-active: orexin neurons fire mainly during active wakefulness and
        are largely silent through NREM and REM sleep. Two electrical classes
        have been resolved from intrinsic and input-driven single-cell
        activity, and a parallel two-way split pairs medial versus lateral
        position with transient versus persistent inhibitory responses to
        glucose in vitro; both electrical classes, and both medial and
        lateral cells, project to locus coeruleus and ventral tegmental area,
        so the split is a partial subdivision rather than a taxonomy.
        Activity is lowered by glucose and raised by physiological mixtures
        of amino acids, which act through inhibition of K-ATP channels and
        activation of system-A amino acid transporters.
      sources:
        - ref: "PMID:22507526"
          method: "whole-cell patch-clamp of retrogradely traced orexin cells in hypothalamic slices"
          scope: "adult mouse — VTA or LC retrograde tracer injected in vivo, recording in slice"
          quote_key: "41564004_45c6d87b"
        - ref: "PMID:28012090"
          method: "review; the two physiological classes are from Williams et al. 2008 slice recordings"
          scope: "rodent LH/PFA — transient versus persistent inhibitory glucose responses paired with medial versus lateral location"
          quote_key: "33319988_7e2741ab"
        - ref: "PMID:22099463"
          method: "brain-slice patch-clamp with in vivo c-Fos confirmation"
          scope: "mouse orexin/hypocretin cells — amino-acid excitation via K-ATP inhibition and system-A transporters; glucose lowers activity"
          quote_key: "9385304_d68c1060"
        - ref: "https://doi.org/10.5772/INTECHOPEN.79899"
          method: "review of unit recordings (Mileykovskiy et al. 2005); assay not named in quote"
          scope: "rodent LH across the sleep-wake cycle"
          quote_key: "92373234_cc3a6749"
    morphology:
      description: >
        Orexin-A-immunoreactive somata are bipolar, fusiform or multipolar and
        bear orexin-A-positive dendrites, forming a restricted cell group in
        the postero-lateral hypothalamus. The morphological subclasses
        described to date do not segregate by projection target.
      sources:
        - ref: "PMID:23162437"
          method: "orexin-A immunohistochemistry"
          scope: "adult mouse postero-lateral hypothalamus, Bregma -1.22 to -2.54"
          quote_key: "11144953_cf7c60f4"
        - ref: "PMID:22507526"
          method: "retrograde tracing with patch-clamp in hypothalamic slices"
          scope: "adult mouse — morphological subclasses project to both LC and VTA"
          quote_key: "41564004_45c6d87b"
    definition_references:
      - "PMID:9822755"
      - "PMID:28966976"
      - "PMID:23162437"
      - "PMID:22507526"
      - "PMID:31375626"
    notes: >
      Population-size estimates differ between sources: approximately 4,000
      orexin neurons in the mouse brain (PMID:23544265) versus approximately
      5,000 in mouse (PMID:34052814), while PMID:30377299 quotes
      approximately 70,000 orexinergic neurons without naming a species, and
      PMID:38517280 gives them instead as about 20% of all LH neurons. No
      single count is adopted here. Several foundational distribution and
      projection sources are rat (PMID:9822755) or pooled across mouse, rat
      and human (the spinal-cord projection,
      https://doi.org/10.1523/JNEUROSCI.19-08-03171.1999), whereas this node
      is scoped to mouse. The class is neurochemically graded rather than
      cleanly subdivided: roughly half of Hcrt/Ox cells carry both
      glutamate-release and GABA-synthesis transcripts without a vesicular
      GABA release pathway (PMID:28966976), and orexin-A axon terminals
      divide into VGLUT2-positive, VGLUT1-positive and VGLUT-negative
      fractions (PMID:41480926). "Ahr1", listed among the candidate
      fate-determining transcription factors of late-embryonic HCRT neurons
      (PMID:31375626), matches no current mouse gene symbol — the only
      claimant of the string in the mouse gene tables is Akr1b1, an aldo-keto
      reductase that does not fit a list of transcription factors — so it is
      recorded by name_in_source only and left for evidence-extraction to
      settle from the primary paper.
