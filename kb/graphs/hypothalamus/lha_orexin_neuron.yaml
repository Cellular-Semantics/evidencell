    colocated_types:
      - neighboring_type: "lha_mch_neuron"
        spatial_relationship: INTERSPERSED
        notes: >
          MCH (Pmch) neurons are spatially intermingled with orexin/Hcrt
          neurons in the LHA while the two peptides are not co-localised
          (Seifinejad et al. 2019, PMID:31375626, quote_key
          262941947_c99ee5db; Kodani et al. 2022, PMID:35437265, quote_key
          248240881_668f30b7). Prosomeric mapping separates them further:
          Hcrt and Pmch occupy distinct LH5 subdivisions, terminal Hcrt cells
          lie lateral to the ventral terminal Pmch population, and in the
          peduncular hypothalamus Hcrt cells lie dorsal to Pmch cells (Diaz
          et al. 2022, PMID:36357614, quote_key 253458103_ddcdf45f).
      - neighboring_type: "lha_leprb_nts_neuron"
        spatial_relationship: ADJACENT
        notes: >
          GABAergic LHA LepRb/neurotensin neurons lie in close apposition with
          orexin neurons; chemogenetic activation of LHA Nts neurons
          hyperpolarises and silences orexin neurons in mouse hypothalamic
          slices (Goforth et al. 2014, PMID:25143620, quote_key
          17964183_cffaa782).
