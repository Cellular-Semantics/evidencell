    notes: >
      SINGLE DEFINING SOURCE. Correa et al. 2014 (PMID:25543145) is the only
      source in this run that describes the type; every marker, the anatomical
      location and the synonyms rest on one abstract-level quote. Massa et al.
      2023 (PMID:36747631, and the duplicate record PMID:37817932) cite that
      paper for estrogen-sensitive VMHvl control of locomotion without adding
      independent characterisation of the marker combination. Primary
      verification against the full text is still outstanding.

      MARKER EVIDENCE IS LARGELY FUNCTIONAL. The available quote names no
      detection assay for any of the three markers, so all MarkerSource
      entries are marker_type NOT_STATED. Nkx2-1 enters as the driver used for
      pharmacogenetic activation and developmental disruption, and Tac1 as a
      signalling requirement; only "loss of VMHVL neurons co-expressing ERα
      and Tac1" is a direct co-expression statement, and it is about ERα and
      Tac1 rather than all three markers together. Whether NKX2-1 protein or
      transcript persists in the adult cells, as opposed to marking their
      developmental history, is not established by this evidence.

      NEUROTRANSMITTER INFERRED. No source characterises the transmitter of
      this subset. The glutamatergic assertion is carried over from the VMHvl
      population it is contained in, via Cheung et al. 2015 (PMID:26629409),
      whose statement is VMH-wide ("nearly all VMH neurons, including those in
      the ... VMHvl subregion") and is recorded here with support WEAK.

      RELATION TO THE ERα/Rprm/Tac1/Pdyn POPULATIONS. van Veen et al. 2020
      (PMID:32377634) resolve six VMH populations and find ERα enriched in
      populations with sex-biased Rprm, Tac1 and Pdyn expression, with Tac1
      female-biased. That is a second ERα-plus-Tac1 population in the same
      nucleus, reached by a different method and not defined by Nkx2-1. No
      source states whether it is the same population as Correa's locomotor
      subset, a superset of it, or a partly overlapping one, so the van Veen
      quote is used only for the neuropeptide identity of Tac1 and not as
      evidence about this node's identity.

      NO NEGATIVE MARKERS RECORDED. Correa 2014 reports that fertility and
      brown adipose tissue thermogenesis are unaffected by disrupting this
      population, but those are functional dissociations, not absent markers.
      The Nr5a1 (SF-1) absence recorded on vmhvl_neuron is scoped to the VMHvl
      population as a whole and no source tests it in this subset, so it is
      not restated here.
