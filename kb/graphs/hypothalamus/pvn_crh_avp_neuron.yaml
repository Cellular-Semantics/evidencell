    is_terminal: false
    definition_references:
      - "https://doi.org/10.1101/2021.08.31.458231"
      - "PMID:10377355"
      - "PMID:33060330"
      - "PMID:24009552"
    notes: >
      This node is NOT the existing pvn_avp_neuron. pvn_avp_neuron is the
      AVP neuron of the PVN — chiefly the magnocellular, posterior-pituitary
      projecting class — defined by vasopressin without reference to CRH.
      This node is a CRH neuron that also expresses Avp, resolved inside the
      glutamatergic Crh+ population by single-cell RNA-seq. Mistaking one for
      the other would merge a neurosecretory AVP class with a CRH subtype.

      The relationship between this Avp-defined transcriptomic cluster and
      the "classical" CRH/AVP co-secreting parvocellular subset described
      elsewhere in the same report is unsettled. That classical subset
      (AVP colocalized with CRH in parvocellular PVN, the two peptides
      co-secreted under some stress conditions and acting synergistically at
      the corticotroph — Itoi et al. 1999, Lightman et al. 2020) is defined
      by peptide colocalization and co-secretion in adult rodents, whereas
      this node is defined by an Avp-high cluster in neonatal male mouse
      scRNA-seq. No source tested whether they are the same cells, so the
      two have deliberately not been merged; see
      research/hypothalamus/20261127_hypothalamus_report_ingest/unplaced/pvn_crh_neuron.yaml.

      All property assertions here rest on a single source (Short et al.
      2021, a preprint), in neonatal male mice. Nothing has been reproduced
      in adult or female animals, and the report gives no dataset accession
      for the single-cell data, so the cluster cannot be re-identified
      computationally.

      "Steroid hormone receptors" is recorded as a defining marker with
      name_in_source only: the source names the receptor family and no
      individual gene, so there is no gene to assign. Which receptor (or
      receptors) is meant — oestrogen, androgen, glucocorticoid,
      mineralocorticoid — is not recoverable from the report.

      Crh and Slc17a6 are inherited from this node's defining context rather
      than scored on the Avp-expressing cells in isolation: the quoted
      passage establishes them for the glutamatergic Crh+ class and then
      subdivides that class by Avp versus Ntng1.
