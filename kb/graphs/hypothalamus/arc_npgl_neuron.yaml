            scope: "mouse hypothalamus, lateral posterior arcuate nucleus"
            notes: >
              Neurosecretory protein GL is a small secreted protein named for
              its C-terminal Gly-Leu-amide motif; listed both as the defining
              marker and as the population's neuropeptide product.
            quote_key: "246907354_02c7536a"
    nt_type:
      name_in_source: "GABAergic"
      cl_terms:
        - id: CL:0000617
          label: "GABAergic neuron"
          name_in_source: "GABAergic"
      sources:
        - ref: "PMID:35203663"
          method: >
            immunohistochemistry (glutamate decarboxylase 67 present; tyrosine
            hydroxylase and vesicular glutamate transporter-2 absent)
          scope: "mouse hypothalamus, lateral posterior arcuate nucleus"
          notes: >
            Partial: approximately 50% of NPGL neurons were identical to
            GABAergic neurons, so GABA is the transmitter of a substantial
            fraction rather than a demonstrated property of every cell. The
            transmitter of the remaining cells is not established by the
            source; catecholaminergic and glutamatergic identities are
            excluded.
          quote_key: "246907354_0ce33067"
    cl_mapping:
      cl_term:
        id: CL:0000110
        label: "peptidergic neuron"
        name_in_source: "Neurosecretory protein GL (NPGL)-producing neuron"
      mapping_type: BROAD
      mapping_notes: >
        Searched "NPGL", "neurosecretory protein GL", "arcuate", "hypothalamus",
        "ArcLP" — no CL term for this population or for any arcuate-specific
        neuron class. Searched "GABAergic neuron" (CL:0000617): rejected, since
        only about half of the population is GAD67+ per the source, so it is
        not a defining feature of the whole type. Searched "neuroendocrine
        cell" (CL:0000165, "a neuron capable of some hormone secretion in
        response to neuronal signals"): considered, but the defining criterion
        here is production of the neuropeptide-like secretory protein NPGL
        itself, which CL:0000110 ("a neuron that uses neuropeptides as
        transmitters") captures more directly and is the nearest term the
        whole population satisfies. No more specific term exists; a new CL
        term for the ArcLP NPGL population would sit under CL:0000110.
    definition_references:
      - "PMID:35203663"
    notes: >
      Single-source node: every property here comes from one immunohistochemical
      study (Naito et al. 2022, PMID:35203663), reached through the ASTA report
      on ARC aromatase neurons, where the population is cited only as a contrast
      case. Nothing has been checked against a second primary paper.
      Suspected heterogeneity: the source states that NPGL neurons co-produce
      glutamate decarboxylase 67 but that only approximately 50% of them were
      identical to GABAergic neurons, so GAD67 and the GABAergic transmitter
      assignment are recorded as properties of a substantial fraction, not of
      every cell; the transmitter identity of the remainder is unknown, with
      catecholaminergic and glutamatergic identities excluded by the absence of
      tyrosine hydroxylase and vesicular glutamate transporter-2.
      Anatomy granularity: the source places the population in the lateral
      posterior part of the arcuate nucleus (ArcLP), a subdivision MBA does not
      carry, so anatomical_location is recorded at the whole arcuate
      hypothalamic nucleus (MBA:223) with the sub-regional wording preserved in
      name_in_source. Sex bias is not reported for this population and is left
      unset.
edges: []
