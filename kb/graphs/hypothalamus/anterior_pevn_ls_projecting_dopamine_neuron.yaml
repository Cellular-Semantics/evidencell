    cl_mapping:
      cl_term:
        id: CL:4072011
        label: "A14 dopaminergic neuron"
        name_in_source: "Anterior periventricular nucleus (A14) lateral septum-projecting dopamine neuron"
      mapping_type: BROAD
      mapping_notes: >
        Searched "lateral septum" (CL hits were anatomy terms, not cell
        types), "septum-projecting neuron" and "anterior periventricular"
        (no hits), then "A14 dopaminergic neuron" (hit: CL:4072011). Read
        CL:4072011's definition: "A type of dopaminergic neuron located in
        the periventricular nucleus of the hypothalamus and projecting to
        the lateral septum and the median eminence. It is contributing to
        neuroendocrine functions, locomotion and stress regulation." This
        spans both characterized A14 projection subtypes — this node's
        anterior, lateral-septum-projecting population AND its sibling
        pevn_onecut3_nmur2_dopamine_neuron's medio-posterior,
        median-eminence-projecting population — so it does not describe
        this node's population alone; it is the containing class, not an
        exact match. CL:4072011 has no descendants (checked), and no CL
        term specific to a lateral-septum-projecting PeVN/A14 subtype
        exists, so CL:4072011 is the most specific containing term
        available. BROAD: a new CL term for this subtype (anterior PeVN
        position, Th+/Dat1+, lateral septum projection target) would sit
        under CL:4072011. Would need a term keyed to anterior position
        and/or lateral-septum projection, distinguishing it from the
        median-eminence-projecting sibling, for an EXACT match.
    definition_references:
      - "PMID:36209152"
      - "PMID:40177299"
    notes: >
      Single-study basis. Every property on this node comes from one primary
      paper (Korchynska et al. 2022, PMID:36209152), and from a single
      sentence of it at that. Morales et al. 2025 (PMID:40177299) is the only
      other source naming this population, and it cites Korchynska for every
      claim it makes about it, so it is corroboration of reading rather than
      independent replication. Only two refs are listed in
      definition_references because no third source in the available
      literature characterises this type. Treat the whole property set as
      needing primary verification.

      Markers are not diagnostic. Th and Dat1/Slc6a3 are the markers of the
      parent periventricular (A14) dopamine population and are shared with the
      medio-posterior Onecut3+/Nmur2+ sibling. Nothing in the available
      literature gives a marker selective for this subtype; it is picked out
      only by position (anterior subdivision of the PeVN) and projection
      target (lateral septum). No assay is named for the Th+/Dat1+ labelling
      in the quoted passage, so both markers carry marker_type NOT_STATED.

      Transmitter caveat. nt_type is recorded as dopamine on the strength of
      the Th/Dat1 pair and the sources' own naming, not a dopamine
      measurement. Morales et al. 2025 propose that the periventricular alar
      (anterior) hypothalamus contains both Otp and non-Otp catecholaminergic
      cells and that, on single-cell transcriptomics, one of these may be
      glutamatergic and the other GABAergic (quote 277180255_3296e936) — and
      they explicitly flag that it is unknown which of the two is the
      lateral-septum-projecting subtype described here. No GABAergic or
      glutamatergic cl_term is therefore asserted, and the possibility that
      this node as currently defined spans two transmitter programmes is open.

      Position. "Anterior subdivision of the PeVN" is the source's own
      wording and is not resolved to an Allen (MBA) subdivision; see the soma
      location's source notes for why the whole-nucleus UBERON term is used
      instead. Note the tension with the parent node's framing, where
      Korchynska describes A14 neurons generally as "dispersed in the medial
      subdivision of the periventricular nucleus" — medial and anterior are
      used in the same paper for, respectively, the whole A14 group and this
      subtype within it.

      Projection. The lateral-septum target is directly traced (reciprocal
      viral tracing plus ex vivo optogenetics), but the source does not report
      how many of the anterior-subdivision cells project there, nor which part
      of the lateral septal nucleus is innervated. Whether this subtype also
      has the parent population's neuroendocrine outputs is untested — the
      sources contrast it with the median-eminence-projecting sibling but do
      not show that it lacks such a projection.

      Not recorded. No morphology, electrophysiology, cell count, sex bias or
      neuropeptide is reported for this subtype. Romanov et al. 2020
      (PMID:32499648) resolve four morphologically and electrophysiologically
      distinct parvocellular dopamine subtypes in the A14/PeVN territory but
      do not say which, if any, is this one, so none of those profiles is
      carried here. The somatostatin of this literature belongs to the
      lateral-septum neurons these cells synapse onto, and the neuromedin S to
      the suprachiasmatic neurons that innervate them — neither is a peptide
      of these cells.

      Afferents and function. The dense suprachiasmatic neuropeptidergic
      innervation of this subtype, its dark-phase activity increase, and its
      proposed role in locomotion have no schema field and are not asserted
      here; they are recorded in
      research/hypothalamus/20261127_hypothalamus_report_ingest/unplaced/anterior_pevn_ls_projecting_dopamine_neuron.yaml.
