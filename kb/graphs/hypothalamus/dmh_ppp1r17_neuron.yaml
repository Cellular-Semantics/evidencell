    notes: >
      No neurotransmitter identity is recorded: the sources give Ppp1r17
      expression, DMH location and absence of the leptin receptor only, and
      neither states the fast transmitter or any peptide output of this
      population. The DMH contains both GABAergic and glutamatergic neurons,
      so no transmitter can be inferred safely for this type from the
      supplied material. Morphology, intrinsic electrophysiology, projection
      targets and developmental origin are likewise undefined in the sources.
      The marker evidence is uneven: the primary functional paper
      (PMID:33753517) names no detection assay for PPP1R17 in the quoted
      passage, writing the marker as a protein name while labelling the
      population DMHPpp1r17; only the later atlas-based selection
      (PMID:37624889) ties Ppp1r17 to DMH transcript expression validated
      against Allen in situ data. The exclusion markers listed as negative are
      cluster-level selection criteria applied when DMH neuron types were
      defined (clusters enriched for a neighbouring-nucleus gene were
      discarded), not direct per-cell absence measurements in this population;
      the leptin receptor entry is the one absence reported for the PPP1R17
      cells themselves. Ppp1r17 is a DMH marker in local anatomical context
      rather than a brain-wide exclusive marker, and the relation of this
      population to the neighbouring Pdyn, Grp and Cck DMH classes is
      unresolved in the supplied sources and may involve overlap.
