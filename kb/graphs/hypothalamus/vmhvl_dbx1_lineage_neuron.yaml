      label: Mus musculus
      name_in_source: "mouse"
    synonyms:
      - term: "Dbx1-derived neurons in the VMH"
        sources:
          - ref: "PMID:27209204"
            quote_key: "9550590_0bdb13aa"
            method: "name used in the discussion for the VMH Dbx1-lineage population, the majority of which lies in VMHvl"
      - term: "Dbx1-lineage cells"
        sources:
          - ref: "PMID:27209204"
            quote_key: "9550590_e5547345"
            method: "name used in the results for the fate-mapped cells scored in the ventrolateral part of the nucleus"
    subtype_of:
      - parent: vmhvl_neuron
        kind: DEFINITIONAL
        confidence: MODERATE
        sources:
          - ref: "PMID:27209204"
            quote_key: "9550590_e5547345"
            method: "Dbx1-Cre fate mapping; the majority of VMH Dbx1-lineage cells are scored in the ventrolateral part of the nucleus (VMHvl), overlapping ERα- and aromatase-positive cells there"
            scope: "postnatal mouse VMH, both sexes"
        notes: >
          This node is scoped to the VMHvl fraction of the Dbx1 lineage, so
          containment in the VMHvl population holds by definition. Sokolowski
          2016 reports only that the majority of VMH Dbx1-lineage cells lie in
          VMHvl, with some overlap with SF1-positive cells in VMHdm — the
          broader name "Dbx1-derived neurons in the VMH" therefore extends
          beyond this node.
    anatomical_location:
      - id: MBA:785
        label: "Ventromedial hypothalamic nucleus, ventrolateral part"
        name_in_source: "the ventrolateral part of the nucleus (VMHvl)"
        compartment: SOMA
        sources:
          - ref: "PMID:27209204"
            quote_key: "9550590_e5547345"
            method: "Dbx1 lineage fate-mapping: reporter-labelled Dbx1-lineage cells scored across VMH subdivisions, the majority falling in the ventrolateral part of the nucleus"
            scope: "postnatal mouse VMH, both sexes"
            notes: >
              The quote locates the majority of the VMH Dbx1 lineage in
              VMHvl; it gives no count or ratio, so no cell_count is
              recorded. This node is scoped to that VMHvl fraction.
    defining_markers:
      - name_in_source: "Dbx1"
        symbol: Dbx1
        ncbi_gene_id: "NCBIGene:13172"
        sources:
          - marker_type: TRANSGENE_REPORTER
            ref: "PMID:27209204"
            quote_key: "9550590_e5547345"
            method: "Dbx1 lineage reporter (Cre-based fate mapping) labelling; the quote names the population as Dbx1-lineage / DBX1-lineage cells and does not name the reporter allele"
            scope: "postnatal mouse VMHvl, both sexes"
            notes: >
              Lineage label, not an adult marker. Cre-based fate mapping
              reports cumulative — here developmental — Dbx1 expression in
              the progenitors of these cells; the sources make no claim that
              Dbx1 transcript or protein is present in the postnatal neuron.
              It is recorded here because the schema offers no lineage or
              fate-map field and TRANSGENE_REPORTER is the marker_type the
              schema defines for cumulative Cre-dependent labelling.
          - marker_type: TRANSGENE_REPORTER
            ref: "PMID:27209204"
            quote_key: "9550590_0bfc4760"
            method: "Dbx1 lineage reporter labelling scored across postnatal hypothalamic nuclei (LH, Arc, VMH)"
            scope: "postnatal mouse hypothalamus — lineage-wide, not restricted to the VMH fraction"
      - name_in_source: "ERα"
        symbol: Esr1
        ncbi_gene_id: "NCBIGene:13982"
        modifier: ENRICHED
        sources:
          - marker_type: NOT_STATED
            ref: "PMID:27209204"
            quote_key: "9550590_e5547345"
            method: "ERα-labelled cells scored against Dbx1-lineage reporter cells in VMHvl; the quote names no detection assay"
            scope: "postnatal mouse VMHvl"
            notes: >
              The reported 57.3 ± 7.0% is the share of the total VMHvl ERα
              population that carries the Dbx1 lineage label — the opposite
              denominator to the one this field asserts. The quote's
              "extensive overlap" is what supports ERα as an enriched marker
              of this lineage subset; the fraction of Dbx1-lineage VMHvl
              cells that are ERα-positive is not stated.
          - marker_type: NOT_STATED
            ref: "PMID:27209204"
            quote_key: "9550590_0bfc4760"
            method: "statement that Dbx1+ progenitors generate a large proportion of the ERα-expressing hypothalamic populations; the quote names no detection assay"
            scope: "postnatal mouse hypothalamus (LH, Arc and VMH taken together)"
      - name_in_source: "aromatase"
        symbol: Cyp19a1
        ncbi_gene_id: "NCBIGene:13075"
        modifier: ENRICHED
        sources:
          - marker_type: NOT_STATED
            ref: "PMID:27209204"
            quote_key: "9550590_e5547345"
            method: "aromatase-labelled cells scored against Dbx1-lineage reporter cells in VMHvl of both sexes; the quote names no detection assay"
            scope: "postnatal mouse VMHvl, males and females"
            notes: >
              As for ERα, the quoted 58.2 ± 5.6% (males) and 60.7 ± 5.6%
              (females) are shares of the total aromatase populations that
              carry the Dbx1 lineage label, not shares of this node's cells
              that express aromatase.
          - marker_type: NOT_STATED
            ref: "PMID:27209204"
            quote_key: "9550590_0bfc4760"
            method: "statement that Dbx1+ progenitors generate, to a lesser extent, the aromatase-expressing hypothalamic populations; the quote names no detection assay"
            scope: "postnatal mouse hypothalamus (LH, Arc and VMH taken together)"
            notes: >
              Lineage-wide statement that qualifies the aromatase
              contribution as smaller than the ERα one; the VMHvl-specific
              figures in the companion quote are nevertheless high.
    nt_type:
      name_in_source: "the excitatory neurotransmitter glutamate (vesicular glutamate transporter 2, Vglut2)"
      cl_terms:
        - id: CL:0000679
          label: "glutamatergic neuron"
          name_in_source: "glutamate"
      sources:
        - ref: "PMID:26629409"
          quote_key: "6881112_017e3b13"
          method: >
            Inferred, not measured for this subset: the source states that
            nearly all VMH neurons, including those of the ventrolateral VMH
            (VMHvl) subregion, release glutamate and use Vglut2, and the
            quote names no assay. Sokolowski et al. 2016 (PMID:27209204)
            report no transmitter phenotype for the Dbx1 lineage in VMH, so
            the value is carried over from the containing VMHvl population.
          scope: "adult mouse VMH including VMHvl — not resolved by developmental lineage"
          support: WEAK
    cl_mapping:
      cl_term:
        id: CL:0000679
        label: "glutamatergic neuron"
        name_in_source: "Dbx1-lineage VMHvl neuron"
      mapping_type: BROAD
      mapping_notes: >
        Searched CL for "lineage", "Dbx1", "hypothalamic neuron" and
        "ventromedial hypothalamic neuron" — no CL term for a
        lineage-of-origin-defined or VMH-region-defined neuron exists (CL has
        no developmental-lineage-based neuron terms of this kind, and no
        hypothalamus-region-specific neuron terms at all). The node is
        subtype_of vmhvl_neuron by definition (scoped to the VMHvl fraction of
        the Dbx1 lineage), and vmhvl_neuron itself is EXACT-mapped to
        CL:0000679 ("a neuron that is capable of some neurotransmission by
        glutamate secretion") on the grounds that glutamatergic identity is
        its defining criterion. Checked CL:0000679's children — none is a
        lineage-defined or VMH-specific term. CL:0000679 is therefore the
        nearest term this node fully satisfies, inherited as BROAD from the
        parent mapping. An EXACT match would need a CL term for
        Dbx1-lineage-derived VMHvl neurons.
    definition_references:
      - "PMID:27209204"
    notes: >
      LINEAGE, NOT AN ADULT MARKER. Dbx1 is recorded in defining_markers
      only because the schema has no lineage or fate-map field. The sources
      assert Dbx1 expression in the progenitors of these cells, revealed by
      Cre-based lineage reporter labelling; they make no claim about Dbx1
      transcript or protein in the postnatal neuron, and the report states
      explicitly that Dbx1 is a developmental lineage marker rather than an
      adult transmitter or peptide marker. Candidate scoring that treats
      defining_markers as adult expression should exclude this entry.

      DENOMINATOR OF THE OVERLAP FIGURES. Every percentage Sokolowski et al.
      2016 (PMID:27209204) give for this population is a share of the ERα,
      aromatase or SF1 population that carries the lineage label — 57.3 ±
      7.0% of VMHvl ERα cells, 58.2 ± 5.6% (male) and 60.7 ± 5.6% (female)
      of VMHvl aromatase cells. The converse quantity, the fraction of
      Dbx1-lineage VMHvl cells expressing ERα or aromatase, is not reported.
      The ENRICHED modifiers therefore rest on the qualitative "extensive
      overlap", not on the quoted numbers.

      SCOPE OF THE SOURCE'S POPULATION. Sokolowski's unit of analysis is the
      VMH (indeed the hypothalamus-wide) Dbx1 lineage; this node is scoped
      to its VMHvl fraction. Two findings in the same quotes fall outside
      that scope and are not recorded as properties here: the 15.1 ± 0.7%
      overlap with SF1-positive cells, which is in VMHdm, and the
      neuropeptide populations (Pmch, Nesfatin, Cart, Hcrt, Agrp, and to a
      lesser extent Pomc and TH) that Dbx1 progenitors generate in LH and
      Arc. No neuropeptide is attributed to the VMH fraction of the lineage,
      which is why neuropeptides is empty rather than absent for lack of
      searching.

      TRANSMITTER INFERRED. nt_type is carried over from the containing
      VMHvl population (Cheung et al. 2015, PMID:26629409: nearly all VMH
      neurons, including VMHvl, release glutamate and use Vglut2) and
      marked support: WEAK. No source measures a transmitter phenotype for
      the Dbx1 lineage in VMH. Slc17a6 is deliberately not listed in
      defining_markers for the same reason — the assertion is VMH-wide and
      adds nothing subtype-specific.

      NO ELECTROPHYSIOLOGY OR MORPHOLOGY. Neither the report nor the cited
      sources characterise intrinsic properties or morphology of
      Dbx1-lineage VMHvl cells; the parent node's profiles come from
      whole-VMH vGluT2-GFP recordings and are not transferable to a
      lineage-defined subset.
