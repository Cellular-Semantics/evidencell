            quote_key: "218686941_736c21b7"
            method: >
              projection reported for genetically defined MB cell types; the
              quoted passage names no tracing method, so the claim is recorded
              as indirect rather than as traced projection evidence
            scope: >
              mouse; reported jointly for the genetically defined MB cell
              types rather than for any single type, and so applied here to
              the MB neuron class as a whole
            support: WEAK
            notes: >
              The projection is topographic: different genetically defined MB
              types reach different parts of the anterior thalamic group. The
              quote does not say which type reaches which anterior thalamic
              nucleus, so no subdivision-level target is recorded.
    definition_references:
      - "https://doi.org/10.1101/2020.05.14.096818"
    notes: >
      Suspected heterogeneity is the defining caveat for this node: the one
      source that resolves the MB finds several transcriptionally distinct
      clusters that segregate within the neuroanatomical subdivisions of the
      MB, so this node is a class containing multiple molecular types rather
      than a single type. The correspondence between the classical mammillary
      subnuclei and the atlas clusters is not recoverable from the supplied
      material, and the clusters are not individually named. No defining
      markers are recorded: the source states that its populations are defined
      by suites of discriminatory markers validated by FISH, but the supplied
      quote lists no MB marker gene, so marker-defined MB classes are known to
      exist without any marker being citable here. Neuropeptides, morphology,
      intrinsic electrophysiology and developmental origin are not
      characterised for MB neurons in the supplied sources. Neurotransmitter
      identity (nt_type) is also not recorded: no source in this run states
      a transmitter for MB neurons, so the field is left unset pending
      confirmation against a primary paper in evidence-extraction, rather
      than recording an inferred value no source asserts. The sole source is
      a preprint (https://doi.org/10.1101/2020.05.14.096818); its
      peer-reviewed version should be substituted when the reference store
      resolves it.
