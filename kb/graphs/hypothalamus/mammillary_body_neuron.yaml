    anatomical_location:
      - id: MBA:331
        label: "Mammillary body"
        name_in_source: "mammillary bodies (MB)"
        compartment: SOMA
        sources:
          - ref: "https://doi.org/10.1101/2020.05.14.096818"
            quote_key: "218686941_736c21b7"
            method: >
              scRNA-seq of >16,000 single cells from the ventral posterior
              hypothalamus, with differentially expressed genes of selected
              neuronal populations validated by fluorescence in situ
              hybridization; MB clusters were related to the neuroanatomical
              subdivisions of the MB
            scope: "mouse ventral posterior hypothalamus, mammillary body"
            notes: >
              The source resolves the MB into several transcriptionally
              distinct clusters that segregate by MB subdivision. MBA has
