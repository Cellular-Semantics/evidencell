    is_terminal: false
    definition_references:
      - "https://doi.org/10.1101/2021.08.31.458231"
      - "PMID:33060330"
      - "PMID:24009552"
    notes: >
      Every type-specific property here rests on a single source (Short et al.
      2021, a preprint), in neonatal male mice. The Ntng1-versus-Avp split of
      glutamatergic PVN Crh neurons, and the concentration of the Ntng1 cells
      in the middle PVN, have not been reproduced in adult or female animals,
      and the preprint has not been through peer review.

      The anatomical grounding is coarse by necessity. The source gives a
      rostrocaudal position ("the middle region of the PVN"), while the Allen
      mouse atlas divides PVH by magnocellular/parvicellular/descending
      division and part; the two schemes do not intersect, so MBA:38 (the
      whole nucleus) is all that can be asserted. This costs the node its
      most discriminative spatial feature for atlas mapping: a candidate
      cluster cannot be scored on middle-PVN position against MBA:38. Xu et
      al. 2020 use an explicitly rostrocaudal framing of PVH (aPVH / mPVH /
      pPVH, 280 µm apart) and could in principle supply the missing
      coordinate, but they do not localise the Ntng1-expressing CRH cells.

      Crh and Slc17a6 are inherited from this node's defining context rather
      than scored on the Ntng1-expressing cells in isolation: the quoted
      passage establishes them for the glutamatergic Crh+ class and then
      subdivides that class by Avp versus Ntng1. Ntng1 is the only marker
      here that distinguishes this node from its sibling pvn_crh_avp_neuron.

      Xu et al. 2020 report that all PVH clusters carry Slc17a6 and lack
      Slc32a1; that is a class-wide PVH statement and was not written to
      negative_markers on this node, which no source has scored for Slc32a1.

      The report gives no dataset accession for the Short et al. single-cell
      data, so cluster 4 cannot be recorded as prior_cluster_label and the
      cluster cannot be re-identified computationally. See
      research/hypothalamus/20261127_hypothalamus_report_ingest/unplaced/pvn_crh_ntng1_neuron.yaml.
