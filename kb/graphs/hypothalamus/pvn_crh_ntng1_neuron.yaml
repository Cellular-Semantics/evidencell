        label: "corticotropin-releasing neuron"
        name_in_source: "PVN CRH-Ntng1 neuron"
      mapping_type: BROAD
      mapping_notes: >
        Searched (OAK CL semsql DB, ols4 unavailable): "CRH neuron" (only
        CL:4072021), "Ntng1" (only a Protein Ontology hit for netrin-G1
        protein, not a CL term), "netrin", "glutamatergic neuron"
        (CL:0000679), "paraventricular", "parvocellular", "hypothalamic
        neuron" — no CL term exists for an Ntng1-defined subset of CRH
        neurons, and CL:4072021 has no child terms. This node is a subset of
        the parent pvn_crh_glutamatergic_neuron (itself BROAD to CL:4072021,
