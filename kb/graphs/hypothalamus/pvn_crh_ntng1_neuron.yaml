    anatomical_location:
      - id: MBA:38
        label: "Paraventricular hypothalamic nucleus"
        name_in_source: "middle region of the PVN"
        compartment: SOMA
        sources:
          - ref: "https://doi.org/10.1101/2021.08.31.458231"
            quote_key: "237393232_d3cd021e"
            method: "CRH-tdTomato immunohistochemistry with in situ hybridization for Slc17a6 and Gad2; the Avp- and Ntng1-defined glutamatergic subgroups scored by position within PVN"
            scope: "neonatal male mouse PVN"
            notes: >
              The source localises this population to "the middle region of
              the PVN". That is a rostrocaudal level, not one of the Allen
              atlas PVH subdivisions, which partition the nucleus by
              magnocellular/parvicellular/descending division and part; no MBA
              term denotes a middle rostrocaudal third. The whole-nucleus term
              MBA:38 is therefore the most specific grounding the source
              supports, and the sub-nuclear position is left in
              name_in_source. Contrast the sibling CRH-AVP population, which
              the same passage reports as distributed sparsely throughout the
              PVN, and the parent glutamatergic Crh+ class, reported in the
              same passage as concentrated in the dorsal parvocellular
              subdivision — the three statements are not reconciled by the
              source.
          - ref: "PMID:33060330"
            quote_key: "222410534_daea8c58"
            method: "multiplexed FISH mapping of PVH marker genes in rostrocaudally separated subregions"
            scope: >
              mouse PVH; this source does not localise the Ntng1-expressing
              CRH population. It is cited only because it uses the same
              rostrocaudal framing — anterior (aPVH), middle (mPVH) and
              posterior (pPVH) PVH, 280 µm apart — that makes Short et al.'s
              "middle region of the PVN" an interpretable coordinate rather
              than an atlas subdivision.
