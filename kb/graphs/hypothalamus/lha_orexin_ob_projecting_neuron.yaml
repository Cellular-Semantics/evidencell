    defining_markers:
      - name_in_source: "orexin-A"
        symbol: Hcrt
        ncbi_gene_id: "NCBIGene:15171"
        sources:
          - ref: "PMID:37434469"
            marker_type: PROTEIN
            method: "orexin-A immunohistochemistry on sections containing retrogradely labelled cells"
            scope: >
              adult mouse hypothalamus — orexin-A immunoreactivity is the
              marker used to pick this population out of the hypothalamic
              input to the main olfactory bulb; 22% of the retrogradely
              labelled hypothalamic neurons expressed it.
            quote_key: "259832148_069c0887"
            notes: >
              The source assays the orexin-A peptide; orexin-A, orexin-B and
              their prepro-orexin precursor are all products of the single
              gene Hcrt, so the marker is pinned to Hcrt. No marker beyond
              orexin-A is asserted for this subpopulation: it is delineated by
              projection target and cell body area, not by a distinct
              molecular profile.
