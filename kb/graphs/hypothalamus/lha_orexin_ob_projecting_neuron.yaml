        notes: >
          Containment is definitional, but the sources are from one group.
          The report treats projection-defined orexin ensembles as
          overlapping and spatially distributed rather than segregated: these
          cells spatially overlap the orexin-A neurons that do not innervate
          the bulb, and are distinguished from them only by cell body area.
