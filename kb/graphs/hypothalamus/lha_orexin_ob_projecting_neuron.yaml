      mapping_notes: >
        Searched CL for "olfactory bulb projecting", "centrifugal",
        "afferent neuron" and "orexin": no CL term exists for a
        projection-target-defined orexin/hypocretin subpopulation (the only
        olfactory-bulb-related CL terms are intrinsic OB cell types —
        CL:1001434 olfactory bulb interneuron, CL:1001503 olfactory bulb
