    cl_mapping:
      cl_term:
        id: CL:4072021
        label: "corticotropin-releasing neuron"
        name_in_source: "GABAergic PVN CRH neuron"
      mapping_type: BROAD
      mapping_notes: >
        Searched (OAK CL semsql DB, ols4 unavailable): "CRH neuron" (returns only
        CL:4072021), "GABAergic neuron" (CL:0000617), "paraventricular",
        "parvocellular", "parvicellular", "vasopressin", "hypothalamic neuron" —
        no CL term exists for a GABAergic- or Gad2-defined subset of CRH
        neurons, and CL:4072021 has no child terms. This node is the subset of
        the parent pvn_crh_neuron (cl_mapping EXACT to CL:4072021) carrying a
        GABAergic molecular signature, per its subtype_of assertion, so
        CL:4072021 is the nearest and most specific containing term — more
        specific than CL:0000617 (GABAergic neuron), which does not capture
        the CRH-defining criterion. Would need a CL term combining "CRH neuron"
        and "GABAergic" for EXACT.
    definition_references:
      - https://doi.org/10.1101/2021.08.31.458231
      - PMID:33060330
      - PMID:24009552
      - PMID:37599997
    notes: >
      Contradicted by the adult PVH single-cell dataset: PMID:33060330 reports
      that all PVH clusters expressed Sim1, contained the excitatory marker
      Vglut2 (Slc17a6) and lacked the inhibitory marker Vgat (Slc32a1), while
      still using Gad2 as one of the genes subdividing those clusters. That
      source therefore treats Gad2 as a transcriptomic subclass marker inside
      an entirely glutamatergic PVH, not as evidence of a GABAergic PVH
      population. PMID:24009552 and PMID:37599997 likewise describe PVN CRH
      neurons as glutamatergic, the former contrasting them with GABAergic CRH
      neurons of the BNST. The whole of this node's positive evidence is one
      preprint (https://doi.org/10.1101/2021.08.31.458231) in neonatal male
      mice, and whether its Gad2-expressing Crh+ group is a developmental
      feature, a dissection or ambient-RNA artefact, or a genuine adult
      minority is unresolved by the sources here. The node is recorded as that
      source states it; a reviewer may prefer to hold it as a heterogeneity
      note on pvn_crh_neuron instead.
      Transmitter evidence is molecular only: Gad2 transcript and a "GABAergic
      molecular signature", with no demonstration of GABA release and no
      report of Slc32a1 in these cells. Slc17a6 is not recorded as a negative
      marker because no source shows it absent from the Gad2-expressing cells;
      the contrast drawn is between cell groups, not an explicit absence.
      Species, age and sex scope: all primary evidence is from neonatal male
      mice, so the properties here should not be read as established for adult
      or female PVN.
      Marker wording: "neurotensinergic" is the source's adjective for cluster
      2, not a named transcript; it is recorded as Nts because neurotensin
      names a single mouse gene. No cell-count, proportion or dataset
      accession is given for the GABAergic cluster in the sources available,
      so prior_dataset_accession and prior_cluster_label are left unset
      despite the population being cluster-defined.
