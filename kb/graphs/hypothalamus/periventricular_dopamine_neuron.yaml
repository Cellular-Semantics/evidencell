    morphology:
      description: >
        Parvocellular (small-bodied) dopamine neurons. The A14/PeVN territory
        is not morphologically uniform — four morphologically and
        electrophysiologically distinct parvocellular dopamine subtypes have
        been resolved within it — so no single somatodendritic description
        holds for the population as a whole.
      sources:
        - ref: "PMID:32499648"
          method: >
            morphological and electrophysiological classification of
            parvocellular dopamine neurons in Th-GFP and
            Slc6a3-Ires-cre::Ai14 mice
          scope: "mouse A14 territory (PeVN)"
          quote_key: "218528429_cb5dea70"
    colocated_types:
      - neighboring_type: "peptidergic neurons of the medial hypothalamic stratum"
        spatial_relationship: INTERSPERSED
        notes: >
          Periventricular TH-positive neurons are described as intermixed with
          neighbouring peptidergic populations in the medial hypothalamic
          stratum at both the alar preoptic (PA) and supraopto-paraventricular
          (SPa) levels (PMID:35601999, quote 248530111_06dc7635). That
          analysis is in adolescent rat rather than mouse, so the colocation
          is carried as cross-species context and the peptidergic partners are
          not identified by type.
    cl_mapping:
      cl_term:
        id: CL:0000700
        label: "dopaminergic neuron"
        name_in_source: "Periventricular dopamine neuron"
      mapping_type: EXACT
      mapping_notes: >
        Searched "dopaminergic neuron" in CL. CL:0000700 ("a neuron that
        releases dopamine as a neurotransmitter") matches this node's
        defining criterion in full — the node's identity is explicitly
        dopaminergic (not merely TH-expressing like its parent
        hypothalamic_th_neuron, EXACT CL:4033050 catecholaminergic neuron),
        with no additional narrowing marker beyond location and
        developmental origin, which are recorded separately.
    definition_references:
      - "PMID:36209152"
      - "PMID:32499648"
      - "PMID:6131950"
      - "PMID:35601999"
      - "PMID:31704726"
    notes: >
      Scope of the name. The modern mouse usage this node follows is the A14
      dopamine group of the periventricular nucleus (PeVN) along the third
      ventricle (PMID:36209152). Older catecholamine mapping used
      "periventricular dopaminergic neurons" as a wider topographic label for
      three rostrocaudal clusters — preoptic periventricular, midtuberal
      periventricular, and caudal posterior hypothalamic including the bed
      nucleus of the supramammillary commissure (PMID:6131950, quote
      8743092_0452ff39). All three are recorded in anatomical_location, so
      this node currently carries the broad reading; if it is later split into
      a broad periventricular system and a narrow PeVN/A14 type, the MBA:133,
      MBA:118 and MBA:946 entries are the ones that move. Prosomeric mapping
      likewise describes A14 as an extensive alar periventricular stratum
      rather than a sharply bounded nucleus (PMID:35601999).

      Internal heterogeneity. This is not one cell type. Four morphologically
      and electrophysiologically distinct parvocellular dopamine subtypes have
      been resolved in the A14 (PeVN) territory (PMID:32499648, quote
      218528429_cb5dea70), of which only two are characterised in the
      available literature — a medio-posterior Onecut3+/Nmur2+ neuroendocrine
      type and an anterior Th+/Dat1+ lateral-septum-projecting type. The
      remaining two have no markers, projections or physiology reported, so
      the properties on this node are the population-level ones and may not
      hold uniformly across all four.

      Transmitter caveats. nt_type is recorded as dopamine only, but the
      population is probably not a pure monoaminergic class: many hypothalamic
      TH+ cells arising from Ascl1+ progenitors retain GAD1 and/or GAD2 and
      other GABAergic markers at the mRNA level, and the degree of TH/GABA
      marker co-expression varies by hypothalamic subdivision (PMID:40177299,
      quote 277180255_1f79ae17). More specifically for this territory, the
      periventricular alar (anterior) hypothalamus (Pe) is proposed to contain
      both Otp and non-Otp catecholaminergic cells, with single-cell
      transcriptomics raising the possibility that one of these subtypes is
      glutamatergic and the other GABAergic (PMID:40177299, quote
      277180255_3296e936). That is a working model, not a settled subtype map,
      so no GABAergic or glutamatergic cl_term is asserted here; it should be
      revisited at evidence-extraction.

      Marker caveats. No marker on this node is specific to A14/PeVN. TH marks
      catecholaminergic rather than dopaminergic cells, and Ddc and Slc18a2
      are reported for the hypothalamic dopamine class as a whole rather than
      for A14; Dat1/Slc6a3 is reported for the anterior PeVN subdivision in
      PMID:36209152 and as a generic dopaminergic transcript in PMID:31704726.
      The selective markers in this literature (Onecut3, Nmur2) belong to a
      subtype, not to the whole population. Separating A14 cells from
      neighbouring arcuate A12 cells therefore requires exact position plus a
      marker combination, not TH alone.

      Neuropeptides. No neuropeptide is recorded: the report finds no direct
      evidence that A14/PeVN dopamine neurons synthesise a peptide. The
      peptides associated with this population in the sources (neuromedin S,
      somatostatin) belong to its afferent and target partners, not to the
      cells themselves.

      Development. Not a schema field, kept here for the record: hypothalamic
      dopamine neurons including the A14/PeVN territory arise through a
      cascading Ascl1 → Isl1 programme from Ascl1+ intermediate progenitors
      and pass through a GABA-progenitor intermediate state (PMID:32499648,
      quotes 218528429_19fbe10c and 218528429_daa2121c), and loss of
      SLIT-ROBO signalling impairs both the production and the positioning of
      periventricular dopamine neurons (quote 218528429_bc262f2b). Ascl1 and
      Isl1 are lineage markers, not mature cell-type markers, so they are
      deliberately not in defining_markers.
