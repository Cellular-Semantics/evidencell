    definition_references:
      - "https://doi.org/10.64898/2026.10.13.758728"
      - "PMID:31375626"
    notes: >
      A single source (Devere et al. 2026, a preprint,
      https://doi.org/10.64898/2026.10.13.758728) names and characterises this
      type; Seifinejad et al. 2019 (PMID:31375626) is supporting context only,
      reporting that selective loss of HCRT neurons halves QRFP expression
      rather than characterising the double-positive population. The
      population is defined by graded co-expression, not a clean boundary, and
      the two assays disagree on how much of the orexin class it covers: 86%
      of orexin-mRNA-expressing LHA cells co-express 26RFa mRNA by RNAscope,
      but only 62% of orexin-immunostained cells are 26RFa-tdTomato positive.
      The report explicitly warns that Qrfp/26RFa "is not a pan-orexin
      marker", so the node is the 26RFa-positive subset and not a relabelling
      of the orexin class. Cell-class scope is likewise partial: NeuN labels
      only 66% of 26RFa/orexin-expressing LHA cells, so a third of them are
      non-neuronal and fall outside this node. nt_type is not measured in
      26RFa-positive cells; it is inherited from lha_orexin_neuron. No
      electrophysiological or morphological characterisation of this subtype
      is reported.
