            method: >
              single-cell RNA-seq — both Slc6a3 and Onecut3 reported as
              predominantly restricted to this particular cell population
            scope: "adult mouse hypothalamic central column"
            quote_key: "205439542_96d0708f"
          - marker_type: TRANSGENE_REPORTER
            ref: "PMID:27991900"
            method: >
              Dat1-Cre::ROSA26Sor CAG-tdTomato mice, giving life-long expression
              profiling of DAT-expressing cells; coincident DAT and onecut-3
              localisation used to place the population anatomically
            scope: "adult mouse periventricular nucleus"
            quote_key: "205439542_96d0708f"
            notes: >
              The source writes the protein/driver as "DAT" and "Dat1" and the
              gene as "Slc6a3"; these name the same mouse dopamine transporter
