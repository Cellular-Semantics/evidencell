    anatomical_location:
      - id: UBERON:0014667
        label: "periventricular nucleus of hypothalamus"
        name_in_source: "medio-posterior subdivision of the periventricular area"
        compartment: SOMA
        sources:
          - ref: "PMID:27991900"
            method: >
              coincident immunohistochemistry for onecut-3 and enzymatically
              active TH phosphorylated at Ser40 on a Th-GFP background, with
              serial sections and reconstructive histochemistry in optically
              cleared tissue (lightsheet microscopy)
            scope: "adult mouse periventricular nucleus of the hypothalamus"
            quote_key: "205439542_96d0708f"
            notes: >
              The onecut-3+ cells form a cell continuum spanning the SCN-Arc
