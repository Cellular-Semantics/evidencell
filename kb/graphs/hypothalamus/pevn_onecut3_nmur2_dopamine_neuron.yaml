        - ref: "PMID:27991900"
          method: >
            immunohistochemistry for enzymatically active TH phosphorylated at
            Ser40 together with onecut-3 on a Th-GFP background, with Slc6a3/DAT
            (dopamine transporter) predominantly restricted to the same
            population
          scope: "adult mouse periventricular nucleus"
          quote_key: "205439542_96d0708f"
          notes: >
            Dopaminergic rather than merely catecholaminergic for this subtype
            rests on the coincidence of phospho-Ser40 TH with Slc6a3/DAT
            restriction to the same cells, not on a direct dopamine measurement.
    defining_markers:
      - name_in_source: "Onecut3"
        symbol: Onecut3
        ncbi_gene_id: "NCBIGene:246086"
        sources:
          - marker_type: TRANSCRIPT
            ref: "PMID:27991900"
            method: >
              single-cell RNA-seq of dissociated neurons from a central column of
              the mouse hypothalamus — unique coexpression of Onecut3 with Nmur2
              defines this dopamine population
            scope: "adult mouse hypothalamic central column"
            quote_key: "205439542_ee40b322"
          - marker_type: PROTEIN
            ref: "PMID:27991900"
            method: >
              immunohistochemistry for onecut-3, detected coincidentally with
              phospho-Ser40 TH on a Th-GFP background and with DAT in
              Dat1-Cre::ROSA26Sor CAG-tdTomato mice; no antibody named in the
              quoted passage
            scope: "adult mouse periventricular nucleus"
            quote_key: "205439542_96d0708f"
            notes: >
              The source writes the gene as "Onecut3" in the transcriptomic
              analysis and the protein as "onecut-3" in the histology; both name
              the same gene. Onecut3 is described as predominantly restricted to
              this cell population, which is what makes it the subtype's
              selective marker rather than a periventricular dopamine marker in
              general.
      - name_in_source: "Nmur2"
        symbol: Nmur2
        ncbi_gene_id: "NCBIGene:216749"
        sources:
          - marker_type: TRANSCRIPT
            ref: "PMID:27991900"
            method: >
              single-cell RNA-seq — Nmur2 is the second member of the unique
              coexpression pair (with Onecut3) that defines this dopamine
              population
            scope: "adult mouse hypothalamic central column"
            quote_key: "205439542_ee40b322"
            notes: >
              Transcriptomic only in the available literature; the histological
              anchoring of the subtype used Onecut3, DAT and phospho-TH, not
              Nmur2. Nmur2 is the neuromedin U receptor 2 gene, so it is a
              receptor marker, not a neuropeptide of these cells.
      - name_in_source: "Slc6a3"
        symbol: Slc6a3
        ncbi_gene_id: "NCBIGene:13162"
        sources:
