      - name_in_source: "TH"
        symbol: Th
        ncbi_gene_id: "NCBIGene:21823"
        modifier: LOW
        sources:
          - marker_type: TRANSGENE_REPORTER
            ref: "PMID:27991900"
            method: >
              Th-GFP reporter mice; GFP intensity quantified in these TH+ cells
              and compared with other TH+ cell groups
            scope: "adult mouse periventricular nucleus"
            quote_key: "205439542_96d0708f"
            notes: >
              LOW is relative, and is a reporter measurement: GFP signal in these
              cells was significantly (P < 0.001) lower than in other TH+ cell
              groups of the same Th-GFP mice. It is not a direct quantification
              of Th mRNA or TH protein, and the comparison group is "other TH+
              cell groups" rather than a named type.
      - name_in_source: "enzymatically active TH phosphorylated at residue Ser40"
        sources:
          - marker_type: PROTEIN
            ref: "PMID:27991900"
            method: >
              immunohistochemistry for TH phosphorylated at Ser40, detected
              coincidentally with onecut-3 on a Th-GFP background; the
              phospho-Ser40 detection follows Tekin et al. 2014 as cited by the
              source, and no antibody is named in the quoted passage
            scope: "adult mouse periventricular nucleus"
            quote_key: "205439542_96d0708f"
            notes: >
              Recorded with name_in_source only: this is a post-translational
              modification state of the TH protein, not a gene product in its own
              right, so it carries no symbol or gene ID (the Th gene is recorded
              separately above, and Th mRNA is not a proxy for the
              phosphorylation state). The phospho-Ser40 signal is what the source
              treats as the readout of enzymatically active, dopamine-synthesising
              TH, and the same study reports that TH phosphorylation in these
              cells is regulated in a circadian fashion.
