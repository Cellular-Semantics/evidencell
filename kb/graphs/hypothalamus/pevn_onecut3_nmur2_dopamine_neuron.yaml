          method: >
            immunohistochemistry for onecut-3 and phospho-Ser40 TH on a Th-GFP
            background, with dendritic orientation read from serial sections and
            reconstructive histochemistry in optically cleared tissue
          scope: "adult mouse periventricular nucleus"
          quote_key: "205439542_96d0708f"
          notes: >
            Dendritic orientation is the only somatodendritic feature the source
            gives for this subtype; soma size, dendritic extent and axonal
            morphology are not described.
    colocated_types:
      - neighboring_type: "arcuate (A12) dopamine neurons (arc_tida_dopamine_neuron)"
        spatial_relationship: ADJACENT
        notes: >
          The onecut-3+ periventricular cells segregate dorsally from the other
          dopamine cells residing in the arcuate nucleus (PMID:27991900, quote
          205439542_96d0708f), and the same study recognises them as distinctly
          different, in molecular makeup and connectivity, from the dorsomedial
          A12 dopamine group (quote 205439542_97445aba). The dorsal offset is
          what separates the two populations in tissue; TH alone does not.
    cl_mapping:
      cl_term:
        id: CL:4072011
        label: "A14 dopaminergic neuron"
        name_in_source: "Onecut3/Nmur2 periventricular A14 dopamine neuron"
      mapping_type: BROAD
      mapping_notes: >
        Searched "Onecut3" and "Nmur2" (no CL hits), "periventricular
        dopaminergic neuron" and "neuroendocrine dopaminergic neuron" (no
        hits), then "A14 dopaminergic neuron" (hit: CL:4072011). Read
        CL:4072011's definition: "A type of dopaminergic neuron located in
        the periventricular nucleus of the hypothalamus and projecting to
        the lateral septum and the median eminence. It is contributing to
        neuroendocrine functions, locomotion and stress regulation." This
        spans both characterized A14 projection subtypes — this node's
        medio-posterior, median-eminence-projecting population AND its
        sibling anterior_pevn_ls_projecting_dopamine_neuron's
        lateral-septum-projecting population — so it does not describe this
        node's population alone; it is the containing class, not an exact
        match. CL:4072011 has no descendants (checked), and no CL term for
        Onecut3, Nmur2, median-eminence-projecting dopamine neuron, or
        tuberoinfundibular dopamine neuron matches this narrower,
        marker-defined subtype, so CL:4072011 is the most specific
        containing term available. BROAD: a new CL term for this subtype
        (Onecut3+/Nmur2+, medio-posterior PeVN, median
        eminence/pituitary-intermediate-lobe projecting) would sit under
        CL:4072011. Would need a term keyed to Onecut3/Nmur2 coexpression
        and/or median-eminence projection, distinguishing it from the
        lateral-septum-projecting sibling, for an EXACT match.
    definition_references:
      - "PMID:27991900"
      - "PMID:32499648"
      - "PMID:36209152"
    notes: >
      Single-study basis. Every property on this node comes from one paper
      (Romanov et al. 2016, PMID:27991900). No independent study in the
      available literature has replicated the Onecut3/Nmur2 coexpression, the
      medio-posterior siting, the vertical dendrites or the median
      eminence/pituitary output for this population. Treat the whole property
      set as needing primary verification and independent replication.

      Position. The two statements the source makes about where these cells
      are do not sit together comfortably: the onecut-3+ cells are described
      as a continuum spanning the SCN-Arc domain with a caudally increasing
      cell gradient, and also as "exclusively situated at the medio-posterior
      subdivision of the periventricular area". The first extends rostrally to
      the SCN level, the second does not. The reading taken here is that the
      population spans the column with its density, and the cells themselves,
      concentrated medio-posteriorly. Only the whole-nucleus UBERON term is
      asserted; no Allen (MBA) periventricular subdivision is claimed, because
      none corresponds to "medio-posterior subdivision of the periventricular
      area".

      Cell number. The source gives two counts for the same population: 474
      cells in one adult mouse brain by lightsheet microscopy of optically
      cleared tissue, and 500-1,000 cells per brain projected from conventional
      serial-section neuroanatomy. Both are recorded in the notes of the soma
      anatomical_location source rather than in a field, since cell_count on
      AnatomicalLocation is reserved for atlas MERFISH registration data. The
      lightsheet figure is n = 1 brain.

      Markers. Onecut3 and Slc6a3 are reported as "predominantly restricted"
      to this population, not as exclusive to it, and the restriction is within
      the hypothalamic column that was sampled, not brain-wide — Slc6a3 in
      particular is a general dopaminergic transporter gene. Nmur2 appears only
      in the single-cell transcriptomic data: it was not used in the
      histological anchoring of the subtype and has no in situ or protein
      confirmation here. The practical marker set the report gives for this
      subtype is Onecut3 + DAT/Slc6a3 + TH, with Nmur2 as a transcriptomic
      feature. The phospho-Ser40 TH entry is a modification state of the TH
      protein and carries no gene ID by design (see its source notes); it is
      not a second Th marker.

      Projections. Median eminence termination is direct (histochemistry) but
      phrased by the source as what these neurons "can" do, and the pituitary
      intermediate lobe entry is indirect — Evans blue loading reported as
      agreeing with an earlier published projection, not traced from the
      onecut-3+ cells. Neither target is quantified per cell.

      Neuropeptides. None recorded. Nmur2 is the neuromedin U receptor 2 gene,
      a receptor on these cells; the neuromedin S (Nms) in this literature
      belongs to the SCN neurons that innervate them, not to the cells
      themselves. The source's suggestion that these cells act as neurosecretory
      "hubs" tuning the release of other hypothalamic neuropeptides is about
      their afferents, not about peptides they make.

      Electrophysiology. Not recorded: no intrinsic physiology is reported for
      the Onecut3+/Nmur2+ population specifically. Romanov et al. 2020
      (PMID:32499648) resolve four morphologically and electrophysiologically
      distinct parvocellular dopamine subtypes in the A14/PeVN territory but do
      not say which, if any, corresponds to this one, so none of those profiles
      is carried here.

      Afferents and circadian context. Afferent input and circadian function
      have no schema field and are not asserted here; they are recorded in
      research/hypothalamus/20261127_hypothalamus_report_ingest/unplaced/pevn_onecut3_nmur2_dopamine_neuron.yaml.
