          - marker_type: TRANSCRIPT
            ref: "PMID:17699664"
            method: "literature description"
            scope: "adult mouse"
            quote_key: "17692566_78d7ff15"
    morphology:
      description: >
        Female-biased sexually dimorphic TH-immunoreactive population: females have
        2-4 times more TH-positive neurons than males in the AVPV, with size
        differences in addition to number. The AVPV consists mainly of TH-positive
        neurons. Ovariectomy does not affect TH expression; chronic estradiol
        treatment reduces it. TH-ir lesioned females show lower maternal behavior,
        suggesting a role in sexually dimorphic parental behavior.
      sources:
        - ref: "https://doi.org/10.1007/s12031-012-9923-1"
          method: "literature description"
          scope: "adult mouse"
          quote_key: "214694216_9c6ba0ce"
        - ref: "PMID:33910083"
          method: "literature description"
          scope: "adult mouse"
          quote_key: "233446934_e19240c2"
        - ref: "PMID:20609214"
          method: "literature description"
          scope: "adult mouse"
          quote_key: "15152139_c025cc8f"
    cl_mapping:
    is_terminal: false
    sex_bias: FEMALE_BIASED
    definition_references:
      - "https://doi.org/10.1007/s12031-012-9923-1"
      - "PMID:33910083"
      - "PMID:20609214"
      - "PMID:21243444"
      - "PMID:25206587"
    notes: >
      Female-biased dimorphism (2-4x more TH+ neurons in females). Substantial
      overlap with AVPV/PeN Kiss1 neurons — most AVPV/PeN Kiss1 cells co-express TH.
      Distinct from SDN-POA where TH-positive cell bodies are absent (only TH-ir
      axons/synapses). No exact CL term — candidate for a new term (sibling of
      CL:4072009 'A12 dopaminergic neuron' for AVPV/RP3V A14 dopaminergic neurons).

