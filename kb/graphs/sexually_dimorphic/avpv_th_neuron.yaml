    lit_type: avpv_th_neuron
    taxonomy_type: CS20230722_SUPT_0486
    relationship: skos:closeMatch
    evidence:
      - evidence_type: ATLAS_METADATA
        supports: SUPPORT
        explanation: >
          SUPT_0486 is the top-ranked rank-1 candidate for avpv_th_neuron. Child cluster
          CLUS_1915 (nt_type=Dopa, male_female_ratio=0.02) is the most extremely female-biased
          cluster in the candidate set, directly concordant with the female-biased AVPV TH
          population (2-4x more TH+ neurons in females). Th=2.72, Esr1=7.72, Kiss1=0.62
          at supertype level. Three independent signals (Th expression, AVPV location,
          female sex ratio in child cluster) converge on SUPT_0486/CLUS_1915.
    property_comparisons:
