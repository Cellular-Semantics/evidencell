    notes: >
      No neurotransmitter identity is recorded. An inference was attempted and
      rejected: the defining source does not state a fast transmitter, none of
      Pdyn, Grp, Cck or Trhr constrains one, and the DMH contains both
      GABAergic and glutamatergic neurons, so neither can be assumed for the
      compact part. Morphology, intrinsic electrophysiology and developmental
      origin are likewise undefined in the supplied sources.
      This node rests on a single primary source (PMID:34728342). Its identity
      is a compound of three things that no one of the sibling marker-defined
      DMH nodes carries together: restriction to the compact part of the DMH,
      definition by activity-dependent labelling (Arc/Arg3.1 TRAP after an
      overnight fast and refeeding) rather than by a marker, and co-expression
      of all four of Pdyn, Grp, Cck and Trhr. Because the population was
      defined by activity rather than by genotype, its boundaries depend on
      the labelling protocol: cells active during that specific
      fasting-refeeding window were captured, and the sources do not establish
      that the labelled set is a stable, reproducible transcriptomic type or
      that every cell meeting the marker signature was labelled.
      The four markers were recovered from one RNA-seq profile of the pooled
      labelled population, so the evidence is for a population-level marker
      set, not for per-cell co-expression: it is not shown that individual
      neurons express all four, nor what fraction of the population expresses
      each. The report makes the same reservation, treating them as a marker
      set rather than proof that each names a separate complete neuron type.
      No negative markers are recorded. The neighbouring-nucleus exclusion
      genes used by PMID:37624889 (Sim1, Slit3, Qrfpr, Arpp21, Nr5a1, Fezf1,
      Prlr, Nr5a2, Pvalb, Klk6, Nts, Hdc) are cluster-selection criteria from
      a snRNA-seq study that did not profile this activity-labelled
      population, so they cannot be transferred here as measured absences.
      PMID:37624889 is retained as a definition reference because it
      independently establishes Pdyn, Cck and Grp as highly expressed DMH
      genes, validated against Allen Brain Atlas in situ hybridization data,
      which corroborates the anatomical plausibility of the marker set but
      says nothing about this population directly.
