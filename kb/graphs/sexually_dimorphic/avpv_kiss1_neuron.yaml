          insufficient to resolve AVPV vs adjacent PVpo/PeN at this cell count.
      - property: marker_Kiss1
        node_a_value: "POSITIVE (transcript, primary defining marker)"
        node_b_value: "precomputed mean_expression=2.51; Kiss1 is a cluster-level DEFINING marker"
        alignment: CONSISTENT
      - property: marker_Th
        node_a_value: "POSITIVE (protein, co-expressed with Kiss1)"
        node_b_value: "precomputed mean_expression=6.6 (highest Th of any SUPT_0486 child cluster)"
        alignment: CONSISTENT
      - property: marker_Esr1
        node_a_value: "POSITIVE (transcript, defining marker)"
        node_b_value: "precomputed mean_expression=9.55 (highest Esr1 in SUPT_0486)"
        alignment: CONSISTENT
      - property: sex_ratio
        node_a_value: "female-biased"
        node_b_value: "male_female_ratio=0.02 (extreme female bias, ~50:1 F:M)"
        alignment: CONSISTENT
      - property: annotation_transfer_f1
        node_a_value: "not applicable"
        node_b_value: "NOT_ASSESSED"
        alignment: NOT_ASSESSED
        notes: AT pipeline not run for avpv_kiss1_neuron. Recommended next step.
    caveats:
      - caveat_type: LOW_CELL_COUNT
        description: >
          CLUS_1915 contains only n=3–5 total cells in the WMBv1 atlas. The sex ratio
          (MFR=0.02) and expression values are reliable in direction but have limited
          statistical power. Confidence is capped at MODERATE pending annotation transfer
          evidence or larger-dataset replication.
      - caveat_type: TAXONOMY_LEVEL_MISMATCH
        description: >
          CLUS_1915 is a sub-resolution split of SUPT_0486. The cluster-level Kiss1+Th+Dopa
          phenotype is the most specific available match for avpv_kiss1_neuron; however,
          avpv_th_neuron maps to the same cluster (both types substantially overlap in the
          classical literature — most AVPV Kiss1 cells co-express Th).
      - caveat_type: OTHER
        description: '[AUTO_REPREDICATED_2026_05_26] Predicate auto-migrated from deprecated evidencell:PartialOverlapMatch to skos:closeMatch by `refresh_predicates.py`. Rule: rule-3b: no AT F1, existing caveats → closeMatch. Curator review recommended.'
    unresolved_questions:
