  - id: edge_avpv_kiss1_neuron_to_cs20230722_clus_1915
    lit_type: avpv_kiss1_neuron
    taxonomy_type: CS20230722_CLUS_1915
    relationship: skos:closeMatch
    evidence:
      - evidence_type: ATLAS_METADATA
        supports: SUPPORT
        explanation: >
          CLUS_1915 (1915 PVpo-VMPO-MPN Hmx2 Gaba_5) is the child cluster of SUPT_0486 with
          the highest co-expression of Kiss1 (2.51), Th (6.6), and Esr1 (9.55) — all three
          classical defining markers. It is the most strongly female-biased cluster in the
          supertype (male_female_ratio=0.02), directly concordant with the FEMALE_BIASED
          sex_bias of avpv_kiss1_neuron. Kiss1 and Slc18a2 are cluster-level DEFINING markers.
          nt_type=Dopa confirmed in cluster.yaml. MBA:272 (AVPV) cells explicitly present.
          CLUS_1915 was not ranked in the top-30 DB results because its Kiss1/Th/Esr1 profile
          appears only in precomputed_expression, not in the defining_markers metadata columns.
          It was identified through child_cluster_expression analysis of the SUPT_0486 parent.
      - evidence_type: BULK_CORRELATION
        supports: SUPPORT
        explanation: >
          Stephens 2024 (PMID:37934722) bulk Kiss1+ neurons sorted from RP3V vs ARC.
          Differential δ = ρ_RP3V − ρ_ARC ranks CLUS_1915 first of 5,322 atlas clusters,
          with δ=0.090 (ρ_RP3V=0.388, ρ_ARC=0.298). All other top-20 hits are also
          preoptic/periventricular hypothalamic GABAergic clusters — the differential
          signal is strongly anatomically clean. Independent quantitative confirmation of
          the existing ATLAS_METADATA-based mapping; the Kiss1+ pool transcriptomic profile
          tracks CLUS_1915 specifically more than any other cluster in the atlas.
        run_ref: corr_run_20260428_stephens_kiss1_wmbv1
        contrast_ref: corr_RP3V_vs_ARC
        target_accession: CS20230722_CLUS_1915
        statistics: >
          rho_a=0.388 (vs RP3V); rho_b=0.298 (vs ARC); delta=0.090; rank_by_delta=1; rank_total=5322; rank_by_rho_a=65.
    property_comparisons:
      - property: nt_type
        node_a_value: "GABAergic / dopaminergic (Th co-expression)"
        node_b_value: "Dopa (confirmed, cluster.yaml name_in_source='Dopa')"
        alignment: CONSISTENT
        notes: Dopaminergic identity confirmed at cluster level despite supertype Gaba_5 label.
      - property: location_MBA272
        node_a_value: "MBA:272 (AVPV)"
        node_b_value: "MBA:272 (AVPV) n=1; MBA:133 PVpo n=1; MBA:1097 Hypothalamus n=3"
        alignment: APPROXIMATE
        notes: >
          AVPV cells present but cluster is very small (n=5 total) and primary soma annotation
