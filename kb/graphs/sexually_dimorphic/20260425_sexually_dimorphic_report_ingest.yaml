      quote_key: 14550592_292dccea
  electrophysiology:
    description: 'CRF increases neuronal excitability specifically in ''type II''
      dlBNST neurons (whole-cell patch-clamp); NPY decreases excitability in the same
      type II neurons and suppresses CRF-induced excitation.

      '
    sources:
    - ref: PMID:23554470
      method: whole-cell patch-clamp
