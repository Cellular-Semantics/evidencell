  morphology:
    description: 'Female-biased sexual dimorphism: females have larger and more numerous
      CRF neurons in the dorsolateral BNST than males. The sex difference is not evident
      at postnatal day 5 and emerges by adulthood. Ovariectomy reduces CRF neuron
      number in females; orchiectomy increases it in males. CRF neurons in dlBNST
      lack calbindin (in contrast to the calbindin+ principal nucleus of BNST). Modulates
      pain sensitivity via CRF release.

      '
    sources:
    - ref: https://doi.org/10.3389/fncir.2025.1593443
      method: literature description
