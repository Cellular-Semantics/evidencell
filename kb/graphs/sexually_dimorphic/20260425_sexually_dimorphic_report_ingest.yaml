  - PMID:33910083
  - PMID:20609214
  - PMID:21243444
  - PMID:25206587
  notes: 'Female-biased dimorphism (2-4x more TH+ neurons in females). Substantial
    overlap with AVPV/PeN Kiss1 neurons — most AVPV/PeN Kiss1 cells co-express TH.
    Distinct from SDN-POA where TH-positive cell bodies are absent (only TH-ir axons/synapses).
    No exact CL term — candidate for a new term (sibling of CL:4072009 ''A12 dopaminergic
    neuron'' for AVPV/RP3V A14 dopaminergic neurons).

    '
