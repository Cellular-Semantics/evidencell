    neuropeptides:
      - symbol: Crh
        ncbi_gene_id: "NCBIGene:12918"
        sources:
          - marker_type: TRANSCRIPT
            ref: "https://doi.org/10.3389/fncir.2025.1593443"
            method: "literature description"
            scope: "adult mouse"
            quote_key: "279874350_b2b4adba"
          - marker_type: TRANSCRIPT
            ref: "PMID:23554470"
            method: "literature description"
            scope: "adult mouse"
            quote_key: "14550592_292dccea"
    morphology:
      description: >
        Female-biased sexual dimorphism: females have larger and more numerous CRF
        neurons in the dorsolateral BNST than males. The sex difference is not evident
        at postnatal day 5 and emerges by adulthood. Ovariectomy reduces CRF neuron
        number in females; orchiectomy increases it in males. CRF neurons in dlBNST
        lack calbindin (in contrast to the calbindin+ principal nucleus of BNST).
        Modulates pain sensitivity via CRF release.
      sources:
        - ref: "https://doi.org/10.3389/fncir.2025.1593443"
          method: "literature description"
          scope: "adult mouse"
          quote_key: "279874350_b2b4adba"
        - ref: "PMID:23554470"
          method: "literature description"
          scope: "adult mouse"
          quote_key: "14550592_292dccea"
    electrophysiology:
      description: >
        CRF increases neuronal excitability specifically in 'type II' dlBNST neurons
        (whole-cell patch-clamp); NPY decreases excitability in the same type II
        neurons and suppresses CRF-induced excitation.
      sources:
        - ref: "PMID:23554470"
          method: "whole-cell patch-clamp"
          scope: "adult rodent"
          quote_key: "14550592_292dccea"
    cl_mapping:
      cl_term:
        id: CL:4072021
        label: "corticotropin-releasing neuron"
        name_in_source: "corticotropin-releasing neuron"
      mapping_type: BROAD
      mapping_notes: >
        CL:4072021 covers all CRH-secreting neurons across brain regions (PVN,
        hippocampus, BNST, etc.). BNST CRF neurons do secrete CRH, making this a valid
        BROAD match. A BNST-specific child term does not yet exist — the female-biased
        dlBNST CRF population is a potential CL contribution.
    is_terminal: false
    definition_references:
      - "https://doi.org/10.3389/fncir.2025.1593443"
      - "PMID:23554470"
      - "PMID:33910083"
      - "PMID:32848568"
    notes: >
      Female-biased dimorphism (larger and more numerous in females). Distinguished
      from calbindin+ principal nucleus of BNST (Kiss1+, male-biased). Type II ephys
      classification within dlBNST. CL:4072021 (corticotropin-releasing neuron) is a
      BROAD match — a BNST-specific child term is a candidate for new CL
      contribution.

