            quote_key: "273240437_af6642f9"
      - symbol: Adcyap1
        ncbi_gene_id: "NCBIGene:11516"
    morphology:
      description: >
        Male-biased sexual dimorphism: significantly higher OTR expression in males
        compared to females between P14 and P56. PMv is a well-established sexually
        dimorphic region with roles in maternal aggression, reproductive control, male
        social behavior, and intermale aggression. Subclass-level abundance
        differences identified in PMv (Hemminger 2024). Previously identified
        subpopulations include PMv-DAT and PMv-PACAP.
      sources:
        - ref: "PMID:32313029"
          method: "literature description"
          scope: "adult mouse"
          quote_key: "201207691_ff444c30"
        - ref: "PMID:39416191"
          method: "literature description"
          scope: "adult mouse"
          quote_key: "273240437_ed3a4faa"
    cl_mapping:
    is_terminal: false
    sex_bias: MALE_BIASED
    definition_references:
      - "PMID:32313029"
      - "PMID:39416191"
    notes: >
      Male-biased dimorphism (males > females). Multiple molecularly defined
      subpopulations: PMv-DAT (Slc6a3+, dopaminergic), PMv-PACAP (Adcyap1+), and
      OTR+. HETEROGENEITY: the OTR+, DAT+, and PACAP+ subpopulations may not fully
      overlap and could be split into separate sub-nodes. No CL term — candidate for
      new term.


