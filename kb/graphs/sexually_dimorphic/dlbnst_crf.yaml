      receptors, and is the class that responds directly to CRF and NPY. Evidence: quote_key 8615463_a14b307e,
      8615463_3be541ed, 8615463_1de4a71c (PMID:21310239); quote_key 14550592_657c9f06 (PMID:23554470).

