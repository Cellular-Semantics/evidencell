  notes: 'SUBSET RELATIONSHIP, NOT SYNONYMY. This node is a SUBSET of bnst_crf_neuron. The measured quantity
    is P(CRF+ | Type III) = 0.95 (Dabrowska et al. 2013). The converse, P(Type III | CRF+), is not measured
    in this corpus, and Silberman et al. 2013 report at least four electrophysiologically separable subtypes
    among identified mouse BNST CRF neurons (quote_key 16233294_39d761a0, PMID:23325234). Type III must
    therefore not be treated as the whole CRF population, nor bnst_crf_neuron as ''the Type III population''.

    SPECIES. All Type I-III evidence is rat (Hazra 2011, Dabrowska 2013, Daniel 2019), whereas bnst_crf_neuron
    is a mouse node. The Type I-III scheme has not been shown to transfer cleanly to mouse; Silberman
    et al. note that mouse BNST CRF neurons fall into more categories than previously described, possibly
    because of rat/mouse physiological differences, recording site, or recording conditions.

    CHANNEL SUBUNIT NAMING. Marker symbols use current gene symbols; the source uses protein/channel names
    (Cav3.3 = Cacna1i, Cav3.1 = Cacna1g, HCN4 = Hcn4, Kv4.2 = Kcnd2, Kv1.4 = Kcna4, Kir2.2 = Kcnj12, Kir2.3
    = Kcnj4). The mapping is recorded in each source''s notes field. Kv3.4 (Kcnc4) is expressed in only
    9% of Type III neurons and is not asserted as a marker (quote_key 8615463_3be541ed).

    NO MORPHOLOGY. The classification is physiological and molecular; no morphological data are reported.

    Oxt-negativity and Oxtr-positivity are scoped to the contrast with PVN parvocellular CRF neurons —
    they establish that this is a distinct extra-hypothalamic CRF class, but do not discriminate among
    BNST cell types.

    '
