  electrophysiology:
    description: 'One of three physiologically and genetically distinct BNSTALG subclasses (Type I-III)
      defined primarily by the expression pattern of four membrane currents — Ih, IA, IT and IK(IR). Type
      III neurons show little discernible Ih, and accounted for 21% of the sampled BNSTALG population
      (Type I 11%, Type II 66%). Unbiased hierarchical cluster analysis followed by discriminant function
      analysis of ion-channel alpha-subunit transcripts segregated BNSTALG neurons into three groups that
      positively correlated with the existing electrophysiological Type I-III classification; Type I and
      Type III appear genetically homogeneous, whereas Type II subdivides into three genetically distinct
      subgroups. Type III is the putative CRF class: ~95% express CRF mRNA. Type III neurons receive increased
      inhibitory synaptic input under CRF signalling and, unlike type II, do not respond directly to CRF
      or NPY. After chronic social stress, Type III alone increases Crf mRNA and decreases Ptpn5 mRNA,
      marking it as the CRF population most sensitive to chronic stress.

      '
    sources:
    - ref: PMID:21310239
      method: whole-cell patch-clamp + single-cell RT-PCR; hierarchical clustering + DFA
      scope: adult rat BNSTALG
      quote_key: '8615463_87500419'
    - ref: PMID:21310239
      method: whole-cell patch-clamp
      scope: adult rat; Type III shows little discernible Ih (cf. Hammack et al. 2007)
      quote_key: 8615463_f9227d8a
    - ref: PMID:21310239
      method: whole-cell patch-clamp
      scope: adult rat; Type I 11%, Type II 66%, Type III 21% of sample
      quote_key: 8615463_5315ebbf
    - ref: PMID:24009552
      method: whole-cell patch-clamp + single-cell RT-PCR
      scope: adult rat; ~95% of Type III neurons CRF mRNA+
      quote_key: 4940077_5b783374
    - ref: PMID:30878403
      method: whole-cell patch-clamp + single-cell RT-PCR after chronic social stress
      scope: adult rat BNSTALG; Type III-selective transcriptomic change
      quote_key: 76666373_c8d78753
    - ref: PMID:31451580
      method: whole-cell patch-clamp (review of prior pharmacology)
      scope: naive rat dlBNST; CRF increases inhibitory synaptic input onto type III neurons
      quote_key: 201756623_c60073e7
    - ref: PMID:23554470
      method: whole-cell patch-clamp with bath-applied CRF and NPY
      scope: adult rat dlBNST; only type II, not type I or III, responded to CRF and NPY
      quote_key: 14550592_657c9f06
  colocated_types:
  - neighboring_type: BNSTALG Type I neuron
