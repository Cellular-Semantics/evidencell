    notes: 'Type I (11% of sample) and Type II (66%) are recorded from the same BNSTALG territory; Type
      I and III are genetically homogeneous populations whereas Type II subdivides into three genetically
      distinct subgroups. Evidence: quote_key 8615463_87500419, 8615463_5315ebbf (PMID:21310239).

      '
  - neighboring_type: BNSTALG Type II neuron
