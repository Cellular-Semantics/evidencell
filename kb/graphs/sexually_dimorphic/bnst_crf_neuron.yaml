    electrophysiology:
      description: 'Not a single membrane-property class. In identified mouse BNST CRF neurons there are AT LEAST FOUR electrophysiologically separable subtypes — more heterogeneity than earlier schemes describe, and notably more than CeA CRF neurons recorded under the same conditions (Silberman et al. 2013). In rat BNSTALG, CRF identity is strongly associated with the classic Type III physiological class: ~95% of Type III neurons express CRF mRNA, and Type III cells carry a characteristic membrane-current and ion-channel alpha-subunit profile (little discernible Ih; Cav3.3+; Kir2.2/2.3 enriched) (Dabrowska et al. 2013; Hazra et al. 2011). NOTE the directionality: only P(CRF+ | Type III) has been measured; P(Type III | CRF+) has not, so Type III is a SUBSET of the CRF population and not a synonym for it (see the child node bnstalg_type_iii_crf_neuron). SEPARATELY, and not a statement about CRF-expressing cells: pharmacological studies show that bath-applied CRF depolarizes / increases the excitability of ''type II'' dlBNST neurons, that NPY opposes this in the same type II cells, and that CRF signalling increases inhibitory synaptic input onto type III neurons. These are local-circuit RESPONSE results identifying CRF TARGETS; the type II cells concerned were not shown to express Crh.

        '
      sources:
        - ref: PMID:23325234
          method: whole-cell patch-clamp in identified CRF neurons (CRF reporter mouse)
          scope: adult mouse BNST; at least four separable CRF-neuron subtypes
          quote_key: 16233294_39d761a0
        - ref: PMID:24009552
          method: whole-cell patch-clamp + single-cell RT-PCR
          scope: adult rat BNSTALG; 95% of Type III neurons CRF mRNA+
          quote_key: 4940077_5b783374
        - ref: PMID:21310239
          method: whole-cell patch-clamp + single-cell RT-PCR (ion channel alpha subunits)
          scope: adult rat BNSTALG Type I-III classification (Ih, IA, IT, IK(IR))
          quote_key: '8615463_87500419'
        - ref: PMID:23554470
          method: whole-cell patch-clamp with bath-applied CRF and NPY
          scope: adult rat dlBNST; CRF/NPY RESPONSE in type II neurons (targets, not CRF-expressing cells)
          quote_key: 14550592_657c9f06
          support: PARTIAL
          notes: 'CORRECTION OF A PRIOR KB ERROR. The canonical KB previously read this result as evidence that BNST CRF neurons are ''type II''. It is not: Ide et al. record the response of dlBNST neurons to exogenous CRF, with no demonstration that the responding type II cells express Crh.

            '
        - ref: PMID:31451580
          method: whole-cell patch-clamp (review of prior pharmacology)
          scope: naive rat dlBNST; CRF depolarizes type II, increases inhibitory input to type III
          quote_key: 201756623_c60073e7
          support: PARTIAL
        - ref: PMID:36698552
          method: whole-cell patch-clamp of projection-identified BNST neurons
          scope: mouse BNST-to-VTA projection neurons; four functional types, possibly a continuum
          quote_key: 255523774_37605a49
          support: PARTIAL
    colocated_types:
      - neighboring_type: BNST cholecystokinin (Cck) neuron
        spatial_relationship: ADJACENT
        notes: 'Crf and Cck are non-overlapping GABAergic subpopulations occupying separate lateral (Crf) vs medial (Cck) subdivisions, co-residing in adjacent compartments through the middle of the BNST A/P axis (~+0.2 to -0.2 mm from bregma in mouse). Evidence: quote_key 231848933_2ec86aed (PMID:33633549); the two LH-projecting populations are also non-overlapping, quote_key 49903082_10e9aec1 (PMID:30038273).

          '
      - neighboring_type: ovBNST protein kinase C-delta (Prkcd) neuron
        spatial_relationship: INTERSPERSED
        notes: 'Prkcd-expressing neurons cluster in the oval region of the BNST rather than in the CRF cells themselves. Evidence: quote_key 195329749_c3edb36b (PMID:31235690); dBNST single-cell clusters marked by Pkcd, Sst, Npy, Lmo4 reported in quote_key 231848933_229a693a (PMID:33633549).

          '
      - neighboring_type: dlBNST local-circuit GABAergic interneuron (serotonin-modulated Crf interneuron)
        spatial_relationship: SAME_LAYER
        notes: 'A BNST microcircuit comprising Crf interneurons modulated by serotonin that regulate separate long-range BNST projection neurons — i.e. part of the Crf population is local-circuit rather than long-range. Evidence: quote_key 231848933_27d3cac4 (PMID:33633549); quote_key 201756623_e388bbee (PMID:31451580).

          '
    sex_bias: FEMALE_BIASED
    cl_mapping:
      cl_term:
        id: CL:4072021
        label: corticotropin-releasing neuron
        name_in_source: corticotropin-releasing neuron
      mapping_type: BROAD
      mapping_notes: 'CL:4072021 covers all CRH-secreting neurons across brain regions (PVN, hippocampus, BNST, etc.). BNST CRF neurons do secrete CRH, making this a valid BROAD match. A BNST-specific child term does not yet exist — the female-biased dlBNST CRF population is a potential CL contribution. The CL:4072021 definition enumerates PVN, hippocampus, piriform area, central amygdalar nucleus, Barrington''s nucleus and inferior olivary complex as locations, and does not mention BNST, reinforcing BROAD rather than EXACT.

        '
    is_terminal: false
    definition_references:
      - https://doi.org/10.3389/fncir.2025.1593443
