          BNST-specific signal. Multiple child clusters appear in top 10 by δ(BNST_FR −
          VMH_FR): CLUS_1295 (rank 4), CLUS_1291 (rank 5), CLUS_1290 (rank 9, primary
          soma BST proper), CLUS_1293 (rank 10, MFR=99 — extreme male bias).
          CRITICAL CAVEAT: Knoedler sorted on Esr1+, not Crh+. This evidence supports
          SUPT_0358 as the BST-localised Esr1+ supertype; CRF+/Crh+ co-localisation within
          this supertype must be confirmed by direct evidence (ISH, scRNA-seq for Crh) before
          accepting SUPT_0358 as a bnst_crf_neuron mapping target. Confidence held at LOW
          pending that confirmation.
        run_ref: corr_run_20260428_knoedler_esr1_wmbv1
        contrast_ref: corr_BNST_FR_vs_VMH_FR
        target_accession: CS20230722_SUPT_0358
        statistics: >
