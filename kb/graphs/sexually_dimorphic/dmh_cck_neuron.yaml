    notes: >
      No neurotransmitter identity is recorded: neither source states the fast
      transmitter of Cck+ DMH neurons, and the DMH contains both GABAergic and
      glutamatergic neurons, so none can be inferred safely. Cck expression
      constrains the peptide output only, not the fast transmitter, and Cck is
      expressed by both glutamatergic and GABAergic populations elsewhere in
      the brain. Morphology, intrinsic electrophysiology and developmental
      origin are likewise undefined in the supplied sources. Cck is a DMH
      marker in local anatomical context rather than a brain-wide exclusive
      marker, so assignment of a Cck-expressing neuron to this type depends on
      anatomical context; the report's own caveat is that Cck is best read as a
      marker within a DMH molecular population rather than a fully standalone
      classical cell type, and the sources do not define whether Cck marks one
      discrete DMH type or part of a broader overlapping satiety ensemble. The
      negative markers are cluster-level exclusion criteria applied when DMH
      neuron types were selected (clusters enriched for a neighbouring-nucleus
      gene were discarded), not direct per-cell absence measurements in this
      population. The two sources characterise overlapping but non-identical
      populations: PMID:37624889 names Cck among the DMH-enriched genes used to
      select DMH clusters, while PMID:34728342 profiles a refeeding-activated
      compact-DMH population that expresses Cck together with Pdyn, Grp and
      Trhr; the PVN projection is therefore recorded as weak, inferred
      evidence. The relation of this type to the neighbouring Pdyn, Grp and
      Ppp1r17 DMH classes is unresolved in the supplied material and may
      involve substantial overlap.
