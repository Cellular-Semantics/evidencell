# Draft KB — sexually_dimorphic
# Source: ASTA deep research report — inputs/deepsearch/Sex_dimorphic_neurons_hypothalamus_ast_report.pdf
# Ingestion date: 2026-04-25
# Status: DRAFT — node metadata from ASTA report, pending primary verification
# Property assertions reference quotes in references/sexually_dimorphic/references.json
# Classical nodes proposed by: asta-report-ingest
# Qualifying filter: clear sex bias, supported by full paper (conference abstract-only nodes excluded)
# Excluded: arc_kndy_neuron (not sexually dimorphic in cell number), mpoa_galanin_neuron (sex ratio unclear),
#   poa_pacap_vip_neuron (fish-only evidence), bnst_kiss1_neuron (abstract-only),
#   lateral_septum_kiss1_neuron (abstract-only)

name: "Sexually dimorphic hypothalamic and limbic neurons — draft KB"
description: >
  Evidence graph capturing classically defined sexually dimorphic neuron types
  in the hypothalamus and connected limbic regions (BNST, lateral septum).
  Nodes proposed from a single ASTA deep-research report; properties are
  literature-derived and have not yet been confirmed against primary papers
  or mapped to a community atlas. No mapping edges populated in this draft.
target_atlas: "WMBv1"
species:
  id: NCBITaxon:10090
  label: Mus musculus
  name_in_source: "Mus musculus (predominantly mouse evidence; rat for some studies)"

creation_date: "2026-04-25"
nodes:
  - id: vmhvl_esr1_pr_neuron
    name: "VMHvl estrogen-receptor alpha / progesterone receptor neuron"
    definition_basis: CLASSICAL_NEUROCHEMICAL
    species:
      id: NCBITaxon:10090
      label: "Mus musculus"
      name_in_source: "Mus musculus"
    anatomical_location:
      - id: MBA:693
        label: "Ventromedial hypothalamic nucleus"
        name_in_source: "ventrolateral subdivision of the ventromedial hypothalamus (VMHvl)"
        compartment: SOMA
        sources:
          - ref: "PMID:25543145"
            method: "literature description"
            scope: "adult mouse"
            quote_key: "27794167_af52b501"
    defining_markers:
      - symbol: Esr1
        ncbi_gene_id: "NCBIGene:13982"
        sources:
          - marker_type: TRANSCRIPT
            ref: "PMID:25543145"
            method: "literature description"
            scope: "adult mouse"
            quote_key: "27794167_af52b501"
      - symbol: Pgr
        ncbi_gene_id: "NCBIGene:18667"
        sources:
          - marker_type: TRANSCRIPT
            ref: "PMID:33910083"
            method: "literature description"
            scope: "adult mouse"
            quote_key: "233446934_8cb6b0bc"
      - symbol: Nkx2-1
        ncbi_gene_id: "NCBIGene:21869"
        sources:
          - marker_type: TRANSCRIPT
            ref: "PMID:25543145"
            method: "literature description"
            scope: "adult mouse"
            quote_key: "27794167_af52b501"
      - symbol: Tac1
        ncbi_gene_id: "NCBIGene:21333"
        sources:
          - marker_type: TRANSCRIPT
            ref: "PMID:25543145"
            method: "literature description"
            scope: "adult mouse"
            quote_key: "27794167_af52b501"
    neuropeptides:
      - symbol: Tac1
        ncbi_gene_id: "NCBIGene:21333"
        sources:
          - marker_type: TRANSCRIPT
            ref: "PMID:25543145"
            method: "literature description"
            scope: "adult mouse"
            quote_key: "27794167_af52b501"
    morphology:
      description: >
        Sexually dimorphic population in VMHvl that controls sex-typical behaviors
        (mating in both sexes, fighting in males). Contains ERalpha+ neurons
        coordinating metabolism and reproduction in females; a subset co-expressing
        ERalpha + Nkx2-1 + Tac1 promotes hormone-dependent female locomotion. snRNA-
        seq identified 17 transcriptomic types, several sexually dimorphic. VMHvl is
        essential for lordosis behavior in females through projections to PAG,
        brainstem, and spinal motor circuits.
      sources:
        - ref: "PMID:25543145"
          method: "literature description"
          scope: "adult mouse"
          quote_key: "27794167_af52b501"
    cl_mapping:
    is_terminal: false
    definition_references:
      - "PMID:25543145"
      - "PMID:33910083"
      - "PMID:31626771"
      - "PMID:38978624"
    notes: >
      Molecularly heterogeneous — multiple defined subpopulations: Pgr+ (mating in
      both sexes / fighting in males), ERalpha+/Nkx2-1+/Tac1+ (female locomotion),
      and additional ERalpha-expressing subtypes with different projections and sex-
      related functions. 17 transcriptomic types identified by snRNA-seq (Kim 2019).
      HETEROGENEITY: may need to be split into multiple sub-nodes in future
      iterations. No CL term — candidate for new term(s).

  - id: CS20230722_SUPT_0564
    name: "0564 VMH Fezf1 Glut_2"
    definition_basis: ATLAS_TRANSCRIPTOMIC
    atlas: WMBv1
    taxonomy_id: CCN20230722
    cell_set_accession: CS20230722_SUPT_0564
    taxonomy_level: SUPERTYPE

  - id: CS20230722_SUPT_0563
    name: "0563 VMH Fezf1 Glut_1"
    definition_basis: ATLAS_TRANSCRIPTOMIC
    atlas: WMBv1
    taxonomy_id: CCN20230722
    cell_set_accession: CS20230722_SUPT_0563
    taxonomy_level: SUPERTYPE
    notes: >
      Parent of the two most female-biased rank-0 clusters in the VMH region:
      CLUS_2290 (MFR=0.08) and CLUS_2292 (MFR=0.12). Identified via Knoedler 2022
      bulk correlation (corr_run_20260428_knoedler_esr1_wmbv1) as the dominant
      VMH-specific Esr1+ supertype, with three of its child clusters (2293, 2290, 2292)
      taking the top-4 positions by δ(VMH_FR − BNST_FR).

edges:
  - id: edge_vmhvl_esr1_pr_neuron_to_cs20230722_supt_0564
    lit_type: vmhvl_esr1_pr_neuron
    taxonomy_type: CS20230722_SUPT_0564
    relationship: evidencell:CrossCuttingMatch
    evidence:
      - evidence_type: ATLAS_METADATA
        supports: PARTIAL
        explanation: >
          SUPT_0564 (VMH Fezf1 Glut_2) has MBA:693 (VMH) as primary location (n=360),
          directly matching VMHvl. Nkx2-1=5.34 and Pgr=4.54 show strong-to-moderate
          expression consistent with the classical defining markers. Esr1=2.35 and Tac1=1.39
          indicate subset expression. CROSS_CUTTING because VMHvl contains 17 transcriptomic
          types (Kim 2019) and the classical node is acknowledged as heterogeneous. Note:
          CS20230722_SUPT_0563 (VMH Fezf1 Glut_1) — parent of the two most female-biased
          rank-0 clusters (CLUS_2290 MFR=0.08, CLUS_2292 MFR=0.12) — was not retrieved
          in the rank-1 DB query and should be assessed as a co-primary mapping target.
      - evidence_type: BULK_CORRELATION
        supports: PARTIAL
        explanation: >
          Knoedler 2022 (PMID:35143761) Esr1+ TRAP-seq pooled VMH female-receptive vs BNST
          female-receptive. SUPT_0564 itself does not appear in the top 20 by δ — instead,
          SUPT_0563 takes 3 of the top 4 (CLUS_2293, 2290, 2292). This is independent
          quantitative support for the open question already raised on this edge: SUPT_0563
          should be added as a co-primary CROSS_CUTTING target. SUPT_0564 retains its
          existing ATLAS_METADATA support but should not be the sole mapping target.
        run_ref: corr_run_20260428_knoedler_esr1_wmbv1
        contrast_ref: corr_VMH_FR_vs_BNST_FR
        target_accession: CS20230722_SUPT_0564
        statistics: >
          Top-20 δ rank: not present (best SUPT_0564 child cluster ranked outside top 20).
          Companion target SUPT_0563 takes ranks 1, 2, 4 in the same contrast.
          See edge_vmhvl_esr1_pr_neuron_to_cs20230722_supt_0563 for the supporting numbers.
    property_comparisons:
      - property: location_MBA693_VMHvl
        node_a_value: "MBA:693 (VMHvl)"
        node_b_value: "MBA:693 (VMH) n=360 (dominant location)"
        alignment: CONSISTENT
      - property: nt_type
        node_a_value: "not stated; VMHvl neurons predominantly glutamatergic"
        node_b_value: "Glutamatergic (VMH Fezf1 Glut label)"
        alignment: CONSISTENT
      - property: marker_Nkx2-1
        node_a_value: "POSITIVE (transcript, defining marker)"
        node_b_value: "precomputed mean_expression=5.34"
        alignment: CONSISTENT
      - property: marker_Pgr
        node_a_value: "POSITIVE (transcript, defining marker)"
        node_b_value: "precomputed mean_expression=4.54"
        alignment: APPROXIMATE
      - property: marker_Esr1
        node_a_value: "POSITIVE (transcript, defining marker)"
        node_b_value: "precomputed mean_expression=2.35"
        alignment: APPROXIMATE
        notes: Moderate expression; Esr1 marks a subset, not the full supertype.
      - property: marker_Tac1
        node_a_value: "POSITIVE (transcript, defining marker and neuropeptide)"
        node_b_value: "precomputed mean_expression=1.39"
        alignment: APPROXIMATE
        notes: Low expression; consistent with subset Esr1/Nkx2-1/Tac1 functional subpopulation.
    caveats:
      - caveat_type: AMBIGUOUS_MAPPING
        description: >
          VMHvl contains 17 transcriptomic types (Kim 2019). The classical vmhvl_esr1_pr_neuron
          spans multiple functional subtypes. CS20230722_SUPT_0563 (VMH Fezf1 Glut_1) — parent
          of the two most female-biased clusters (CLUS_2290 MFR=0.08, CLUS_2292 MFR=0.12) —
          was not retrieved in the rank-1 DB query and should be assessed as a co-primary
          mapping target for the female-biased lordosis subpopulation.
      - caveat_type: MARKER_NOT_SPECIFIC
        description: >
          Calb1 has the highest mean expression in SUPT_0564 (mean=8.0) but is not a defining
          marker of vmhvl_esr1_pr_neuron. Calb1 is a canonical marker of the distinct SDN-POA
          calbindin neuron. High Calb1 in SUPT_0564 warrants primary literature verification.
    unresolved_questions:
      - >
        Does Calb1 co-localise with Esr1/Pgr in VMHvl neurons, or does it mark a
        distinct subpopulation within SUPT_0564?

    mapping_justification: semapv:UnreviewedManualMapping
  - id: edge_vmhvl_esr1_pr_neuron_to_cs20230722_supt_0563
    lit_type: vmhvl_esr1_pr_neuron
    taxonomy_type: CS20230722_SUPT_0563
    relationship: evidencell:CrossCuttingMatch
    evidence:
      - evidence_type: BULK_CORRELATION
        supports: SUPPORT
        explanation: >
          Knoedler 2022 (PMID:35143761) Esr1+ TRAP-seq pooled VMH female-receptive vs BNST
          female-receptive. SUPT_0563 takes three of the top four child-cluster positions
          by δ = ρ(VMH_FR) − ρ(BNST_FR): CLUS_2293 (rank 1, δ=0.0180), CLUS_2290 (rank 2,
          δ=0.0159, MFR=0.08), CLUS_2292 (rank 4, δ=0.0145, MFR=0.12). The female-biased
          CLUS_2290 and CLUS_2292 directly correspond to the lordosis-circuit subpopulation
          flagged in vmhvl_esr1_pr_neuron's classical definition. SUPT_0563 was missed by
          the rank-1 DB query (no DEFINING_SCOPED markers in atlas metadata for this
          supertype) and is added here as a co-primary CROSS_CUTTING target alongside
          SUPT_0564 based on the bulk-correlation evidence.
        run_ref: corr_run_20260428_knoedler_esr1_wmbv1
        contrast_ref: corr_VMH_FR_vs_BNST_FR
        target_accession: CS20230722_SUPT_0563
        statistics: >
          best_child_cluster=CLUS_2293 (rank 1 of 5322, δ=0.0180);
          additional_top_hits: CLUS_2290 (rank 2, δ=0.0159, MFR=0.08), CLUS_2292 (rank 4, δ=0.0145, MFR=0.12);
          n_child_clusters_in_top_20=3.
    property_comparisons:
      - property: location_MBA693_VMHvl
        node_a_value: "MBA:693 (VMHvl)"
        node_b_value: "MBA:693 (VMH) primary location across child clusters"
        alignment: CONSISTENT
      - property: nt_type
        node_a_value: "not stated; VMHvl predominantly glutamatergic"
        node_b_value: "Glutamatergic (VMH Fezf1 Glut label)"
        alignment: CONSISTENT
      - property: sex_ratio
        node_a_value: "female-biased lordosis subpopulation expected"
        node_b_value: "child clusters CLUS_2290 (MFR=0.08), CLUS_2292 (MFR=0.12) — both strongly female-biased"
        alignment: CONSISTENT
        notes: >
          Sex ratio at supertype level is NULL; signal is concentrated in the two
          female-biased child clusters that the bulk correlation also surfaces as top hits.
    caveats:
      - caveat_type: AMBIGUOUS_MAPPING
        description: >
          Co-primary with edge_vmhvl_esr1_pr_neuron_to_cs20230722_supt_0564. The classical
          vmhvl_esr1_pr_neuron is a heterogeneous population; SUPT_0563 captures the
          female-biased lordosis subpopulation, SUPT_0564 captures the broader
          Pgr+/Nkx2-1+/Tac1+ subpopulation. Both edges should be retained until the
          classical node is split or a finer-grained analysis is performed.
    unresolved_questions:
      - >
        Is SUPT_0563 vs SUPT_0564 a clean female-vs-broader split, or do both supertypes
        contain heterogeneous sub-populations that cross-cut the classical definition?
      - >
        Are CLUS_2290 and CLUS_2292 distinct functional subtypes within SUPT_0563, or
        replicates of the same lordosis subpopulation?
    proposed_experiments:
      - >
        Cluster-level Esr1, Pgr, Nkx2-1, Tac1 co-expression in CLUS_2290, 2292, 2293 vs
        the female-biased clusters of SUPT_0564 — distinguish the two SUPT mappings.
      - >
        MapMyCells annotation transfer of published VMHvl ERα-Cre or PR-Cre scRNA-seq
        data to WMBv1; expect F1 split between SUPT_0563 (female-biased) and SUPT_0564
        (broader).

    mapping_justification: semapv:UnreviewedManualMapping
