description: 'Classical nodes for the BNST anterolateral-group Type III CRF neuron and the anterior-BNST glutamatergic CRF subset, from the dlBNST CRF ASTA deep research report (inputs/deepsearch/dlBNST_CRF.pdf) plus targeted full-text retrieval of Hazra et al. 2011 and Daniel et al. 2019. Parent node bnst_crf_neuron lives in 20260425_sexually_dimorphic_report_ingest.yaml in this directory.

  '
