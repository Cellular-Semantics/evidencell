# Draft KB — sexually_dimorphic
# Source: ASTA deep research report — inputs/deepsearch/Sex_dimorphic_neurons_hypothalamus_ast_report.pdf
# Ingestion date: 2026-04-25
# Status: DRAFT — node metadata from ASTA report, pending primary verification
# Property assertions reference quotes in references/sexually_dimorphic/references.json
# Classical nodes proposed by: asta-report-ingest
# Qualifying filter: clear sex bias, supported by full paper (conference abstract-only nodes excluded)
# Excluded: arc_kndy_neuron (not sexually dimorphic in cell number), mpoa_galanin_neuron (sex ratio unclear),
#   poa_pacap_vip_neuron (fish-only evidence), bnst_kiss1_neuron (abstract-only),
#   lateral_septum_kiss1_neuron (abstract-only)

name: "Sexually dimorphic hypothalamic and limbic neurons — draft KB"
description: >
  Evidence graph capturing classically defined sexually dimorphic neuron types
  in the hypothalamus and connected limbic regions (BNST, lateral septum).
  Nodes proposed from a single ASTA deep-research report; properties are
  literature-derived and have not yet been confirmed against primary papers
  or mapped to a community atlas. No mapping edges populated in this draft.
target_atlas: "WMBv1"
species:
  id: NCBITaxon:10090
  label: Mus musculus
  name_in_source: "Mus musculus (predominantly mouse evidence; rat for some studies)"

creation_date: "2026-04-25"
nodes:
  - id: mpoa_esr1_neuron
    name: "MPOA estrogen receptor 1 (Esr1) neuron"
    definition_basis: CLASSICAL_NEUROCHEMICAL
    species:
      id: NCBITaxon:10090
      label: "Mus musculus"
      name_in_source: "Mus musculus"
    anatomical_location:
      - id: MBA:523
        label: "Medial preoptic area"
        name_in_source: "medial preoptic area (MPOA)"
        compartment: SOMA
        sources:
