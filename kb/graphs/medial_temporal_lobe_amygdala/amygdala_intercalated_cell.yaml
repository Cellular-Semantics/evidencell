name: Amygdala intercalated cell — classical type
description: >-
  Single classical cell type (one-file-one-class): amygdala intercalated cell
  (ITC / IA). Migrated from the monolithic 20260528 MTL/amygdala report-ingest
  graph to the current schema as part of the one-file-per-lit-type refactor.
  Node content carried over verbatim; edges (re)generated by map-cell-type.
  Declares `at_source_sets` for the Hochgerner 2023 Foxp2 IA clusters (GABA-1..4).
