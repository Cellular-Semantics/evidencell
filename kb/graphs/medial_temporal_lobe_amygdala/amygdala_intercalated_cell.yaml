  (definition_basis CLASSICAL → CLASSICAL_MULTIMODAL; anatomical_location
  name→label + name_in_source; nt_type cl_terms added). UBERON:0002884 canonical
  label is "intercalated amygdaloid nuclei" (old node loosely used "amygdala").
  at_source_sets = Hochgerner 2023 GABA-1..4 (Foxp2/Tshz1 IA cells); GABA-5..7
  are a separate ITC-*related* CEA-located Pax6 population, deliberately excluded.
