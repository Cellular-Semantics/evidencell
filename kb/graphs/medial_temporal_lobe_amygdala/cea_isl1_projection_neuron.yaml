  - evidence_type: LITERATURE
    supports: SUPPORT
    reference: PMID:36425768
    explanation: O'Leary et al. 2022 identifies Isl1-expressing neurons as a major medial CeA class responsible
      for a large fraction of CEA long-range projections; ISL1 marks developmentally distinct LGEv-derived
      CeA neurons.
    snippet: Such work has typically defined molecular cell types by classical inhibitory marker genes;
      consequently, whether marker-gene- defined cell types exhaustively cover the CEA and co-vary with
      connectivity remains unresolved. Here, we combined single-cell RNA sequencing, multiplexed fluorescent
      in situ hybridization, immunohistochemistry, and long-range projection mapping to derive a "bottom-up"
      understanding of CEA cell types. In doing so, we identify two major cell types, encompassing one-third
      of all CEA neurons, that have gone unresolved in previous studies. In spatially mapping these novel
      types, we identify a non-canonical CEA subdomain associated with Nr2f2 expression and uncover an
      Isl1-expressing medial cell type that accounts for many long-range CEA projections.
