  evidence:
  - evidence_type: LITERATURE
    supports: SUPPORT
    reference: PMID:21068836
    explanation: Haubensak et al. 2010 identifies PKC-delta+ CeL neurons as the CeL-OFF population; defines
      Prkcd and Sst negativity as the canonical marker pair. Strongly supports mapping to a Prkcd-high
      CeA cluster.
    snippet: The role of different amygdala nuclei (neuroanatomical subdivisions) in processing Pavlovian
      conditioned fear has been studied extensively, but the function of the heterogeneous neuronal subtypes
      within these nuclei remains poorly understood. Here we use molecular genetic approaches to map the
      functional connectivity of a subpopulation of GABA-containing neurons, located in the lateral subdivision
      of the central amygdala (CEl), which express protein kinase C-δ (PKC-δ). Channelrhodopsin-2-assisted
      circuit mapping in amygdala slices and cell-specific viral tracing indicate that PKC-δ+ neurons
      inhibit output neurons in the medial central amygdala (CEm), and also make reciprocal inhibitory
      synapses with PKC-δ− neurons in CEl. Electrical silencing of PKC-δ+ neurons in vivo suggests that
      they correspond to physiologically identified units that are inhibited by the conditioned stimulus,
      called CEloff units. This correspondence, together with behavioural data, defines an inhibitory
      microcircuit in CEl that gates CEm output to control the level of conditioned freezing.
  - evidence_type: LITERATURE
    supports: SUPPORT
    reference: PMID:33188006
    explanation: CeA circuit study confirms PKC-delta+ neurons as a major CeL class non-overlapping with
      SST+ cells.
    snippet: This diverse span of function is mirrored by the genetic, physiological and morphologic heterogeneity
      in CeA neuron subtypes (Martina et al., 1999;Schiess et al., 1999;Janak and Tye, 2015). Two genetically
      identified cell types, protein kinase Cdexpressing (PKCd⁺) neurons and somatostatin-expressing (Som⁺)
      neurons, constitute most CeLC neurons and are largely non-overlapping (Li et al., 2013;Kim et al.,
      2017;Wilson et al., 2019).
  - evidence_type: LITERATURE
    supports: SUPPORT
    reference: PMID:36425768
    explanation: O'Leary et al. 2022 CeA scRNA-seq confirms the CEA-BST Six3 Cyp26b1 cluster family as
      the dominant CeA transcriptomic family, consistent with PKC-delta neuron lineage.
    snippet: Prkcd and Sst each exhibited mixed expression across multiple scRNA-seq-clusters
  - evidence_type: ATLAS_METADATA
    supports: SUPPORT
    explanation: CLUS_1333 "CEA-BST Six3 Cyp26b1 Gaba_2" (WMBv1) is explicitly labeled central amygdala;
      56.7% of cluster cells are in CeA (MBA:536). Prkcd mean expression 7.44 (99.1th pct CeA GABAergic
      cohort) is the highest among all CEA-BST GABA candidates. This cluster belongs to the dominant CeA
      transcriptomic family (Six3/Cyp26b1 lineage) and is the best available match for the PKC-delta CeL
      neuron despite the Sst caveat.
    atlas: WMBv1
