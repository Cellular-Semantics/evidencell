  caveats:
  - caveat_type: OTHER
    description: Sst expression at cluster average level (1.21, 57.5th pct) conflicts with the Sst-negativity
      criterion. The CLUS_1333 mean may reflect population heterogeneity — some cells expressing Sst and
      others not — rather than universal co-expression in all PKC-delta neurons.
  - caveat_type: DISTRIBUTED_ACROSS_CLUSTERS
    description: Multiple CEA-BST Six3 Cyp26b1 clusters (CLUS_1331-1335 under SUPT_0368; CLUS_1342-1343
      under SUPT_0370) all have high Prkcd expression and CeA fractions 0.37-0.65. Classical type likely
      spans multiple Cyp26b1 Gaba_2/4 clusters; 1:n cardinality.
  unresolved_questions:
  - Does CLUS_1333 contain a Sst-negative subpopulation identifiable by sub-cluster re-clustering? Are
    the Prkcd-high cells the Sst-negative ones?
  - Is the CEA-BST Six3 Cyp26b1 Gaba_2 family the correct WMBv1 cluster for CeL PKC-delta-OFF neurons,
    or is there a more specific Prkcd+/Sst- cluster at higher resolution?
  - Trawl literature for Sst heterogeneity within PKC-delta+ CeL neurons — the cluster-average Sst expression
    may reflect a real subpopulation signal; O'Leary et al. 2022 documents mixed expression but does not
    quantify the Prkcd+/Sst+ fraction.
  - Sub-cluster CLUS_1333 and neighbouring CEA-BST Cyp26b1 clusters (CLUS_1331–1335, CLUS_1342–1343) to
    identify a Prkcd-high/Sst-low subgroup; 1:n cardinality likely across the Gaba_2/4 family.
  - Sub-cluster CS20230722_CLUS_1333 and neighbouring CEA-BST Cyp26b1 clusters (CLUS_1331–1335, CLUS_1342–1343)
    to identify a Prkcd-high/Sst-low subgroup; 1:n cardinality likely across the Gaba_2/4 family.
  proposed_experiments:
