  rationale: '[tier:CUT] Paralaminar/ventral amygdala immature excitatory neurons are a primate-enriched
    population with defining immaturity markers (DCX, BCL2, VIM, NES, MKI67) absent from adult mouse transcriptomic
    types; ATLAS_METADATA evidence explicitly argues against biological equivalence to any WMBv1 type.
    CS20230722_SUPT_0005 was the only candidate retrieved from MBA:295 proximity filter (score 1, cohort_size
    5, rank 1 in a tie) and carries DISCORDANT location_soma (cortical subplate / EP-CLA territory) and
    DISCORDANT marker_DCX alignment. No annotation transfer evidence exists. This is a species-barrier
    null result, not a mapping failure.

    '
  rationale_generated_at: '2026-06-15T11:56:55+00:00'
  report_path: reports/medial_temporal_lobe_amygdala/paralaminar_immature_neuron_summary.md
  reconciliation_note: 'No WMBv1 cluster constitutes a biologically supported homolog. The UNCERTAIN verdict
    reflects a species-barrier gap rather than insufficient evidence about the candidate itself. A future
    annotation transfer from human paralaminar snRNA-seq data may reveal a partial transcriptomic signature
    landing on CS20230722_SUPT_0005 or a related EP-CLA type, which could upgrade to LOW confidence with
    a closeMatch predicate.

    '
