  - evidence_type: ATLAS_METADATA
    supports: REFUTE
    explanation: Cross-species snRNA-seq (Tosches 2023 / Bhattacharyya et al.) identifies paralaminar
      neurons as a primate-enriched cluster with high SOX11 and BCL2 expression, explicitly absent from
      mouse datasets. This evidence actively argues against a biological equivalence to any adult mouse
      atlas type.
    atlas: WMBv1
  caveats:
  - caveat_type: CROSS_SPECIES_EXTRAPOLATION
    description: Paralaminar immature neurons are a primate-enriched type with no established mouse homolog.
      WMBv1 is derived from adult mouse brain. This mapping has no biological support and records only
      the closest type by regional/NT filter in the absence of a true homolog.
  - caveat_type: OTHER
    description: Classical defining markers (DCX, VIM, NES, MKI67, BCL2) are immaturity/progenitor-state
      markers absent from adult mouse transcriptomic atlases. No precomputed expression comparison is
      possible against WMBv1 cluster data.
  unresolved_questions:
  - Does any cross-species scRNA-seq dataset contain a mouse cluster partially matching the DCX+/BCL2+/PROX1+
    paralaminar population?
  - Would targeted re-analysis of WMBv1 in endopiriform nucleus (MBA:942) reveal a closer candidate?
  - Should this population be submitted as a new CL term distinct from CL:4042028 (immature neuron)?
  proposed_experiments:
  - Map human paralaminar nucleus snRNA-seq data (Sorrells et al. 2019 or Caglayan et al. 2023) to WMBv1
    using cell type assignment tools to determine whether any mouse atlas type captures a partial transcriptomic
    signature; would add AnnotationTransferEvidence to this edge.
  - Perform targeted fluorescence labeling for DCX, BCL2, and NES in adult mouse amygdala to formally
    confirm absence of a paralaminar-equivalent population in rodent; would add LiteratureEvidence with
    REFUTE support formalising the species barrier.
  - Re-run find-candidates restricted to MBA:942 (endopiriform nucleus) to assess whether a closer WMBv1
    candidate exists at either rank 0 or rank 1.
