  morphology:
    description: Persistent immature-appearing neurons co-expressing DCX, PSA-NCAM, Bcl-2, beta-tubulin-III
      and NeuN; extend as a stream from the lateral ventricle SVZ into the paralaminar nucleus and adjacent
      medial temporal cortical areas. In humans, develop during adolescence (Sorrells et al., 2019); CGE-linked
      progenitor markers (SP8+, COUP-TFII+, few NKX2.1+) are co-detected in dense progenitor fields.
    sources:
    - ref: PMID:34206571
      method: asta_report
      scope: morphology synthesis from ASTA report
      quote_key: 235715856_1045f5c1
    - ref: PMID:9502809
      method: asta_report
      scope: morphology synthesis from ASTA report
      quote_key: 15638357_aee0d974
    - ref: PMID:36788214
      method: asta_snippet — cross-species snRNA-seq identifies a primate-enriched neuronal cluster with
        high SOX11 and BCL2 expression derived from the paralaminar nucleus
      scope: cross-species amygdala snRNA-seq (human/macaque/mouse/chicken)
      quote_key: 256832817_58d7b193
