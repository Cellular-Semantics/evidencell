  morphology:
    description: Perisomatic-targeting inhibitory interneuron innervating principal-cell somata and proximal
      dendrites; estimated at ~17-20% of GABAergic cells in lateral and basal nuclei. Among the clearest
      parallels between BLA and neocortical inhibitory organization. Mutually interconnected via synapses
      and gap junctions within the PV basket-cell network; avoids innervating CCK basket cells but contacts
      axo-axonic cells.
