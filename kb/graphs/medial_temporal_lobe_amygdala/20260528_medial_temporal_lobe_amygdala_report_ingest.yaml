          scope: rat basolateral amygdaloid complex, in vivo
          quote_key: 17655278_eaf7f2a2
        - ref: PMID:27013983
          method: asta_snippet — composition of BLA (~80% glutamatergic principal cells)
          scope: rat basolateral amygdala, immunohistochemistry
          quote_key: 16327247_664091c4
