    morphology:
      description: 'Pyramidal-like projection neurons with spiny dendrites; comprise ~70-80% (often cited as ~75%) of BLA neurons. Morphology varies: small cells with restricted dendritic fields confined to limited sensory terminal zones, alongside larger neurons with more extensive dendritic fields. Constitutes ~80-90% of BLA neurons; in the lateral amygdala, somata often lack a clearly pyramidal shape.'
      sources:
        - ref: PMID:25309888
          method: asta_report
          scope: morphology synthesis from ASTA report
