  evidence:
  - evidence_type: LITERATURE
    supports: SUPPORT
    reference: PMID:23354330
    explanation: Ciocchi et al. 2010 identifies CeL SST+ neurons (CeL-ON) that increase firing during
      fear conditioning; SST is the primary neuropeptide marker defining this population opposite to the
      PKC-delta CeL-OFF class.
    snippet: The amygdala is essential for fear learning and expression. The central amygdala (CeA), once
      viewed as a passive relay between the amygdala complex and downstream fear effectors, has emerged
      as an active participant in fear conditioning. However, the mechanism by which CeA contributes to
      the learning and expression of fear is unclear. We found that fear conditioning in mice induced
      robust plasticity of excitatory synapses onto inhibitory neurons in the lateral subdivision of the
      CeA (CeL). This experience-dependent plasticity was cell specific, bidirectional and expressed presynaptically
      by inputs from the lateral amygdala. In particular, preventing synaptic potentiation onto somatostatin-positive
      neurons impaired fear memory formation. Furthermore, activation of these neurons was necessary for
      fear memory recall and was sufficient to drive fear responses. Our findings support a model in which
      fear conditioning–induced synaptic modifications in CeL favor the activation of somatostatin-positive
      neurons, which inhibit CeL output, thereby disinhibiting the medial subdivision of CeA and releasing
      fear expression.
  - evidence_type: LITERATURE
    supports: SUPPORT
    reference: PMID:33188006
    explanation: Confirms SST+ CeL neurons as the classical CeL-ON population non-overlapping with PKC-delta
      cells; SST and Prkcd jointly define the two major CeL classes.
    snippet: This diverse span of function is mirrored by the genetic, physiological and morphologic heterogeneity
      in CeA neuron subtypes (Martina et al., 1999;Schiess et al., 1999;Janak and Tye, 2015). Two genetically
      identified cell types, protein kinase Cdexpressing (PKCd⁺) neurons and somatostatin-expressing (Som⁺)
      neurons, constitute most CeLC neurons and are largely non-overlapping (Li et al., 2013;Kim et al.,
      2017;Wilson et al., 2019).
  - evidence_type: ATLAS_METADATA
    supports: SUPPORT
    explanation: CLUS_0823 "Sst Gaba_17" (WMBv1) expresses Sst at 95.1th pct of CeA GABAergic cohort (tier-2
      reliable) with Prkcd effectively absent (0th pct). CeA region_fraction 0.067. Selected over CLUS_0765
      (already used for bla_som_dendrite_targeting_interneuron) and CLUS_0860 (Sst Chodl — Chodl co-expression
      may not characterise typical CeA SST neurons).
