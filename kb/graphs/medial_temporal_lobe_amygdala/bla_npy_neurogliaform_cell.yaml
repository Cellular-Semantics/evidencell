    snippet: 'we estimated that the following cell types together compose the vast majority of GABAergic
      cells in the LA and BA: axo-axonic cells (5.5%-6%), basket cells expressing parvalbumin (17%-20%)
      or cholecystokinin (7%-9%), dendrite-targeting inhibitory cells expressing somatostatin (10%-16%),
      NPY-containing neurogliaform cells (14%-15%), VIP and/or calretinin-expressing interneuron-selective
