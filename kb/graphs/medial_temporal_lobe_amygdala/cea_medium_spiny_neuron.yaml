  evidence:
  - evidence_type: LITERATURE
    supports: PARTIAL
    reference: PMID:32751957
    explanation: Muller et al. characterises CeA medium spiny neurons as the predominant lateral CeA cell
      type with striatal-like morphology and DARPP-32 expression; provides the classical type definition
      but no transcriptomic mapping.
    snippet: Morphologically, there are several types of neurons located in the central nucleus of the
      amygdala (CeA). In the lateral sector of the central nucleus, a predominant cell type with ovoid
      soma is located. These cells have several primary nonspiny dendrites, branching onto spiny secondary
      and tertiary dendrite. Their axons begin branching even before leaving the nucleus, which is why
      these cells are called "medium spiny neurons" (Hall, 2004)(McDonald, 1982). Another type of neurons
      located in the central nuclei have big soma with thick aspiny dendrites, branching on to secondary
      seldom spiny processes (McDonald, 1982)(Cassell et al., 1989) (Schiess et al., 1999). The third
      type of cells are small aspiny neurons (Cassell et al., 1989)
  - evidence_type: ATLAS_METADATA
    supports: PARTIAL
    explanation: CLUS_1344 "CEA-BST Six3 Cyp26b1 Gaba_5" (WMBv1) is in the central extended amygdala lineage
      (Six3/Cyp26b1 transcription factors mark CeA/AAA/BST identity). 42/45 cells in this cluster derive
      from GABA-11-Adora2a-Id4 (purity 0.933). Does not appear in CeA rank-0 survival cohort — may have
      low WMBv1 CeA sampling — but AT confirms presence of this transcriptomic type in Hochgerner CeA-isolated
      tissue.
