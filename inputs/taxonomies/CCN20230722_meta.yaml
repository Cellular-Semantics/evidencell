# Marker sets (#274): Yao 2023 marker combinations and NS-Forest sets with
# F-beta / precision / recall, from brain_cell_KG. Fetch the export with:
#   just fetch-taxonomy-kg inputs/taxonomies/CCN20230722_marker_sets.cypher CCN20230722 \
#       --output inputs/taxonomies/CCN20230722_marker_sets.json
# Ingest fails if the built counts drift from expected_counts: sets per level
# and METHOD/CONTEXT, after attaching each set to its class's most specific
# exemplar cell set (baseline 2026-11-27). Same-cell ancestors in single-child
# chains have no sets of their own in WMBO, so e.g. Yao global sets cover 245
# of 338 subclasses.
