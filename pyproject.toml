[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidencell"
version = "0.1.0"
description = "LinkML-based knowledge base for cell type mapping evidence."
requires-python = ">=3.12,<4.0"

dependencies = [
  "linkml>=1.9.3",
  "linkml-runtime>=1.9.4",
  "oaklib>=0.6.0",
  "linkml-term-validator>=0.2.1",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "pymupdf>=1.24",
  "anndata>=0.12.10",
  "scanpy>=1.12",
  "uv>=0.11.6",
  "ipython>=9.12.0",
  "mygene>=3.2.2",
  "matplotlib>=3.8",
  "anthropic>=0.40.0",
]

[project.optional-dependencies]
# Neo4j driver for fetching taxonomies directly from brain_cell_KG
# Install with: uv sync --group kg
kg = ["neo4j>=5.0"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.16.7,<0.17",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=evidencell --cov-report=term-missing --cov-fail-under=80"
markers = [
  "integration: tests that hit external services or large local databases (OAK, network)",
  "slow: tests that process full taxonomy files (run with just test, excluded from just test-fast)",
]

[tool.ruff]
line-length = 100
exclude = [
    "kb/annotation_transfer_runs",
]

[tool.ruff.lint]
# Pinned explicitly to ruff's long-standing default. Leaving this unset means the
# rule set is whatever the installed ruff defaults to, which is not stable across
# releases: a 2026-10 ruff expanded its defaults to 413 rules and turned a green
# tree into 491 findings (317 of them UP045 alone) without a line of code changing.
# Widening this is a deliberate choice to make on its own, not something to absorb
# silently from a dependency bump.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Generated by `just gen-models` (linkml gen-pydantic); do not hand-edit.
"src/evidencell/_models.py" = ["F401", "E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = false
