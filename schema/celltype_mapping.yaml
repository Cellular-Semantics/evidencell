##
# CellTypeEvidence Schema v0.6.0
#
# Schema for accumulating evidence for transcriptomic cell type mappings.
# Core design: an evidence graph (nodes + edges), inspired by dismech's causal chain model.
#
# Terminal nodes = community atlas cell sets (identified by CCN accession).
# Non-terminal nodes = classical types, prior transcriptomic types, or intermediate types.
# Edges = evidenced mapping assertions between nodes; can be chained transitively.
#
# Version: 0.3  (2026-02-25) — added CLMapping (EXACT/BROAD), Allen anatomy terms,
#                               ProposedCLTerm.parent_cl_term,
#                               AnnotationTransferEvidence.source_cell_set_accession (cross-Allen-taxonomy)
# Version: 0.4  (2026-02-25) — location split: CellTypeColocation + AnatomicalLocation.colocated_types;
#                               NCBI gene IDs: GeneDescriptor.ncbi_gene_id (replaces hgnc_id);
#                               annotation transfer simplified: best_f1_score, metrics_by_level optional;
#                               TaxonomyLevel enum removed → free string;
#                               EvidenceItem.figure_urls for image/screenshot evidence
# Version: 0.5  (2026-03-11) — property provenance: PropertySource + MarkerSource (mixin pattern);
#                               HasMarkerType mixin + MarkerType enum (PROTEIN/TRANSCRIPT, extensible);
#                               per-property sources on nodes: definition_references, nt_type_sources,
#                               ephys_sources, morphology_sources, AnatomicalLocation.sources,
#                               GeneDescriptor.sources (MarkerSource);
#                               property comparison on edges: PropertyComparison + PropertyAlignment enum;
#                               AnatomicalLocation.name → region_name (BREAKING);
#                               AnnotationTransferEvidence: source_species, target_species added;
#                               nt_consistent_with_classical deprecated (superseded by property_comparisons);
#                               OntologyTerm: name_in_source added as required field (always record)
# Version: 0.7.1 (2026-04-22) — ADDITIVE: taxonomy_rank (integer) on CellTypeNode, TaxonomyNodeList,
#                               AnnotationTransferLevelResult; rank-based taxonomy level encoding (S1);
#                               0 = most specific (leaf), incrementing toward root.
#                               MappingEdge.type_a/type_b: range CellTypeNode (documentation;
#                               linkml-validate does not enforce cross-object refs currently).
#                               Taxonomy nodes in KB graphs should be minimal stubs (id, name,
#                               definition_basis, taxonomy_id, cell_set_accession); full data
#                               lives in kb/taxonomy/{taxonomy_id}/*.yaml
# Version: 0.8.0 (2026-04-23) — BREAKING: nested provenance on property objects.
#                               ElectrophysiologyProfile + MorphologyProfile classes (description + sources);
#                               electrophysiology_class → electrophysiology (ElectrophysiologyProfile);
#                               morphology_notes → morphology (MorphologyProfile);
#                               AnatomicalLocation.sources added (replaces CellTypeNode.location_sources);
#                               ephys_sources, morphology_sources, location_sources removed from CellTypeNode.
#                               definition_references retained (general citations, not property-scoped).
# Version: 0.7.1 (2026-04-23) — ADDITIVE: CellTypeNode.male_female_ratio (M/F cell count ratio from taxonomy)
# Version: 0.7.0 (2026-04-22) — ADDITIVE: MarkerCategory enum; GeneDescriptor.category + expression_score;
#                               AnatomicalLocation.cell_count; CellTypeNode.markers + neighborhood;
#                               TaxonomyNodeList container; WMB: prefix for atlas node CURIEs
# Version: 0.6.4 (2026-04-21) — PropertySource.source + PropertySource.support: workflow provenance fields
#                               added by cite-traverse and evidence-extraction workflows
# Version: 0.6.3 (2026-04-21) — PropertySource.notes: curator analysis notes distinct from verbatim snippet
# Version: 0.6.2 (2026-04-21) — MappingRelationship.CANDIDATE_SYNONYM: split-first extraction default;
#                               provisional same-type edges resolvable by curation
# Version: 0.6.1 (2026-04-21) — TypeSynonym class + SynonymType enum + CellTypeNode.synonyms field;
#                               evidence-backed synonym capture for lit mining query expansion
# Version: 0.6.0 (2026-04-09) — AnatomicalLocation class (OntologyTerm mixin) + CellCompartment enum (BREAKING);
#                               anatomical_location range: OntologyTerm → AnatomicalLocation on CellTypeNode
#                               and AtlasMetadataEvidence; formalises soma vs projection location (S2)
# Version: 0.5.4 (2026-03-25) — ATLAS_QUERY EvidenceType + AtlasQueryEvidence class: atlas browser queries
#                               with URL, filters, and curator observation as structured evidence
# Version: 0.5.3 (2026-03-11) — atlas_markers → defining_markers, atlas_neuropeptides → neuropeptides (BREAKING);
#                               AtlasMetadataEvidence.positive_markers → defining_markers (BREAKING);
#                               marker fields now shared across all node types; cell_set_accession
#                               pattern constraints removed (deferred to source-lookup validation)
# Version: 0.5.2 (2026-03-11) — namespace pattern constraints on OntologyTerm.id, GeneDescriptor IDs,
#                               reference fields; MBA prefix added
# Version: 0.5.1 (2026-03-11) — NeurotransmitterType class: unifies nt_type + atlas_nt_type + nt_type_sources;
#                               CL terms as official NT identifiers; atlas_nt_type removed (BREAKING);
#                               neuropeptides field added to CellTypeNode (separate from markers);
#                               AtlasMetadataEvidence.nt_type now range NeurotransmitterType
##

id: https://bican.org/schema/celltype-evidence/v0.5
name: CellTypeEvidence
description: >
  Evidence graph schema for mapping cell types from the literature (classical and
  transcriptomic) to community single-cell and spatial transcriptomic atlases.

prefixes:
  linkml:    https://w3id.org/linkml/
  CL:        http://purl.obolibrary.org/obo/CL_
  UBERON:    http://purl.obolibrary.org/obo/UBERON_
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  NCBIGene:  https://www.ncbi.nlm.nih.gov/gene/
  HGNC:      https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/
  PMID:      https://pubmed.ncbi.nlm.nih.gov/
  DOI:       https://doi.org/
  GEO:       https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=
  SCP:       https://singlecell.broadinstitute.org/single_cell/study/
  # BFO is referenced as a relation predicate in dynamic-enum reachable_from
  # declarations (BFO:0000050 = part_of).
  BFO:       http://purl.obolibrary.org/obo/BFO_
  # Allen Brain Atlas anatomy ontologies:
  # MBA   = Allen Mouse Brain Atlas ontology (CCF structure terms, mouse)
  # DHBA  = Developing Human Brain Atlas ontology (human/primate)
  # HOMBA = Harmonized Mammalian Brain Anatomy Ontology (cross-species,
  #         intended successor to HBA; harmonises MBA/DHBA/HBA concepts).
  # HBA   = Human Brain Atlas ontology (human adult) — legacy; new curation
  #         should prefer HOMBA, but existing HBA terms remain valid.
  # ABAO  = Allen Brain Atlas Ontology (mouse CCF, older prefix — prefer MBA)
  # All four have UBERON cross-references; MBA/DHBA/HOMBA are validated via
  # OAK file adapters (see conf/oak_config.yaml) under the AnatomyTerm
  # binding (reachable from UBERON:0001062 via subClassOf + part_of).
  MBA:       http://purl.obolibrary.org/obo/MBA_
  ABAO:      http://purl.obolibrary.org/obo/ABAO_
  HBA:       http://purl.obolibrary.org/obo/HBA_
  DHBA:      http://purl.obolibrary.org/obo/DHBA_
  HOMBA:     https://purl.brain-bican.org/ontology/homba/HOMBA_
  # WMB = Whole Mouse Brain atlas (Allen Brain Cell Atlas CCN taxonomy)
  # Placeholder URL pending official Allen CURIE registration.
  WMB:       https://allen-brain-cell-atlas.s3.us-west-2.amazonaws.com/metadata/WMB-taxonomy/20231215/cell_set_information.csv#
  # Mapping vocabulary prefixes (Phase 2 schema overhaul, 2026-05-12).
  # See planning/phase_2_decisions_2026-05-12.md.
  skos:       http://www.w3.org/2004/02/skos/core#
  semapv:     https://w3id.org/semapv/vocab/
  evidencell: https://w3id.org/evidencell/

imports:
  - linkml:types

default_range: string

# ══════════════════════════════════════════════════════════════════
# NAMING AND PROVENANCE CONVENTIONS
# ══════════════════════════════════════════════════════════════════
#
# NAMING CONVENTION:
# Every named entity is recorded as a triple: name_in_source | id | label.
# This principle applies to ALL entity types — ontology terms, genes, and
# anatomical regions alike.
#
#   name_in_source  Text exactly as it appears in the source paper or atlas.
#                   ALWAYS record — even when identical to the canonical label —
#                   because source context matters for review and traceability.
#                   Mappings from source names to official IDs can be wrong;
#                   reviewers must always see what the original source said.
#   id              Stable, official identifier (CURIE). Enables cross-graph
#                   queries and validator hook correction loops.
#   label           Canonical term label from the authoritative source (ontology,
#                   gene nomenclature authority). Must match the id exactly.
#
# How each entity type implements the triple:
#
#   OntologyTerm:   id, label, name_in_source — all three fields required
#                   (used for species, anatomy, CL terms, etc.)
#
#   GeneDescriptor: symbol = name_in_source AND label (gene symbols ARE their
#                   own canonical labels in scientific usage; case reflects species
#                   convention, e.g. Sst vs SST);
#                   ncbi_gene_id = id (cross-species stable identifier;
#                   strongly recommended — use NodeNormalization to look up)
#
#   Regions:        anatomical_location = OntologyTerm (id + label + name_in_source);
#                   name_in_source = region name as in the source paper or atlas;
#                   prefer Allen atlas terms (MBA mouse / DHBA human); UBERON as fallback
#
#   NT type:        CellTypeNode.nt_type = NeurotransmitterType (unified for both classical and atlas nodes);
#                   nt_type.name_in_source = verbatim source label (e.g. "Glut-GABA", "dual GABA-Glut");
#                   nt_type.cl_terms = list of OntologyTerm (CL:0000617 GABAergic, CL:0000679 glutamatergic, etc.)
#
#   Taxonomy:       cell_set_accession is the stable source id; name is human label
#
# FREE TEXT vs ID POLICY:
# Official IDs are strongly recommended for shared entities (genes, regions,
# species, ontology terms) — they enable cross-graph queries and validation.
#
# Free text is sufficient (and preferred over guessed IDs) when:
#   - The concept is specific to a single source/atlas with no standard term
#   - The mapping to an official term is genuinely uncertain (novel region,
#     ambiguous cross-species homology)
#   - The field captures source-verbatim text that may conflict with official labels
#
# Never invent an ID that has not been verified. An absent ncbi_gene_id is
# better than a wrong one. Use the `notes` field to flag IDs pending verification.
#
# ATLAS NODE PROVENANCE:
# ATLAS_TRANSCRIPTOMIC node properties (defining_markers, negative_markers,
# neuropeptides, merfish_markers, nt_type, ccf_distribution) have implicit
# provenance from the node's atlas + cell_set_accession + metadata_url on
# the corresponding AtlasMetadataEvidence item. Leave all sources lists
# empty on atlas terminal nodes.


# ══════════════════════════════════════════════════════════════════
# ENUMERATIONS
# ══════════════════════════════════════════════════════════════════

enums:

  # ── Ontology-term ranges (dynamic enums for binding validation) ─
  # These enums are consumed by linkml-term-validator's BindingValidationPlugin
  # in the pre-edit hook. They drive both:
  #   (1) label round-trip — the value's {id, label} pair must match OAK
  #   (2) range-appropriateness — the value must be reachable from the
  #       declared root term via the listed relationship_types
  # Adapter selection routes by the value's prefix (CL → CL adapter, MBA →
  # mbao.obo adapter, etc.) per conf/oak_config.yaml. Lazy validation: no
  # pre-expansion step required.
  CLClassTerm:
    description: >
      Any term in the Cell Ontology (CL) reachable from CL:0000000 (cell)
      via subClassOf. Used as the binding range for cl_term, cl_terms,
      and parent_cl_term slots.
    reachable_from:
      source_ontology: obo:cl
      source_nodes: [CL:0000000]
      include_self: true
      relationship_types: [rdfs:subClassOf]

  NCBITaxonClassTerm:
    description: >
      Any taxon in NCBITaxon reachable from NCBITaxon:1 (root) via
      subClassOf. Used as the binding range for species, source_species,
      and target_species slots.
    reachable_from:
      source_ontology: obo:ncbitaxon
      source_nodes: [NCBITaxon:1]
      include_self: true
      relationship_types: [rdfs:subClassOf]

  AnatomyTerm:
    description: >
      Any anatomical term reachable from UBERON:0001062 (anatomical entity)
      via subClassOf or part_of. Covers UBERON plus the brain-bican atlas
      ontologies (MBA, DHBA, HOMBA) — all three carry is_a / part_of links
      that bottom out at UBERON, so a single source_node suffices. Used as
      the binding range for anatomical_location, anatomical_region,
      projection_target, and brain_region slots.
    reachable_from:
      source_ontology: obo:uberon
      source_nodes: [UBERON:0001062]
      include_self: true
      relationship_types: [rdfs:subClassOf, BFO:0000050]

  # ── Node definition basis ───────────────────────────────────────
  DefinitionBasis:
    description: >
      What kind of evidence was used to define this cell type node.
    permissible_values:
      CLASSICAL_MORPHOLOGICAL:
        description: Defined primarily by morphological criteria (soma shape, dendrite/axon pattern)
      CLASSICAL_ELECTROPHYSIOLOGICAL:
        description: Defined primarily by electrophysiological properties
      CLASSICAL_NEUROCHEMICAL:
        description: Defined by neurotransmitter, neuropeptide, or IHC marker expression
      CLASSICAL_ANATOMICAL:
        description: Defined primarily by anatomical location and projection targets
      CLASSICAL_MULTIMODAL:
        description: Classical type defined by combination of morphology, location, electrophysiology, neurochemistry
      PRIOR_TRANSCRIPTOMIC:
        description: >
          Transcriptomic type from a prior publication or dataset (not the community target atlas).
          Identified by a cluster label in a specific dataset (e.g. PLI3 in Osorno SCP795).
      ATLAS_TRANSCRIPTOMIC:
        description: >
          Cell type from the community target atlas (or a named reference atlas).
          Identified by a CCN cell_set_accession.
      MULTIMODAL_EMERGING:
        description: >
          A type description being built up from multiple evidence types; may eventually
          become a new or revised CL term. Not yet anchored to a single classical or T-type definition.

  # ── Sex bias (classical nodes) ──────────────────────────────────
  SexBias:
    description: >
      Expected direction of sexual dimorphism in cell number or marker expression
      for a classical cell type. Used by find-candidates to score atlas clusters
      whose male_female_ratio matches the expected direction.
    permissible_values:
      MALE_BIASED:
        description: More cells (or higher expression) in males than females
      FEMALE_BIASED:
        description: More cells (or higher expression) in females than males
      NOT_DIMORPHIC:
        description: No documented sex difference in cell number or defining markers

  # ── Synonym type ────────────────────────────────────────────────
  SynonymType:
    description: Category of alternative name for a cell type.
    permissible_values:
      ABBREVIATION:
        description: Short form or acronym, e.g. "OLM" for "oriens-lacunosum moleculare"
      HISTORICAL:
        description: Deprecated or superseded name still found in older literature
      ATLAS_LABEL:
        description: >
          An atlas cluster or cell set label used as a cell type name in papers
          (e.g. "Sst Gaba_3" used to refer to OLM cells in an atlas-integrated study)
      CROSS_SPECIES:
        description: Name used for the equivalent type in a different species
      INFORMAL:
        description: Community-specific colloquial term not formally defined in a publication

  # ── Taxonomy levels ─────────────────────────────────────────────
  # TaxonomyLevel enum removed in v0.4: level names are atlas-specific.
  # taxonomy_level fields now use free strings. Common values:
  #   WMBv1 (CCN20230722):  CLASS, SUBCLASS, SUPERTYPE, CLUSTER
  #   HMBA BG Consensus:    CLASS, GROUP (GROUP is below CLASS)
  #   Custom atlases:       as documented by that atlas
  #
  # taxonomy_rank (v0.7.1): integer rank for ordering levels across taxonomies.
  #   0 = most specific (leaf/terminal), incrementing toward root.
  #   WMBv1: CLUSTER=0, SUPERTYPE=1, SUBCLASS=2, CLASS=3
  #   HMBA BG: GROUP=0, CLASS=1
  #   Rank is optional on individual nodes (derivable from taxonomy_level +
  #   taxonomy_meta.yaml level_hierarchy) but required on TaxonomyNodeList
  #   container files and in taxonomy_meta.yaml level_hierarchy.

  # ── Mapping relationship types ──────────────────────────────────
  #
  # Direction convention: relationships are directional, read from the
  # lit_type (subject) to the taxonomy_type (object). SKOS predicates
  # are used where they apply; custom evidencell: predicates for cases
  # SKOS does not cover. See docs/mapping_schema_2026-05-12.md for the
  # glossary preamble and worked examples.
  #
  # SKOS broadMatch / narrowMatch are counter-intuitive: the match goes
  # *to* the broader / narrower thing, not *from* it. Enum value
  # descriptions below restate the direction in plain English.
  #
  # Phase 2 schema overhaul, 2026-05-12. Old values (EQUIVALENT,
  # PARTIAL_OVERLAP, CROSS_CUTTING, TYPE_A_SPLITS, TYPE_A_MERGES,
  # SUBSET, SUPERSET, NO_CORRESPONDENCE, UNCERTAIN, CANDIDATE_SYNONYM,
  # OVERLAPS) removed; KB sweep migrates existing edges in PR2.
  MappingRelationship:
    description: >
      The nature of the correspondence between lit_type and taxonomy_type
      in this edge. Relationships are directional, from lit_type to
      taxonomy_type. Permissible-value identifiers are CURIEs binding
      to SKOS predicates where applicable; custom evidencell: predicates
      otherwise.
    permissible_values:
      skos:exactMatch:
        description: >
          The lit_type and taxonomy_type describe the same cell population
          (one-to-one identity). Required: cardinality 1:1; location
          consistent (classical region + adjacent only, not distant);
          AT supports 1:1 (F1 > 0.75) when AT is present; no major
          contradictions. AT-absent cases may still be exactMatch on
          converging location + markers + literature, but confidence
          ceiling drops to MODERATE. Numeric AT gate lives in the
          report-time prompt + rationale, not in this description.
      skos:closeMatch:
        description: >
          Same 1:1-style correspondence as exactMatch but with one or
          more contradictions: marker mismatch with no resolving
          heterogeneity in the lit, soft AT (F1 in a borderline band or
          coverage/purity asymmetry), location edge case, or other
          partial-information caveat. Pair with mapping_justification:
          semapv:UnreviewedManualMapping when not curator-confirmed.
      skos:broadMatch:
        description: >
          The lit_type is **narrower** than the taxonomy_type; the
          match goes *to* the broader thing. Read
          `lit_OLM --skos:broadMatch--> Sst_Gaba_3_supertype` as
          "OLM has a broad match — the supertype is the broader thing."
          Apply when: the taxonomy_type is located in regions distant
          from the classical region + adjacent set; or the relationship
          is cross-cutting at rank N but collapses to a clean broader
          relation at rank N+1 (pick the higher rank); or multiple
          lit_types map to a single taxonomy_type at this rank. AT must
          be consistent with the broader reading when present. Always
          paired with `mapping_cardinality: 1:n` (the hidden-1:1 case
          collapses: if the specific sub-cluster is TBD, map at the
          next rank up).
      skos:narrowMatch:
        description: >
          The lit_type is **broader** than the taxonomy_type; the
          match goes *to* the narrower thing. Read
          `lit_classical_basket --skos:narrowMatch--> mli2_cluster` as
          "classical basket has a narrow match — this specific cluster
          is the narrower thing." Symmetric inverse of broadMatch.
          Always paired with `mapping_cardinality: n:1`.
      evidencell:PartialOverlapMatch:
        description: >
          DEPRECATED (2026-05-26). Absorbed into closeMatch (1:1-ish
          with contradictions) + broadMatch / narrowMatch / CrossCuttingMatch
          per the new predicate rubric. Retained transitionally so the
          KB validates against the deprecated value during migration;
          the re-run will re-predicate the existing 42 edges. Do not
          emit on new edges. Will be removed after migration.
      evidencell:CrossCuttingMatch:
        description: >
          The taxonomy_type cross-cuts the boundary of the lit_type
          (and usually at least one other lit_type). The transcriptomic
          type captures cells that the classical taxonomy would assign
          to multiple distinct types. E.g. MLI1 cuts across classical
          basket and stellate cells. Apply only when no higher rank
          rescues the relationship to a clean broadMatch — if
          cross-cutting at rank N collapses to a single broader type at
          rank N+1, prefer broadMatch at N+1. No SKOS equivalent.
      evidencell:NoCorrespondence:
        description: >
          No corresponding type exists in the target taxonomy.
          Use to explicitly document failures of correspondence
          (e.g. a curated literature type that the atlas does not
          resolve at any rank). No SKOS equivalent.
      evidencell:UncertainRelationship:
        description: >
          The kind of correspondence is not yet determinable from
          available evidence. Distinct from `evidencell:NoCorrespondence`
          (which asserts no mapping exists). Pair with
          `mapping_justification: semapv:UnspecifiedMatching` and a
          `reconciliation_note` describing what additional evidence
          would resolve the question. No SKOS equivalent.

  # ── Mapping cardinality ─────────────────────────────────────────
  #
  # Phase 2: split predicate from cardinality. SSSOM convention; values
  # are literal strings (no upstream ontology).
  MappingCardinality:
    description: >
      Cardinality of the mapping considered as a set relation.
      Required with skos:broadMatch (always 1:n) and skos:narrowMatch
      (always n:1); recommended with skos:exactMatch (always 1:1).
      The former hidden-1:1 broadMatch case collapses: if the specific
      sub-cluster is not yet identifiable, map at the next rank up
      where the relationship is cleanly 1:n.
    permissible_values:
      "1:1":
        description: One lit_type maps to one taxonomy_type.
      "1:n":
        description: One lit_type splits across multiple taxonomy_types.
      "n:1":
        description: Multiple lit_types collapse onto one taxonomy_type.

  # ── Mapping justification (semapv subset) ───────────────────────
  #
  # Phase 2: track the provenance of the mapping decision. Values bound
  # to the semapv vocabulary (https://w3id.org/semapv/vocab/).
  MappingJustification:
    description: >
      Provenance of the mapping decision. Bound to the semapv mapping
      provenance vocabulary; SSSOM-compatible.
    permissible_values:
      semapv:ManualMappingCuration:
        description: Mapping reviewed and approved by a human curator.
      semapv:UnreviewedManualMapping:
        description: >
          Manually proposed (typically agent-emitted from extraction or
          synthesis) but not yet reviewed by a curator. The default
          state for new edges in this KB.
      semapv:LexicalMatching:
        description: >
          Mapping derived from name / synonym lexical match. Lowest
          confidence among manual-class justifications.
      semapv:CompositeMatching:
        description: >
          Mapping derived from multi-source evidence integration
          (e.g. anatomy + markers + AT F1 all converging).
      semapv:LogicalReasoning:
        description: >
          Mapping derived by logical reasoning over schema-encoded
          relations.
      semapv:UnspecifiedMatching:
        description: >
          Provenance not recorded. Use sparingly; prefer one of the
          other values when known.

  # ── Mapping confidence ──────────────────────────────────────────
  MappingConfidence:
    permissible_values:
      HIGH:
        description: >
          Strong experimental anchor with no major contradictions. Two
          standard paths: (a) patch-seq annotation-transfer F1 > 0.75
          with marker confirmation; (b) bridging or bulk RNA-seq with
          strong structure/function convergence at similar strength.
          Default for a clean exactMatch where AT is present and
          supportive.
      MODERATE:
        description: Two or more independent evidence items with consistent support
      LOW:
        description: Single evidence item or consistent but weak/indirect evidence
      UNCERTAIN:
        description: Evidence is contradictory, ambiguous, or minimal
      REFUTED:
        description: Preponderance of evidence argues against this mapping

  # ── Evidence support ────────────────────────────────────────────
  EvidenceSupport:
    permissible_values:
      SUPPORT: {}
      REFUTE: {}
      PARTIAL:
        description: Supports some aspects but not all
      WEAK:
        description: >
          Non-zero but weak evidence — e.g. marker match with anatomical
          mismatch, or a speculative assignment retained as placeholder.
      NO_EVIDENCE:
        description: Assessed but no relevant evidence found

  # ── Evidence types ──────────────────────────────────────────────
  EvidenceType:
    permissible_values:
      LITERATURE:
        description: Peer-reviewed paper (classical anatomy, electrophysiology, prior transcriptomics)
      ATLAS_METADATA:
        description: >
          Data taken directly from an atlas cluster metadata spreadsheet / taxonomy:
          markers, MERFISH location, NT type, CCF distribution.
      ANNOTATION_TRANSFER:
        description: Computational label transfer (MapMyCells, Seurat, scANVI, etc.)
      SPATIAL_COLOCATION:
        description: Spatial transcriptomics or FISH-based co-location analysis
      PATCH_SEQ:
        description: Patch-seq multi-modal data (electrophysiology + morphology + transcriptomics)
      PROJECTION_SEQ:
        description: Transcriptomics combined with retrograde tracing (proj-seq)
      ELECTROPHYSIOLOGY:
        description: Electrophysiology recordings without transcriptomics
      MORPHOLOGY:
        description: Morphological characterisation (light microscopy, EM)
      MARKER_ANALYSIS:
        description: Custom marker gene overlap analysis beyond atlas metadata
      ATLAS_QUERY:
        description: >
          Curator-performed interactive query against a published atlas browser
          (ABC Atlas, Allen Brain Map, BICCN viewer, etc.) with specified filters.
          Result is observation-level evidence: reproducible given the same atlas
          version and filter parameters. Stronger than an informal note but weaker
          than a peer-reviewed publication. Record the query URL and atlas version.
      BULK_CORRELATION:
        description: >
          Cluster ranking from a paired-bulk transcriptomic correlation run.
          Two bulk pools (e.g. region A vs region B) are correlated against atlas
          cluster pseudobulks; the differential signal δ = ρ_A − ρ_B identifies
          clusters specifically tracking pool A. Backing record: a CorrelationRun
          (kb/correlation_runs/{run_id}/manifest.yaml) referenced by run_ref.

  # ── Marker type ─────────────────────────────────────────────────
  MarkerType:
    description: >
      The molecule type detected in a marker evidence source.
      Currently covers the two most important categories (protein vs transcript);
      could be extended in future to other molecule types where these are used
      as cell type markers (e.g. glycoproteins, lipids, metabolites) if such
      cases become relevant to atlas mappings.
    permissible_values:
      PROTEIN:
        description: >
          Protein-level detection: IHC, immunofluorescence, western blot,
          proximity ligation assay, mass spectrometry.
      TRANSCRIPT:
        description: >
          Transcript-level detection: bulk RNA-seq, scRNA-seq, snRNA-seq,
          smFISH, RNAscope, MERFISH, Visium, or other spatial transcriptomics.

  # ── Cell compartment ─────────────────────────────────────────────
  CellCompartment:
    description: >
      Which cellular compartment an anatomical location refers to.
      Critical for interpreting spatial data: MERFISH records soma
      position only; axonal/dendritic targets require other methods.
    permissible_values:
      SOMA:
        description: Cell body location
      AXON_TARGET:
        description: Axonal projection target region
      DENDRITE:
        description: Dendritic arbor region

  # ── Marker category ─────────────────────────────────────────────
  MarkerCategory:
    description: >
      Functional category of a marker gene in the context of a cell type description.
      Used on GeneDescriptor.category to distinguish marker roles in the unified
      markers list. Negative markers use modifier: ABSENT rather than a separate
      category.
    permissible_values:
      DEFINING:
        description: >
          Global defining markers — discriminate this type across the full taxonomy
          (e.g. cluster_markers_combo in WMBv1).
      DEFINING_SCOPED:
        description: >
          Within-subclass or within-supertype scoped markers — most informative
          within a narrower comparison context (e.g. cluster_markers_combo_within_subclass).
      TF:
        description: Transcription factor markers (e.g. cluster_TF_markers_combo in WMBv1).
      NEUROPEPTIDE:
        description: >
          Neuropeptide co-transmitter markers. Pair with expression_score where
          available (e.g. from np_markers precomputed stats: Vip:9.2).
      NT_MARKER:
        description: >
          Genes providing evidence for the neurotransmitter type assertion:
          Gad1/Gad2 (GABA), Slc17a6/Slc17a7 (glutamate), Th (dopamine),
          Slc6a4 (serotonin), etc. Populate on classical nodes where NT type is
          inferred from marker expression rather than direct physiology.
      MERFISH:
        description: >
          MERFISH spatial transcriptomics panel markers — distinguish this type
          in the spatial panel (e.g. merfish_markers_combo in WMBv1).

  # ── Property alignment ──────────────────────────────────────────
  PropertyAlignment:
    description: >
      How well a specific property aligns between type_a and type_b on a
      mapping edge. Used in PropertyComparison to make the basis for
      confidence judgments machine-readable.
    permissible_values:
      CONSISTENT:
        description: >
          Properties agree: same value or biologically equivalent,
          modulo naming conventions. E.g. "GABA-Glut" vs "Glut-GABA"
          (same dual-transmitter biology, different ordering).
      APPROXIMATE:
        description: >
          Properties broadly agree but differ in resolution, specificity,
          species convention, or one is a subset of the other.
          E.g. "GPi shell region" (classical) vs atlas-annotated "GPi";
          Sst in classical description vs Sst in 2/3 atlas clusters.
      DISCORDANT:
        description: >
          Properties conflict — constitutes evidence against the mapping.
          Document in PropertyComparison.notes and consider adding a Caveat.
      NOT_ASSESSED:
        description: >
          Property not evaluated for this edge (data unavailable or
          not relevant to this mapping).

  # ── CL mapping type ─────────────────────────────────────────────
  CLMappingType:
    description: >
      Whether the CL term on this node is an exact match or a broad ancestor.
      Mirrors SKOS mapping predicates (skos:exactMatch, skos:broadMatch).
    permissible_values:
      EXACT:
        description: >
          This node IS this CL term, modulo species restriction.
          The CL term may be defined at species-neutral level; the node represents
          a species-specific instance. E.g. CL:0000617 GABAergic neuron — EXACT for
          a node that is clearly and fully described by this term.
      BROAD:
        description: >
          This node is a subtype of this CL term; the CL term is an ancestor.
          The ProposedCLTerm on this node (if present) would be a new child
          of the CL term, extending the ontology.
          E.g. CL:0000679 (glutamatergic neuron) is a BROAD match for a Lugaro cell —
          a new CL term for Lugaro cell would be placed under it.
      RELATED:
        description: >
          The CL term is related but neither exact nor strictly an ancestor.
          Use for partial overlaps or uncertain relationships with existing terms.

  # ── Caveat types ─────────────────────────────────────────────────
  CaveatType:
    permissible_values:
      MERFISH_REGISTRATION_UNCERTAINTY:
        description: Anatomical location inferred from MERFISH CCF registration, which may be inaccurate
      LOW_CELL_COUNT:
        description: Fewer than ~50 cells used in this analysis; results may not be robust
      DISTRIBUTED_ACROSS_CLUSTERS:
        description: Source type cells are spread across multiple target clusters (low coverage at finest level)
      TAXONOMY_LEVEL_MISMATCH:
        description: Best mapping is at a coarser taxonomy level than desired (e.g. supertype not cluster)
      MARKER_NOT_SPECIFIC:
        description: Defining marker(s) are not unique to this cell type in the atlas
      CROSS_SPECIES_EXTRAPOLATION:
        description: Evidence is from a different species than the atlas being mapped to
      SINGLE_DATASET:
        description: Evidence comes from a single dataset; independent replication not yet available
      NT_PREDICTION_UNCERTAIN:
        description: NT type from atlas may be unreliable (e.g. nuclear RNA depletion in snRNA-seq)
      PRIOR_MAPPING_ASSUMED:
        description: This edge relies on a prior mapping step whose confidence is UNCERTAIN or LOW
      AMBIGUOUS_MAPPING:
        description: >
          Multiple possible target types; mapping is not clearly one-to-one.
          Use when the classical type spans several atlas clusters without
          a dominant match.
      SINGLE_STUDY:
        description: >
          Evidence for this mapping comes from a single study (broader than
          SINGLE_DATASET — covers the case where independent replication
          is absent even with multiple datasets from one lab).
      NO_DISCRIMINATING_MARKER:
        description: >
          No single marker uniquely identifies this classical type in the
          atlas; mapping relies on marker combinations or other evidence.
      DISCORDANT_ANATOMY:
        description: >
          Anatomical location of the classical type and the atlas cluster
          do not agree — e.g. different layers, subregions, or hemispheric
          distribution.
      ELECTROPHYSIOLOGY_ONLY_DEFINITION:
        description: >
          This classical type is defined primarily or solely by
          electrophysiological properties, making transcriptomic matching
          inherently uncertain.
      OTHER: {}

  DiscoveryContextKind:
    description: >
      Semantic class of a percentile context recorded on
      MappingEdge.discovery_score. Today only SURVIVAL_COHORT is
      emitted by Stage A; the other values reserve slots for future
      universal / anatomical / sibling context emission so that
      downstream agents can reason about contexts uniformly without
      parsing free-text descriptions.
    permissible_values:
      SURVIVAL_COHORT:
        description: >
          Candidates surviving the discovery pass's filters
          (region, NT, sex bias, etc.) at the queried rank.
          CURRENTLY THE ONLY KIND EMITTED BY STAGE A. Cohort
          membership is dynamic — it depends on the query filters,
          so two queries against the same taxonomy can yield
          different cohorts.
      ATLAS_UNIVERSAL:
        description: >
          All clusters in the taxonomy at the queried rank, with
          no filters. Stable across queries against the same
          taxonomy. Emission currently dormant; reserved for
          revival of the legacy `_score_from_percentiles` path.
      ANATOMICAL_RESTRICTION:
        description: >
          All clusters annotated to a specified anatomical region
          closure, with no other filters. Anticipates future
          anatomy-context scoring; not yet emitted by Stage A.
      SIBLINGS_UNDER_PARENT:
        description: >
          Direct children of a common parent at the queried rank.
          Legacy notion from the pre-2026 sibling/global scoring
          scheme; reserved in case it is revived.

  GeneDiscoverySource:
    description: >
      Where the per-gene `val` recorded on a
      GeneDiscoveryDetail came from. Determines which of
      val / reliable / percentiles / coverage are populated.
    permissible_values:
      EXPRESSION:
        description: >
          Value read from the candidate's precomputed_stats HDF5.
          val / reliable / percentiles populated; coverage
          populated at rank ≥ 1.
      METADATA:
        description: >
          Gene flagged as a marker in the taxonomy YAML but
          absent from precomputed_stats. val / reliable /
          percentiles all null; raw_tier = +1 (a weak presence
          assertion based on metadata, not measurement).

  DiscoveryRegionEvidence:
    description: >
      How Stage A established that a candidate is "in region"
      for the queried anatomy.
    permissible_values:
      SELF:
        description: >
          The candidate's own anatomical annotation places it in
          the queried region closure.
      DESCENDANT_ONLY:
        description: >
          The candidate (rank ≥ 1) was rescued because its rank-0
          descendants annotate to the region, even though the
          candidate's own anatomical metadata is incomplete
          (BCKG workaround for sparse mid-rank annotation).


# ══════════════════════════════════════════════════════════════════
# SHARED SUPPORTING CLASSES
# ══════════════════════════════════════════════════════════════════

classes:

  OntologyTerm:
    description: >
      An ontology identifier + canonical label + source name triple.
      All three fields are required. name_in_source is always recorded —
      even when it matches the canonical label — because source context
      is important for traceability and review.
    attributes:
      id:
        required: true
        pattern: "^(CL|UBERON|NCBITaxon|MBA|DHBA|HBA|HOMBA|ABAO):[0-9]+$"
        description: >
          Ontology CURIE from a recognised namespace. Pattern enforces a known
          prefix — add new prefixes here when new ontologies are adopted (e.g.
          HOMBA when released). Examples: CL:0000540, UBERON:0001950,
          NCBITaxon:10090, MBA:1031, HBA:12898, DHBA:10344.
      label:
        required: true
        description: >
          Canonical label from the ontology (must match exactly).
          Required for the validator hook correction loop — the hook
          verifies id:label pairs against OAK local databases.
      name_in_source:
        required: true
        description: >
          Text as it appears in the source document or atlas. Always
          record — even when identical to the canonical label — because
          source context matters for review and traceability.
          Examples:
            - source "macaque" → label "Primates" (NCBITaxon:9443)
            - source "GPi" → label "internal segment of globus pallidus" (UBERON:0002474)
            - source "GPi shell neuron" → label "internal globus pallidus
              shell projection neuron" (CL:4310096)
            - source "internal segment of globus pallidus" → label same
              (populate identically when no discrepancy)

  AnatomicalLocation:
    mixins:
      - OntologyTerm
    description: >
      An anatomical region associated with a cell type, with optional
      compartment annotation. Inherits id, label, name_in_source from
      OntologyTerm. When compartment is omitted, the location applies
      to the whole cell or compartment is unspecified.
    attributes:
      compartment:
        range: CellCompartment
        description: >
          Which cellular compartment resides in this region.
          Required when a cell type spans multiple regions with
          different compartments (e.g. OLM: soma in SO, axon in SLM).
          Leave absent for atlas terminal nodes (MERFISH captures soma
          implicitly) and for types where location is not
          compartment-specific.
      cell_count:
        range: integer
        description: >
          Number of cells of this type registered to this anatomical region.
          Populated from atlas MERFISH registration data (e.g. WMBv1 anat
          cell counts per cluster per region). Enables ranking of anatomical
          locations by cell abundance. Leave absent for non-atlas nodes.
      sources:
        multivalued: true
        inlined_as_list: true
        range: PropertySource
        description: >
          Evidence sources for this specific anatomical location assertion.
          Populate for classical and prior-transcriptomic nodes, especially
          for sub-regional claims where location is specific or contested.
          scope is critical where location is context-dependent.
          Leave empty for atlas terminal nodes (provenance implicit from
          atlas + cell_set_accession).

  CLMapping:
    description: >
      A Cell Ontology term binding for a node, with an explicit mapping type.
      Every non-terminal node should have a cl_mapping.
      Use EXACT when this node IS the CL term (modulo species).
      Use BROAD when the CL term is an ancestor and a new child term is needed.
      The presence of proposed_cl_term on the node indicates a new term is being drafted.
    attributes:
      cl_term:
        required: true
        range: OntologyTerm
        bindings:
          - binds_value_of: id
            range: CLClassTerm
            obligation_level: REQUIRED
        description: The CL term (existing or most appropriate ancestor)
      mapping_type:
        required: true
        range: CLMappingType
      mapping_notes:
        description: >
          Free text explaining the basis for this mapping type, especially for BROAD/RELATED.

  GeneDescriptor:
    description: >
      A gene identified by the universal naming triple (name_in_source | id | label).
      For genes, symbol fills both the name_in_source and label roles: gene symbols
      ARE their own canonical labels in scientific usage, and recording the symbol
      as written in the source preserves species case convention (Sst vs SST) and
      the exact source wording. ncbi_gene_id is the stable cross-species identifier
      (the id role). Evidence sources for the marker assertion are recorded in
      the sources list.
    attributes:
      symbol:
        required: true
        description: >
          Gene symbol exactly as it appears in the source: e.g. Sst, Pvalb,
          Slc17a6 (mouse convention) or SST, PVALB, SLC17A6 (human convention).
          Serves as both name_in_source and label — gene symbols are their own
          canonical identifiers in scientific usage. ncbi_gene_id gives the
          stable cross-species identifier.
      modifier:
        description: "Expression context: HIGH, LOW, ABSENT, ENRICHED"
      ncbi_gene_id:
        pattern: "^NCBIGene:[0-9]+$"
        description: >
          NCBI Gene ID as CURIE, e.g. NCBIGene:20604 (Mus musculus Sst).
          Species-specific; preferred for multi-species use.
          Use Translator NodeNormalization for cross-species mapping:
          https://github.com/NCATSTranslator/NodeNormalization
      hgnc_id:
        pattern: "^HGNC:[0-9]+$"
        description: >
          HGNC ID (human-only). Deprecated in favour of ncbi_gene_id;
          retained for backward compatibility.
      category:
        range: MarkerCategory
        description: >
          Functional category of this marker in the unified markers list.
          Use when populating GeneDescriptor entries in CellTypeNode.markers.
          Leave absent for entries in the legacy separate fields (defining_markers,
          neuropeptides, merfish_markers) where the field name itself encodes the category.
      expression_score:
        range: float
        description: >
          Expression level score from precomputed atlas stats. Populated for
          NEUROPEPTIDE markers from np_markers precomputed data (e.g. Vip:9.2
          means Vip neuropeptide score = 9.2 in this cluster's stats).
          Leave absent for markers without quantitative score data.
      sources:
        multivalued: true
        inlined_as_list: true
        range: MarkerSource
        description: >
          Evidence sources for this marker assertion. Multiple sources allowed —
          e.g. protein evidence from one paper and transcript evidence from another.
          Populate for classical and prior-transcriptomic nodes. Leave empty for
          atlas node markers (atlas_markers, merfish_markers) — provenance is
          implicit from the parent node's atlas + cell_set_accession.

  CellTypeColocation:
    description: >
      A cell type that co-localises with or is spatially associated with the type
      being described. Used to record relative positional context separately from
      the absolute anatomical location.
    attributes:
      neighboring_type:
        required: true
        description: >
          Name or local node ID of the colocating cell type,
          e.g. "GPi core neuron (PVALB+)", "Purkinje cell", "classical_basket"
      spatial_relationship:
        description: >
          Spatial relationship descriptor. Suggested values: ADJACENT, PROXIMAL,
          DISTAL, INTERSPERSED, SAME_LAYER, LAYER_BORDER. Free text also acceptable.
      notes:
        description: Free-text context or citation supporting this colocation claim

  # ── Property provenance ─────────────────────────────────────────
  #
  # ANATOMICAL LOCATION ONTOLOGY PREFERENCE:
  # Anatomical location is recorded as an OntologyTerm (id + label + name_in_source).
  # Preferred ontologies, in order:
  #   Mouse:           MBA (Allen Mouse Brain Atlas CCF structure ontology)
  #   Human / Primate: DHBA (Allen Developing Human Brain Atlas) or HBA (Human Brain Atlas)
  #   Cross-species:   UBERON — use as fallback when no Allen term is available or
  #                    when species-neutral identity is the priority
  #   Future:          HOMBA (Allen multi-species neuro-anatomy ontology) — not yet released;
  #                    migrate to HOMBA terms when available
  # Look up terms via OLS4 (OLS4 MCP tool available). Allen terms carry UBERON
  # cross-references. Both MBA and DHBA terms are findable in OLS under their prefixes.
  # name_in_source carries the region name as it appears in the source paper or atlas.

  HasMarkerType:
    mixin: true
    description: >
      Mixin that adds a controlled marker_type field (PROTEIN | TRANSCRIPT).
      Applied to MarkerSource to give the most important methodological
      distinction as controlled vocabulary, while keeping the base
      PropertySource generic.
    attributes:
      marker_type:
        required: true
        range: MarkerType
        description: >
          The molecule type detected: PROTEIN or TRANSCRIPT.
          The specific technique goes in PropertySource.method (free text).

  PropertySource:
    description: >
      Evidence source for a single property assertion on a node.
      Used as the nested sources list on property objects:
      NeurotransmitterType.sources, ElectrophysiologyProfile.sources,
      MorphologyProfile.sources, AnatomicalLocation.sources.
      For marker assertions use MarkerSource (extends PropertySource with
      the controlled marker_type field).

      Leave sources lists empty on ATLAS_TRANSCRIPTOMIC nodes — provenance
      is implicit from atlas + cell_set_accession (see header convention).

      Property-specific guidance for LLM population:

      NeurotransmitterType.sources — method should describe how NT type was
        established: "IHC (GABA/glutamate antibody)",
        "scRNA-seq (Gad2/Slc17a6 co-expression)",
        "electrophysiology (inhibitory PSPs recorded)". Scope is important —
        NT type can differ across species or developmental stage.

      ElectrophysiologyProfile.sources — ref to the recording study. Scope
        should note age, temperature, and preparation (acute slice, in vivo, etc.).

      MorphologyProfile.sources — method e.g. "Golgi stain", "biocytin fill +
        confocal", "electron microscopy". Snippet from the cell description section.

      AnatomicalLocation.sources — ref establishing the location claim.
        Scope is critical where location is context-specific or contested.
        For sub-regional claims (e.g. "shell region"), cite specifically.
    attributes:
      ref:
        required: true
        pattern: "^(PMID:[0-9]+|https://doi\\.org/.+)$"
        description: "DOI (https://doi.org/...) or PMID (PMID:xxxxxxxx)"
      method:
        description: >
          How this property was detected or established. Free text.
          Examples: "IHC", "patch-clamp (acute slice)", "Golgi stain",
          "scRNA-seq", "smFISH", "retrograde tracing + scRNA-seq".
      scope:
        description: >
          Experimental context: species, age, brain region, preparation.
          E.g. "adult mouse GPi", "human GPi post-mortem tissue",
          "P21 mouse cerebellum". Populate where context affects
          generalisability of the claim.
      snippet:
        description: >
          Verbatim quote from the cited source supporting this assertion.
          Strongly recommended — primary material for reviewers at the
          evidence gate. Must be exact text from the source, no paraphrase.
          If quote_key is set, snippet may be omitted (dereferenceable from
          references.json). If both are present, snippet is the verified text.
      quote_key:
        description: >
          Content-hashed key into the region's references.json quote store.
          Format: {corpus_id}_{hash8} where hash8 is the first 8 hex chars
          of SHA-256 of the normalised quote text. Allows quote lookup without
          embedding full text in the KB YAML. Set by asta-report-ingest and
          cite-traverse workflows. Reports dereference to include snippet text.
      notes:
        description: >
          Curator-derived analysis notes for this source: computed statistics,
          re-analysis observations, cross-subtype comparisons. Distinct from
          snippet (which must be a verbatim quote from the cited source).
          Examples: "Detected in 46/46 cells (100%); mean counts 305273",
          "Htr3a-OLM 43% vs Sst-OLM 26% — subtype-specific expression".
      support:
        range: EvidenceSupport
        description: >
          Whether this source supports, refutes, or is ambiguous for the
          property assertion. Set by cite-traverse and evidence-extraction
          workflows. Omit when support level is implicit (e.g. all sources
          on a property are assumed SUPPORT unless stated otherwise).
      source:
        description: >
          Workflow provenance tag identifying when/how this source was added.
          E.g. "cite_traverse_2026_04_10", "asta_survey_2026_03". Machine-set;
          not for human editing.
      added_by:
        description: >
          Identifier of the agent or workflow run that wrote this entry.
          E.g. "evidence_extraction_olm_cell_ca1_2026-04-22". Machine-set;
          not for human editing.

  TypeSynonym:
    description: >
      An alternative name or abbreviation for a cell type, with evidence provenance.
      Captures the name as used in specific sources — abbreviations, historical terms,
      atlas labels, informal community terms. Sources cite the papers where this name
      is used or defined, enabling synonym-expanded queries in lit mining.

      Population guidance: extract synonyms as the first processing step for each paper.
      Set snippet to the passage where the name is introduced or defined. Multiple
      sources if the term appears across several papers.
    attributes:
      term:
        required: true
        description: >
          The synonym string exactly as used in the source. Required.
          Examples: "OLM", "O-LM interneuron", "oriens-lacunosum moleculare cell",
          "Sst Gaba_3" (when used as a cell type name in a paper).
      synonym_type:
        range: SynonymType
        description: >
          Category of synonym — ABBREVIATION, HISTORICAL, ATLAS_LABEL,
          CROSS_SPECIES, or INFORMAL. Omit if unclear.
      sources:
        multivalued: true
        inlined_as_list: true
        range: PropertySource
        description: >
          Papers where this synonym is used for this cell type. Each PropertySource:
          ref = citing paper; snippet = passage where name is defined or first used
          (quote_key also accepted); method = how the name is used in context
          (e.g. "primary label throughout", "defined in introduction as abbreviation").
          Multiple sources if the term appears across multiple papers.

  MarkerSource:
    is_a: PropertySource
    mixins:
      - HasMarkerType
    description: >
      Evidence source for a marker assertion. Extends PropertySource with
      a controlled marker_type field (PROTEIN | TRANSCRIPT). Use in
      GeneDescriptor.sources. marker_type should always be populated.

      Examples:
        - marker_type: PROTEIN
          method: "IHC (SST antibody)"
          scope: "adult human GPi"
          snippet: "SST+/SLC17A6+/SLC32A1+ neurons are located on the borders of the GPi"
          ref: "https://doi.org/10.1016/j.neuron.2017.03.017"

        - marker_type: TRANSCRIPT
          method: "snRNA-seq"
          scope: "adult mouse, WMBv1"
          snippet: "Sst neuropeptide marker present in clusters 1996 and 1997"
          ref: "https://doi.org/10.1038/s41586-023-06812-z"

  ElectrophysiologyProfile:
    description: >
      Electrophysiological characterisation of a cell type: e-type classification
      and firing properties, with evidence provenance. Replaces the former
      electrophysiology_class string + ephys_sources list pair.
    attributes:
      description:
        required: true
        description: >
          E-type label and firing properties. Free text.
          E.g. "fast-spiking", "regular-spiking adapting with pronounced sag (Ih)",
          "theta spiking resonance, high input resistance".
      sources:
        multivalued: true
        inlined_as_list: true
        range: PropertySource
        description: >
          Evidence sources for this electrophysiology characterisation.
          ref to the recording study; snippet from the e-type description.
          scope should note age, temperature, and preparation type
          (e.g. "P21 mouse, acute slice, 32°C").

  MorphologyProfile:
    description: >
      Morphological characterisation of a cell type: key structural features
      with evidence provenance. Replaces the former morphology_notes string +
      morphology_sources list pair.
    attributes:
      description:
        required: true
        description: >
          Key morphological features. Free text.
          E.g. "large soma, radially-projecting dendrites into ML",
          "horizontal dendrites in SO, axon ramifies in SLM".
      sources:
        multivalued: true
        inlined_as_list: true
        range: PropertySource
        description: >
          Evidence sources for this morphology characterisation.
          method e.g. "Golgi stain", "biocytin fill + confocal",
          "electron microscopy". Snippet from cell description section.

  NeurotransmitterType:
    description: >
      The neurotransmitter identity of a cell type, recorded as the universal
      naming triple: name_in_source (verbatim source label) + cl_terms (CL
      ontology identifiers) + sources (evidence provenance).

      Used for both classical and atlas nodes — replaces the previous split
      between nt_type (free string) and atlas_nt_type (verbatim string).

      For dual/co-transmitter types, list both CL terms in cl_terms. The
      name_in_source captures the compound label as written in the source
      (e.g. "Glut-GABA", "GABA-Glut (dual)") — ordering may differ between
      atlases (WMBv1 lists dominant NT first; HMBA BG lists GABA first by
      convention). Use name_in_source to preserve this exactly; the cl_terms
      list is order-independent.

      CL terms for common neurotransmitter types:
        CL:0000617  GABAergic neuron
        CL:0000679  glutamatergic neuron
        CL:0000108  cholinergic neuron
        CL:0000084  glycinergic neuron  (Note: verify in current CL release)
        CL:0000700  dopaminergic neuron
        CL:0000561  serotonergic neuron (Note: verify in current CL release)
      For types not covered by a single CL term, record the closest available
      and note the limitation in sources[].scope or a node-level notes field.

      On ATLAS_TRANSCRIPTOMIC nodes: set name_in_source to the verbatim atlas
      label; cl_terms recommended but optional (atlas naming is primary).
      Leave sources empty — provenance is implicit from atlas + cell_set_accession.
    attributes:
      name_in_source:
        required: true
        description: >
          NT label exactly as written in the source paper or atlas, e.g.
          "GABA", "Glut-GABA", "GABA-Glut (dual)", "GABA/Glycine", "Glut".
          Preserves source naming convention including ordering, which can
          differ between atlases for the same biology.
      cl_terms:
        multivalued: true
        inlined_as_list: true
        range: OntologyTerm
        bindings:
          - binds_value_of: id
            range: CLClassTerm
            obligation_level: REQUIRED
        description: >
          CL ontology terms for this NT type. One entry per transmitter
          (e.g. two entries for a dual-transmitter type). Each OntologyTerm
          carries id, label, and name_in_source (the individual substance
          name as it appears in the source, e.g. "GABA", "Glut").
          Strongly recommended for classical nodes; optional for atlas
          terminal nodes where atlas naming is primary.
      sources:
        multivalued: true
        inlined_as_list: true
        range: PropertySource
        description: >
          Evidence sources establishing this NT type. One or more
          PropertySource entries with ref, method, scope, snippet.
          method should describe how NT type was established, e.g.
          "IHC (GABA antibody)", "scRNA-seq (Gad2/Slc17a6 co-expression)",
          "electrophysiology (inhibitory PSPs recorded)".
          scope is important — NT type can differ across species or
          developmental stage.
          Leave empty on ATLAS_TRANSCRIPTOMIC nodes (provenance implicit).

  PropertyComparison:
    description: >
      A structured comparison of one property between type_a and type_b on
      a mapping edge. Complements evidence items: evidence items provide
      detailed justification; property_comparisons give a machine-readable
      property-level alignment summary that makes the basis for the
      confidence judgment explicit and reportable.

      Populate at minimum: nt_type, location, all defining markers.
      Use NOT_ASSESSED when data for a property is unavailable.
    attributes:
      property:
        required: true
        description: >
          Name of the property compared. Suggested values:
          nt_type, location, marker_{gene_symbol}, morphology,
          electrophysiology, projection_target, ccf_distribution.
          Free text — be specific, e.g. "marker_Sst" not "marker".
      node_a_value:
        required: true
        description: >
          Value of this property as recorded on type_a.
          Use the actual text from the node, not a paraphrase.
      node_b_value:
        required: true
        description: >
          Value of this property as recorded on type_b (verbatim from
          node or its source metadata).
      alignment:
        required: true
        range: PropertyAlignment
      notes:
        description: >
          Brief explanation of the alignment call.
          Required for APPROXIMATE and DISCORDANT.
          E.g. "Same biology; WMBv1 orders dual NT with dominant first
          (Glut-GABA vs GABA-Glut), convention difference only."

  HierarchyNode:
    description: One level of an atlas taxonomy hierarchy (used in AtlasCellSetRef)
    attributes:
      level:
        required: true
        description: >
          Taxonomy level string, e.g. CLASS, SUBCLASS, SUPERTYPE, CLUSTER (WMBv1)
          or GROUP (HMBA BG). See schema header comment for atlas-specific values.
      name:
        required: true
      cell_set_accession:
        description: CCN accession at this level, e.g. CS20230722_SUPT_1145

  ProposedCLTerm:
    description: >
      Draft or approved Cell Ontology term entry for the classical/named type being described.
      Generated from the evidence graph by traversing from this node to terminal atlas nodes.
      A node with cl_mapping.mapping_type = BROAD should have a ProposedCLTerm whose
      parent_cl_term = cl_mapping.cl_term, placing the new term as a child in the hierarchy.
    attributes:
      cl_id:
        description: >
          Existing CL term ID this proposed term is updating, when applicable
          (e.g. when adding/refining a definition for an existing CL term).
          Leave absent for brand-new proposed terms — temporary CL: placeholder
          IDs must not be used, as they cannot be validated against the live
          ontology. Track the term request in `term_request_url` instead.
      term_request_url:
        description: >
          URL of the CL new-term-request issue tracking this proposed term
          (e.g. https://github.com/obophenotype/cell-ontology/issues/N).
          Populated once a term request has been filed via the cl-term-request
          workflow. The eventual CL ID assigned on merge replaces this field
          with cl_id.
      label:
        description: Term label
      parent_cl_term:
        range: OntologyTerm
        bindings:
          - binds_value_of: id
            range: CLClassTerm
            obligation_level: REQUIRED
        description: >
          The CL term this proposed term is a child of.
          For nodes with cl_mapping.mapping_type = BROAD, this should match cl_mapping.cl_term.
          For nodes with cl_mapping.mapping_type = EXACT, this field is typically not needed.
          Drives placement in the CL hierarchy and should be confirmed with CL editors.
      definition:
        description: >
          Proposed CL definition text.
          Standard template: "A [parent_cl_term.label] that is [distinguishing_feature].
          These cells are located in [location]. Reference transcriptomic data for this
          type can be found in [atlas] in cell set [accession]."
      comment:
        description: >
          Proposed CL comment: the mapping rationale derived from the evidence chain.
          Template: "Mapping to [type] is based on [evidence summary]. [Caveats if any]."
      xrefs:
        multivalued: true
        description: >
          References — DOIs, PMIDs, atlas URLs, and CCN cell set accessions.
          The CCN accession of the terminal node(s) should always be included here.
      status:
        description: "DRAFT | SUBMITTED | ACCEPTED"


# ══════════════════════════════════════════════════════════════════
# GRAPH NODES
# ══════════════════════════════════════════════════════════════════

  CellTypeNode:
    description: >
      A named cell type at any level of description: classical, prior transcriptomic,
      atlas cluster, or emerging multimodal. Nodes are connected by MappingEdges
      to form the evidence graph. Terminal nodes are atlas cell sets.
    attributes:
      id:
        required: true
        identifier: true
        description: >
          Locally unique ID within this graph.
          Suggested format: lowercase_underscored, e.g. "lugaro", "pli3_osorno", "wmb_1145"
      name:
        required: true
        description: Human-readable name, e.g. "Lugaro cell", "CB PLI Gly-Gaba_2 (supertype 1145)"
      synonyms:
        range: TypeSynonym
        multivalued: true
        inlined_as_list: true
        description: >
          Alternative names and abbreviations for this cell type, with evidence provenance.
          Populated during literature mining — synonym extraction is the first processing
          step for each paper (both survey and targeted paths). Used to expand queries
          in subsequent searches.

          Include all forms that appear in the literature or atlases: abbreviations
          (OLM), long forms if non-obvious, historical names, atlas labels used as
          cell type names. Do NOT include the canonical name field value itself.

          For ATLAS_TRANSCRIPTOMIC nodes: include the atlas cluster label in synonyms
          only if that label is used as a cell type name in at least one non-atlas paper.
      definition_basis:
        required: true
        range: DefinitionBasis
      species:
        range: OntologyTerm
        bindings:
          - binds_value_of: id
            range: NCBITaxonClassTerm
            obligation_level: REQUIRED
        description: NCBITaxon term
      anatomical_location:
        range: AnatomicalLocation
        multivalued: true
        inlined_as_list: true
        bindings:
          - binds_value_of: id
            range: AnatomyTerm
            obligation_level: REQUIRED
        description: >
          Anatomical location(s) of this cell type. Each entry is an
          AnatomicalLocation (OntologyTerm + optional compartment).
          Prefer Allen atlas terms (MBA for mouse; DHBA or HBA for human/primate);
          use UBERON as fallback. Look up via OLS4. name_in_source carries the
          region name as written in the source (e.g. "GPi shell region", "GPi").
          Multiple entries for types that span regions or are defined relative
          to multiple structures. Set compartment (SOMA, AXON_TARGET, DENDRITE)
          when a type has different compartments in different regions (e.g. OLM:
          soma in SO, axon in SLM). Leave compartment absent when location is
          not compartment-specific or compartment is unknown.
      colocated_types:
        range: CellTypeColocation
        multivalued: true
        inlined_as_list: true
        description: >
          Other cell types that co-localise with or are spatially adjacent to
          this type. Records relative positional context separately from the
          anatomical location above (e.g. "adjacent to GPi core neurons").
      cl_mapping:
        range: CLMapping
        description: >
          CL term binding with mapping type (EXACT or BROAD).
          Every non-terminal node should have a cl_mapping.
          EXACT: this node IS this CL term (modulo species).
          BROAD: this node is a subtype; a ProposedCLTerm would be a new child of the cl_term.
          Terminal nodes (atlas cell sets) may also have a cl_mapping once cognate CL terms exist.
      proposed_cl_term:
        range: ProposedCLTerm
        description: >
          Draft CL term for this node — populated when authoring a new or revised CL entry.
          For BROAD cl_mapping nodes: proposed_cl_term.parent_cl_term = cl_mapping.cl_term.
          For EXACT cl_mapping nodes: proposed_cl_term.cl_id = cl_mapping.cl_term.id (updating an existing term).
      is_terminal:
        range: boolean
        description: >
          True if this node is a cell set in the community target atlas (the mapping destination).
          Terminal nodes should have cell_set_accession populated.

      # ── Markers (all node types) ─────────────────────────────────
      # Classical nodes: from original description / literature.
      # Atlas nodes: from atlas metadata (cluster.markers.combo, np.markers);
      #   sources left empty — provenance implicit from atlas + cell_set_accession.
      defining_markers:
        range: GeneDescriptor
        multivalued: true
        description: >
          Markers used to define this type. For classical/literature nodes: markers
          from the original type description. For atlas nodes: defining markers from
          the atlas (cluster.markers.combo or equivalent).
      negative_markers:
        range: GeneDescriptor
        multivalued: true
        description: Markers explicitly shown to be absent (all node types).
      neuropeptides:
        range: GeneDescriptor
        multivalued: true
        inlined_as_list: true
        description: >
          Neuropeptide co-transmitters expressed by this cell type (all node types).
          For classical nodes: from literature (populate sources on each GeneDescriptor).
          For atlas nodes: from atlas np.markers column (sources left empty).
          Separate from defining_markers because neuropeptide identity is a distinct
          functional property — though a gene may appear in both lists (e.g. Sst as
          a defining marker AND as a neuropeptide co-transmitter).
          Examples: Sst, Vip, Cck, Npy, Pnoc.
      nt_type:
        range: NeurotransmitterType
        inlined: true
        description: >
          Neurotransmitter type of this cell type. Applies to both classical
          and atlas terminal nodes (unified field, replaces atlas_nt_type).
          Carries the naming triple: name_in_source (verbatim source label),
          cl_terms (CL identifiers), sources (evidence provenance).
      electrophysiology:
        range: ElectrophysiologyProfile
        inlined: true
        description: >
          Electrophysiological characterisation with nested evidence sources.
          Replaces former electrophysiology_class (string) + ephys_sources (list) pair.
      morphology:
        range: MorphologyProfile
        inlined: true
        description: >
          Morphological characterisation with nested evidence sources.
          Replaces former morphology_notes (string) + morphology_sources (list) pair.

      # ── For PRIOR_TRANSCRIPTOMIC nodes ───────────────────────────
      prior_dataset_accession:
        description: >
          Dataset accession where this T-type was defined, e.g. SCP795, GEO:GSE173954.
          Used when definition_basis = PRIOR_TRANSCRIPTOMIC.
      prior_cluster_label:
        description: >
          Cluster label in the prior dataset, e.g. "PLI3", "MLI1".
          Used when definition_basis = PRIOR_TRANSCRIPTOMIC.
      prior_reference:
        pattern: "^(PMID:[0-9]+|https://doi\\.org/.+)$"
        description: DOI or PMID of the paper defining this cluster, e.g. "https://doi.org/10.1038/s41593-022-01057-x"

      # ── For ATLAS_TRANSCRIPTOMIC nodes (terminal) ─────────────────
      atlas:
        description: Atlas identifier, e.g. "WMBv1", "HMBA_BG_Consensus", "BICAN_10x_Multiome_2024"
      taxonomy_id:
        description: Taxonomy version identifier, e.g. CCN202307220
      cell_set_accession:
        description: CCN cell set accession at this node's taxonomy level, e.g. CS20230722_SUPT_1145
      taxonomy_level:
        description: >
          Taxonomy level string, e.g. CLASS, SUBCLASS, SUPERTYPE, CLUSTER (WMBv1)
          or GROUP (HMBA BG). See schema header comment for atlas-specific values.
      taxonomy_rank:
        range: integer
        description: >
          Integer rank for cross-taxonomy level ordering. 0 = most specific
          (leaf/terminal), incrementing toward root. Derivable from taxonomy_level
          + taxonomy_meta.yaml level_hierarchy when not set explicitly.
      parent_hierarchy:
        range: HierarchyNode
        multivalued: true
        description: All parent levels in the atlas taxonomy, from immediate parent to root
      n_cells:
        range: integer
        description: >
          Number of cells of this type in the 10x dataset, summed across all
          regions. Populated from the atlas taxonomy source (e.g. WMBv1 KG
          node `cell_count` property). Distinct from
          `anatomical_location[].cell_count`, which is the per-region MerFish
          count. Leave absent for non-atlas nodes.
      merfish_markers:
        range: GeneDescriptor
        multivalued: true
        description: MERFISH panel markers distinguishing this type (merfish.markers.combo)
      markers:
        multivalued: true
        inlined_as_list: true
        range: GeneDescriptor
        description: >
          Unified marker list for atlas taxonomy nodes. Replaces the separate
          defining_markers / neuropeptides / merfish_markers fields for atlas nodes;
          use GeneDescriptor.category to distinguish marker roles (DEFINING,
          DEFINING_SCOPED, TF, NEUROPEPTIDE, NT_MARKER, MERFISH). Negative markers
          use modifier: ABSENT. The legacy separate fields are retained for backward
          compatibility with existing draft KB YAML.
      neighborhood:
        description: >
          Atlas-assigned neighborhood or supergroup label (e.g. "Subpallium-GABA").
          Populated from atlas metadata; provides coarser grouping above taxonomy
          class level. Leave absent for non-atlas nodes.
      male_female_ratio:
        range: float
        description: >
          Male/Female cell count ratio from source taxonomy (>1 = male-biased,
          <1 = female-biased). Stored to 2 dp. Null when balanced or data
          unavailable. Computed from Male and Female fraction properties in
          the source taxonomy metadata.
      ccf_distribution:
        description: >
          CCF region distribution from atlas, e.g. "CB:0.72,NA:0.25" (from CCF_broad.freq column)

      # ── Property provenance (classical / prior-transcriptomic nodes) ─────
      sex_bias:
        range: SexBias
        description: >
          Expected direction of sexual dimorphism in cell number or defining-marker
          expression. Set on classical nodes only. Used by find-candidates to score
          atlas clusters whose male_female_ratio matches the expected direction.
          Leave absent when sex dimorphism is not documented for this type.
      definition_references:
        multivalued: true
        description: >
          General source citations for this node's defining properties — the
          key papers that established or characterised this cell type.
          DOI or PMID strings. Not property-scoped; for property-specific
          provenance use the nested sources on electrophysiology, morphology,
          anatomical_location, nt_type, and marker GeneDescriptors.
          Not needed for atlas terminal nodes — use metadata_url on
          AtlasMetadataEvidence instead.

      precomputed_expression:
        range: PrecomputedExpression
        inlined: true
        description: >
          Precomputed expression statistics for key genes from the atlas
          taxonomy. Used for property comparison scoring on mapping edges.
          Populated by the precomputed-stats workflow for atlas terminal
          nodes. Leave absent for classical/prior-transcriptomic nodes.
      cell_set_designation:
        description: >
          CAS taxonomy designation string for this cell set (e.g. "Vip",
          "49_Vip"). From CAS-format taxonomy ingest. Distinct from name
          which may be editorially adjusted.
      rationale_dois:
        multivalued: true
        description: >
          DOIs cited as rationale for this cell set's designation in the
          source CAS taxonomy. From CAS-format taxonomy metadata.
      notes:
        description: Any caveats or observations not captured by other fields


# ══════════════════════════════════════════════════════════════════
# EVIDENCE ITEMS
# ══════════════════════════════════════════════════════════════════

  EvidenceItem:
    abstract: true
    description: Base class for all evidence items supporting a mapping edge
    attributes:
      evidence_type:
        required: true
        range: EvidenceType
      supports:
        required: true
        range: EvidenceSupport
      explanation:
        required: true
        description: >
          Why this evidence supports/refutes/partially supports the mapping.
          Should be concise and citable — this text feeds the CL comment.
      figure_urls:
        multivalued: true
        description: >
          URLs to supporting figures or database screenshots. Use for visual
          evidence that complements the text explanation, e.g.:
            - Atlas browser views showing spatial distribution across species
            - UMAP/t-SNE plots showing cluster location
            - Dot plots showing marker expression profiles
            - Supplementary data figures from papers
            - OLS/ontology browser entry screenshots
          Prefer stable, persistent URLs (DOI-resolved figures, database entry
          pages). Allen Brain Cell Atlas browser URLs, OLS term pages, and
          Figshare/Zenodo figure links are all acceptable.

  LiteratureEvidence:
    is_a: EvidenceItem
    description: >
      Evidence from a peer-reviewed paper. Must include verbatim snippet from abstract
      (or open-access full text). Used for: classical type definitions, prior T-type
      characterisations, cross-modal bridging papers.
    attributes:
      reference:
        required: true
        pattern: "^(PMID:[0-9]+|https://doi\\.org/.+)$"
        description: "PMID:xxxxxxxx or https://doi.org/xxxxx"
      snippet:
        required: true
        description: >
          Exact verbatim text from the cited paper's abstract (or full text if open access).
          Must be a literal substring of the cached reference — no paraphrasing.
      study_type:
        description: >
          Type of study: MORPHOLOGICAL, ELECTROPHYSIOLOGICAL, TRANSCRIPTOMIC,
          MULTIMODAL, FUNCTIONAL, REVIEW

  AtlasMetadataEvidence:
    is_a: EvidenceItem
    description: >
      Evidence drawn directly from an atlas taxonomy metadata file (the cluster spreadsheet).
      Captures: anatomical location (from MERFISH registration), NT type, defining markers,
      CCF distribution. Primary evidence type for atlas-to-classical mappings based on
      atlas-provided information. E.g. GPi shell neuron mapping based on HMBA metadata.
    attributes:
      atlas:
        required: true
        description: Atlas identifier, e.g. "HMBA_BG_Consensus", "WMBv1"
      cell_set_accession:
        description: CCN accession for the referenced cell set
      anatomical_location:
        range: AnatomicalLocation
        multivalued: true
        inlined_as_list: true
        bindings:
          - binds_value_of: id
            range: AnatomyTerm
            obligation_level: REQUIRED
        description: >
          Anatomical location from atlas curation. AnatomicalLocation with
          name_in_source set to the verbatim atlas annotation (e.g. "GPi",
          "GPi shell and surrounding GPi core neurons"). id/label from Allen
          atlas (MBA/DHBA) or UBERON. Compartment is typically absent for
          atlas entries (MERFISH captures soma position implicitly).
      ccf_distribution:
        description: CCF region frequency distribution from atlas, e.g. "GPi:0.78,GPe:0.12"
      nt_type:
        range: NeurotransmitterType
        inlined: true
        description: >
          NT type as recorded in the atlas taxonomy. Use NeurotransmitterType:
          set name_in_source to the verbatim atlas label (e.g. "Glut-GABA");
          cl_terms recommended. Leave sources empty — provenance is implicit
          from this evidence item's atlas + metadata_url.
      nt_consistent_with_classical:
        range: boolean
        description: >
          DEPRECATED in v0.5 — superseded by MappingEdge.property_comparisons,
          which captures NT type alignment (and all other properties) in a
          general, structured way. Retained for backward compatibility.
          Use property_comparisons with property: "nt_type" instead.
      defining_markers:
        range: GeneDescriptor
        multivalued: true
        description: Defining markers from the atlas metadata (cluster.markers.combo or equivalent)
      negative_markers:
        range: GeneDescriptor
        multivalued: true
        description: Markers explicitly absent (e.g. Pvalb-negative in GPi shell)
      neuropeptides:
        range: GeneDescriptor
        multivalued: true
        inlined_as_list: true
        description: >
          Neuropeptide co-transmitters from the atlas (np.markers column or equivalent).
          Mirrors atlas node neuropeptides — same data, snapshot on the evidence item.
      merfish_markers:
        range: GeneDescriptor
        multivalued: true
        description: MERFISH panel markers for this cell set (from merfish.markers.combo)
      metadata_url:
        description: URL or accession of the metadata file used

  AtlasQueryEvidence:
    is_a: EvidenceItem
    description: >
      Evidence from a curator-performed interactive query against a published
      atlas browser (ABC Atlas, Allen Brain Map, BICCN viewer, etc.) with
      specified filters. Documents what was observed when filtering the atlas
      by anatomy, neurotransmitter type, gene expression, or other parameters.
      Reproducible given the same atlas version and filter set.
    attributes:
      atlas:
        required: true
        description: >
          Atlas name and version, e.g. "ABC Atlas v20231215", "Allen Brain Map WMBv1.0"
      query_url:
        required: true
        description: >
          URL capturing the exact query state (filters applied). Use the atlas
          browser's share/permalink feature where available. Short URLs are acceptable
          if the target is stable (e.g. tinyurl pointing to ABC Atlas with filters).
      filters_applied:
        description: >
          Human-readable description of the filters used, e.g.
          "anatomy=HPF; NT=GABA; expression=Chrna2". Redundant with query_url
          but improves readability without loading the URL.
      atlas_version:
        description: >
          Explicit data version string from the atlas if distinct from the atlas
          name, e.g. "20231215" or "WMBv1.0.0".

  AnnotationTransferLevelResult:
    description: Annotation transfer metrics at a single taxonomy level
    attributes:
      taxonomy_level:
        required: true
        description: Taxonomy level string (e.g. CLASS, SUBCLASS, SUPERTYPE, CLUSTER)
      taxonomy_rank:
        range: integer
        description: >
          Integer rank of this level. 0 = most specific (leaf), incrementing
          toward root. Allows cross-taxonomy comparison of mapping granularity.
      best_target_name:
        required: true
        description: Name of the best-matching target at this level
      best_target_accession:
        description: CCN accession of the best-matching target
      coverage:
        range: float
        description: >
          Fraction of source cells mapping to this target. High
          coverage = the source type is concentrated on this target.
          Equivalent to recall in standard ML terms. Surfaced as
          `Cov` in figure annotations and `coverage` in
          `at_figures --emit-metrics` JSON sidecars. Renamed from
          `group_purity` in the 2026-05-25 nomenclature standardisation
          (hard cutover).
      purity:
        range: float
        description: >
          Fraction of cells in the target that come from this source.
          High purity = the target is specifically populated by this
          source type. Equivalent to precision in standard ML terms.
          Surfaced as `Pur` in figure annotations and `purity` in
          `at_figures --emit-metrics` JSON sidecars. Renamed from
          `target_purity` in the 2026-05-25 nomenclature standardisation
          (hard cutover).
      f1_score:
        range: float
        description: Harmonic mean of coverage and purity.
      n_cells_mapped:
        range: integer
        description: Number of source cells mapped to this target at this level (after bootstrap filter)
      median_bootstrap:
        range: float
        description: Median bootstrap confidence score for cells mapped to this target

  AnnotationTransferMetricRow:
    description: >
      One row of (source_label, taxonomy_level, target_accession) → metrics
      from an annotation-transfer run. Uniquely keyed on
      (source_label, taxonomy_level, target_accession). Container for
      the canonical per-(source, target) F1/precision/recall values that
      `AnnotationTransferResultSet` stores. Distinct from
      `AnnotationTransferLevelResult`: the latter records the source's
      best target at each level (one row per (source, level)); this class
      records every (source, level, target) triple seen by the AT run.
    attributes:
      source_label:
        required: true
        description: Source cluster / cohort label as it appears in the AT run input.
      taxonomy_level:
        required: true
        description: Taxonomy level (CLASS / SUBCLASS / SUPERTYPE / CLUSTER).
      taxonomy_rank:
        range: integer
        description: >
          Integer rank of this level. 0 = most specific (leaf), incrementing
          toward root.
      target_name:
        description: Name of the target at this level (e.g. "0206 Pvalb Gaba_2").
      target_accession:
        required: true
        description: CCN accession of the target (e.g. CS20230722_SUPT_0206).
      n_cells:
        range: integer
        description: Number of source cells mapping to this target at this level.
      coverage:
        range: float
        description: >
          Fraction of source cells mapping to this target (= recall in
          standard ML terms). Same semantic as
          `AnnotationTransferLevelResult.coverage`. Surfaced as `Cov`
          in figure annotations and `coverage` in `--emit-metrics`
          JSON sidecars.
      purity:
        range: float
        description: >
          Fraction of cells in the target coming from this source
          (= precision in standard ML terms). Same semantic as
          `AnnotationTransferLevelResult.purity`. Surfaced as `Pur` in
          figure annotations and `purity` in `--emit-metrics` JSON
          sidecars.
      f1:
        range: float
        description: Harmonic mean of coverage and purity.
      median_bootstrap:
        range: float
      mean_bootstrap:
        range: float

  AnnotationTransferResultSet:
    description: >
      The complete set of per-(source, level, target) F1/precision/recall
      metrics for one annotation-transfer run. Schema-compliant successor
      to the implicit "CSV columns are the contract" convention used by
      `f1_matrix*.csv` / `f1_scores_*.csv` files. Lives alongside the
      run's `manifest.yaml` as `at_results.yaml` (canonical source of
      truth) — or `at_results_<variant>.yaml` for variant normalisations
      (e.g. `at_results_by_class.yaml` for Chamberland-style within-class
      dropout-robust scoring). `MappingEdge.evidence[].metrics_by_level`
      is populated by `src/evidencell/at_metrics.py` reading this set
      with (run_ref, source_label, edge.taxonomy_type) — never by an
      LLM agent. Raw CSVs are retained as audit trail under `raw/` but
      are not the contract.
    attributes:
      run_id:
        required: true
        description: AnnotationTransferRun.id this result set belongs to.
      taxonomy_id:
        required: true
        description: Target taxonomy (e.g. CCN20230722).
      normalisation:
        description: >
          Variant tag when the same run emits multiple normalisations
          (e.g. "by_class" for within-class dropout-robust scoring;
          null or "base" for standard F1 over the full dataset).
      source_csv_relpath:
        description: >
          Path (relative to the run dir) of the raw CSV this YAML was
          derived from, for audit. Optional once the YAML is the
          canonical source of truth.
      generated_at:
        description: ISO8601 timestamp when this result set was written.
      generator:
        description: >
          Script / tool that produced this YAML
          (e.g. "src/evidencell/at_metrics.py::migrate_csv").
      rows:
        range: AnnotationTransferMetricRow
        multivalued: true
        required: true

  AnnotationTransferEvidence:
    is_a: EvidenceItem
    description: >
      Evidence from computational label transfer between transcriptomic datasets.
      Minimal required fields: target_atlas + method.
      Report quality with best_f1_score (simple) or metrics_by_level (detailed).
      Covers two scenarios:
        (a) External dataset → community atlas: e.g. PLI3 cells (Osorno SCP795) → WMBv1.
            Source cluster identified by dataset accession + cluster label.
        (b) Allen taxonomy → Allen taxonomy: e.g. HMBA BG → WMBv1, or one atlas version
            to another. Source cluster identified by CCN cell_set_accession on both sides.
            Populate source_cell_set_accession when the source node has a CCN accession.

      For evidence items derived from a stored AnnotationTransferRun (parallels
      the BulkCorrelationEvidence/CorrelationRun pattern), populate `run_ref`
      with the run id; the renderer follows it to the run manifest at
      kb/annotation_transfer_runs/{run_id}/manifest.yaml for full provenance,
      F1 matrix, and figures. The per-evidence `method`, `tool_version`,
      `code_reference`, `bootstrap_threshold` etc. become redundant in that
      case and may be omitted on new evidence items (kept for back-compat
      with existing evidence ingested before the run schema landed).
    attributes:
      # ── Required ──────────────────────────────────────────────────
      target_atlas:
        required: true
        description: Atlas the cells were mapped to, e.g. "WMBv1"
      method:
        required: true
        description: Transfer method, e.g. "MapMyCells (default parameters)", "Seurat v4 label transfer"
      # ── Optional pointer to an AnnotationTransferRun ──────────────
      run_ref:
        description: >
          AnnotationTransferRun.id (pointing at
          kb/annotation_transfer_runs/{run_id}/manifest.yaml). Optional —
          when populated, the run carries the full F1 matrix, script
          provenance, and figures; this evidence item is a thin pointer at
          the relevant target_accession's row in that matrix. New evidence
          items should populate run_ref; existing evidence remains valid
          via its inline method/tool_version fields.
      source_species:
        range: OntologyTerm
        bindings:
          - binds_value_of: id
            range: NCBITaxonClassTerm
            obligation_level: REQUIRED
        description: >
          NCBITaxon term for the species of the source dataset.
          Required when source and target species differ (cross-species transfer).
          E.g. {id: NCBITaxon:9443, label: Primates} for primate → mouse WMBv1.
      target_species:
        range: OntologyTerm
        bindings:
          - binds_value_of: id
            range: NCBITaxonClassTerm
            obligation_level: REQUIRED
        description: >
          NCBITaxon term for the species of the target atlas.
          E.g. {id: NCBITaxon:10090, label: Mus musculus} for WMBv1.

      # ── Strongly recommended ───────────────────────────────────
      source_dataset_accession:
        description: >
          Accession of the source dataset.
          E.g. SCP:SCP795, GEO:GSE173954, NeMO:nemo_xxxxxxx
          For cross-Allen-taxonomy transfers, this may be the taxonomy_id
          (e.g. CCN202307220) or the atlas identifier (e.g. "HMBA_BG_Consensus").
      source_cluster_label:
        description: >
          Cluster label in the source dataset (e.g. "PLI3", "MLI1", "5178 CB PLI Gly-Gaba_1").
      best_f1_score:
        range: float
        description: >
          F1 score at the best-mapping taxonomy level.
          Minimum quality metric; use when full metrics_by_level is unavailable.
          Derive from metrics_by_level[best_mapping_level].f1_score when present.
      best_mapping_level:
        description: >
          Taxonomy level name at which best_f1_score was achieved.
          E.g. "SUPERTYPE" for PLI3→1145 (F1=0.96) vs "CLUSTER" for PLI1→5178 (F1=0.94).
      best_mapping_rank:
        range: integer
        description: >
          Taxonomy rank at which best_f1_score was achieved (0 = leaf).
          Cross-taxonomy-comparable alternative to best_mapping_level.

      # ── Optional detail ────────────────────────────────────────
      source_cell_set_accession:
        description: >
          CCN cell set accession of the source cluster, if available.
          Populate for cross-Allen-taxonomy transfers where the source node
          is an atlas cell set with a stable CCN identifier.
      n_cells_total:
        range: integer
        description: Total cells from this cluster before bootstrap filtering
      n_cells_after_filter:
        range: integer
        description: Cells retained after bootstrap filtering
      bootstrap_threshold:
        range: float
        description: Bootstrap score cutoff applied (e.g. 0.8 = cells with score <0.8 discarded)
      metrics_by_level:
        range: AnnotationTransferLevelResult
        multivalued: true
        description: >
          Full per-level metrics (optional). Include when multi-level
          analysis is relevant; omit when best_f1_score suffices.
          Populated programmatically by `src/evidencell/at_metrics.py`
          from `kb/annotation_transfer_runs/{run_ref}/at_results.yaml`
          using (run_ref, source_cluster_label, edge.taxonomy_type).
          MUST NOT be transcribed by an LLM agent — see the schema
          description of `AnnotationTransferResultSet` for the rationale.
          For each level, records the best target the source mapped to;
          when the edge's taxonomy_type matches the source's best at
          some level, `best_target_accession` at that level equals
          `edge.taxonomy_type` (the typical pattern). When it doesn't,
          the row is informational — the supporting agent should also
          look up F1 for (source, edge.taxonomy_type) specifically and
          surface that in the explanation.
      f1_source_relpath:
        description: >
          Path (relative to the AT run dir) of the
          `AnnotationTransferResultSet` YAML that fed `metrics_by_level`
          for this evidence item. Defaults to `at_results.yaml` (the
          canonical base file); used to disambiguate when a run emits
          multiple variant normalisations (e.g. `at_results_by_class.yaml`).
      nt_consistent_with_classical:
        range: boolean
        description: >
          DEPRECATED in v0.5 — superseded by MappingEdge.property_comparisons.
          Retained for backward compatibility.
      name_in_source:
        description: >
          Label of the target cluster as it appears in the target taxonomy
          (the name the source cluster was mapped to). Preserves the exact
          source wording for review. E.g. "49_Vip", "7_Lamp5 Lhx6".
      tool_version:
        description: Version of tool used, e.g. "MapMyCells v1.2"
      code_reference:
        description: >
          URL or accession of the notebook/script that produced these results.
          E.g. https://github.com/Cellular-Semantics/cellular_semantics_notebooks/tree/main/MLI-PLI%20annotation
      source_groups:
        range: SourceGroup
        multivalued: true
        description: >
          Optional. When this evidence's metrics were computed by pooling
          multiple raw source clusters into one pseudo-source, record the
          composition here. Absence means per-source metrics keyed by
          source_cluster_label.

  SourceGroup:
    description: >
      Composition of a pooled pseudo-source used to compute an
      AnnotationTransferEvidence's metrics. `label` is the pseudo-source
      name (also the `--pool ...:NAME` argument fed to at_figures);
      `members` is the list of raw source_label values (as they appear
      in the f1_matrix.csv source_label column) that were combined.
      Optional `rationale` records justification that the pool reading
      is defensible across the available property panels; absence means
      no such justification is on file.
    attributes:
      label:
        required: true
        description: >
          Pseudo-source name. Must match the `--pool ...:NAME` argument
          and the source_label key in the figure-rendering sidecar from
          `at_figures --emit-metrics`, so stored metrics and rendered
          figure are joinable on a shared key.
      members:
        multivalued: true
        required: true
        description: >
          Raw source_label values (from f1_matrix.csv) combined into the
          pseudo-source.
      rationale:
        description: >
          Optional. Justification that the pool reading is defensible
          across the available property panels. May be supplied by a
          human curator or by a synthesis agent. Multiple independent
          lines of evidence are encouraged — record each as its own
          sentence or bullet, with citations to the underlying evidence
          (AT run id, paper PMID/DOI, edge id, etc.) where applicable.
          Example justifications (combine where multiple apply):
            - "Annotation transfer to the target taxonomy is
              indistinguishable between the pooled types: both source
              cohorts map to the same target cluster set with comparable
              F1 distributions (cite run_id)."
            - "Literature reports no distinguishing electrophysiology,
              morphology, or connectivity between the pooled types
              (cite paper)."
            - "Pooled types share defining markers and neurotransmitter
              type; no differential expression of canonical
              subtype-discriminating genes is reported."
            - "Pool reflects the originating cohort's own grouping
              convention (e.g. shared sample-collection criterion);
              no further cross-panel check has been performed."
          Absence is not a gate — it just means no justification is on
          file. A future workflow run may populate or extend the
          rationale; existing entries should not be overwritten without
          curator review.

  SpatialColocationEvidence:
    is_a: EvidenceItem
    description: Evidence from spatial transcriptomics or FISH co-location analysis
    attributes:
      spatial_dataset:
        description: Dataset accession or publication reference
      spatial_technology:
        description: "MERFISH, Visium, seqFISH+, smFISH, FISH, ExSEQ"
      anatomical_region:
        range: OntologyTerm
        bindings:
          - binds_value_of: id
            range: AnatomyTerm
            obligation_level: REQUIRED
      probes_used:
        multivalued: true
        description: Gene probes in the spatial assay
      colocation_metric:
        description: "Metric: Moran's I, nearest-neighbour distance, co-expression fraction"
      colocation_value:
        range: float
      registration_method:
        description: How cells/spots were registered to CCF, if applicable
      registration_uncertainty:
        range: boolean
        description: Set true if registration accuracy is a known concern (adds MERFISH_REGISTRATION_UNCERTAINTY caveat)

  PatchSeqEvidence:
    is_a: EvidenceItem
    description: >
      Evidence from patch-seq (simultaneous electrophysiology + morphology + transcriptomics).
      Can come from atlas-associated datasets or third-party studies.
    attributes:
      dataset_accession:
        description: Dataset accession, e.g. Allen Cell Types DB, NeMO, DANDI
      n_cells_matched:
        range: integer
        description: Number of patch-seq cells matching this type definition
      transcriptomic_match_score:
        range: float
        description: Average transcriptomic correspondence score for matched cells
      morphology_features:
        multivalued: true
        description: Morphological features consistent with the type, e.g. "axonal arborisation in Purkinje layer"
      ephys_features:
        multivalued: true
        description: >-
          Key E-type features, e.g. "fast-spiking", "Rin: 120-180 MOhm", "no adaptation"
      matched_cluster_id:
        description: Atlas cluster ID matched by these patch-seq cells

  ProjectionSeqEvidence:
    is_a: EvidenceItem
    description: >
      Evidence from projection-seq or retrograde tracing combined with transcriptomics.
      Used to link projection target identity with transcriptomic type.
    attributes:
      dataset_accession:
        description: Dataset accession
      projection_target:
        range: OntologyTerm
        bindings:
          - binds_value_of: id
            range: AnatomyTerm
            obligation_level: REQUIRED
        description: Brain region where axons project to
      fraction_projecting:
        range: float
        description: Fraction of the cell set with projections to this target
      method:
        description: "retrograde tracing + scRNAseq, proj-seq, MERFISH + anterograde tracing"

  ElectrophysiologyEvidence:
    is_a: EvidenceItem
    description: Electrophysiology evidence without transcriptomics
    attributes:
      dataset_accession:
        description: Dataset or publication reference
      etype_label:
        description: E-type classification label
      key_features:
        multivalued: true
        description: Quantitative features matching the classical type

  MorphologyEvidence:
    is_a: EvidenceItem
    description: Morphological characterisation
    attributes:
      dataset_accession:
        description: Dataset or publication reference
      imaging_method:
        description: "Golgi stain, biocytin fill, EM, expansion microscopy"
      key_features:
        multivalued: true
        description: Morphological features, e.g. "ascending axon collateral", "beaded dendrites"

  MarkerAnalysisEvidence:
    is_a: EvidenceItem
    description: >
      Custom marker gene overlap analysis (beyond what atlas metadata provides).
      E.g. intersecting DEG lists between a prior study and an atlas.
    attributes:
      dataset_accession:
        description: Dataset used for analysis
      markers_examined:
        multivalued: true
        description: Gene symbols examined
      overlap_metric:
        description: "Jaccard index (top-50 DEGs), Fisher exact p, AUC, hypergeometric"
      overlap_value:
        range: float
      method:
        description: Analysis method, e.g. "DEG intersection, Seurat FindMarkers"

  BulkCorrelationEvidence:
    is_a: EvidenceItem
    description: >
      Edge evidence linking a mapping target to a CorrelationRun + contrast +
      free-form statistics map. Parallels AnnotationTransferEvidence in shape:
      a thin pointer at a separately-stored analysis (kb/correlation_runs/{run_id}/)
      together with the relevant target accession and the numeric receipts.

      Conventional keys for paired-bulk Spearman analyses (not enforced):
        rho_a, rho_b, delta, rank, rank_total
      Other statistic families (KL divergence, OT distance, regression β, F1)
      use whatever keys make sense for that family. The CorrelationRun manifest
      records the statistic_kind that interprets the keys.
    attributes:
      run_ref:
        required: true
        description: CorrelationRun.id (kb/correlation_runs/{run_id}/manifest.yaml)
      contrast_ref:
        required: true
        description: CorrelationContrast.id within the referenced run
      target_accession:
        required: true
        description: WMBv1 (or other atlas) cluster/supertype accession the evidence supports
      statistics:
        description: >
          Free-form name:value map of statistic name → numeric value.
          YAML-inline mapping. Validated structurally only — key names are conventional, not enforced.


# ══════════════════════════════════════════════════════════════════
# TYPED CAVEATS
# ══════════════════════════════════════════════════════════════════

  Caveat:
    description: >
      A typed caveat about the reliability or completeness of this mapping edge.
      Caveats are distinct from EvidenceItems: they document limitations, not positive support.
    attributes:
      caveat_type:
        required: true
        range: CaveatType
      description:
        required: true
        description: >
          Specific explanation of this caveat in the context of this mapping.
          Will appear in the CL comment and community report.


# ══════════════════════════════════════════════════════════════════
# DISCOVERY SCORE (Stage A persistence)
# ══════════════════════════════════════════════════════════════════

  DiscoveryContext:
    description: >
      A named percentile context referenced by
      DiscoveryScore.expression_detail[*].percentiles[*].context_id.
      Each context describes the population of candidates that
      defines "100th percentile" for that comparison. Critical for
      downstream readers — "0.94 of 142 survivors" is not the same
      claim as "0.94 of 5322 atlas-wide clusters". Without an
      explicit context registry, percentile values are ambiguous
      and cannot be interpreted by the report-time agent.
    attributes:
      id:
        required: true
        description: >
          Local identifier (e.g. 'cohort', 'universal',
          'anat_hippocampus') referenced by
          GenePercentile.context_id. Stable within one
          discovery_score block; not a global ID.
      kind:
        required: true
        range: DiscoveryContextKind
      rank:
        range: integer
        description: >
          Taxonomy rank at which the context is defined (0 = leaf
          cluster, 1 = supertype, …). For SURVIVAL_COHORT must
          match the parent DiscoveryScore.rank.
      n_members:
        required: true
        range: integer
        description: >
          Number of candidates in this context. Required for
          interpreting any percentile — 0.95 of 12 is much weaker
          discriminator than 0.95 of 500.
      filters:
        multivalued: true
        description: >
          For SURVIVAL_COHORT — the filters that defined survival
          (e.g. ['region=hippocampal_formation', 'nt_type=Gaba']).
          Empty for ATLAS_UNIVERSAL. Format is free-text key=value
          intended for agent consumption, not for programmatic
          parsing.
      description:
        description: >
          Optional human-readable expansion (e.g. 'GABAergic
          clusters annotated to hippocampal formation closure').
          For agent consumption when the structured fields above
          are insufficient.

  GenePercentile:
    description: >-
      A single gene's specificity within one named context.
    attributes:
      context_id:
        required: true
        description: References DiscoveryScore.contexts[*].id.
      pct:
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
        description: >
          Percentile of val within the context's members (0–1).
          Interpret with the context's n_members — 0.95 of 12 is
          a much weaker discriminator than 0.95 of 500. Null when
          val is null (i.e. source=metadata).

  GeneDiscoveryDetail:
    description: >
      Stage A's per-gene observation for one queried gene against
      one candidate. Six fields capture orthogonal aspects:
      measurement (val, reliable, source), specificity within
      context(s) (percentiles[]), score contribution before and
      after modifiers (raw_tier, applied_score), and rank ≥ 1
      distribution (coverage). Read all six together; any one in
      isolation can mislead.
    attributes:
      gene:
        required: true
        description: >
          Gene symbol. A leading '-' marks a NEGATIVE marker —
          i.e. the cell type was specified to NOT express this
          gene, and credit is awarded for absence. The prefix
          survives every downstream surface so the reading
          polarity is never ambiguous.
      val:
        range: float
        description: >
          Precomputed mean expression (log scale) for this gene
          on this candidate. Null when the gene is not in the
          precomputed_stats HDF5 (source=metadata).
      reliable:
        range: boolean
        description: >
          True iff val ≥ MIN_DETECTABLE (currently 1.0). False
          means the value is at noise floor — for positive
          markers, treat as 'not actually expressed'; for negative
          markers, confirms absence.
      raw_tier:
        range: integer
        description: >
          Integer tier from the cohort-relative scoring table
          BEFORE any modifiers. Positive markers: +2 (reliable &
          cohort_pct ≥ 0.95), +1 (reliable, cohort_pct < 0.95),
          0 (not reliable). Negative markers: +1 (correctly
          absent), −1 (present, cohort_pct < 0.95 — contradicts
          but unsurprising), −2 (cohort_pct ≥ 0.95 — aberrantly
          high). +1 for metadata-only marker assertions.
      applied_score:
        range: float
        description: >
          Score actually contributed to DiscoveryScore.score
          after modifiers. At rank ≥ 1 the rank-0 coverage
          dampener (sqrt(coverage)) shrinks raw_tier
          proportionally, so applied_score = raw_tier ×
          sqrt(coverage) when coverage is populated. At rank 0,
          applied_score == raw_tier. When applied_score differs
          from raw_tier, the gap is the modifier signal —
          investigate `coverage` next.
      source:
        required: true
        range: GeneDiscoverySource
      coverage:
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
        description: >
          AT RANK ≥ 1 ONLY (null at rank 0). Fraction of this
          candidate's rank-0 descendants that express the gene at
          ≥ MIN_DETECTABLE. Reveals whether a supertype-mean is
          broadly supported (coverage ≈ 0.75 — most children
          carry the signal) or driven by a minority (coverage ≈
          0.25 — the supertype-mean is misleading; the signal
          probably belongs to one child cluster). Low coverage at
          rank ≥ 1 is a HIDDEN-1:1 signal — see §1.2 of the
          confidence review.
      percentiles:
        multivalued: true
        inlined_as_list: true
        range: GenePercentile
        description: >
          Per-context specificity records. Today exactly one
          entry per gene (context_id='cohort'); the list shape is
          forward-compatible with universal / anatomical context
          emission.

  DiscoveryAtSignal:
    description: >
      Cohort-scoring view of the AT hit that contributed to
      DiscoveryScore.score. The AUTHORITATIVE AT record lives in
      MappingEdge.evidence[] as AnnotationTransferEvidence; this
      block exists only to make the cohort-ranking reasoning
      auditable — i.e. "+3 of the discovery score came from an AT
      F1 ≥ 0.5 hit".
    attributes:
      f1:
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
      n_cells:
        range: integer
      target_level:
        description: Taxonomy level of the AT target (cluster, supertype, …).
      target_name:
        description: Name of the AT target the source mapped to.
      score:
        range: integer
        description: >
          AT bucket contribution to DiscoveryScore.score (+1 / +2
          / +3 at F1 thresholds ≥ floor / 0.3 / 0.5).

  DiscoveryScore:
    description: >
      Stage A find_candidates output recorded on the MappingEdge it
      produced. A SINGLE SIGNAL AMONG MANY — does NOT re-state
      overall confidence. Stage A scores cohort-relative gene
      overlap; it does NOT see AT-pooling caveats, cluster-level
      region scatter, literature, or morphology. Report-time
      agents must treat `score` as one input, weighed against
      marker comparisons, AT metrics, and literature evidence —
      never as a confidence value. See workflows/gen-report.md
      "How to read discovery_score" for the reader's guide.
    attributes:
      score:
        range: integer
        description: >
          Composite Stage A score for this candidate. Sum of
          contributions from: region match (+2), NT match (+2),
          per-gene marker tiers (see
          GeneDiscoveryDetail.applied_score), AT-F1 bucket
          (+1/+2/+3 at thresholds F1 ≥ floor / 0.3 / 0.5),
          region-exact bonus (+1), optional criteria.
          Cohort-relative ranking matters more than the absolute
          number; compare against `next_best_score` and
          `cohort_size`.
      rank_in_cohort:
        range: integer
        description: >
          1-based rank of this candidate in the discovery cohort
          (1 = top scorer). Combined with `cohort_size` and
          `next_best_score`, lets the report-time agent reason
          about cohort dominance.
      cohort_size:
        range: integer
        description: >
          Total number of candidates returned by this discovery
          pass — i.e. members of the SURVIVAL_COHORT context (see
          contexts[]). Required to interpret `rank_in_cohort` and
          any `cohort` percentile.
      next_best_score:
        range: integer
        description: >
          Score of the cohort runner-up. A large gap (e.g. 8 vs
          3) indicates the top candidate dominated the cohort; a
          small gap signals ambiguity between near-tied
          candidates.
      rank:
        range: integer
        description: >
          Taxonomy rank queried at Stage A (0 = leaf cluster,
          1 = supertype, 2 = subclass, …). Determines whether
          GeneDiscoveryDetail.coverage is populated (only at rank
          ≥ 1).
      region_fraction:
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
        description: >
          cells-in-queried-region / total annotated cells at this
          candidate. 1.0 = candidate sits entirely inside the
          queried region. Low values may push the predicate
          toward PartialOverlapMatch (see §1.7 of the confidence
          review).
      region_evidence:
        range: DiscoveryRegionEvidence
      contexts:
        multivalued: true
        inlined_as_list: true
        range: DiscoveryContext
        description: >
          Registry of percentile contexts referenced by
          expression_detail[*].percentiles[*].context_id. Today
          only SURVIVAL_COHORT (id='cohort') is emitted; future
          passes may add ATLAS_UNIVERSAL or
          ANATOMICAL_RESTRICTION. Each context captures the
          cohort definition so a reader can interpret a
          percentile correctly.
      expression_detail:
        multivalued: true
        inlined_as_list: true
        range: GeneDiscoveryDetail
        description: >
          Per-gene record of what Stage A saw for the genes the
          curator queried. Negative markers are keyed with a '-'
          prefix on `gene` (e.g. '-Slc17a7') and earn credit for
          being ABSENT.
      at_signal:
        range: DiscoveryAtSignal
        description: >
          Optional. Annotation-transfer hit that contributed to
          `score`. Cohort-scoring provenance only — the
          authoritative AT record lives in
          MappingEdge.evidence[] as AnnotationTransferEvidence.


# ══════════════════════════════════════════════════════════════════
# GRAPH EDGES
# ══════════════════════════════════════════════════════════════════

  MappingEdge:
    description: >
      An evidenced mapping assertion between two CellTypeNodes.
      Edges are directional (lit_type → taxonomy_type) but the
      relationship field describes the nature of the correspondence,
      not a hierarchy.

      Transitivity: edges can be chained. E.g.:
        classical_lugaro --[skos:exactMatch, Osorno 2022]--> pli3_osorno
        pli3_osorno --[skos:exactMatch, MapMyCells]--> wmb_supertype_1145

      Cross-cutting: use multiple edges, all pointing at the same taxonomy_type:
        classical_basket   --[evidencell:CrossCuttingMatch]--> mli1_kozareva
        classical_stellate --[evidencell:PartialOverlapMatch]--> mli1_kozareva

      Splits / merges: use one edge per pair, all with
      skos:broadMatch (split) or skos:narrowMatch (merge), each carrying
      mapping_cardinality 1:n or n:1.

      Phase 2 schema overhaul (2026-05-12): type_a → lit_type, type_b →
      taxonomy_type. The old slot names are retained as deprecated
      aliases for the PR1 → PR2 transition window; drop after KB sweep
      completes.
    attributes:
      id:
        required: true
        identifier: true
        description: Unique edge ID, e.g. "edge_lugaro_to_pli3"
      lit_type:
        required: true
        range: CellTypeNode
        description: >
          ID of the source node (reference to CellTypeNode.id). Typically
          a curated literature / classical type. Renamed from `type_a`
          in the Phase 2 schema overhaul (PR2 KB sweep, 2026-05-12).
      taxonomy_type:
        required: true
        range: CellTypeNode
        description: >
          ID of the target node (reference to CellTypeNode.id). Typically
          an atlas / transcriptomic taxonomy node. For atlas/taxonomy
          nodes, use the cell_set_accession as the id (e.g.
          CS20230722_SUPT_0179). The node must be declared in the graph's
          nodes list — a minimal stub (id, name, definition_basis,
          taxonomy_id, cell_set_accession) suffices for taxonomy
          references. Renamed from `type_b` in the Phase 2 schema
          overhaul (PR2 KB sweep, 2026-05-12).
      relationship:
        required: true
        range: MappingRelationship
      mapping_cardinality:
        range: MappingCardinality
        description: >
          Cardinality of the mapping as a set relation. Required when
          relationship is skos:broadMatch or skos:narrowMatch;
          recommended on skos:exactMatch / skos:closeMatch (typically
          1:1). Phase 2 schema overhaul (2026-05-12).
      mapping_justification:
        range: MappingJustification
        description: >
          Provenance of the mapping decision. Default for new edges:
          semapv:UnreviewedManualMapping. Promote to
          semapv:ManualMappingCuration on curator review. Phase 2
          schema overhaul (2026-05-12).
      confidence:
        range: MappingConfidence
        description: >
          Ordinal mapping verdict. Phase 3 (2026-05-13): authority for
          this slot moved from Stage B (map-cell-type Step 3 synthesis)
          to report time (gen-report synthesis). Set by the report-gen
          agent alongside `confidence_score`, `rationale`, and the
          `rationale_*` provenance fields. Optional (`required: false`)
          because edges that have not been through report generation
          carry no headline verdict — honest state, not a regression.
          Pre-Phase-3 edges were swept clear of `confidence` in the
          Phase 3 invalidation migration; they regain it on the first
          gen-report pass. Spreadsheet / CAP exports should render
          edges with no confidence as "(verdict pending)".
      confidence_score:
        range: float
        minimum_value: 0.0
        maximum_value: 1.0
        description: >
          Numeric confidence (0-1). Phase 3 (2026-05-13): written by
          the report-time agent alongside the ordinal `confidence`;
          the two agree by construction. Not curator-derived; no
          ordinal → numeric fallback. SSSOM-compatible.
      rationale:
        description: >
          Short prose verdict distilled from the full report by the
          report-time agent. Phase 3 (2026-05-13). Format constraint:
          must cite specific structured fields (F1 values, accessions,
          marker counts) rather than free-form claims; an automated
          post-write check parses these citations and verifies them
          against the edge's structured data and references. The agent
          MUST NOT read prior `rationale` / `confidence` /
          `confidence_score` as input when regenerating — inputs are
          structured data + evidence + property_comparisons + the
          pool-candidates pre-pass.
      report_path:
        description: >
          Relative path or URL to the full report that backs the
          `rationale`. Phase 3 (2026-05-13). Written by the report-gen
          orchestrator at write-back time.
      rationale_generated_at:
        range: datetime
        description: >
          Timestamp at which the report-time agent wrote `rationale`.
          Phase 3 (2026-05-13).
      rationale_source_hash:
        description: >
          SHA256 8-char digest over the canonical edge + endpoint-node
          payload at rationale-generation time (excluding the
          rationale-suite fields themselves). On every read and on
          `just qc`, the hash is recomputed from current state and
          compared; mismatch marks the rationale stale (still shown,
          flagged for regeneration). Whole-edge granularity — any
          change in the hashed inputs invalidates the whole rationale.
          Phase 3 (2026-05-13).
      reconciliation_note:
        description: >
          Structured cross-edge note. Two uses:
          (1) Phase 2 framing — curator's synthesis when parallel
          evidence sources DISAGREE (e.g. divergent F1 from two AT
          runs on different datasets, or marker evidence pointing one
          way while anatomy points another); distinct from per-property
          notes / rationale fields.
          (2) Phase 3 (2026-05-13) extension — agent-side cross-edge
          indistinguishability note. When the report-time agent calls
          two source groups indistinguishable across available property
          panels (the Winterer Sst-OLM / Htr3a-OLM pattern; see #61,
          #62), the structured cross-reference goes here while the
          per-edge narrative goes in `rationale`. Paired with a
          lit-to-lit `skos:closeMatch` edge when the indistinguishability
          spans all available panels (not just AT).
      reviewed_by:
        description: >
          Name or ORCID of the human reviewer who confirmed this edge,
          distinct from the curator who created or last edited the
          record. Phase 2 schema overhaul (2026-05-12).
      discovery_score:
        range: DiscoveryScore
        description: >
          Stage A find_candidates output for this candidate,
          recorded verbatim on the edge that consumed it. A single
          signal among many — NOT a re-statement of overall
          confidence. See the DiscoveryScore class description and
          the gen-report "How to read discovery_score" prompt for
          reader guidance. Populated by Stage B at edge creation
          (workflows/map-cell-type.md Step 3) or by backfill from
          on-disk discovery JSONs (just backfill-discovery-score).
          Optional — edges that predate the discovery JSON
          convention will have no value.
      evidence:
        required: true
        multivalued: true
        inlined_as_list: true
        range: EvidenceItem
        description: All evidence items directly supporting this specific edge (min 1)
      property_comparisons:
        multivalued: true
        inlined_as_list: true
        range: PropertyComparison
        description: >
          Structured property-by-property comparison between lit_type and
          taxonomy_type. Makes the basis for the confidence judgment
          machine-readable and surfaceable in reports. Populate at
          minimum: nt_type, location, and all defining markers. Use
          NOT_ASSESSED where data is unavailable.
      caveats:
        multivalued: true
        inlined_as_list: true
        range: Caveat
      unresolved_questions:
        multivalued: true
        description: Specific outstanding questions about this edge
      proposed_experiments:
        multivalued: true
        description: Experiments that would resolve or strengthen this edge
      curator:
        description: Name or ORCID of person who curated this edge
      creation_date:
        range: date
      updated_date:
        range: date


# ══════════════════════════════════════════════════════════════════
# TOP-LEVEL GRAPH CONTAINER
# ══════════════════════════════════════════════════════════════════

  CellTypeMappingGraph:
    tree_root: true
    description: >
      A graph of cell type mapping evidence for a brain region or cell class.
      Contains CellTypeNodes (classical types, prior T-types, atlas cell sets)
      connected by MappingEdges (each with evidence and confidence).
      Terminal nodes (is_terminal=true) are community atlas cell sets.
    attributes:
      name:
        required: true
        description: e.g. "Cerebellar cortex interneurons — WMBv1", "Basal ganglia GPi types — HMBA"
      description: {}
      brain_region:
        range: OntologyTerm
        bindings:
          - binds_value_of: id
            range: AnatomyTerm
            obligation_level: REQUIRED
        description: >
          Brain region covered by this evidence graph. OntologyTerm with
          Allen atlas term preferred (MBA/DHBA); UBERON as fallback.
      target_atlas:
        required: true
        description: The community atlas that terminal nodes belong to
      species:
        range: OntologyTerm
        bindings:
          - binds_value_of: id
            range: NCBITaxonClassTerm
            obligation_level: REQUIRED
        description: Primary species (NCBITaxon)
      nodes:
        required: true
        multivalued: true
        inlined_as_list: true
        range: CellTypeNode
      edges:
        required: true
        multivalued: true
        inlined_as_list: true
        range: MappingEdge
      creation_date:
        range: date
      updated_date:
        range: date
      notes:
        description: Free-text notes about scope, limitations, or outstanding issues
      source_atlas:
        description: >
          When this graph represents cross-taxonomy annotation transfer,
          the atlas that nodes were transferred FROM (the source taxonomy).
          E.g. "WMBv1 (CCN20230722)" for WMB→CTX-HPF transfers.
      annotation_transfer_datasets:
        multivalued: true
        inlined_as_list: true
        range: AnnotationTransferDataset
        description: >
          Datasets used or planned for annotation transfer experiments
          targeting cell types in this graph. Tracked at graph level so
          multiple nodes can reference the same dataset.

  AnnotationTransferDataset:
    description: >
      A dataset used for annotation transfer (MapMyCells or equivalent).
      Tracked at graph level to avoid duplication across nodes.
    attributes:
      accession:
        required: true
        description: >
          Dataset accession, e.g. "GEO:GSE142546", "SCP795".
      publication:
        pattern: "^(PMID:[0-9]+|https://doi\\.org/.+)$"
        description: DOI or PMID of the associated publication
      description:
        description: Free-text description of the dataset and its relevance
      cell_types:
        multivalued: true
        description: >
          Node IDs (within this graph) that this dataset targets.
      status:
        description: >
          Processing status, e.g. "pending_retrieval", "processed",
          "awaiting_sra_reprocessing". Free text.

  PrecomputedExpression:
    description: >
      Precomputed expression statistics for key genes from the atlas taxonomy.
      Used for scoring property comparisons on mapping edges — e.g. "does the
      atlas cluster express the classical type's defining markers?"
    attributes:
      source:
        required: true
        description: >
          Source file or dataset for the precomputed stats.
          E.g. "precomputed_stats_ABC_revision_230821.h5"
      level:
        description: >
          Taxonomy level these stats correspond to.
          E.g. "cluster", "supertype"
      genes:
        multivalued: true
        inlined_as_list: true
        range: GeneExpression
        description: >
          Per-gene expression statistics for this node.
      child_cluster_expression:
        multivalued: true
        inlined_as_list: true
        range: ChildClusterExpression
        description: >
          Per-child-cluster expression breakdown (supertype nodes only).
          Enables scoring to inspect cluster-level heterogeneity.

  ChildClusterExpression:
    description: >
      Per-child-cluster expression breakdown for a supertype node.
      Enables mapping-edge scoring to inspect cluster-level heterogeneity
      within a supertype.
    attributes:
      cluster_accession:
        required: true
        description: Cell set accession of the child cluster
      n_cells:
        range: integer
        description: Number of cells in this cluster
      expression:
        description: >
          Gene symbol → mean expression mapping. Stored as a flat dict;
          keys are gene symbols, values are floats.

  GeneExpression:
    description: >
      Expression level of a single gene in a cell type or cluster.
      Minimal record: gene symbol + mean expression value.
    attributes:
      symbol:
        required: true
        description: Gene symbol, e.g. "Sst", "Pvalb"
      ensembl_id:
        description: Ensembl gene ID, e.g. "ENSMUSG00000004366"
      mean_expression:
        range: float
        description: Mean expression value (log-normalised or CPM, depending on source)

  TaxonomyNodeList:
    description: >
      Container for per-level atlas taxonomy node files (e.g. cluster.yaml,
      supertype.yaml). Each file holds all CellTypeNode objects at one taxonomy
      level for one taxonomy. No edges or brain_region required — these are
      reference nodes, not a mapping graph.
    attributes:
      taxonomy_id:
        required: true
        description: Taxonomy identifier, e.g. CCN20230722
      taxonomy_level:
        required: true
        description: Level string for all nodes in this file, e.g. cluster, supertype
      taxonomy_rank:
        range: integer
        description: >
          Integer rank for this level. 0 = most specific (leaf/terminal),
          incrementing toward root. Required on hierarchical level files;
          omit for orthogonal annotation levels (e.g. NEUROTRANSMITTER)
          that sit outside the hierarchy.
      nodes:
        required: true
        multivalued: true
        inlined_as_list: true
        range: CellTypeNode
        description: All CellTypeNode objects at this taxonomy level


# ══════════════════════════════════════════════════════════════════
# BULK TRANSCRIPTOMIC DATASETS AND CORRELATION RUNS
# ══════════════════════════════════════════════════════════════════
#
# Reusable cross-region records for paired-bulk transcriptomic evidence.
# A BulkDataset record exists once per published dataset and is referenced
# by zero or more CorrelationRuns. Each CorrelationRun records reproducibility
# metadata (input checksums, atlas version, method parameters) and contrasts;
# BulkCorrelationEvidence entries on MappingEdges point at run + contrast.
#
# Free-form `metadata` (range: string) slots are deliberately untyped —
# they accept any inline mapping. Schema is read by agents, written by agents;
# rigid keys add little value. Convention examples appear in the descriptions.

  BulkDataset:
    tree_root: true
    description: >
      A published bulk transcriptomic dataset that profiles labelled cell populations.
      First-class entity, reusable across many MappingEdges. Lives at
      kb/datasets/{dataset_id}.yaml.
    attributes:
      id:
        identifier: true
        required: true
        description: Stable dataset identifier, e.g. dataset_GSE183092
      record_type:
        required: true
        equals_string: BulkDataset
      source_pmid:
        pattern: "^PMID:[0-9]+$"
        description: PubMed ID of the source publication
      geo_accession:
        description: GEO series accession, e.g. GSE183092
      authors:
        multivalued: true
        description: >
          Authors of the source publication, full names, in publication order.
          Used by the renderer to format a citation line for evidence items
          that cite this dataset via run_ref. Optional — if absent, the
          citation falls back to the bare PMID.
      year:
        range: integer
        description: Publication year of the source publication.
      title:
        description: Title of the source publication.
      technique:
        required: true
        description: "TRAP-seq, FACS-bulk, RiboTag, INTACT, laser-capture, manual-pick, FANS, ..."
      species:
        description: NCBITaxon CURIE, e.g. NCBITaxon:10090
      ingested_date:
        range: date
      description:
        description: Free-text description of the experimental design and what was profiled
      data_files:
        multivalued: true
        inlined: true
        inlined_as_list: true
        range: BulkDataFile
      pools:
        multivalued: true
        inlined: true
        inlined_as_list: true
        range: BulkPool
      notes:
        description: Free-text notes (caveats, related datasets, scope limitations)
      metadata:
        description: >
          Free-form name:value map for ancillary properties not captured elsewhere.
          YAML-inline mapping; key names not enforced.

  BulkDataFile:
    description: A single data file within a BulkDataset (typically one expression matrix).
    attributes:
      relpath:
        required: true
        description: Path relative to the dataset's home (or to a standard cache location)
      url:
        description: Canonical URL where this file can be re-fetched
      sha256:
        description: SHA-256 checksum of the file
      keyed_by:
        description: "ensembl_id, gene_symbol, refseq, ..."
      normalisation:
        description: "DESeq2_size_factor, log2(TPM+1), CPM, raw_counts, ..."
      metadata:
        description: Free-form name:value map for file-specific notes

  BulkPool:
    description: >
      A labelled bulk sample group within a BulkDataset. Replicates may be averaged
      or kept; n_replicates records the underlying biological N.
    attributes:
      id:
        identifier: true
        required: true
        description: Stable pool identifier, e.g. knoedler_VMH_FR
      tissue:
        description: Source tissue / region (free string; promote to OntologyTerm in future)
      sort_marker:
        description: "Esr1+, Kiss1+, Th-Cre/Esr1+, ..."
      state:
        description: Animal state at sampling — male, female_receptive, naive, post-stress, etc.
      n_replicates:
        range: integer
      anatomy_id:
        description: Optional MBA/UBERON CURIE if the tissue maps to a known atlas region
      metadata:
        description: Free-form name:value map (animal age, gating strategy, etc.)

  CorrelationRun:
    tree_root: true
    description: >
      A specific correlation analysis between BulkPools and an atlas pseudobulk.
      Lives at kb/correlation_runs/{run_id}/manifest.yaml alongside the script,
      data inputs, and ranked output files.
    attributes:
      id:
        identifier: true
        required: true
        description: Stable run identifier, e.g. corr_run_20260428_knoedler_wmbv1
      record_type:
        required: true
        equals_string: CorrelationRun
      dataset_ref:
        required: true
        description: BulkDataset.id this run analyses
      atlas:
        required: true
        range: AtlasReference
        inlined: true
      method:
        required: true
        range: CorrelationMethod
        inlined: true
      contrasts:
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        range: CorrelationContrast
      script:
        range: ScriptReference
        inlined: true
      output:
        range: OutputReference
        inlined: true
      caveats:
        description: Free-text caveats about run-specific findings (e.g. artefact patterns observed)
      code_version:
        description: >
          Codebase version (commit SHA, tag, or version string) at the time the
          run was executed. Optional — script.git_commit covers the per-script
          version; this field is for the broader codebase if different.
      metadata:
        description: Free-form name:value map for ancillary run-level notes

  AtlasReference:
    description: Reference to an atlas version + pseudobulk source used in a correlation run.
    attributes:
      taxonomy_id:
        required: true
        description: e.g. CCN20230722
      pseudobulk_source:
        description: Path or URL to the precomputed_stats.h5 (or equivalent)
      sha256:
        description: SHA-256 of the pseudobulk source file (for reproducibility)

  CorrelationMethod:
    description: The statistic family and parameters used in a correlation run.
    attributes:
      statistic_kind:
        required: true
        description: >
          Free string naming the statistic family.
          Examples: spearman_rho, pearson_r, kl_divergence, ot_distance, regression_beta.
      parameters:
        description: >
          Free-form name:value map of method parameters
          (transform, gene set restriction, normalisation choices, etc.).

  CorrelationContrast:
    description: >
      A named contrast between two BulkPools within a CorrelationRun. The differential
      δ statistic = stat(cluster, pool_a) − stat(cluster, pool_b) ranks clusters by
      pool_a-specificity.
    attributes:
      id:
        identifier: true
        required: true
        description: Stable contrast identifier, e.g. corr_VMH_FR_vs_BNST_FR
      pool_a:
        required: true
        description: BulkPool.id (the "specific" pool — positive δ favours this)
      pool_b:
        required: true
        description: BulkPool.id (the "background" pool)
      interpretation:
        description: One-line free text describing what this contrast probes biologically

  ScriptReference:
    description: Pointer to the script that produced a CorrelationRun's output.
    attributes:
      relpath:
        required: true
        description: Path relative to the run directory
      python_version:
        description: e.g. ">=3.11"
      packages:
        multivalued: true
        description: Required Python packages (no version pins necessary)
      git_repo_url:
        pattern: "^https://(github|gitlab)\\.com/.+$"
        description: >
          Canonical repository URL where the script lives. Combined with
          git_commit + relpath gives a stable permalink for audit.
          E.g. https://github.com/Cellular-Semantics/evidencell
      git_commit:
        description: >
          Commit SHA, short SHA, or tag pinning the exact version of the
          script that was run. With git_repo_url + relpath, lets a reader
          form a permalink to the code that produced the run's output.

  OutputReference:
    description: Pointer to the primary ranked output file of a CorrelationRun.
    attributes:
      relpath:
        required: true
      format:
        description: "tsv, csv, parquet, ..."

  AnnotationTransferRunSummary:
    description: >
      Thin summary entry for one AT run in the registry index.
      Each entry corresponds to a full AnnotationTransferRun manifest at manifest_path.
    attributes:
      id:
        identifier: true
        required: true
        description: Run identifier — matches AnnotationTransferRun.id
      target_taxonomy_id:
        description: Taxonomy the cells were mapped to, e.g. CCN20230722
      source_dataset_accession:
        description: Accession of the source dataset, e.g. GEO:GSE124847
      manifest_path:
        required: true
        description: Repo-relative path to the run's manifest.yaml

  AnnotationTransferIndex:
    tree_root: true
    description: >
      Registry of all annotation-transfer runs in this repo.
      Lives at kb/annotation_transfer_runs/index.yaml.
      Auto-generated by `just register-at-run`; do not edit manually.
      Validated by the pre-write hook: every run_ref in KB YAML must resolve
      to an entry here.
    attributes:
      runs:
        multivalued: true
        inlined_as_list: true
        range: AnnotationTransferRunSummary
        description: One entry per registered AT run, ordered by id.

  AnnotationTransferRun:
    tree_root: true
    description: >
      A specific annotation-transfer analysis (typically MapMyCells against an
      atlas pseudobulk). Lives at kb/annotation_transfer_runs/{run_id}/manifest.yaml
      alongside the F1 matrix, the input h5ad, the script, and any figures.

      Mirrors CorrelationRun in structure: each AnnotationTransferEvidence
      item on a MappingEdge is a thin pointer at one row of this run's F1
      matrix (target_accession × source_label), with the run carrying the
      full provenance (input data SHA, atlas SHA, method version, code
      version, figures). Promotes per-evidence inline metadata
      (method, tool_version, code_reference, bootstrap_threshold...) to a
      single shared record.
    attributes:
      id:
        identifier: true
        required: true
        description: Stable run identifier, e.g. at_run_20260408_winterer_olm_mmc_wmbv1
      record_type:
        required: true
        equals_string: AnnotationTransferRun
      source_dataset_accession:
        description: Accession of the source dataset, e.g. GEO:GSE124847
      source_cluster_label:
        description: >
          Source cluster label or grouping convention used in the run
          (free string; may differ across runs of the same source dataset).
      source_species:
        description: NCBITaxon CURIE of the source dataset species
      target_atlas:
        required: true
        description: Atlas the cells were mapped to, e.g. "WMBv1"
      target_taxonomy_id:
        description: e.g. CCN20230722 (when target_atlas has a versioned taxonomy id)
      target_species:
        description: NCBITaxon CURIE of the target atlas species
      method:
        required: true
        description: e.g. "MapMyCells (cell_type_mapper v1.7.1, default parameters, raw normalization)"
      tool_version:
        description: Specific tool version, e.g. "cell_type_mapper v1.7.1"
      code_reference:
        description: URL of the run's notebook or script (canonical link)
      bootstrap_threshold:
        range: float
        description: Bootstrap score cutoff applied (0–1)
      n_cells_total:
        range: integer
      n_cells_after_filter:
        range: integer
      atlas:
        range: AtlasReference
        inlined: true
        description: Atlas pseudobulk + SHA (mirrors CorrelationRun.atlas)
      script:
        range: ScriptReference
        inlined: true
        description: >
          Script that produced the F1 matrix. Carries git_repo_url +
          git_commit + relpath for stable permalinks.
      output:
        range: OutputReference
        inlined: true
        description: Primary ranked output (typically f1_matrix.tsv)
      figure:
        range: OutputReference
        inlined: true
        description: >
          Optional pre-rendered figure (e.g. faceted F1 heatmap).
          relpath is relative to the run directory.
      code_version:
        description: Codebase commit/tag for the run
      caveats:
        description: Free-text caveats about run-specific findings
      metadata:
        description: Free-form name:value map for ancillary run-level notes
