# OAK Configuration for evidencell term validation
# Maps ontology prefixes to OAK adapter strings.
#
# Adapter types:
#   sqlite:obo:<name>  - Pre-built SQLite databases (fast, offline, recommended)
#                        OAK caches these in ~/.data/oaklib/ on first use.
#   simpleobo:<path>   - Local OBO file parsed on each load. Use for
#                        ontologies where we ship a slim rather than the
#                        full DB (e.g. NCBITaxon).
#   ""                 - Skip validation for this prefix (no warning)
#
# Only prefixes listed here are validated.
# Run `just fetch-oak-dbs` for a guided setup of the SQLite databases.

ontology_adapters:
  # Cell type ontology — primary controlled vocabulary for cell type nodes
  CL: sqlite:obo:cl

  # Anatomy — UBERON for whole-organism anatomy; per-atlas ontologies
  # (MBA, DHBA, HOMBA) for brain-atlas-specific regions. All four are
  # validated via the AnatomyTerm dynamic enum in the schema, which
  # follows subClassOf + part_of from UBERON:0001062 (anatomical entity).
  UBERON: sqlite:obo:uberon
  MBA:    simpleobo:conf/oak_dbs/mbao.obo    # Allen Mouse Brain Atlas
  DHBA:   simpleobo:conf/oak_dbs/dhbao.obo   # Developing Human Brain Atlas
  HOMBA:  simpleobo:conf/oak_dbs/homba.obo   # Harmonized Mammalian Brain Anatomy

  # Taxonomy — species identifiers on evidence scope fields.
  # Backed by the upstream NCBITaxon slim (taxslim.obo, ~9 MB), not the
  # full DB (~10+ GB). Fetched by `just fetch-oak-dbs`. The slim covers
  # all UniProt reference proteomes — model organisms + standard primates
  # used in BICAN work. See issue #73.
  NCBITaxon: simpleobo:conf/oak_dbs/taxslim.obo

  # Skip LinkML/RDF meta-prefixes
  linkml: ""
  schema: ""
  xsd: ""
  rdf: ""
  rdfs: ""
  owl: ""
